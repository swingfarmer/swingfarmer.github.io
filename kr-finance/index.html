<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex, nofollow">
<title>한국주식 재무 트래커 | 스윙파머</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d27;--card-hover:#222532;--border:#2a2d3a;--text:#e4e4e7;--text-dim:#71717a;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--gold:#eab308;--orange:#f97316}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 80px}
.header{padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.header h1{font-size:24px;font-weight:800;letter-spacing:-0.5px}
.header h1 span{color:var(--accent)}
.header-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px}
.updated{font-size:12px;color:var(--text-dim)}
.back-link{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}

/* 컨트롤 바 */
.controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit}
.search-box:focus{outline:none;border-color:var(--accent)}
.search-box::placeholder{color:var(--text-dim)}
.filter-btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .12s;font-family:inherit}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* 통계 바 */
.stats-bar{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.stat-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px}
.stat-chip .label{color:var(--text-dim);margin-right:6px}
.stat-chip .val{font-weight:700}

/* 테이블 */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1100px}
thead{position:sticky;top:0;z-index:2}
th{background:var(--card);text-align:right;padding:10px 8px;border-bottom:2px solid var(--border);color:var(--text-dim);font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;user-select:none;transition:color .12s}
th:hover{color:var(--accent)}
th.sorted{color:var(--accent)}
th .arrow{font-size:9px;margin-left:3px}
th:first-child,th:nth-child(2){text-align:left;position:sticky;left:0;z-index:3;background:var(--card)}
th:nth-child(2){left:42px}
td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
td:first-child{text-align:center;width:42px;position:sticky;left:0;background:var(--card);z-index:1}
td:nth-child(2){text-align:left;position:sticky;left:42px;background:var(--card);z-index:1;min-width:110px}
tr:hover td{background:var(--card-hover)}
tr.selected td{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}
.stock-name{font-weight:700;font-size:13px;display:block}
.stock-code{font-size:10px;color:var(--text-dim)}
.stock-sector{font-size:10px;color:var(--text-dim);display:block;margin-top:1px}
.up{color:var(--green)}
.down{color:var(--red)}
.gold{color:var(--gold)}
.dim{color:var(--text-dim)}

/* 체크박스 */
.chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* 비교 패널 */
.compare-panel{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--accent);padding:14px 20px;display:none;z-index:10;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.compare-panel.show{display:flex}
.compare-panel .compare-count{font-weight:700;font-size:14px}
.compare-panel button{padding:8px 20px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-compare{background:var(--accent);color:#fff}
.btn-clear{background:transparent;color:var(--text-dim);border:1px solid var(--border) !important}

/* 비교 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;max-width:1100px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px}
.modal .close-btn{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer}
.compare-grid{display:grid;gap:16px}
.compare-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.compare-card h3{font-size:16px;font-weight:800;margin-bottom:12px}
.compare-card .code{color:var(--text-dim);font-size:12px;font-weight:400}
.compare-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.compare-row:last-child{border-bottom:none}
.compare-row .cl{color:var(--text-dim)}

/* 반응형 */
@media(max-width:768px){
  .controls{gap:6px}
  .search-box{min-width:100%}
  .stats-bar{gap:8px}
  .stat-chip{padding:6px 10px;font-size:11px}
  table{font-size:11px}
  th,td{padding:7px 6px}
}
.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:30px;line-height:1.8}
.loading{text-align:center;padding:60px;color:var(--text-dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>한국주식 <span>재무 트래커</span></h1>
    <div class="header-meta">
      <div class="updated" id="updated">로딩 중...</div>
      <a href="/" class="back-link">← 메인으로</a>
    </div>
  </div>

  <div class="controls" id="controls">
    <input type="text" class="search-box" id="search" placeholder="종목명 또는 코드 검색…">
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="note">
    ※ 재무 데이터: OpenDART 공시 기준 · 주가 연동 시 PER/PBR 추가 예정<br>
    ※ 샘플 데이터 — 2단계에서 자동 수집 연결 예정
  </div>
</div>

<!-- 비교 바 -->
<div class="compare-panel" id="comparePanel">
  <span class="compare-count" id="compareCount">0종목 선택</span>
  <button class="btn-compare" onclick="openCompare()">📊 비교하기</button>
  <button class="btn-clear" onclick="clearSelection()">초기화</button>
</div>

<!-- 비교 모달 -->
<div class="modal-overlay" id="compareModal">
  <div class="modal" style="position:relative">
    <button class="close-btn" onclick="closeCompare()">✕</button>
    <h2>📊 종목 비교</h2>
    <div id="compareBody"></div>
  </div>
</div>

<script>
(function(){
var DATA_URL = '/data/kospi200.json';
var stocks = [];
var filtered = [];
var selected = new Set();
var sortKey = 'revenue';
var sortDir = -1; // -1=desc
var activeSector = '';

var COLS = [
  {key:'_chk', label:'', nosort:true, w:'42px'},
  {key:'name', label:'종목', align:'left'},
  {key:'sector', label:'업종', align:'left', hide:true},
  {key:'revenue', label:'매출액', unit:'억'},
  {key:'op', label:'영업이익', unit:'억'},
  {key:'ni', label:'순이익', unit:'억'},
  {key:'opm', label:'OPM', unit:'%'},
  {key:'nim', label:'NIM', unit:'%'},
  {key:'roe', label:'ROE', unit:'%'},
  {key:'roa', label:'ROA', unit:'%'},
  {key:'debt_ratio', label:'부채비율', unit:'%'},
  {key:'dividend', label:'배당금', unit:'원'},
  {key:'div_yield', label:'배당률', unit:'%'},
  {key:'revenue_yoy', label:'매출YoY', unit:'%'},
  {key:'op_yoy', label:'OPYOY', unit:'%'}
];

function fmt(v, unit){
  if(v === null || v === undefined) return '-';
  if(unit === '억'){
    if(Math.abs(v) >= 10000) return (v/10000).toFixed(1) + '조';
    return v.toLocaleString() + '억';
  }
  if(unit === '%') return v.toFixed(1) + '%';
  if(unit === '원') return v.toLocaleString() + '원';
  return v;
}

function colorClass(v, key){
  if(v === null || v === undefined) return '';
  if(key === 'debt_ratio') return v > 200 ? 'down' : v > 100 ? 'gold' : '';
  if(['opm','nim','roe','roa','div_yield'].indexOf(key) >= 0){
    return v > 10 ? 'up' : v < 0 ? 'down' : '';
  }
  if(key === 'revenue_yoy' || key === 'op_yoy'){
    if(v <= -999) return 'down';
    return v > 0 ? 'up' : v < 0 ? 'down' : '';
  }
  if(key === 'op' || key === 'ni') return v < 0 ? 'down' : '';
  return '';
}

function buildHead(){
  var tr = document.createElement('tr');
  COLS.forEach(function(c){
    if(c.hide) return;
    var th = document.createElement('th');
    if(c.nosort){
      th.innerHTML = '<input type="checkbox" class="chk" id="chkAll" title="전체 선택">';
      th.querySelector('#chkAll').addEventListener('change', function(e){
        if(e.target.checked) filtered.forEach(function(s){ selected.add(s.code); });
        else selected.clear();
        render();
      });
    } else {
      th.textContent = c.label;
      if(c.key === sortKey) th.className = 'sorted';
      th.innerHTML += (c.key === sortKey ? (sortDir > 0 ? ' <span class="arrow">▲</span>' : ' <span class="arrow">▼</span>') : '');
      th.addEventListener('click', function(){
        if(sortKey === c.key) sortDir *= -1;
        else { sortKey = c.key; sortDir = -1; }
        sort();
        buildHead();
        renderBody();
      });
    }
    if(c.align==='left') th.style.textAlign = 'left';
    tr.appendChild(th);
  });
  document.getElementById('thead').innerHTML = '';
  document.getElementById('thead').appendChild(tr);
}

function renderBody(){
  var tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  filtered.forEach(function(s){
    var tr = document.createElement('tr');
    if(selected.has(s.code)) tr.className = 'selected';
    tr.addEventListener('click', function(e){
      if(e.target.tagName === 'INPUT') return;
    });
    COLS.forEach(function(c){
      if(c.hide) return;
      var td = document.createElement('td');
      if(c.key === '_chk'){
        td.innerHTML = '<input type="checkbox" class="chk" '+(selected.has(s.code)?'checked':'')+' data-code="'+s.code+'">';
        td.querySelector('.chk').addEventListener('change', function(e){
          if(e.target.checked) selected.add(s.code);
          else selected.delete(s.code);
          tr.classList.toggle('selected', selected.has(s.code));
          updateCompareBar();
        });
      } else if(c.key === 'name'){
        td.innerHTML = '<span class="stock-name">'+s.name+'</span><span class="stock-code">'+s.code+'</span><span class="stock-sector">'+s.sector+'</span>';
        td.style.textAlign = 'left';
      } else {
        var v = s[c.key];
        var display = (c.key==='op_yoy' && v <= -999) ? '적전' : fmt(v, c.unit);
        td.textContent = display;
        var cc = colorClass(v, c.key);
        if(cc) td.className = cc;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  updateCompareBar();
}

function sort(){
  filtered.sort(function(a,b){
    var va = a[sortKey], vb = b[sortKey];
    if(sortKey === 'name') return sortDir * (va < vb ? -1 : va > vb ? 1 : 0);
    if(va === null || va === undefined) va = -Infinity;
    if(vb === null || vb === undefined) vb = -Infinity;
    return sortDir * (va - vb);
  });
}

function applyFilters(){
  var q = document.getElementById('search').value.trim().toLowerCase();
  filtered = stocks.filter(function(s){
    var matchQ = !q || s.name.toLowerCase().indexOf(q) >= 0 || s.code.indexOf(q) >= 0;
    var matchSec = !activeSector || s.sector === activeSector;
    return matchQ && matchSec;
  });
  sort();
  renderBody();
  updateStats();
}

function updateStats(){
  var bar = document.getElementById('statsBar');
  var cnt = filtered.length;
  var profitable = filtered.filter(function(s){ return s.op > 0; }).length;
  var avgROE = 0, avgDY = 0;
  filtered.forEach(function(s){ avgROE += s.roe; avgDY += s.div_yield; });
  if(cnt){ avgROE /= cnt; avgDY /= cnt; }
  bar.innerHTML =
    '<div class="stat-chip"><span class="label">종목 수</span><span class="val">'+cnt+'</span></div>'+
    '<div class="stat-chip"><span class="label">흑자</span><span class="val up">'+profitable+'</span> / <span class="val down">'+(cnt-profitable)+'</span></div>'+
    '<div class="stat-chip"><span class="label">평균 ROE</span><span class="val">'+avgROE.toFixed(1)+'%</span></div>'+
    '<div class="stat-chip"><span class="label">평균 배당률</span><span class="val gold">'+avgDY.toFixed(1)+'%</span></div>';
}

function updateCompareBar(){
  var panel = document.getElementById('comparePanel');
  var cnt = selected.size;
  document.getElementById('compareCount').textContent = cnt + '종목 선택';
  panel.classList.toggle('show', cnt >= 2);
}

window.clearSelection = function(){
  selected.clear();
  render();
};

window.openCompare = function(){
  var arr = stocks.filter(function(s){ return selected.has(s.code); });
  if(arr.length < 2) return;
  var body = document.getElementById('compareBody');
  var labels = [
    ['매출액','revenue','억'],['영업이익','op','억'],['순이익','ni','억'],
    ['OPM','opm','%'],['NIM','nim','%'],['ROE','roe','%'],['ROA','roa','%'],
    ['부채비율','debt_ratio','%'],['배당금','dividend','원'],['배당수익률','div_yield','%'],
    ['매출 YoY','revenue_yoy','%'],['영업이익 YoY','op_yoy','%']
  ];

  // 비교 테이블 형태
  var html = '<div style="overflow-x:auto"><table style="min-width:auto;font-size:13px"><thead><tr><th style="text-align:left;min-width:100px">항목</th>';
  arr.forEach(function(s){ html += '<th style="text-align:right;min-width:100px">'+s.name+'</th>'; });
  html += '</tr></thead><tbody>';
  labels.forEach(function(l){
    html += '<tr><td style="color:var(--text-dim);text-align:left">'+l[0]+'</td>';
    // 최대값 찾기
    var vals = arr.map(function(s){ return s[l[1]]; });
    var maxV = Math.max.apply(null, vals.filter(function(v){ return v > -999; }));
    arr.forEach(function(s){
      var v = s[l[1]];
      var display = (l[1]==='op_yoy' && v <= -999) ? '적전' : fmt(v, l[2]);
      var cc = colorClass(v, l[1]);
      var bold = (v === maxV && vals.filter(function(x){return x===maxV;}).length === 1) ? 'font-weight:800;' : '';
      html += '<td class="'+cc+'" style="text-align:right;'+bold+'">'+display+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  body.innerHTML = html;
  document.getElementById('compareModal').classList.add('show');
};

window.closeCompare = function(){
  document.getElementById('compareModal').classList.remove('show');
};

document.getElementById('compareModal').addEventListener('click', function(e){
  if(e.target === this) closeCompare();
});

function buildSectorFilters(){
  var sectors = {};
  stocks.forEach(function(s){ sectors[s.sector] = (sectors[s.sector]||0) + 1; });
  var ctrl = document.getElementById('controls');
  // "전체" 버튼
  var all = document.createElement('button');
  all.className = 'filter-btn active';
  all.textContent = '전체 ('+stocks.length+')';
  all.addEventListener('click', function(){
    activeSector = '';
    document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    all.classList.add('active');
    applyFilters();
  });
  ctrl.appendChild(all);

  Object.keys(sectors).sort().forEach(function(sec){
    var btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = sec + ' ('+sectors[sec]+')';
    btn.addEventListener('click', function(){
      activeSector = (activeSector === sec) ? '' : sec;
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
      if(activeSector) btn.classList.add('active');
      else all.classList.add('active');
      applyFilters();
    });
    ctrl.appendChild(btn);
  });
}

function render(){
  buildHead();
  applyFilters();
}

// 검색
document.getElementById('search').addEventListener('input', function(){
  applyFilters();
});

// 키보드: ESC로 모달 닫기
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeCompare();
});

// 로드
fetch(DATA_URL)
  .then(function(r){ return r.json(); })
  .then(function(data){
    stocks = data.stocks;
    filtered = stocks.slice();
    document.getElementById('updated').textContent =
      '기준: ' + data.period + ' · 업데이트: ' + data.updated + ' · 출처: ' + data.source;
    buildSectorFilters();
    render();
  })
  .catch(function(e){
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="14" style="text-align:center;padding:40px;color:var(--red)">데이터 로드 실패: '+e.message+'</td></tr>';
  });
})();
</script>
<script src="/common.js?v=4"></script>
</body>
</html>
