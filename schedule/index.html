<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>일정표 | 스윙파머</title>
<meta name="description" content="투자·개인 일정을 한 곳에. 달력 모드와 리스트 모드, 카테고리 색상 구분, 완료 체크. 실적발표·배당락·약속 등 주요 일정 관리.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; background: #f5f7fa; color: #333; line-height: 1.5; padding-bottom: 80px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  header { background: white; border-bottom: 3px solid #1F4E78; padding: 18px 16px; }
  header .wrap { padding: 0; display: block; }
  header h1 { font-size: 20px; color: #1F4E78; margin: 0; }
  .back-link { display: inline-block; margin-bottom: 8px; font-size: 13px; color: #1F4E78; text-decoration: none; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }
  .desc { font-size: 12.5px; color: #888; margin: 8px 0 16px; line-height: 1.7; }

  /* 모드 토글 */
  .mode-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .mode-btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: white; color: #1F4E78; border: 2px solid #e5e7eb; text-align: center; }
  .mode-btn.active { background: #1F4E78; color: white; border-color: #1F4E78; }

  /* 달력 네비 */
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
  .cal-nav button { background: #eef2f7; border: none; width: 38px; height: 38px; border-radius: 9px; font-size: 18px; cursor: pointer; color: #1F4E78; }
  .cal-nav .cal-title { font-size: 18px; font-weight: 800; color: #1F4E78; min-width: 150px; text-align: center; }
  .today-btn { font-size: 12px; padding: 6px 12px; border-radius: 7px; background: #eff6ff; color: #1F4E78; border: 1px solid #bfdbfe; cursor: pointer; font-weight: 600; }

  /* 달력 그리드 */
  .calendar { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 14px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
  .cal-weekday { text-align: center; font-size: 11.5px; font-weight: 700; color: #888; padding: 4px 0; }
  .cal-weekday.sun { color: #dc2626; } .cal-weekday.sat { color: #2563eb; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .cal-cell { min-height: 62px; border-radius: 7px; padding: 4px; cursor: pointer; border: 1px solid transparent; transition: all .1s; background: #fafbfc; }
  .cal-cell:hover { background: #eff6ff; }
  .cal-cell.other-month { opacity: .35; }
  .cal-cell.today { border-color: #1F4E78; background: #eff6ff; }
  .cal-daynum { font-size: 12px; font-weight: 600; color: #555; }
  .cal-cell.sun .cal-daynum { color: #dc2626; } .cal-cell.sat .cal-daynum { color: #2563eb; }
  .cal-events { margin-top: 2px; display: flex; flex-direction: column; gap: 2px; }
  .cal-ev { font-size: 9.5px; padding: 1px 4px; border-radius: 3px; color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
  .cal-ev.done { opacity: .5; text-decoration: line-through; }
  .cal-more { font-size: 9px; color: #888; padding-left: 4px; }

  /* 리스트 모드 */
  .list-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: 600; }
  .filter-chip.active { background: #1F4E78; color: white; border-color: #1F4E78; }
  .list-group { margin-bottom: 16px; }
  .list-month-label { font-size: 13px; font-weight: 700; color: #1F4E78; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 2px solid #eef0f3; }
  .list-item { display: flex; align-items: center; gap: 10px; background: white; border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; box-shadow: 0 1px 2px rgba(0,0,0,.04); border-left: 4px solid #ccc; }
  .list-item.done { opacity: .55; }
  .list-check { width: 24px; height: 24px; border: 2px solid #cbd5e1; border-radius: 7px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; }
  .list-item.done .list-check { background: #16a34a; border-color: #16a34a; }
  .list-date { font-size: 12px; color: #888; width: 56px; flex-shrink: 0; text-align: center; line-height: 1.3; }
  .list-date b { display: block; font-size: 17px; color: #333; }
  .list-body { flex: 1; min-width: 0; }
  .list-title { font-size: 14px; font-weight: 600; }
  .list-item.done .list-title { text-decoration: line-through; }
  .list-memo { font-size: 11.5px; color: #999; margin-top: 1px; }
  .list-cat { font-size: 10px; padding: 1px 7px; border-radius: 4px; color: white; flex-shrink: 0; }
  .list-dday { font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .list-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; flex-shrink: 0; }
  .list-del:hover { color: #dc2626; }
  .empty { text-align: center; color: #bbb; font-size: 13px; padding: 30px; }

  /* FAB */
  .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #1F4E78; color: white; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 12px rgba(31,78,120,.4); z-index: 100; }

  /* 모달 */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
  .modal.show { display: flex; }
  .modal-box { background: white; border-radius: 16px; max-width: 420px; width: 100%; padding: 20px; max-height: 90vh; overflow:auto; }
  .modal-box h3 { font-size: 16px; color: #1F4E78; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: #555; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  .field input:focus, .field textarea:focus { outline: 2px solid #1F4E78; }
  .cat-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-opt { padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: white; opacity: .45; border: 2px solid transparent; }
  .cat-opt.sel { opacity: 1; border-color: #1a1a1a; }
  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .modal-btns button { flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
  .btn-save { background: #1F4E78; color: white; }
  .btn-cancel { background: #e5e7eb; color: #555; }
  .btn-delete { background: #fee2e2; color: #dc2626; flex: 0 0 auto !important; padding: 11px 16px !important; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn { border: none; border-radius: 6px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-blue { background: #1F4E78; color: white; } .btn-green { background: #10b981; color: white; } .btn-gray { background: #9ca3af; color: white; }
  footer { text-align: center; margin-top: 30px; color: #999; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="/" class="back-link">← 메인으로</a>
    <h1>📅 일정표</h1>
  </div>
</header>

<div class="wrap">
  <p class="desc">투자·개인 주요 일정을 한 곳에. <b>달력</b>으로 한눈에 보고, <b>리스트</b>로 다가오는 일정을 확인하세요. 카테고리 색상으로 구분하고 완료를 체크할 수 있어요.</p>

  <div id="cloudArea" style="display:none;align-items:center;gap:8px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap">
    <span style="font-size:12px;font-weight:700;color:#0369a1">☁️ 관리자</span>
    <button id="btnCloudOpen" class="btn btn-blue" type="button" style="background:#0ea5e9">클라우드 저장/불러오기</button>
    <span id="cloudWho" style="font-size:11px;color:#0369a1"></span>
    <button id="btnCloudLogout" class="btn btn-gray" type="button" style="margin-left:auto">로그아웃</button>
  </div>
  <button id="btnAdminLogin" class="btn" type="button" style="display:none;background:#fff;color:#444;border:1px solid #ddd;margin-bottom:14px">🔑 관리자 로그인</button>
  <div id="uidInfo" style="display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;font-size:13px;color:#92400e;margin-bottom:14px;line-height:1.7"></div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeCalBtn" onclick="setMode('cal')">📅 달력</button>
    <button class="mode-btn" id="modeListBtn" onclick="setMode('list')">📋 리스트</button>
  </div>

  <label style="display:flex;align-items:center;gap:8px;background:white;border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;font-size:13px;font-weight:600;color:#1F4E78">
    <input type="checkbox" id="econToggle" onchange="toggleEcon()" style="width:18px;height:18px">
    📈 경제지표 자동 표시 <span style="font-size:11px;color:#888;font-weight:400">(마녀의날·CPI·FOMC·옵션만기 등)</span>
  </label>

  <!-- 달력 모드 -->
  <div id="calMode">
    <div class="cal-nav">
      <button onclick="moveMonth(-1)">‹</button>
      <span class="cal-title" id="calTitle">-</span>
      <button onclick="moveMonth(1)">›</button>
    </div>
    <div style="text-align:center;margin-bottom:10px"><button class="today-btn" onclick="goToday()">오늘로</button></div>
    <div class="calendar">
      <div class="cal-weekdays">
        <div class="cal-weekday sun">일</div><div class="cal-weekday">월</div><div class="cal-weekday">화</div><div class="cal-weekday">수</div><div class="cal-weekday">목</div><div class="cal-weekday">금</div><div class="cal-weekday sat">토</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 리스트 모드 -->
  <div id="listMode" style="display:none">
    <div class="list-filters" id="listFilters"></div>
    <div id="listContent"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-green" onclick="saveJson()">💾 내보내기</button>
    <label class="btn btn-blue" style="cursor:pointer">📂 불러오기<input type="file" id="fileLoad" accept=".json" style="display:none" onchange="loadJson(event)"></label>
    <button class="btn btn-gray" onclick="manageCats()">🏷️ 카테고리</button>
  </div>

  <footer>© 스윙파머</footer>
</div>

<button class="fab" onclick="openAdd()">+</button>

<!-- 일정 추가/수정 모달 -->
<div class="modal" id="evModal">
  <div class="modal-box">
    <h3 id="modalTitle">일정 추가</h3>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="evDate">
    </div>
    <div class="field">
      <label>제목</label>
      <input type="text" id="evTitle" placeholder="예: 대한항공 2Q 실적발표" maxlength="60">
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="cat-picker" id="catPicker"></div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="evMemo" rows="2" placeholder="상세 내용" maxlength="200"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-delete" id="delBtn" onclick="deleteEvent()" style="display:none">삭제</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<!-- 카테고리 관리 모달 -->
<div class="modal" id="catModal">
  <div class="modal-box">
    <h3>🏷️ 카테고리 관리</h3>
    <div id="catManageList"></div>
    <div style="display:flex;gap:6px;margin-top:12px">
      <input type="text" id="newCatName" placeholder="새 카테고리" maxlength="12" style="flex:1;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:13px">
      <input type="color" id="newCatColor" value="#1F4E78" style="width:44px;height:40px;border:1px solid #ccc;border-radius:8px;cursor:pointer">
      <button onclick="addCat()" style="background:#1F4E78;color:white;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer">추가</button>
    </div>
    <div class="modal-btns"><button class="btn-cancel" onclick="$('catModal').classList.remove('show')">닫기</button></div>
  </div>
</div>

<!-- 클라우드 슬롯 모달 -->
<div id="slotModal" class="modal">
  <div class="modal-box">
    <div style="display:flex;align-items:center;margin-bottom:14px">
      <h3 style="margin:0">☁️ 클라우드 저장</h3>
      <button onclick="$('slotModal').classList.remove('show')" style="margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:#999">×</button>
    </div>
    <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;color:#0369a1;margin-bottom:8px">💾 현재 일정 전체를 저장</div>
      <div style="font-size:11.5px;color:#0369a1;margin-bottom:8px">날짜(2026-06) 이름은 이력, 그 외는 백업용. 전체 일정·카테고리가 저장됩니다.</div>
      <div style="display:flex;gap:8px">
        <input type="text" id="slotName" placeholder="이름 (예: 2026-06 또는 백업)" maxlength="30" style="flex:1;padding:9px;font-size:13px;border:1px solid #ccc;border-radius:6px">
        <button id="slotSaveBtn" style="background:#0ea5e9;color:white;border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">저장</button>
      </div>
    </div>
    <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:8px">📋 저장된 백업</div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button id="slotTabMonth" onclick="window._slotSwitchTab('month')" style="flex:1;padding:7px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;background:#1F4E78;color:white;border:none">📅 날짜별 <span id="cntMonth">0</span></button>
      <button id="slotTabOther" onclick="window._slotSwitchTab('other')" style="flex:1;padding:7px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;background:#e8eef4;color:#1F4E78;border:none">📝 기타 <span id="cntOther">0</span></button>
    </div>
    <div id="slotSelectBar" style="display:none;align-items:center;gap:8px;margin-bottom:8px;font-size:12px">
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer;color:#555"><input type="checkbox" id="slotSelectAll" onclick="window._slotToggleAll(this.checked)"> 전체선택</label>
      <span id="slotSelCount" style="color:#888"></span>
      <button id="slotDelSelected" onclick="window._slotDeleteSelected()" style="margin-left:auto;background:#dc2626;color:white;border:none;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:none">선택 삭제</button>
    </div>
    <div id="slotList" style="display:flex;flex-direction:column;gap:8px">
      <div style="color:#999;font-size:13px;text-align:center;padding:20px">불러오는 중...</div>
    </div>
  </div>
</div>

<script src="/common.js?v=3"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-Ynu-KdYL4sqPers2XnPt5dEEsKsXvMY",
  authDomain: "swingfarmer-board01.firebaseapp.com",
  projectId: "swingfarmer-board01",
  storageBucket: "swingfarmer-board01.firebasestorage.app",
  messagingSenderId: "312575044644",
  appId: "1:312575044644:web:81d754eb1d90f25454fcb1"
};
const ADMIN_UID = "1JrHgD2bpTRjrS2jw7MbpHciBph1";
const CALC_KEY = "schedule";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });
const gid = id => document.getElementById(id);
let currentUser = null;

getRedirectResult(auth).catch(()=>{});
if(location.hash === '#admin' || location.hash === '#관리자'){ gid('btnAdminLogin').style.display='inline-block'; }
gid('btnAdminLogin').addEventListener('click', async ()=>{
  try{ await signInWithPopup(auth, provider); }
  catch(e){ const code=e&&e.code;
    if(code==='auth/popup-blocked'||code==='auth/cancelled-popup-request'||code==='auth/popup-closed-by-user'||code==='auth/operation-not-supported-in-this-environment'){
      try{ await signInWithRedirect(auth, provider); }catch(e2){ alert('로그인 실패: '+e2.message); }
    } else { alert('로그인 실패: '+(e.message||code)); }
  }
});
onAuthStateChanged(auth, user=>{
  currentUser=user; const isAdmin=user&&user.uid===ADMIN_UID;
  if(isAdmin){ gid('cloudArea').style.display='inline-flex'; gid('btnAdminLogin').style.display='none'; gid('cloudWho').textContent='☁️ '+(user.displayName||user.email||'관리자'); if(gid('uidInfo'))gid('uidInfo').style.display='none'; }
  else if(user&&!isAdmin){ gid('cloudArea').style.display='none'; gid('btnAdminLogin').style.display='none'; const box=gid('uidInfo'); if(box){ box.style.display='block'; box.innerHTML='로그인됨: <b>'+(user.email||'')+'</b><br>이 계정 UID:<br><code style="font-size:11px;word-break:break-all">'+user.uid+'</code><br><button onclick="window._scSignout()" style="background:#dc2626;color:white;border:none;border-radius:4px;padding:3px 9px;font-size:11.5px;cursor:pointer;margin-top:4px">로그아웃</button>'; } }
  else { gid('cloudArea').style.display='none'; if(gid('uidInfo'))gid('uidInfo').style.display='none'; }
});
window._scSignout=()=>signOut(auth);

const docRef=()=>doc(db,'calc_data',ADMIN_UID);
async function loadSlots(){ try{ const snap=await getDoc(docRef()); if(snap.exists()&&snap.data()[CALC_KEY]&&Array.isArray(snap.data()[CALC_KEY].slots))return snap.data()[CALC_KEY].slots; }catch(e){} return []; }
async function saveSlots(slots){ const ref=docRef(); let ex={}; try{ const s=await getDoc(ref); if(s.exists())ex=s.data(); }catch(e){} ex[CALC_KEY]={slots,updatedAt:new Date().toISOString()}; await setDoc(ref,ex,{merge:true}); }

let _slotsCache=[], _slotTab='month';
window._slotSwitchTab=function(t){ _slotTab=t; gid('slotTabMonth').style.background=t==='month'?'#1F4E78':'#e8eef4'; gid('slotTabMonth').style.color=t==='month'?'white':'#1F4E78'; gid('slotTabOther').style.background=t==='other'?'#1F4E78':'#e8eef4'; gid('slotTabOther').style.color=t==='other'?'white':'#1F4E78'; renderSlots(); };
function slotItemHtml(s,idx){ const t=s.savedAt?new Date(s.savedAt).toLocaleString('ko-KR'):''; const cnt=(s.data&&s.data.events)?s.data.events.length:0; return '<div style="display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px"><input type="checkbox" class="slotChk" data-idx="'+idx+'" onclick="window._slotChkChange()" style="width:16px;height:16px"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;color:#1F4E78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.name||'(이름없음)')+' <span style="color:#888;font-weight:500">(일정 '+cnt+'개)</span></div><div style="font-size:11px;color:#999">'+t+'</div></div><button onclick="window._slotRename('+idx+')" style="background:#e5e7eb;color:#444;border:none;padding:6px 9px;border-radius:6px;font-size:12px;cursor:pointer">✏️</button><button onclick="window._slotLoad('+idx+')" style="background:#0284c7;color:white;border:none;padding:6px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">불러오기</button></div>'; }
function renderSlots(){ const box=gid('slotList'); if(!_slotsCache||_slotsCache.length===0){ box.innerHTML='<div style="color:#999;font-size:13px;text-align:center;padding:20px">저장된 백업이 없어요.</div>'; gid('cntMonth').textContent='0'; gid('cntOther').textContent='0'; gid('slotSelectBar').style.display='none'; return; }
  const dateRe=/^\d{4}-\d{2}/; const dated=[],other=[];
  _slotsCache.forEach((s,i)=>{ (dateRe.test(s.name||'')?dated:other).push({s,i}); });
  dated.sort((a,b)=>(a.s.name<b.s.name?1:-1)); other.sort((a,b)=>(new Date(b.s.savedAt||0))-(new Date(a.s.savedAt||0)));
  gid('cntMonth').textContent=dated.length; gid('cntOther').textContent=other.length;
  const list=_slotTab==='month'?dated:other;
  if(list.length===0){ box.innerHTML='<div style="color:#aaa;font-size:13px;text-align:center;padding:20px">'+(_slotTab==='month'?'날짜(2026-06) 이름으로 저장한 게 여기 표시됩니다.':'기타 이름 백업이 여기 표시됩니다.')+'</div>'; gid('slotSelectBar').style.display='none'; return; }
  box.innerHTML=list.map(x=>slotItemHtml(x.s,x.i)).join(''); gid('slotSelectBar').style.display='flex'; gid('slotSelectAll').checked=false; window._slotChkChange();
}
window._slotChkChange=function(){ const chks=Array.from(document.querySelectorAll('.slotChk')),sel=chks.filter(c=>c.checked); gid('slotSelCount').textContent=sel.length>0?sel.length+'개 선택':''; gid('slotDelSelected').style.display=sel.length>0?'inline-block':'none'; gid('slotSelectAll').checked=chks.length>0&&sel.length===chks.length; };
window._slotToggleAll=function(c){ document.querySelectorAll('.slotChk').forEach(x=>x.checked=c); window._slotChkChange(); };
window._slotDeleteSelected=async function(){ const idxs=Array.from(document.querySelectorAll('.slotChk:checked')).map(c=>parseInt(c.dataset.idx)); if(idxs.length===0)return; if(!confirm(idxs.length+'개 삭제할까요?'))return; try{ idxs.sort((a,b)=>b-a).forEach(i=>_slotsCache.splice(i,1)); await saveSlots(_slotsCache); renderSlots(); }catch(e){ alert('삭제 실패: '+e.message); } };
async function refreshSlots(){ gid('slotList').innerHTML='<div style="color:#999;font-size:13px;text-align:center;padding:20px">불러오는 중...</div>'; _slotsCache=await loadSlots(); renderSlots(); }

gid('btnCloudOpen').addEventListener('click', async ()=>{ if(!currentUser||currentUser.uid!==ADMIN_UID){ alert('관리자 로그인이 필요합니다.'); return; } const now=new Date(); gid('slotName').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'); gid('slotModal').classList.add('show'); await refreshSlots(); });
gid('slotSaveBtn').addEventListener('click', async ()=>{ const name=gid('slotName').value.trim(); if(!name){ alert('이름을 입력하세요.'); return; } const idx=_slotsCache.findIndex(s=>s.name===name); if(idx>=0&&!confirm('"'+name+'" 이미 있어요. 덮어쓸까요?'))return; gid('slotSaveBtn').disabled=true; gid('slotSaveBtn').textContent='저장 중...';
  try{ const data=window.scGetState(); const entry={name,data:JSON.parse(JSON.stringify(data)),savedAt:new Date().toISOString()}; if(idx>=0)_slotsCache[idx]=entry; else _slotsCache.push(entry); await saveSlots(_slotsCache); renderSlots(); alert('✅ "'+name+'" 저장 완료.'); }catch(e){ alert('저장 실패: '+e.message); }
  gid('slotSaveBtn').disabled=false; gid('slotSaveBtn').textContent='저장'; });
window._slotLoad=function(i){ const s=_slotsCache[i]; if(!s)return; if(!confirm('"'+s.name+'" 불러올까요? 현재 일정이 교체됩니다.'))return; window.scSetState(s.data); gid('slotModal').classList.remove('show'); alert('✅ "'+s.name+'" 불러왔어요.'); };
window._slotRename=async function(i){ const s=_slotsCache[i]; if(!s)return; const nn=prompt('이름 수정 (날짜는 2026-06 형식)',s.name||''); if(nn===null)return; const t=nn.trim(); if(!t){ alert('이름을 비울 수 없어요.'); return; } if(_slotsCache.some((x,idx)=>idx!==i&&x.name===t)){ alert('같은 이름이 있어요.'); return; } try{ _slotsCache[i].name=t; await saveSlots(_slotsCache); renderSlots(); }catch(e){ alert('실패: '+e.message); } };
gid('btnCloudLogout').addEventListener('click', async ()=>{ if(confirm('로그아웃 할까요?')){ try{ await signOut(auth); alert('로그아웃 됐어요.'); }catch(e){} } });
</script>
<script>
const $ = id => document.getElementById(id);
const STORE_KEY = 'sf_schedule_v1';
const WEEK = ['일','월','화','수','목','금','토'];

let events = []; // {id, date:'YYYY-MM-DD', title, cat, memo, done}
let categories = []; // {name, color}
let viewDate = new Date();
let mode = 'cal';
let editingId = null;
let pickedCat = '';
let listFilter = 'all';
let showEcon = false; // 경제지표 표시 여부

// === 경제지표 자동 생성 ===
// N번째 특정요일 날짜 구하기 (year, month0, weekday0=일~6, nth=1~4)
function nthWeekday(y, m, weekday, nth){
  const first=new Date(y,m,1); const firstDow=first.getDay();
  let day = 1 + ((weekday - firstDow + 7)%7) + (nth-1)*7;
  return new Date(y, m, day);
}
function fmtD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// 특정 연·월의 경제지표 일정 생성
function genEconForMonth(y, m){
  const list = [];
  // 1=월요일 기준 아님, 0=일 1=월 2=화 3=수 4=목 5=금 6=토
  // NFP 미국 고용보고서: 첫째 주 금요일 (확실)
  list.push({ date: fmtD(nthWeekday(y,m,5,1)), title:'미국 고용보고서(NFP)', cat:'__econ_sure', memo:'매월 첫째 주 금요일' });
  // 미국 CPI: 둘째 주 화요일 근처 (예상)
  list.push({ date: fmtD(nthWeekday(y,m,2,2)), title:'미국 CPI (예상)', cat:'__econ_est', memo:'보통 둘째 주 화요일~, 실제 10~15일 사이 변동' });
  // PPI: CPI 다음날(수) 근처 (예상)
  list.push({ date: fmtD(nthWeekday(y,m,3,2)), title:'미국 PPI (예상)', cat:'__econ_est', memo:'보통 CPI 다음날 전후' });
  // 미국 옵션만기: 셋째 주 금요일 (확실)
  list.push({ date: fmtD(nthWeekday(y,m,5,3)), title:'미국 옵션만기', cat:'__econ_sure', memo:'매월 셋째 주 금요일' });
  // 네 마녀의 날: 3·6·9·12월 둘째 주 목요일 (한국, 확실)
  if([2,5,8,11].includes(m)){
    list.push({ date: fmtD(nthWeekday(y,m,4,2)), title:'네 마녀의 날 (선물·옵션 동시만기)', cat:'__econ_sure', memo:'3·6·9·12월 둘째 주 목요일 (한국)' });
  }
  // FOMC: 분기말 대표월 (1·3·4·6·7·9·10·12월 중 점도표는 3·6·9·12) — 예상
  // 간단히 3·6·9·12월 셋째 주 수요일로 표기 (예상)
  if([2,5,8,11].includes(m)){
    list.push({ date: fmtD(nthWeekday(y,m,3,3)), title:'FOMC 금리결정 (예상·점도표)', cat:'__econ_est', memo:'분기말, 실제 일정은 연준 공지 확인' });
  }
  return list;
}

// 보이는 범위(앞뒤 3개월)의 경제지표 생성
function getEconEvents(centerDate){
  let out=[];
  for(let off=-2; off<=2; off++){
    const d=new Date(centerDate.getFullYear(), centerDate.getMonth()+off, 1);
    out = out.concat(genEconForMonth(d.getFullYear(), d.getMonth()));
  }
  return out.map((e,i)=>({ ...e, id:'econ_'+e.date+'_'+i, done:false, isEcon:true }));
}
function econColor(cat){ return cat==='__econ_sure' ? '#0891b2' : '#94a3b8'; } // 확실=청록, 예상=회색

const DEFAULT_CATS = [
  { name:'실적', color:'#dc2626' },
  { name:'배당', color:'#16a34a' },
  { name:'금리/지표', color:'#f59e0b' },
  { name:'부동산', color:'#8b5cf6' },
  { name:'개인', color:'#1F4E78' }
];

function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const d=JSON.parse(raw); events=d.events||[]; categories=d.categories||[]; showEcon=d.showEcon||false; } }catch(e){}
  if(categories.length===0) categories=JSON.parse(JSON.stringify(DEFAULT_CATS));
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({events, categories, showEcon})); }catch(e){} }
function toggleEcon(){ showEcon=$('econToggle').checked; save(); render(); }

function catColor(name){ const c=categories.find(x=>x.name===name); return c?c.color:'#9ca3af'; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function setMode(m){
  mode=m;
  $('modeCalBtn').classList.toggle('active', m==='cal');
  $('modeListBtn').classList.toggle('active', m==='list');
  $('calMode').style.display = m==='cal'?'block':'none';
  $('listMode').style.display = m==='list'?'block':'none';
  render();
}
function moveMonth(d){ viewDate.setMonth(viewDate.getMonth()+d); render(); }
function goToday(){ viewDate=new Date(); render(); }

function render(){ if(mode==='cal') renderCalendar(); else renderList(); }

function renderCalendar(){
  const y=viewDate.getFullYear(), m=viewDate.getMonth();
  $('calTitle').textContent = y+'년 '+(m+1)+'월';
  const first=new Date(y,m,1), startDay=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=todayStr();
  // 경제지표 (토글 시)
  const econ = showEcon ? getEconEvents(viewDate) : [];

  let cells=[];
  // 이전달 채우기
  for(let i=startDay-1;i>=0;i--) cells.push({day:prevDays-i, other:true, date:fmtDate(new Date(y,m-1,prevDays-i))});
  // 이번달
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d, other:false, date:fmtDate(new Date(y,m,d))});
  // 다음달 (6주 채우기)
  let next=1; while(cells.length%7!==0 || cells.length<42){ cells.push({day:next, other:true, date:fmtDate(new Date(y,m+1,next))}); next++; if(cells.length>=42)break; }

  $('calGrid').innerHTML = cells.map(c=>{
    const dow=new Date(c.date).getDay();
    const userEv=events.filter(e=>e.date===c.date).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
    const econEv=econ.filter(e=>e.date===c.date);
    const dayEvents=userEv.concat(econEv);
    const shown=dayEvents.slice(0,3);
    const more=dayEvents.length-shown.length;
    const evHtml=shown.map(e=>{
      const col = e.isEcon ? econColor(e.cat) : catColor(e.cat);
      const style = e.isEcon ? `background:${col};${e.cat==='__econ_est'?'border:1px dashed rgba(255,255,255,.6)':''}` : `background:${col}`;
      return `<div class="cal-ev ${e.done?'done':''}" style="${style}">${e.title.replace(/</g,'&lt;')}</div>`;
    }).join('') + (more>0?`<div class="cal-more">+${more}</div>`:'');
    return `<div class="cal-cell ${c.other?'other-month':''} ${c.date===today?'today':''} ${dow===0?'sun':''} ${dow===6?'sat':''}" onclick="openAddFor('${c.date}')">
      <div class="cal-daynum">${c.day}</div>
      <div class="cal-events">${evHtml}</div>
    </div>`;
  }).join('');
}

function renderList(){
  // 필터칩
  $('listFilters').innerHTML = `<div class="filter-chip ${listFilter==='all'?'active':''}" onclick="setFilter('all')">전체</div>` +
    categories.map(c=>`<div class="filter-chip ${listFilter===c.name?'active':''}" onclick="setFilter('${c.name}')" style="${listFilter===c.name?'background:'+c.color+';border-color:'+c.color:''}">${c.name}</div>`).join('');

  const today=todayStr();
  // 경제지표 합치기 (토글 시, 전체 필터일 때만)
  let allEvents = events.slice();
  if(showEcon && listFilter==='all'){
    allEvents = allEvents.concat(getEconEvents(new Date()));
  }
  let evs = allEvents.filter(e=> listFilter==='all' || e.cat===listFilter);
  evs.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);

  const upcoming = evs.filter(e=>e.date>=today);
  const past = evs.filter(e=>e.date<today).reverse();

  if(evs.length===0){ $('listContent').innerHTML='<div class="empty">일정이 없어요. + 버튼으로 추가하세요.</div>'; return; }

  let html='';
  if(upcoming.length>0){ html += groupByMonth(upcoming, today); }
  if(past.length>0){
    html += `<div class="list-month-label" style="color:#aaa;margin-top:20px">지난 일정</div>`;
    html += past.map(e=>listItemHtml(e, today)).join('');
  }
  $('listContent').innerHTML = html;
}

function groupByMonth(evs, today){
  const groups={};
  evs.forEach(e=>{ const ym=e.date.slice(0,7); (groups[ym]=groups[ym]||[]).push(e); });
  return Object.keys(groups).sort().map(ym=>{
    const [y,m]=ym.split('-');
    return `<div class="list-group"><div class="list-month-label">${y}년 ${parseInt(m)}월</div>` +
      groups[ym].map(e=>listItemHtml(e,today)).join('') + `</div>`;
  }).join('');
}

function listItemHtml(e, today){
  const d=new Date(e.date);
  const dday = Math.round((new Date(e.date)-new Date(today))/(1000*60*60*24));
  let ddayText='', ddayColor='#888';
  if(dday===0){ ddayText='D-DAY'; ddayColor='#dc2626'; }
  else if(dday>0){ ddayText='D-'+dday; ddayColor= dday<=7?'#f59e0b':'#888'; }
  else { ddayText='D+'+(-dday); ddayColor='#ccc'; }

  // 경제지표 (자동 생성) — 체크/삭제 없음, 색 다름
  if(e.isEcon){
    const col=econColor(e.cat);
    const estTag = e.cat==='__econ_est' ? '<span style="font-size:9px;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:3px;margin-left:4px">예상</span>' : '';
    return `<div class="list-item" style="border-left-color:${col};opacity:.92">
      <div style="width:24px;flex-shrink:0;text-align:center;font-size:16px">📈</div>
      <div class="list-date"><b>${d.getDate()}</b>${WEEK[d.getDay()]}</div>
      <div class="list-body">
        <div class="list-title" style="font-weight:600">${e.title.replace(/</g,'&lt;')}${estTag}</div>
        ${e.memo?`<div class="list-memo">${e.memo.replace(/</g,'&lt;')}</div>`:''}
      </div>
      <span class="list-cat" style="background:${col}">지표</span>
      <span class="list-dday" style="color:${ddayColor}">${ddayText}</span>
    </div>`;
  }

  return `<div class="list-item ${e.done?'done':''}" style="border-left-color:${catColor(e.cat)}">
    <div class="list-check" onclick="event.stopPropagation();toggleDone('${e.id}')">${e.done?'✓':''}</div>
    <div class="list-date"><b>${d.getDate()}</b>${WEEK[d.getDay()]}</div>
    <div class="list-body" onclick="openEdit('${e.id}')">
      <div class="list-title">${e.title.replace(/</g,'&lt;')}</div>
      ${e.memo?`<div class="list-memo">${e.memo.replace(/</g,'&lt;')}</div>`:''}
    </div>
    <span class="list-cat" style="background:${catColor(e.cat)}">${e.cat||'-'}</span>
    <span class="list-dday" style="color:${ddayColor}">${ddayText}</span>
    <button class="list-del" onclick="event.stopPropagation();delEventDirect('${e.id}')">×</button>
  </div>`;
}

function setFilter(f){ listFilter=f; renderList(); }
function toggleDone(id){ const e=events.find(x=>x.id===id); if(e){ e.done=!e.done; save(); render(); } }
function delEventDirect(id){ if(confirm('이 일정을 삭제할까요?')){ events=events.filter(x=>x.id!==id); save(); render(); } }

// 모달
function renderCatPicker(){
  $('catPicker').innerHTML = categories.map(c=>`<div class="cat-opt ${pickedCat===c.name?'sel':''}" style="background:${c.color}" onclick="pickCat('${c.name}')">${c.name}</div>`).join('');
}
function pickCat(name){ pickedCat=name; renderCatPicker(); }

function openAdd(){ editingId=null; pickedCat=categories[0]?.name||''; $('modalTitle').textContent='일정 추가'; $('evDate').value=todayStr(); $('evTitle').value=''; $('evMemo').value=''; $('delBtn').style.display='none'; renderCatPicker(); $('evModal').classList.add('show'); }
function openAddFor(date){ openAdd(); $('evDate').value=date; }
function openEdit(id){
  const e=events.find(x=>x.id===id); if(!e)return;
  editingId=id; pickedCat=e.cat; $('modalTitle').textContent='일정 수정';
  $('evDate').value=e.date; $('evTitle').value=e.title; $('evMemo').value=e.memo||'';
  $('delBtn').style.display='block'; renderCatPicker(); $('evModal').classList.add('show');
}
function closeModal(){ $('evModal').classList.remove('show'); }
function saveEvent(){
  const date=$('evDate').value, title=$('evTitle').value.trim();
  if(!date){ alert('날짜를 선택하세요.'); return; }
  if(!title){ alert('제목을 입력하세요.'); return; }
  const memo=$('evMemo').value.trim();
  if(editingId){
    const e=events.find(x=>x.id===editingId);
    if(e){ e.date=date; e.title=title; e.cat=pickedCat; e.memo=memo; }
  } else {
    events.push({ id:'ev'+Date.now()+Math.random().toString(36).slice(2,6), date, title, cat:pickedCat, memo, done:false });
  }
  save(); closeModal(); render();
}
function deleteEvent(){ if(editingId && confirm('삭제할까요?')){ events=events.filter(x=>x.id!==editingId); save(); closeModal(); render(); } }

// 카테고리 관리
function manageCats(){ renderCatManage(); $('catModal').classList.add('show'); }
function renderCatManage(){
  $('catManageList').innerHTML = categories.map((c,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0">
    <span style="width:18px;height:18px;border-radius:5px;background:${c.color};flex-shrink:0"></span>
    <span style="flex:1;font-size:13px;font-weight:600">${c.name}</span>
    <button onclick="delCat(${i})" style="background:#fee2e2;color:#dc2626;border:none;border-radius:5px;padding:4px 9px;font-size:12px;cursor:pointer">삭제</button>
  </div>`).join('');
}
function addCat(){
  const name=$('newCatName').value.trim(), color=$('newCatColor').value;
  if(!name){ alert('이름을 입력하세요.'); return; }
  if(categories.some(c=>c.name===name)){ alert('이미 있어요.'); return; }
  categories.push({name,color}); save(); $('newCatName').value=''; renderCatManage();
}
function delCat(i){ if(confirm(`"${categories[i].name}" 삭제? (일정은 남습니다)`)){ categories.splice(i,1); save(); renderCatManage(); render(); } }

function saveJson(){ const blob=new Blob([JSON.stringify({events,categories},null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); const d=new Date(); a.href=url; a.download=`일정표_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`; a.click(); URL.revokeObjectURL(url); }
function loadJson(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); events=d.events||[]; categories=d.categories||DEFAULT_CATS; save(); render(); alert('✅ 불러왔어요.'); }catch(err){ alert('파일 오류: '+err.message); } }; r.readAsText(f); e.target.value=''; }

$('evModal').addEventListener('click', e=>{ if(e.target===$('evModal')) closeModal(); });
$('catModal').addEventListener('click', e=>{ if(e.target===$('catModal')) $('catModal').classList.remove('show'); });

window.scGetState = ()=>({events, categories});
window.scSetState = (d)=>{ events=d.events||[]; categories=d.categories||JSON.parse(JSON.stringify(DEFAULT_CATS)); save(); render(); };

load();
if($('econToggle')) $('econToggle').checked = showEcon;
render();
</script>
</body>
</html>
