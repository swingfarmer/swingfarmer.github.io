<title>스윙파머 전체 메뉴</title>

<link rel="stylesheet" href="/common.css?v=12">
<style>
:root { --sf-max-w: 960px; }
header{text-align:center;margin-bottom:30px}
.subtitle{color:#666;font-size:15px}
.hidden-badge{display:inline-block;background:#1F4E78;color:white;font-size:12px;font-weight:600;padding:4px 12px;border-radius:12px;margin-top:10px}
.section-title{font-size:14px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin:28px 0 10px 0;border-bottom:1px solid #e5e7eb;padding-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.section-title:hover{color:#1F4E78}
.section-title .arrow{font-size:12px;transition:transform .2s;color:#aaa}
.section-title.collapsed .arrow{transform:rotate(-90deg)}
.section-title .cnt{font-size:11px;color:#aaa;font-weight:400;margin-left:auto}
.section-body.collapsed{display:none}
.row{display:grid;gap:14px;margin-bottom:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.icon{font-size:22px;margin-bottom:6px}.card-title{font-size:13px}.card-desc{font-size:11px;line-height:1.4}.tag{font-size:10px}}
.card{background:white;border-radius:10px;padding:18px;box-shadow:0 2px 6px rgba(0,0,0,0.06);text-decoration:none;color:inherit;border:2px solid transparent;transition:all .15s;display:flex;flex-direction:column;height:100%}
.card:hover{border-color:#1F4E78;transform:translateY(-2px);box-shadow:0 4px 12px rgba(31,78,120,0.15)}
.icon{font-size:26px;margin-bottom:8px}
.card-title{font-size:15px;font-weight:700;color:#1F4E78;margin-bottom:4px}
.card-desc{font-size:12px;color:#666;line-height:1.5;flex:1}
.tag{display:inline-block;background:#eef2f7;color:#1F4E78;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-top:8px;align-self:flex-start}
.tag.live{background:#fee2e2;color:#dc2626}
.tag.ext{background:#e0e7ff;color:#4338ca}
.tag.new{background:#d1fae5;color:#065f46}
.tag.db{background:#fef3c7;color:#92400e}
footer{text-align:center;margin-top:60px;color:#999;font-size:12px}

body.sf-dark .subtitle{color:#a1a1aa}
body.sf-dark .hidden-badge{background:#1e3a5f}
body.sf-dark .section-title{color:#a1a1aa;border-color:#2a2d3a}
body.sf-dark .section-title:hover{color:#60a5fa}
body.sf-dark .section-title .arrow{color:#71717a}
body.sf-dark .section-title .cnt{color:#71717a}
body.sf-dark .tag.live{background:rgba(239,68,68,.15)!important;color:#f87171!important}
body.sf-dark .tag.ext{background:rgba(99,102,241,.15)!important;color:#818cf8!important}
body.sf-dark .tag.new{background:rgba(34,197,94,.15)!important;color:#4ade80!important}
body.sf-dark .tag.db{background:rgba(251,191,36,.15)!important;color:#fbbf24!important}
body.sf-dark footer{color:#71717a}
.sec-tools{display:flex;justify-content:flex-end;gap:6px;margin:6px 0 -14px}
.sec-tools button{background:none;border:1px solid #d1d5db;color:#1F4E78;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}
.sec-tools button:hover{border-color:#1F4E78}
.auto-note{font-size:12px;color:#888;margin-top:8px}
.load-msg{text-align:center;color:#888;font-size:13px;padding:30px 0}
body.sf-dark .sec-tools button{border-color:#3f4354;color:#60a5fa}
body.sf-dark .auto-note,body.sf-dark .load-msg{color:#a1a1aa}
</style>

<link rel="stylesheet" href="/auth-guard.css?v=4">
<script type="module" src="/auth-guard.js?v=6"></script>
</head>
<body class="sf-no-pblock sf-narrow">

<header>
  <h1>스윙파머 전체 메뉴</h1>
  <p class="subtitle">개인 재무 시뮬레이션 &amp; 분석 모음</p>
  <div class="hidden-badge" id="allBadge">🔒 전체 목록</div>
  <p class="auto-note">메인 화면의 카드를 그대로 불러와서 카테고리별로 펼쳐 보여줌 — 메인만 고치면 여기도 자동으로 같아짐</p>
  <div style="margin-top:16px"><a href="/" style="display:inline-block;background:#1F4E78;color:white;text-decoration:none;font-size:14px;font-weight:600;padding:10px 24px;border-radius:8px">🏠 메인으로</a></div>
</header>

<!-- 메뉴 찾기 (089) — 동작은 /menu-search.js, 카드(a.card)를 읽어서 찾음. 카드를 다 그린 뒤에 불러옴(아래 스크립트) -->
<div id="sfMenuSearch"></div>

<div class="sec-tools"><button type="button" id="btnOpenAll">모두 펼치기</button><button type="button" id="btnCloseAll">모두 접기</button></div>

<!-- (094) 카드는 여기 직접 쓰지 않는다. 메인(/)의 .tool-panel을 불러와서 그림 → 새 페이지는 메인에만 카드 추가 -->
<div id="sections"><div class="load-msg">메뉴 불러오는 중…</div></div>

<footer id="allFooter">© 스윙파머 · 전체 메뉴</footer>

<script>
(function(){
  var KEY = 'sf_hidden_collapsed';   // 섹션 접힘 상태 (예전 1808과 같은 키)
  var collapsed = {};
  try{ collapsed = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  function saveCol(){ try{ localStorage.setItem(KEY, JSON.stringify(collapsed)); }catch(e){} }
  var box = document.getElementById('sections');

  function loadSearch(){
    // 메뉴 찾기는 처음 검색할 때 카드를 읽음 → 카드를 다 그린 뒤에 스크립트를 붙여야 빈 목록이 안 됨
    var sc = document.createElement('script');
    sc.src = '/menu-search.js?v=2';
    document.body.appendChild(sc);
  }

  function setSec(title, body, isCol){
    title.classList.toggle('collapsed', isCol);
    body.classList.toggle('collapsed', isCol);
    collapsed[title.getAttribute('data-section')] = isCol;
  }

  function render(doc){
    var panels = doc.querySelectorAll('.tool-panel[id^="panel-"]');
    if(!panels.length) throw new Error('메인에서 카테고리를 못 찾음');
    var frag = document.createDocumentFragment(), total = 0;
    panels.forEach(function(p){
      var key = p.id.replace(/^panel-/, '');
      var h = p.querySelector('.panel-header h2');
      var cards = p.querySelectorAll('.tool-grid > .card');
      total += cards.length;

      var title = document.createElement('div');
      title.className = 'section-title';
      title.setAttribute('data-section', key);
      title.textContent = (h ? h.textContent.trim() : key) + ' ';
      var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = cards.length;
      var arr = document.createElement('span'); arr.className = 'arrow'; arr.textContent = '▼';
      title.appendChild(cnt); title.appendChild(arr);

      var body = document.createElement('div');
      body.className = 'section-body';
      body.setAttribute('data-body', key);
      var row = document.createElement('div'); row.className = 'row';
      cards.forEach(function(c){
        var n = document.importNode(c, true);
        n.querySelectorAll('.star-btn').forEach(function(x){ x.remove(); });
        row.appendChild(n);
      });
      body.appendChild(row);

      if(collapsed[key]){ title.classList.add('collapsed'); body.classList.add('collapsed'); }
      title.addEventListener('click', function(){
        setSec(title, body, !title.classList.contains('collapsed')); saveCol();
      });
      frag.appendChild(title); frag.appendChild(body);
    });
    box.innerHTML = '';
    box.appendChild(frag);
    document.getElementById('allBadge').textContent = '🔒 전체 목록 · ' + total + '개 도구';
    document.getElementById('allFooter').textContent = '© 스윙파머 · 전체 메뉴 · ' + total + '개 도구';
  }

  function all(isCol){
    document.querySelectorAll('.section-title[data-section]').forEach(function(t){
      var b = document.querySelector('.section-body[data-body="' + t.getAttribute('data-section') + '"]');
      if(b) setSec(t, b, isCol);
    });
    saveCol();
  }
  document.getElementById('btnOpenAll').addEventListener('click', function(){ all(false); });
  document.getElementById('btnCloseAll').addEventListener('click', function(){ all(true); });

  fetch('/', {cache: 'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(html){
      render(new DOMParser().parseFromString(html, 'text/html'));
      loadSearch();
    })
    .catch(function(e){
      box.innerHTML = '<div class="load-msg">메인 메뉴를 못 불러왔어요 (' + String(e.message || e).replace(/[<>&]/g, '') + ') — 새로고침하거나 메인에서 보세요.</div>';
    });
})();
</script>
<script src="/common.js?v=11"></script>
</body>
</html>
