<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>공지 & 문의 게시판</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f7fa;color:#1a1a1a}
.back-link{display:inline-block;margin-bottom:16px;color:#1F4E78;text-decoration:none;font-size:14px}
.back-link:hover{text-decoration:underline}
h1{color:#1F4E78;border-bottom:3px solid #1F4E78;padding-bottom:10px;margin-bottom:6px;font-size:22px}
.desc{color:#555;font-size:13.5px;margin-bottom:18px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-tabs{display:flex;gap:4px;background:#e5e7eb;padding:4px;border-radius:8px}
.ftab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:#666;border-radius:6px;font-family:inherit}
.ftab.active{background:white;color:#1F4E78;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{padding:9px 16px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:#1F4E78;color:white}
.btn-primary:hover{background:#2d6ba3}
.btn-gray{background:#9ca3af;color:white}
.btn-red{background:#dc2626;color:white}
.btn-sm{padding:5px 11px;font-size:12px}

.post-list{display:flex;flex-direction:column;gap:10px}
.post{background:white;border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #e5e7eb;cursor:pointer;transition:all .15s}
.post:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.post.notice{border-left-color:#dc2626;background:#fffbfb}
.post.pinned{border-left-color:#d97706;background:#fffbeb}
.post-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.badge.notice{background:#fee2e2;color:#b91c1c}
.badge.question{background:#dbeafe;color:#1e40af}
.badge.pin{background:#fed7aa;color:#9a3412}
.post-title{font-size:15px;font-weight:700;color:#1a1a1a;flex:1}
.post-meta{font-size:12px;color:#999;display:flex;gap:10px;flex-wrap:wrap}
.post-body{margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;font-size:14px;line-height:1.7;color:#333;white-space:pre-wrap;word-break:break-word;display:none}
.post.open .post-body{display:block}
.post-actions{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.replies{margin-top:14px;padding-top:12px;border-top:1px dashed #ddd}
.reply-empty{font-size:12px;color:#aaa;padding:4px 0 10px}
.reply-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.reply{background:#f8fafc;border-radius:8px;padding:9px 12px;font-size:13px}
.reply.admin{background:#eff6ff;border-left:3px solid #2563eb}
.reply-head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.reply-name{font-weight:700;color:#1F4E78;font-size:12px}
.reply.admin .reply-name{color:#1e40af}
.reply-date{font-size:11px;color:#aaa;margin-right:auto}
.reply-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:12px;padding:0 4px}
.reply-del:hover{color:#dc2626}
.reply-text-body{color:#333;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.reply-form{display:flex;gap:6px;flex-wrap:wrap}
.reply-form .reply-author{width:90px;padding:7px 9px;font-size:13px;border:1px solid #ccc;border-radius:6px;background:#FFF2CC;font-family:inherit}
.reply-form .reply-text{flex:1;min-width:140px;padding:7px 9px;font-size:13px;border:1px solid #ccc;border-radius:6px;background:#FFF2CC;font-family:inherit}
.reply-form input:focus{outline:2px solid #1F4E78;background:#FFFACD}

.empty{text-align:center;color:#999;padding:50px 20px;background:white;border-radius:10px}
.loading{text-align:center;color:#888;padding:40px}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:white;border-radius:12px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal h2{color:#1F4E78;font-size:18px;margin-bottom:16px}
.field{display:flex;flex-direction:column;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;margin-bottom:5px;color:#444}
.field input,.field select,.field textarea{padding:10px;font-size:14px;border:1px solid #ccc;border-radius:6px;font-family:inherit}
.field input,.field textarea{background:#FFF2CC}
.field textarea{min-height:140px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #1F4E78;background:#FFFACD}
.field .hint{font-size:11px;color:#888;margin-top:3px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.notice-box{background:#dbeafe;border-left:4px solid #2563eb;padding:12px 16px;border-radius:6px;font-size:12.5px;color:#1e3a8a;line-height:1.7;margin-bottom:16px}
.admin-only{display:none}
</style>
</head>
<body>

<a href="/" class="back-link">← 메인으로</a>
<h1>📢 공지 & 문의 게시판</h1>
<p class="desc">업데이트 소식·공지사항과 문의를 남기는 공간입니다. 누구나 읽고 문의를 남길 수 있어요.</p>

<div class="notice-box">
  💬 <b>문의는 누구나</b> 남길 수 있습니다. 글 작성 시 정한 <b>비밀번호</b>로 본인 글을 수정·삭제할 수 있어요. 공지는 운영자만 작성합니다.<br>
  ⚠️ 비밀번호·연락처 등 민감한 개인정보는 적지 마세요. (이 게시판은 공개됩니다)
</div>

<div class="toolbar">
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all">전체</button>
    <button class="ftab" data-filter="notice">📢 공지</button>
    <button class="ftab" data-filter="question">💬 문의</button>
  </div>
  <button class="btn btn-primary" id="btnWrite" style="margin-left:auto">✏️ 글쓰기</button>
  <button class="btn btn-gray" id="btnSelectMode">☑️ 선택삭제</button>
  <button class="btn btn-red" id="btnBulkDelete">🗑 일괄삭제</button>
</div>

<div id="selectBar" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;margin-bottom:12px;align-items:center;gap:10px">
  <label style="font-size:13px;font-weight:600;color:#991b1b;display:flex;align-items:center;gap:6px;cursor:pointer">
    <input type="checkbox" id="checkAll" style="width:16px;height:16px"> 전체 선택
  </label>
  <span id="selectCount" style="font-size:13px;color:#991b1b;margin-right:auto">0개 선택됨</span>
  <button class="btn btn-red btn-sm" id="btnDeleteSelected">선택 삭제</button>
  <button class="btn btn-gray btn-sm" id="btnSelectCancel">취소</button>
</div>

<div id="postList" class="post-list">
  <div class="loading">불러오는 중...</div>
</div>

<!-- 글쓰기/수정 모달 -->
<div class="modal-bg" id="writeModal">
  <div class="modal">
    <h2 id="modalTitle">✏️ 글쓰기</h2>
    <div class="field">
      <label>종류</label>
      <select id="fType">
        <option value="question" selected>💬 문의</option>
        <option value="notice">📢 공지 (운영자)</option>
      </select>
    </div>
    <div class="field">
      <label>제목</label>
      <input type="text" id="fTitle" placeholder="제목을 입력하세요" maxlength="100">
    </div>
    <div class="field">
      <label>작성자</label>
      <input type="text" id="fAuthor" placeholder="이름 또는 닉네임" maxlength="20">
    </div>
    <div class="field">
      <label>내용</label>
      <textarea id="fContent" placeholder="내용을 입력하세요"></textarea>
    </div>
    <div class="field" id="pwField">
      <label id="pwLabel">비밀번호 <span style="color:#888;font-weight:400">(본인 글 수정·삭제용)</span></label>
      <div style="position:relative">
        <input type="password" id="fPw" placeholder="4자 이상" maxlength="30" style="width:100%;padding-right:44px">
        <button type="button" id="fPwToggle" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px">👁</button>
      </div>
      <span class="hint" id="pwHint">문의 글은 이 비밀번호로 나중에 수정·삭제할 수 있어요.</span>
    </div>
    <div class="field admin-only" id="pinField">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="fPinned" style="width:16px;height:16px"> 📌 상단 고정 (공지)
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-gray" id="btnCancel">취소</button>
      <button class="btn btn-primary" id="btnSubmit">등록</button>
    </div>
  </div>
</div>

<!-- 비밀번호 확인 모달 -->
<div class="modal-bg" id="pwModal">
  <div class="modal" style="max-width:380px">
    <h2 id="pwModalTitle">🔒 비밀번호 확인</h2>
    <div class="field">
      <div style="position:relative">
        <input type="password" id="pwInput" placeholder="비밀번호 입력" maxlength="30" style="width:100%;padding-right:44px">
        <button type="button" id="pwToggle" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px">👁</button>
      </div>
      <span class="hint" id="pwModalHint"></span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-gray" id="btnPwCancel">취소</button>
      <button class="btn btn-primary" id="btnPwConfirm">확인</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy, serverTimestamp, arrayUnion, getDoc, increment } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-Ynu-KdYL4sqPers2XnPt5dEEsKsXvMY",
  authDomain: "swingfarmer-board01.firebaseapp.com",
  projectId: "swingfarmer-board01",
  storageBucket: "swingfarmer-board01.firebasestorage.app",
  messagingSenderId: "312575044644",
  appId: "1:312575044644:web:81d754eb1d90f25454fcb1",
  measurementId: "G-WGQH1DPTFB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const POSTS = collection(db, 'posts');

// 관리자 비밀번호 해시 (공지 작성/고정/삭제용)
// 비밀번호를 바꾸려면: 새 비번의 해시를 구해서 아래 값 교체 (평문은 코드에 안 남김)
// 현재 기본 비번의 해시 — 반드시 본인 비번으로 바꾸세요!
const ADMIN_PW_HASH = "7046371e5d7b0d17221938e25d12b146ddc83a20546fb86eab16cb1d5c3a4014";

let allPosts = [];
let currentFilter = 'all';
let selectMode = false;
let editingId = null;
let pwAction = null; // {type:'edit'|'delete', post}

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 비밀번호 해시 (SHA-256) — 원본 비번을 저장하지 않음
async function hashPw(pw){
  const enc = new TextEncoder().encode(pw + '_sf_salt_2026');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// 비밀번호 입력 모달 (Promise) — prompt 대신, ** 마스킹 + 👁 표시
function askPassword(title, hint){
  return new Promise(resolve=>{
    $('pwModalTitle').textContent = title || '🔒 비밀번호 확인';
    $('pwModalHint').textContent = hint || '';
    $('pwInput').value = '';
    $('pwInput').type = 'password';
    $('pwModal').classList.add('active');
    setTimeout(()=>$('pwInput').focus(), 50);
    const ok = ()=>{ cleanup(); resolve($('pwInput').value); };
    const cancel = ()=>{ cleanup(); resolve(null); };
    function onKey(e){ if(e.key==='Enter') ok(); if(e.key==='Escape') cancel(); }
    function cleanup(){
      $('pwModal').classList.remove('active');
      $('btnPwConfirm').removeEventListener('click', ok);
      $('btnPwCancel').removeEventListener('click', cancel);
      $('pwInput').removeEventListener('keydown', onKey);
    }
    $('btnPwConfirm').addEventListener('click', ok);
    $('btnPwCancel').addEventListener('click', cancel);
    $('pwInput').addEventListener('keydown', onKey);
  });
}
// 표시 토글 (모달 비번)
$('pwToggle').addEventListener('click', ()=>{
  const i = $('pwInput');
  i.type = i.type==='password' ? 'text' : 'password';
});
// 표시 토글 (글쓰기 비번)
$('fPwToggle').addEventListener('click', ()=>{
  const i = $('fPw');
  i.type = i.type==='password' ? 'text' : 'password';
});

function fmtDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const p = n => ('0'+n).slice(-2);
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

// === 목록 로드 ===
async function loadPosts(){
  try{
    const q = query(POSTS, orderBy('createdAt','desc'));
    const snap = await getDocs(q);
    allPosts = [];
    snap.forEach(d => allPosts.push({id:d.id, ...d.data()}));
    render();
  }catch(e){
    $('postList').innerHTML = '<div class="empty">불러오기 실패: '+esc(e.message)+'<br><br>잠시 후 새로고침 해주세요.</div>';
  }
}

function render(){
  let posts = allPosts.slice();
  if(currentFilter !== 'all') posts = posts.filter(p => p.type === currentFilter);
  // 정렬: 고정 먼저, 그 다음 최신순
  posts.sort((a,b)=>{
    if((b.pinned?1:0)!==(a.pinned?1:0)) return (b.pinned?1:0)-(a.pinned?1:0);
    const ta = a.createdAt?.seconds||0, tb = b.createdAt?.seconds||0;
    return tb-ta;
  });
  if(posts.length===0){
    $('postList').innerHTML = '<div class="empty">아직 글이 없어요. 첫 글을 남겨보세요!</div>';
    return;
  }
  $('postList').innerHTML = posts.map(p => {
    const cls = (p.type==='notice'?'notice':'') + (p.pinned?' pinned':'');
    return `<div class="post ${cls}" data-id="${p.id}" onclick="window.postClick(event, this)">
      <div class="post-head">
        <input type="checkbox" class="post-check" data-id="${p.id}" onclick="event.stopPropagation()" style="display:none;width:17px;height:17px;cursor:pointer">
        ${p.pinned?'<span class="badge pin">📌 고정</span>':''}
        <span class="badge ${p.type}">${p.type==='notice'?'📢 공지':'💬 문의'}</span>
        <span class="post-title">${esc(p.title)}</span>
      </div>
      <div class="post-meta">
        <span>👤 ${esc(p.author||'익명')}</span>
        <span>🕒 ${fmtDate(p.createdAt)}</span>
        <span class="view-count">👁 ${p.views||0}</span>
      </div>
      <div class="post-body">${esc(p.content)}
        <div class="post-actions" onclick="event.stopPropagation()">
          <button class="btn btn-gray btn-sm" onclick="window.editPost('${p.id}')">수정</button>
          <button class="btn btn-red btn-sm" onclick="window.deletePost('${p.id}')">삭제</button>
        </div>
        <div class="replies" onclick="event.stopPropagation()">
          ${renderReplies(p)}
          <div class="reply-form">
            <input type="text" class="reply-author" id="ra_${p.id}" placeholder="이름" maxlength="20">
            <input type="text" class="reply-text" id="rt_${p.id}" placeholder="답글 달기..." maxlength="500">
            <button class="btn btn-primary btn-sm" onclick="window.addReply('${p.id}')">등록</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// 답글 목록 렌더
function renderReplies(p){
  const reps = p.replies || [];
  if(reps.length === 0) return '<div class="reply-empty">아직 답글이 없어요.</div>';
  return '<div class="reply-list">' + reps.map((r,idx)=>{
    const isAdmin = r.admin;
    return `<div class="reply ${isAdmin?'admin':''}">
      <div class="reply-head">
        <span class="reply-name">${isAdmin?'🛡️ ':''}${esc(r.author||'익명')}</span>
        <span class="reply-date">${fmtDate(r.createdAt)}</span>
        <button class="reply-del" onclick="window.deleteReply('${p.id}',${idx})" title="삭제">✕</button>
      </div>
      <div class="reply-text-body">${esc(r.text)}</div>
    </div>`;
  }).join('') + '</div>';
}

// 글 클릭: 선택모드면 체크, 아니면 펼침
window.postClick = function(e, el){
  if(selectMode){
    const chk = el.querySelector('.post-check');
    if(chk){ chk.checked = !chk.checked; updateSelectCount(); }
  } else {
    const wasOpen = el.classList.contains('open');
    el.classList.toggle('open');
    // 펼칠 때(닫힘→열림) 조회수 +1, 같은 브라우저 중복 방지
    if(!wasOpen){
      const id = el.dataset.id;
      addView(id, el);
    }
  }
};

// 조회수 증가 (localStorage로 브라우저별 중복 방지)
async function addView(id, el){
  try{
    let viewed = [];
    try{ viewed = JSON.parse(localStorage.getItem('sf_board_viewed')) || []; }catch(e){}
    if(viewed.includes(id)) return; // 이미 본 글
    await updateDoc(doc(db,'posts',id), { views: increment(1) });
    viewed.push(id);
    if(viewed.length>500) viewed = viewed.slice(-500);
    localStorage.setItem('sf_board_viewed', JSON.stringify(viewed));
    // 화면 숫자 갱신
    const p = allPosts.find(x=>x.id===id);
    if(p){ p.views = (p.views||0)+1; const vEl = el.querySelector('.view-count'); if(vEl) vEl.textContent = '👁 '+p.views; }
  }catch(e){}
}

// === 필터 ===
document.querySelectorAll('.ftab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentFilter = t.dataset.filter;
    render();
  });
});

// === 글쓰기 모달 ===
function openWrite(){
  editingId = null;
  $('modalTitle').textContent = '✏️ 글쓰기';
  $('fType').value = 'question'; $('fTitle').value=''; $('fAuthor').value=''; $('fContent').value=''; $('fPw').value=''; $('fPinned').checked=false;
  $('pwField').style.display = 'flex';  // 비번칸 복구
  updateTypeUI();
  $('writeModal').classList.add('active');
}
$('btnWrite').addEventListener('click', openWrite);
$('btnCancel').addEventListener('click', ()=> $('writeModal').classList.remove('active'));

function updateTypeUI(){
  const isNotice = $('fType').value === 'notice';
  $('pinField').style.display = isNotice ? 'block' : 'none';
  if(isNotice){
    $('pwLabel').innerHTML = '관리자 비밀번호';
    $('pwHint').textContent = '공지 작성에는 관리자 비밀번호가 필요합니다.';
    // 공지는 작성자 기본 '운영자'
    if(!editingId && (!$('fAuthor').value.trim() || $('fAuthor').value.trim()==='익명')){
      $('fAuthor').value = '운영자';
    }
  } else {
    $('pwLabel').innerHTML = '비밀번호 <span style="color:#888;font-weight:400">(본인 글 수정·삭제용)</span>';
    $('pwHint').textContent = '문의 글은 이 비밀번호로 나중에 수정·삭제할 수 있어요.';
    // 문의로 바꾸면 '운영자' 기본값 비우기
    if(!editingId && $('fAuthor').value.trim()==='운영자'){
      $('fAuthor').value = '';
    }
  }
}
$('fType').addEventListener('change', updateTypeUI);

// === 등록/수정 ===
$('btnSubmit').addEventListener('click', async ()=>{
  const type = $('fType').value;
  const title = $('fTitle').value.trim();
  const author = $('fAuthor').value.trim() || '익명';
  const content = $('fContent').value.trim();
  const pw = $('fPw').value;
  const pinned = $('fPinned').checked;

  if(!title){ alert('제목을 입력하세요.'); return; }
  if(!content){ alert('내용을 입력하세요.'); return; }

  // 신규 작성일 때만 비밀번호 검사 (수정은 진입 시 이미 인증됨)
  if(!editingId){
    if(type === 'notice'){
      const ph = await hashPw(pw);
      if(ph !== ADMIN_PW_HASH){ alert('관리자 비밀번호가 틀렸습니다.'); return; }
    } else {
      if(pw.length < 4){ alert('비밀번호를 4자 이상 입력하세요.'); return; }
    }
  }

  $('btnSubmit').disabled = true;
  $('btnSubmit').textContent = '저장 중...';
  try{
    if(editingId){
      // 수정
      const ref = doc(db, 'posts', editingId);
      await updateDoc(ref, { title, author, content, pinned: type==='notice'?pinned:false, updatedAt: serverTimestamp() });
    } else {
      // 신규 — 비밀번호는 해시로 저장 (원본 비번은 저장 안 함)
      const pwHash = type==='notice' ? '' : await hashPw(pw);
      await addDoc(POSTS, {
        type, title, author, content,
        pwHash,   // 문의만 해시 저장
        pinned: type==='notice' ? pinned : false,
        createdAt: serverTimestamp()
      });
    }
    $('writeModal').classList.remove('active');
    await loadPosts();
  }catch(e){
    alert('저장 실패: '+e.message);
  }
  $('btnSubmit').disabled = false;
  $('btnSubmit').textContent = '등록';
});

// === 수정 진입 ===
window.editPost = async function(id){
  const p = allPosts.find(x=>x.id===id);
  if(!p) return;
  const pw = await askPassword('🔒 수정 비밀번호', p.type==='notice'?'관리자 비밀번호를 입력하세요.':'본인 비밀번호 또는 관리자 비밀번호를 입력하세요.');
  if(pw === null) return;
  const ph = await hashPw(pw);
  const isAdmin = (ph === ADMIN_PW_HASH);
  const isOwner = (p.type!=='notice' && ph === p.pwHash);
  if(!isAdmin && !isOwner){ alert('비밀번호가 틀렸습니다.'); return; }
  fillEdit(p);
};
function fillEdit(p){
  editingId = p.id;
  $('modalTitle').textContent = '✏️ 글 수정';
  $('fType').value = p.type;
  $('fTitle').value = p.title;
  $('fAuthor').value = p.author;
  $('fContent').value = p.content;
  $('fPw').value = '';  // 수정 시 비번 재입력 불필요 (이미 통과)
  $('fPinned').checked = !!p.pinned;
  updateTypeUI();
  // 수정 모드에선 비번칸 숨김 (이미 인증됨)
  $('pwField').style.display = 'none';
  $('writeModal').classList.add('active');
}

// === 삭제 ===
window.deletePost = async function(id){
  const p = allPosts.find(x=>x.id===id);
  if(!p) return;
  const pw = await askPassword('🔒 삭제 비밀번호', p.type==='notice'?'관리자 비밀번호를 입력하세요.':'본인 비밀번호 또는 관리자 비밀번호를 입력하세요.');
  if(pw === null) return;
  const ph = await hashPw(pw);
  // 관리자 비번이면 무엇이든 삭제 가능, 아니면 본인 비번(문의만)
  const isAdmin = (ph === ADMIN_PW_HASH);
  const isOwner = (p.type!=='notice' && ph === p.pwHash);
  if(!isAdmin && !isOwner){ alert('비밀번호가 틀렸습니다.'); return; }
  if(!confirm('정말 삭제할까요?')) return;
  try{
    await deleteDoc(doc(db, 'posts', id));
    await loadPosts();
  }catch(e){
    alert('삭제 실패: '+e.message);
  }
};

// 모달 바깥 클릭 닫기
$('writeModal').addEventListener('click', e=>{ if(e.target===$('writeModal')) $('writeModal').classList.remove('active'); });

// === 선택삭제 모드 ===
function setSelectMode(on){
  selectMode = on;
  $('selectBar').style.display = on ? 'flex' : 'none';
  document.querySelectorAll('.post-check').forEach(c=>{ c.style.display = on?'inline-block':'none'; c.checked=false; });
  $('checkAll').checked = false;
  updateSelectCount();
  // 선택모드일 땐 글 펼침 막기(체크 편하게)
  document.querySelectorAll('.post').forEach(p=>{
    p.style.cursor = on ? 'default' : 'pointer';
  });
}
function updateSelectCount(){
  const n = document.querySelectorAll('.post-check:checked').length;
  $('selectCount').textContent = n + '개 선택됨';
}
$('btnSelectMode').addEventListener('click', ()=> setSelectMode(true));
$('btnSelectCancel').addEventListener('click', ()=> setSelectMode(false));
$('checkAll').addEventListener('change', ()=>{
  const on = $('checkAll').checked;
  document.querySelectorAll('.post-check').forEach(c=> c.checked = on);
  updateSelectCount();
});
// 체크 변경 감지 (이벤트 위임)
$('postList').addEventListener('change', e=>{
  if(e.target.classList.contains('post-check')) updateSelectCount();
});
$('btnDeleteSelected').addEventListener('click', async ()=>{
  const ids = Array.from(document.querySelectorAll('.post-check:checked')).map(c=>c.dataset.id);
  if(ids.length===0){ alert('선택된 글이 없습니다.'); return; }
  const pw = await askPassword('🔒 선택 삭제 (관리자)', ids.length+'개 글을 삭제하려면 관리자 비밀번호를 입력하세요.');
  if(pw === null) return;
  if(await hashPw(pw) !== ADMIN_PW_HASH){ alert('관리자 비밀번호가 틀렸습니다.'); return; }
  if(!confirm('선택한 '+ids.length+'개 글을 삭제할까요?\n(되돌릴 수 없습니다)')) return;
  $('btnDeleteSelected').disabled = true;
  $('btnDeleteSelected').textContent = '삭제 중...';
  try{
    for(const id of ids){ await deleteDoc(doc(db, 'posts', id)); }
    await loadPosts();
    setSelectMode(false);
    alert(ids.length+'개 삭제 완료.');
  }catch(e){ alert('삭제 중 오류: '+e.message); }
  $('btnDeleteSelected').disabled = false;
  $('btnDeleteSelected').textContent = '선택 삭제';
});

// === 일괄삭제 (관리자 전용) ===
$('btnBulkDelete').addEventListener('click', async ()=>{
  const pw = await askPassword('🗑 일괄삭제 (관리자)', '관리자 비밀번호를 입력하면 현재 보이는 목록을 모두 삭제합니다.');
  if(pw === null) return;
  if(await hashPw(pw) !== ADMIN_PW_HASH){ alert('관리자 비밀번호가 틀렸습니다.'); return; }
  let targets = allPosts.slice();
  if(currentFilter !== 'all') targets = targets.filter(p => p.type === currentFilter);
  if(targets.length === 0){ alert('삭제할 글이 없습니다.'); return; }
  const label = currentFilter==='all'?'전체':(currentFilter==='notice'?'공지':'문의');
  if(!confirm('현재 "'+label+'" 목록 '+targets.length+'개를 모두 삭제할까요?\n(되돌릴 수 없습니다)')) return;
  $('btnBulkDelete').disabled = true;
  $('btnBulkDelete').textContent = '삭제 중...';
  try{
    for(const p of targets){ await deleteDoc(doc(db, 'posts', p.id)); }
    await loadPosts();
    alert(targets.length+'개 삭제 완료.');
  }catch(e){ alert('삭제 중 오류: '+e.message); }
  $('btnBulkDelete').disabled = false;
  $('btnBulkDelete').textContent = '🗑 일괄삭제';
});

// === 답글 ===
window.addReply = async function(postId){
  const author = ($('ra_'+postId).value || '').trim() || '익명';
  const text = ($('rt_'+postId).value || '').trim();
  if(!text){ alert('답글 내용을 입력하세요.'); return; }
  // 관리자 이름(운영자/관리자/admin)으로 달면 관리자 비번 요구
  let isAdmin = false;
  if(author==='운영자' || author==='관리자' || author==='admin'){
    const pw = await askPassword('🛡️ 관리자 답글', '관리자 이름으로 답글을 달려면 관리자 비밀번호를 입력하세요.');
    if(pw === null) return;
    if(await hashPw(pw) !== ADMIN_PW_HASH){ alert('관리자 비밀번호가 틀렸습니다.'); return; }
    isAdmin = true;
  }
  try{
    await updateDoc(doc(db, 'posts', postId), {
      replies: arrayUnion({ author, text, admin: isAdmin, createdAt: new Date() })
    });
    await loadPosts();
    setTimeout(()=>{ const el=document.querySelector('.post[data-id="'+postId+'"]'); if(el) el.classList.add('open'); }, 50);
  }catch(e){ alert('답글 등록 실패: '+e.message); }
};

window.deleteReply = async function(postId, idx){
  const p = allPosts.find(x=>x.id===postId);
  if(!p || !p.replies || !p.replies[idx]) return;
  const pw = await askPassword('🔒 답글 삭제', '관리자 비밀번호를 입력하세요.');
  if(pw === null) return;
  if(await hashPw(pw) !== ADMIN_PW_HASH){ alert('관리자 비밀번호가 틀렸습니다.'); return; }
  if(!confirm('이 답글을 삭제할까요?')) return;
  try{
    const newReplies = p.replies.filter((_,i)=>i!==idx);
    await updateDoc(doc(db,'posts',postId), { replies: newReplies });
    await loadPosts();
    setTimeout(()=>{ const el=document.querySelector('.post[data-id="'+postId+'"]'); if(el) el.classList.add('open'); }, 50);
  }catch(e){ alert('답글 삭제 실패: '+e.message); }
};

loadPosts();
</script>
