<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>공지 & 문의 | 스윙파머</title>
<link rel="stylesheet" href="/common.css?v=4">
<style>
:root { --sf-max-w: 860px; }
*{box-sizing:border-box;margin:0;padding:0}
a{color:#333;text-decoration:none}
.board-header{border-bottom:2px solid #1F4E78;padding-bottom:12px;margin-bottom:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0;border-bottom:1px solid #e5e5e5}
.filter-tabs{display:flex;gap:0;flex-wrap:wrap}
.ftab{padding:6px 14px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#666;font-family:inherit;margin-right:-1px}
.ftab:first-child{border-radius:4px 0 0 4px}
.ftab:last-child{border-radius:0 4px 4px 0}
.ftab.active{background:#1F4E78;color:white;border-color:#1F4E78;z-index:1;position:relative}
.search-box{display:flex;gap:0;flex:1;min-width:120px;margin-left:auto;max-width:260px}
.search-box input{flex:1;padding:6px 10px;font-size:12px;border:1px solid #ddd;border-right:none;border-radius:4px 0 0 4px;font-family:inherit}
.search-box input:focus{outline:none;border-color:#1F4E78}
.search-box button{padding:6px 12px;background:#1F4E78;color:white;border:1px solid #1F4E78;border-radius:0 4px 4px 0;cursor:pointer;font-size:12px}
.list-header{display:flex;align-items:center;padding:10px 0}
.list-cnt{font-size:13px;color:#666}
.btn-write{margin-left:auto;padding:8px 20px;background:#03c75a;color:white;border:none;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-write:hover{background:#02b350}
.post-table{width:100%;border-collapse:collapse}
.post-table th{padding:8px;font-size:12px;color:#999;font-weight:600;border-bottom:2px solid #e5e5e5;text-align:center}
.post-table th.th-title{text-align:left;padding-left:16px}
.post-table td{padding:8px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.post-table tbody tr:hover{background:#f8fbff;cursor:pointer}
.td-no{text-align:center;color:#999;font-size:12px;width:50px}
.td-type{text-align:center;width:70px}
.td-title-cell{padding-left:16px!important}
.td-title-cell:hover .t-text{text-decoration:underline}
.t-text{font-weight:500;color:#333}
.t-reply{color:#e55;font-size:12px;font-weight:700;margin-left:3px}
.td-author{text-align:center;color:#555;width:80px;font-size:12px}
.td-date{text-align:center;color:#999;width:80px;font-size:12px}
.td-views{text-align:center;color:#999;width:50px;font-size:12px}
.type-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px}
.type-notice{background:#fff3e0;color:#e65100}
.type-question{background:#e8f0fe;color:#1a73e8}
.pin-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#fff3e0;color:#e65100}
/* 페이지네이션 */
.pager{display:flex;gap:4px;justify-content:center;padding:16px 0}
.pager button{padding:6px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit}
.pager button.active{background:#1F4E78;color:white;border-color:#1F4E78}
.pager button:disabled{opacity:.3;cursor:default}
.notice-box{background:#dbeafe;border-left:4px solid #2563eb;padding:12px 16px;border-radius:6px;font-size:12.5px;color:#1e3a8a;line-height:1.7;margin-bottom:0}
/* 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal-inner{width:100%;max-width:700px;margin:auto}
/* 글쓰기 */
.w-box{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.w-topbar{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid #e5e5e5}
.w-topbar h2{font-size:17px;font-weight:800;color:#333;flex:1}
.w-cancel{padding:6px 14px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#555;margin-right:8px}
.w-submit{padding:6px 20px;border:none;border-radius:4px;background:#03c75a;color:white;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.w-submit:hover{background:#02b350}
.w-selectors{display:flex;gap:10px;padding:14px 24px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.w-selectors select,.w-selectors input{padding:8px 12px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit;background:#fff}
.w-title-row{padding:0 24px;border-bottom:1px solid #f0f0f0}
.w-title-row input{width:100%;padding:14px 0;font-size:16px;border:none;font-family:inherit;color:#333;font-weight:500}
.w-title-row input::placeholder{color:#bbb}
.w-title-row input:focus{outline:none}
.w-media-bar{display:flex;gap:0;padding:8px 24px;border-bottom:1px solid #f0f0f0;overflow-x:auto}
.w-media-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border:none;background:none;cursor:pointer;font-family:inherit;color:#555;min-width:48px;border-radius:4px}
.w-media-btn:hover{background:#f5f5f5}
.w-media-btn .ico{font-size:20px}.w-media-btn .lbl{font-size:10px;white-space:nowrap;color:#888}
.w-format-bar{display:flex;gap:2px;padding:6px 24px;border-bottom:1px solid #f0f0f0;align-items:center}
.w-fmt{padding:4px 7px;border:none;background:none;cursor:pointer;font-size:14px;color:#555;border-radius:3px;font-family:inherit}
.w-fmt:hover{background:#f0f0f0}
.w-fmt.active{background:#e0e7ef;color:#1F4E78}
.w-content .wysiwyg{width:100%;min-height:300px;border:none;padding:18px 24px;font-size:15px;line-height:1.8;font-family:inherit;color:#333;overflow-y:auto;outline:none}
.w-content .wysiwyg:empty::before{content:attr(data-placeholder);color:#bbb;pointer-events:none}
.w-content .wysiwyg img{max-width:100%;border-radius:4px;margin:10px 0;display:block}
.w-content .wysiwyg a{color:#1a73e8;text-decoration:underline}
.w-content .wysiwyg hr{border:none;border-top:1px solid #e5e5e5;margin:20px 0}
.w-pw-row{padding:10px 24px;border-top:1px solid #f0f0f0;display:flex;align-items:center;gap:8px}
.w-pw-row input{padding:8px 12px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit;max-width:220px}
.w-pw-row .hint{font-size:11px;color:#888}
.w-pin-row{display:flex;padding:8px 24px;align-items:center;gap:6px;border-top:1px solid #f0f0f0}
/* 글 보기 */
.v-title{font-size:20px;font-weight:800;color:#1a1a1a;margin-bottom:6px}
.v-meta{font-size:12px;color:#999;display:flex;gap:12px;margin-bottom:14px}
.v-body{padding:24px 28px;line-height:1.8;font-size:15px;color:#333;word-break:break-word}
.v-body img{max-width:100%;border-radius:4px;margin:10px 0;display:block}
.v-body a{color:#1a73e8;text-decoration:underline}
.v-body hr{border:none;border-top:1px solid #e5e5e5;margin:20px 0}
.v-actions{display:flex;gap:8px;padding:14px 24px;border-top:1px solid #f0f0f0;justify-content:flex-end}
.v-btn{padding:7px 16px;border:1px solid #ddd;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.v-btn.red{color:#dc2626;border-color:#fca5a5}
.v-btn.red:hover{background:#fef2f2}
/* 답글 */
.rp-section{padding:14px 24px;border-top:1px solid #f0f0f0}
.rp-item{padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.rp-head{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.rp-name{font-weight:600;color:#333;font-size:13px}
.rp-time{color:#999;font-size:11px}
.rp-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:12px}
.rp-del:hover{color:#e55}
.rp-body{color:#555;line-height:1.5}
.rp-form{display:flex;gap:6px;padding-top:10px}
.rp-form input{padding:8px 10px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit}
.rp-form input:focus{outline:none;border-color:#1F4E78}
.rp-form .rp-author{width:90px}
.rp-form .rp-text{flex:1;min-width:120px}
.rp-form button{padding:8px 14px;background:#1F4E78;color:white;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.admin-only{display:none}
.empty{text-align:center;padding:60px 20px;color:#999;font-size:14px}
.loading{text-align:center;padding:40px;color:#999}
@media(max-width:600px){
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{max-width:100%}
  .td-no,.td-views{display:none}
  .modal-inner{margin:20px auto}
  .w-selectors{flex-direction:column}
  .rp-form{flex-direction:column}.rp-form .rp-author{width:100%}
}
</style>
</head>
<body class="sf-narrow">
<a href="/" class="back-link">← 메인으로</a>
<div class="board-header">
  <h1>📢 공지 & 문의</h1>
  <p style="font-size:13px;color:#666;margin-top:4px">업데이트 소식·공지사항과 문의를 남기는 공간입니다.</p>
</div>
<div class="notice-box">
  💡 문의는 누구나 남길 수 있습니다. 글 작성 시 정한 <b>비밀번호</b>로 본인 글을 수정·삭제할 수 있어요.<br>
  ⚠️ 비밀번호·연락처 등 민감한 개인정보는 적지 마세요. (이 게시판은 공개됩니다)
</div>
<div class="toolbar">
  <div class="filter-tabs" id="filterTabs">
    <button class="ftab active" data-f="all">전체</button>
    <button class="ftab" data-f="notice">📢 공지</button>
    <button class="ftab" data-f="question">💬 문의</button>
  </div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="검색"><button id="btnSearch">🔍</button></div>
</div>
<div class="list-header">
  <span class="list-cnt" id="cntInfo"></span>
  <button class="btn-write" id="btnWrite">✏️ 글쓰기</button>
</div>
<div id="postArea"><div class="loading">불러오는 중...</div></div>
<div class="pager" id="pager"></div>

<!-- 글 보기 모달 -->
<div class="modal-overlay" id="viewModal"><div class="modal-inner"><div class="w-box">
  <div style="padding:24px 28px 0">
    <div id="vBadge"></div>
    <div class="v-title" id="vTitle"></div>
    <div class="v-meta"><span id="vAuthor"></span><span id="vDate"></span><span id="vViews"></span></div>
  </div>
  <div class="v-body" id="vBody"></div>
  <div class="v-actions" id="vActions"></div>
  <div class="rp-section" id="vReplies"></div>
</div></div></div>

<!-- 글쓰기 모달 -->
<div class="modal-overlay" id="writeModal"><div class="modal-inner"><div class="w-box">
  <div class="w-topbar"><h2 id="wTitle">글쓰기</h2><button class="w-cancel" id="wCancel">취소</button><button class="w-submit" id="wSubmit">등록</button></div>
  <div class="w-selectors">
    <select id="fType"><option value="question">💬 문의</option><option value="notice">📢 공지</option></select>
    <input type="text" id="fAuthor" placeholder="작성자" maxlength="20" style="max-width:160px">
  </div>
  <div class="w-title-row"><input type="text" id="fTitle" placeholder="제목을 입력해 주세요." maxlength="100"></div>
  <div class="w-media-bar">
    <button class="w-media-btn" id="tbPhoto"><span class="ico">🖼️</span><span class="lbl">사진</span></button>
    <button class="w-media-btn" id="tbHr"><span class="ico">—</span><span class="lbl">구분선</span></button>
    <button class="w-media-btn" id="tbLink"><span class="ico">🔗</span><span class="lbl">링크</span></button>
    <button class="w-media-btn" id="tbImg"><span class="ico">🌐</span><span class="lbl">이미지URL</span></button>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none">
  <div class="w-format-bar">
    <button class="w-fmt" id="tbBold" title="굵게"><b>B</b></button>
    <button class="w-fmt" id="tbItalic" title="기울임"><i>I</i></button>
    <button class="w-fmt" id="tbUnder" title="밑줄"><u>U</u></button>
    <button class="w-fmt" id="tbStrike" title="취소선"><s>S</s></button>
  </div>
  <div class="w-content"><div id="fContent" class="wysiwyg" contenteditable="true" data-placeholder="내용을 입력하세요."></div></div>
  <div class="w-pw-row" id="pwRow">
    <input type="password" id="fPw" placeholder="비밀번호 (4자 이상)" maxlength="30">
    <span class="hint" id="pwHint">수정·삭제 시 필요합니다.</span>
  </div>
  <div class="w-pin-row admin-only"><label><input type="checkbox" id="fPinned" style="width:15px;height:15px"> 📌 상단 고정</label></div>
</div></div></div>

<!-- 비밀번호 확인 모달 -->
<div class="modal-overlay" id="pwModal"><div class="modal-inner" style="max-width:380px"><div class="w-box" style="padding:24px">
  <h2 id="pwModalTitle" style="font-size:16px;margin-bottom:14px">🔒 비밀번호 확인</h2>
  <input type="password" id="pwInput" placeholder="비밀번호 입력" maxlength="30" style="width:100%;padding:10px;font-size:14px;border:1px solid #ddd;border-radius:6px;font-family:inherit;margin-bottom:8px">
  <div style="font-size:11px;color:#888;margin-bottom:14px" id="pwModalHint"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="v-btn" id="btnPwCancel">취소</button>
    <button class="w-submit" id="btnPwConfirm" style="font-size:13px">확인</button>
  </div>
</div></div></div>

<script src="/common.js?v=5"></script>
<script>
var API = 'https://swingfarmer.duckdns.org/api';
var $ = function(id){return document.getElementById(id);};
var esc = function(s){return (s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var currentFilter = 'all', currentPage = 1, searchQuery = '', editingId = null, isAdmin = false;

function fmtDate(d){if(!d)return'';var t=new Date(d);var now=new Date();var diff=now-t;if(diff<86400000){var h=t.getHours(),m=t.getMinutes();return(h<10?'0':'')+h+':'+(m<10?'0':'')+m;}return(t.getMonth()+1)+'/'+t.getDate();}

// 관리자 체크 (Firebase Auth)
function checkAdmin(){
  if(window._sfFirebaseReady && window._sfFirebaseReady.auth){
    var auth = window._sfFirebaseReady.auth;
    auth.onAuthStateChanged(function(user){
      if(user){
        isAdmin = true;
        document.querySelectorAll('.admin-only').forEach(function(el){el.style.display='';});
      }
    });
  }
}
setTimeout(checkAdmin, 500);

// API 호출 (관리자용 — 토큰 부착)
function apiFetch(url, opts){
  return sfApiFetch(url, opts);
}

// 비밀번호 확인 모달 (Promise)
function askPassword(title, hint){
  return new Promise(function(resolve){
    $('pwModalTitle').textContent = title || '🔒 비밀번호 확인';
    $('pwModalHint').textContent = hint || '';
    $('pwInput').value = '';
    $('pwModal').classList.add('active');
    $('pwInput').focus();
    var cleanup;
    function onConfirm(){cleanup(); resolve($('pwInput').value);}
    function onCancel(){cleanup(); resolve(null);}
    cleanup = function(){
      $('btnPwConfirm').removeEventListener('click', onConfirm);
      $('btnPwCancel').removeEventListener('click', onCancel);
      $('pwModal').classList.remove('active');
    };
    $('btnPwConfirm').addEventListener('click', onConfirm);
    $('btnPwCancel').addEventListener('click', onCancel);
  });
}

// 목록 로드
function loadPosts(){
  $('postArea').innerHTML='<div class="loading">불러오는 중...</div>';
  var url = API+'/board?page='+currentPage+'&per_page=20';
  if(currentFilter!=='all') url += '&type='+currentFilter;
  if(searchQuery) url += '&q='+encodeURIComponent(searchQuery);
  fetch(url).then(function(r){return r.json();}).then(function(res){
    $('cntInfo').textContent = '총 '+res.total+'건';
    renderList(res.data||[]);
    renderPager(res.page, res.pages);
  }).catch(function(e){$('postArea').innerHTML='<div class="empty">불러오기 실패: '+esc(e.message)+'</div>';});
}

function renderList(posts){
  if(!posts.length){$('postArea').innerHTML='<div class="empty">아직 게시글이 없습니다.</div>';return;}
  var h='<table class="post-table"><thead><tr><th class="td-no">번호</th><th class="td-type">분류</th><th class="th-title">제목</th><th>작성자</th><th>날짜</th><th class="td-views">조회</th></tr></thead><tbody>';
  posts.forEach(function(p){
    var typeClass = p.post_type==='notice'?'type-notice':'type-question';
    var typeLabel = p.post_type==='notice'?'공지':'문의';
    h+='<tr data-id="'+p.id+'">';
    h+='<td class="td-no">'+(p.is_pinned?'📌':p.id)+'</td>';
    h+='<td class="td-type"><span class="type-tag '+typeClass+'">'+typeLabel+'</span></td>';
    h+='<td class="td-title-cell"><span class="t-text">'+esc(p.title)+'</span>'+(p.reply_count?'<span class="t-reply">['+p.reply_count+']</span>':'')+'</td>';
    h+='<td class="td-author">'+esc(p.author)+'</td>';
    h+='<td class="td-date">'+fmtDate(p.created_at)+'</td>';
    h+='<td class="td-views">'+(p.views||0)+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table>';
  $('postArea').innerHTML=h;
  $('postArea').querySelectorAll('tr[data-id]').forEach(function(tr){
    tr.addEventListener('click',function(){openPost(parseInt(this.dataset.id));});
  });
}

function renderPager(page,pages){
  if(pages<=1){$('pager').innerHTML='';return;}
  var h='';
  h+='<button '+(page<=1?'disabled':'')+' data-p="'+(page-1)+'">◀</button>';
  for(var i=1;i<=pages;i++){h+='<button class="'+(i===page?'active':'')+'" data-p="'+i+'">'+i+'</button>';}
  h+='<button '+(page>=pages?'disabled':'')+' data-p="'+(page+1)+'">▶</button>';
  $('pager').innerHTML=h;
  $('pager').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){if(this.disabled)return;currentPage=parseInt(this.dataset.p);loadPosts();});
  });
}

// 글 보기
function openPost(id){
  fetch(API+'/board/'+id).then(function(r){return r.json();}).then(function(p){
    if(p.error){alert(p.error);return;}
    var typeLabel = p.post_type==='notice'?'📢 공지':'💬 문의';
    $('vBadge').innerHTML=(p.is_pinned?'<span class="pin-tag">📌 고정</span> ':'')+'<span class="type-tag '+(p.post_type==='notice'?'type-notice':'type-question')+'">'+typeLabel+'</span>';
    $('vTitle').textContent=p.title;
    $('vAuthor').textContent=p.author||'익명';
    $('vDate').textContent=fmtDate(p.created_at);
    $('vViews').textContent='조회 '+(p.views||0);
    $('vBody').innerHTML=p.content||'';
    // 액션 버튼
    $('vActions').innerHTML='<button class="v-btn" data-act="edit" data-id="'+p.id+'">수정</button><button class="v-btn red" data-act="del" data-id="'+p.id+'">삭제</button><button class="v-btn" id="vClose">닫기</button>';
    $('vClose').addEventListener('click',closeView);
    $('vActions').querySelector('[data-act="edit"]').addEventListener('click',function(){closeView();editPost(parseInt(this.dataset.id));});
    $('vActions').querySelector('[data-act="del"]').addEventListener('click',function(){deletePost(parseInt(this.dataset.id));});
    // 답글
    renderReplies(p.id, p.replies||[]);
    $('viewModal').classList.add('active');document.body.style.overflow='hidden';
  }).catch(function(e){alert('오류: '+e.message);});
}
function closeView(){$('viewModal').classList.remove('active');document.body.style.overflow='';}
$('viewModal').addEventListener('click',function(e){if(e.target===$('viewModal'))closeView();});

function renderReplies(pid, replies){
  var h='<h3 style="font-size:14px;margin-bottom:8px">답글 '+replies.length+'</h3>';
  if(!replies.length) h+='<div style="color:#999;font-size:13px;padding:8px 0">답글이 없습니다.</div>';
  else {
    replies.forEach(function(r){
      h+='<div class="rp-item"><div class="rp-head"><span class="rp-name">'+esc(r.author||'익명')+'</span><span class="rp-time">'+fmtDate(r.created_at)+'</span>'+(isAdmin?'<button class="rp-del" data-rid="'+r.id+'" data-pid="'+pid+'">삭제</button>':'')+'</div><div class="rp-body">'+esc(r.content)+'</div></div>';
    });
  }
  h+='<div class="rp-form"><input class="rp-author" id="ra_'+pid+'" placeholder="이름" maxlength="20"><input class="rp-text" id="rt_'+pid+'" placeholder="답글 달기..." maxlength="500"><button onclick="addReply('+pid+')">등록</button></div>';
  $('vReplies').innerHTML=h;
  $('vReplies').querySelectorAll('.rp-del').forEach(function(btn){
    btn.addEventListener('click',function(){deleteReply(parseInt(this.dataset.rid), parseInt(this.dataset.pid));});
  });
}

function addReply(pid){
  var author = $('ra_'+pid).value.trim() || '익명';
  var content = $('rt_'+pid).value.trim();
  if(!content){alert('내용을 입력하세요.');return;}
  fetch(API+'/board/'+pid+'/replies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:author,content:content})})
  .then(function(r){return r.json();}).then(function(res){if(!res.ok){alert(res.error||'실패');return;}openPost(pid);}).catch(function(e){alert(e.message);});
}
function deleteReply(rid, pid){
  if(!confirm('답글을 삭제할까요?'))return;
  apiFetch(API+'/board/replies/'+rid,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({})})
  .then(function(r){if(!r.ok){alert(r.data.error||'실패');return;}openPost(pid);}).catch(function(e){alert(e.message);});
}

// 글쓰기
function openWrite(){
  editingId=null;$('wTitle').textContent='글쓰기';
  $('fType').value='question';$('fTitle').value='';$('fAuthor').value='';$('fContent').innerHTML='';$('fPw').value='';$('fPinned').checked=false;
  $('pwRow').style.display='flex';
  $('writeModal').classList.add('active');document.body.style.overflow='hidden';
  setTimeout(function(){$('fTitle').focus();},100);
}
$('btnWrite').addEventListener('click',openWrite);
function closeWrite(){$('writeModal').classList.remove('active');document.body.style.overflow='';}
$('wCancel').addEventListener('click',closeWrite);
$('writeModal').addEventListener('click',function(e){if(e.target===$('writeModal'))closeWrite();});

// 글쓰기 타입 변경
$('fType').addEventListener('change',function(){
  var isNotice = this.value==='notice';
  if(isNotice){
    $('pwRow').style.display='none';
    $('pwHint').textContent='';
    if(!$('fAuthor').value.trim()||$('fAuthor').value.trim()==='익명') $('fAuthor').value='운영자';
  } else {
    $('pwRow').style.display='flex';
    $('pwHint').textContent='수정·삭제 시 필요합니다.';
  }
});

// WYSIWYG
function execFmt(cmd,val){$('fContent').focus();document.execCommand(cmd,false,val||null);}
function insertHtml(html){$('fContent').focus();document.execCommand('insertHTML',false,html);}
function updateFmtBtns(){
  $('tbBold').classList.toggle('active',document.queryCommandState('bold'));
  $('tbItalic').classList.toggle('active',document.queryCommandState('italic'));
  $('tbUnder').classList.toggle('active',document.queryCommandState('underline'));
  $('tbStrike').classList.toggle('active',document.queryCommandState('strikeThrough'));
}
$('fContent').addEventListener('keyup',updateFmtBtns);
$('fContent').addEventListener('mouseup',updateFmtBtns);
$('tbBold').addEventListener('click',function(){execFmt('bold');});
$('tbItalic').addEventListener('click',function(){execFmt('italic');});
$('tbUnder').addEventListener('click',function(){execFmt('underline');});
$('tbStrike').addEventListener('click',function(){execFmt('strikeThrough');});
$('tbHr').addEventListener('click',function(){insertHtml('<hr>');});
$('tbImg').addEventListener('click',function(){var u=prompt('이미지 URL (https://...)');if(u&&u.trim())insertHtml('<img src="'+u.trim()+'" alt="이미지">');});
$('tbLink').addEventListener('click',function(){var u=prompt('링크 URL');if(!u||!u.trim())return;var l=prompt('표시할 텍스트',u.trim());insertHtml('<a href="'+u.trim()+'" target="_blank" rel="noopener">'+(l||u.trim())+' ↗</a>');});
$('tbPhoto').addEventListener('click',function(){$('fileInput').click();});
$('fileInput').addEventListener('change',function(){
  var file=this.files[0];if(!file)return;
  if(file.size>10*1024*1024){alert('10MB 이하만 가능합니다.');this.value='';return;}
  var lbl=$('tbPhoto').querySelector('.lbl');lbl.textContent='업로드중...';
  var fd=new FormData();fd.append('file',file);
  apiFetch(API+'/upload',{method:'POST',body:fd})
  .then(function(r){if(!r.ok){alert(r.data.error||'업로드 실패');return;}insertHtml('<img src="'+r.data.url+'" alt="이미지">');})
  .catch(function(e){alert('업로드 실패: '+e.message);})
  .finally(function(){lbl.textContent='사진';$('fileInput').value='';});
});

// 등록
$('wSubmit').addEventListener('click',function(){
  var ptype=$('fType').value, title=$('fTitle').value.trim(), author=$('fAuthor').value.trim()||'익명';
  var content=$('fContent').innerHTML.trim(), pw=$('fPw').value, pinned=$('fPinned').checked;
  if(!title){alert('제목을 입력하세요.');return;}
  if(!content){alert('내용을 입력하세요.');return;}
  if(ptype==='notice' && !isAdmin){alert('공지는 관리자만 작성할 수 있습니다.');return;}
  if(ptype==='question' && !editingId && pw.length<4){alert('비밀번호를 4자 이상 입력하세요.');return;}
  $('wSubmit').disabled=true;$('wSubmit').textContent='저장 중...';
  var body = {type:ptype,title:title,author:author,content:content,password:pw,pinned:pinned};
  var url = API+'/board'+(editingId?'/'+editingId:'');
  var method = editingId?'PUT':'POST';
  var fetchFn = (ptype==='notice' && isAdmin) ? apiFetch : function(u,o){return fetch(u,o).then(function(r){return{ok:r.ok,data:r.json()};});};
  // 공지는 토큰 부착, 문의는 일반 fetch
  if(ptype==='notice' && isAdmin){
    apiFetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok){alert(r.data.error||'저장 실패');return;}closeWrite();loadPosts();})
    .catch(function(e){alert(e.message);})
    .finally(function(){$('wSubmit').disabled=false;$('wSubmit').textContent='등록';});
  } else {
    fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(res){if(res.error){alert(res.error);return;}closeWrite();loadPosts();})
    .catch(function(e){alert(e.message);})
    .finally(function(){$('wSubmit').disabled=false;$('wSubmit').textContent='등록';});
  }
});

// 수정
function editPost(id){
  askPassword('🔒 비밀번호 확인', '글 작성 시 설정한 비밀번호 또는 관리자 비밀번호').then(function(pw){
    if(pw===null) return;
    // 비번 검증은 PUT 시 서버에서 하므로 일단 데이터 로드
    fetch(API+'/board/'+id).then(function(r){return r.json();}).then(function(p){
      if(p.error){alert(p.error);return;}
      editingId=id;
      $('wTitle').textContent='글 수정';
      $('fType').value=p.post_type||'question';
      $('fTitle').value=p.title||'';
      $('fAuthor').value=p.author||'';
      $('fContent').innerHTML=p.content||'';
      $('fPinned').checked=!!p.is_pinned;
      $('fPw').value=pw; // 비번 넣어두기 (PUT 시 전송)
      $('pwRow').style.display='flex';
      $('pwHint').textContent='(인증용 비밀번호 입력됨)';
      $('fType').dispatchEvent(new Event('change'));
      $('writeModal').classList.add('active');document.body.style.overflow='hidden';
    }).catch(function(e){alert(e.message);});
  });
}

// 삭제
function deletePost(id){
  askPassword('🔒 삭제 비밀번호', '글 작성 시 설정한 비밀번호 또는 관리자 비밀번호').then(function(pw){
    if(pw===null) return;
    if(!confirm('정말 삭제할까요?')) return;
    var opts = {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})};
    // 관리자면 토큰도 부착
    if(isAdmin){
      apiFetch(API+'/board/'+id,opts)
      .then(function(r){if(!r.ok){alert(r.data.error||'삭제 실패');return;}closeView();loadPosts();})
      .catch(function(e){alert(e.message);});
    } else {
      fetch(API+'/board/'+id,opts)
      .then(function(r){return r.json();}).then(function(res){if(res.error){alert(res.error);return;}closeView();loadPosts();})
      .catch(function(e){alert(e.message);});
    }
  });
}

// 필터
$('filterTabs').addEventListener('click',function(e){
  var btn=e.target.closest('.ftab');if(!btn)return;
  document.querySelectorAll('.ftab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  currentFilter=btn.dataset.f;currentPage=1;loadPosts();
});
$('btnSearch').addEventListener('click',function(){searchQuery=$('searchInput').value.trim();currentPage=1;loadPosts();});
$('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter'){$('btnSearch').click();}});

// 초기 로드
loadPosts();
</script>
