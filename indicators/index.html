<head>
<meta charset="UTF-8">

<style>
:root { --sf-max-w: 1100px; }
.indicator-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ind-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.ind-name{font-size:11px;color:var(--text-dim);font-weight:600;margin-bottom:6px}
.ind-price{font-size:20px;font-weight:800}
.ind-change{font-size:12px;font-weight:600;margin-top:3px}
.vix-level{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:700}
.vix-calm{background:#166534;color:#bbf7d0}
.vix-normal{background:#854d0e;color:#fde68a}
.vix-high{background:#991b1b;color:#fca5a5}
.vix-extreme{background:#7f1d1d;color:#fecaca}
.spread-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:10px}
.spread-label{font-size:12px;color:var(--text-dim);font-weight:600}
.spread-value{font-size:18px;font-weight:800;margin-top:4px}
.spread-warn{color:var(--red);font-size:11px;font-weight:600}
.chart-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.chart-tab{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-dim);font-size:11px;cursor:pointer;font-weight:600}
.chart-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.news-section{margin-top:28px}
.news-list{display:flex;flex-direction:column;gap:6px}
.news-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--text);transition:border-color .15s}
.news-item:hover{border-color:var(--accent)}
.news-title{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-cat{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;white-space:nowrap;background:var(--border);color:var(--text-dim)}
.news-time{font-size:11px;color:var(--text-dim);white-space:nowrap}
.error-msg{background:#2d1b1b;border:1px solid #7f1d1d;color:#fca5a5;padding:16px;border-radius:8px;font-size:13px}
.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:30px;line-height:1.8}
/* 113: 국제유가·석유제품 (오피넷, 관리자 로그인만) */
.oil-date{font-size:11px;color:var(--text-dim);font-weight:400;margin-left:6px}
.oil-lock{background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:14px;font-size:12px;color:var(--text-dim)}
.oil-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 8px}
.oil-bar .sp{flex:1}
.oil-copy{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);font-size:11px;cursor:pointer}
.oil-tbl-wrap{overflow-x:auto;max-height:440px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.oil-tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.oil-tbl th{position:sticky;top:0;background:var(--card);color:var(--text-dim);font-weight:600;padding:7px 9px;text-align:right;border-bottom:1px solid var(--border)}
.oil-tbl th:first-child,.oil-tbl td:first-child{text-align:left}
.oil-tbl td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.oil-tbl tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.oil-tbl td.hl{color:#b45309;font-weight:700}
body.sf-dark .oil-tbl td.hl{color:#f0b060}
.oil-tbl .ong{font-size:10px;color:var(--text-dim);margin-left:4px}
.oil-note{font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.7}
/* 096: 외부 링크 칸 (GPU 임대료 등 — 약관상 수집 불가라 링크만) */
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.link-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--text);transition:border-color .15s}
.link-card:hover{border-color:var(--accent)}
.link-name{font-size:13px;font-weight:700}
.link-desc{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5}
.link-how{font-size:11px;color:var(--text);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);line-height:1.55;opacity:.85}
.link-how b{color:var(--accent)}
.link-note{font-size:11px;color:var(--text-dim);margin:-4px 0 10px;line-height:1.6}
@media(max-width:600px){
  .indicator-grid{grid-template-columns:repeat(2,1fr)}
  .ind-price{font-size:17px}
}

/* 듀얼 테마: 라이트 모드 오버라이드 */
body:not(.sf-dark){
  --sf-bg:#f5f7fa;--sf-card:#fff;--sf-card-hover:#f0f5fa;--sf-border:#e5e7eb;

  --bg:#f5f7fa;--card:#fff;--card-hover:#f0f5fa;--surface:#fff;
  --border:#e5e7eb;--text:#1a1a1a;--text-dim:#71717a;

body:not(.sf-dark) .card,body:not(.sf-dark) .kpi-card,body:not(.sf-dark) .sec-card,

body:not(.sf-dark) table th{background:#f0f5fa;color:#555}
body:not(.sf-dark) table td{border-color:#f0f0f0;color:#333}
body:not(.sf-dark) h1,body:not(.sf-dark) h2,body:not(.sf-dark) h3{color:#1F4E78}
body:not(.sf-dark) .back-link{color:#1F4E78}
body:not(.sf-dark) .subtitle{color:#666}
body:not(.sf-dark) .btn{background:#1F4E78}
body:not(.sf-dark) .badge-safe{background:rgba(5,150,105,.12);color:#059669}
body:not(.sf-dark) .badge-warn{background:rgba(217,119,6,.12);color:#d97706}
body:not(.sf-dark) .badge-danger{background:rgba(220,38,38,.12);color:#dc2626}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var DATA_URL = '/data/market_indicators.json';
var HIST_URL = '/data/market_history.json';
var NEWS_URL = 'https://swingfarmer.duckdns.org/api/news';
var CAT_LABELS = {breaking:'속보',economy:'경제',stock:'증시',realestate:'부동산',politics:'정치',international:'국제',tech:'기술',industry:'산업'};
var NEWS_CATS = ['economy','stock','breaking'];
var charts = {};

function fmt(v, d) {
  return sfNum(v, d || 2);   // (106) 표기는 sf-fmt.js
}

function chgClass(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
function chgText(v) {
  if (v == null || v === 0) return '<span class="flat">→ 0.00%</span>';
  var arrow = v > 0 ? '▲' : '▼';
  return '<span class="' + chgClass(v) + '">' + arrow + ' ' + Math.abs(v).toFixed(2) + '%</span>';
}

function vixBadge(v) {
  if (v < 15) return '<span class="vix-level vix-calm">안정</span>';
  if (v < 20) return '<span class="vix-level vix-normal">보통</span>';
  if (v < 30) return '<span class="vix-level vix-high">경계</span>';
  return '<span class="vix-level vix-extreme">공포</span>';
}

function indCard(ind) {
  var priceDecimals = ind.cat === 'us_rate' ? 3 : 2;
  var suffix = ind.unit === '%' ? '%' : '';
  var prefix = ind.unit === '$/bbl' ? '$' : '';
  var extra = ind.ticker === '^VIX' ? vixBadge(ind.price) : '';
  return '<div class="ind-card">' +
    '<div class="ind-name">' + ind.name + '</div>' +
    '<div class="ind-price">' + prefix + fmt(ind.price, priceDecimals) + suffix + extra + '</div>' +
    '<div class="ind-change">' + chgText(ind.change_pct) + '</div>' +
    '</div>';
}

function renderIndicators(data) {
  var bycat = {};
  (data.indicators || []).forEach(function(ind) {
    if (!bycat[ind.cat]) bycat[ind.cat] = [];
    bycat[ind.cat].push(ind);
  });

  var rates = data.rates || {};
  var html = '';

  // 한국 지수
  if (bycat.kr_index) {
    html += '<div class="section"><div class="section-title">🇰🇷 한국 지수</div>';
    html += '<div class="indicator-grid">' + bycat.kr_index.map(indCard).join('') + '</div></div>';
  }

  // 미국 지수
  if (bycat.us_index) {
    html += '<div class="section"><div class="section-title">🇺🇸 미국 지수</div>';
    html += '<div class="indicator-grid">' + bycat.us_index.map(indCard).join('') + '</div></div>';
  }

  // VIX
  if (bycat.volatility) {
    html += '<div class="section"><div class="section-title">😱 변동성</div>';
    html += '<div class="indicator-grid">' + bycat.volatility.map(indCard).join('') + '</div></div>';
  }

  // 환율 (rates.json 데이터)
  if (rates.USD_KRW) {
    html += '<div class="section"><div class="section-title">💱 환율</div>';
    html += '<div class="indicator-grid">';
    html += '<div class="ind-card"><div class="ind-name">원/달러</div><div class="ind-price">' + fmt(rates.USD_KRW) + '</div></div>';
    if (rates.JPY100_KRW) html += '<div class="ind-card"><div class="ind-name">원/엔(100)</div><div class="ind-price">' + fmt(rates.JPY100_KRW) + '</div></div>';
    if (rates.CNY_KRW) html += '<div class="ind-card"><div class="ind-name">원/위안</div><div class="ind-price">' + fmt(rates.CNY_KRW) + '</div></div>';
    html += '</div></div>';
  }

  // 금리
  if (bycat.us_rate) {
    html += '<div class="section"><div class="section-title">📊 미국 금리</div>';
    html += '<div class="indicator-grid">' + bycat.us_rate.map(indCard).join('') + '</div>';

    // 10yr-13w 스프레드
    var tnx = bycat.us_rate.find(function(i){return i.ticker==='^TNX';});
    var irx = bycat.us_rate.find(function(i){return i.ticker==='^IRX';});
    if (tnx && irx) {
      var spread = (tnx.price - irx.price).toFixed(3);
      var inverted = parseFloat(spread) < 0;
      html += '<div class="spread-card"><span class="spread-label">10yr − 13w 스프레드</span>' +
        '<div class="spread-value ' + (inverted ? 'down' : 'up') + '">' + (spread > 0 ? '+' : '') + spread + '%p' +
        (inverted ? ' <span class="spread-warn">⚠ 장단기 역전</span>' : '') + '</div></div>';
    }
    html += '</div>';
  }

  // 원자재
  if (bycat.commodity) {
    html += '<div class="section"><div class="section-title">🛢️ 원자재</div>';
    html += '<div class="indicator-grid">' + bycat.commodity.map(indCard).join('');
    if (rates.GOLD_KRW_G) {
      html += '<div class="ind-card"><div class="ind-name">금 (원/g)</div><div class="ind-price">' + fmt(rates.GOLD_KRW_G, 0) + '</div></div>';
    }
    html += '</div></div>';
  }

  // (113) 국제유가·석유제품 — 오피넷 자료는 관리자 로그인 API로만 읽어서 렌더 뒤 initOil()이 채움
  html += '<div class="section" id="oilSec"><div class="section-title">⛽ 국제유가 · 석유제품 <span style="font-size:11px;color:var(--text-dim);font-weight:400">오피넷 · $/bbl</span><span class="oil-date" id="oilDate"></span></div>' +
    '<div class="oil-lock" id="oilMsg">불러오는 중…</div><div id="oilBody" style="display:none"></div></div>';

  // 096: GPU 임대료·데이터센터 — 외부 링크만 (Ornn 약관이 자동 수집·저장 금지 → 들어가서 보기만)
  html += '<div class="section"><div class="section-title">🖥️ GPU 임대료 · 데이터센터 <span style="font-size:11px;color:var(--text-dim);font-weight:400">외부 링크</span></div>';
  html += '<div class="link-note">GPU 1개 1시간 빌리는 값(달러). 오르면 AI 수요 &gt; 공급, 내리면 공급 과잉 신호. 두 회사 지수는 방식이 달라 값이 다름 — 같은 곳 안에서 흐름을 볼 것. 숫자를 적어 둘 땐 공개되는 곳에 올리지 말 것(약관)</div>';
  html += '<div class="link-grid">' + LINKS.map(function(l){
    return '<a class="link-card" href="' + l.u + '" target="_blank" rel="noopener"><div class="link-name">' + l.n + ' ↗</div><div class="link-desc">' + l.d + '</div>' + (l.h ? '<div class="link-how"><b>보는 법</b> ' + l.h + '</div>' : '') + '</a>';
  }).join('') + '</div></div>';

  return html;
}

var LINKS = [
  {n:'Ornn H100 SXM', u:'https://data.ornn.com/markets/h100-sxm', d:'실제 체결된 임대 거래로 만든 일별 지수. ICE 선물 정산 기준',
   h:'차트 위 1W·1M·3M·1Y·ALL로 기간 바꿔 추이 확인(기록 안 해도 됨). 1Y로 놓고 지금 값이 1년 범위의 위쪽인지 아래쪽인지 볼 것 — 위쪽이면 AI 수요가 공급보다 강함'},
  {n:'Ornn 전체 GPU (H200·B200 등)', u:'https://data.ornn.com/markets', d:'같은 방식의 H200·B200·RTX5090 지수 목록',
   h:'목록에서 GPU 골라 들어가면 H100과 같은 차트. 신형(B200)이 오르는데 구형(H100)이 내리면 세대교체, 같이 오르면 전체 수요 강세'},
  {n:'Silicon Data H100 (SDH100RT)', u:'https://www.silicondata.com/products/silicon-index/h100', d:'네오클라우드(코어위브 같은 GPU 전문 업체)와 하이퍼스케일러(AWS·GCP 등) 단가를 나눠 보여줌. CME 선물 기준',
   h:'하이퍼스케일러는 비싸고($7대) 거의 안 움직임, 네오클라우드($2~3대)가 먼저 움직임 → 네오클라우드 쪽을 볼 것. 차트가 결제를 요구하면 이 링크도 빼기'},
  {n:'국내 데이터센터 지도 (하나증권)', u:'https://hana-jhlee-dcc.leejunho.chatgpt.site/', d:'하나증권 이준호 — 공시 기반 국내 DC 위치·전력·단계. 개인 페이지라 없어질 수 있음',
   h:'단계(운영·공사·계획·후보)와 전력 MW를 볼 것. 수전 MW(받는 전력)와 IT MW(서버용)는 서로 더하면 안 됨. 빨간색은 확인 안 된 후보지'}
];

function renderCharts(history) {
  if (!history || history.length < 2) return '<div style="color:var(--text-dim);font-size:13px;padding:20px">히스토리 2일 이상 쌓이면 차트 표시</div>';

  var html = '';

  // 차트 그룹 정의
  var chartGroups = [
    {id:'idx', title:'📈 지수 추이', keys:['KS11','KQ11'], labels:['코스피','코스닥'], colors:['#3b82f6','#22c55e'], yAxis:'pt'},
    {id:'usidx', title:'🇺🇸 미국 지수', keys:['GSPC','IXIC','DJI'], labels:['S&P500','나스닥','다우'], colors:['#3b82f6','#a855f7','#f97316'], yAxis:'pt'},
    {id:'rate', title:'📊 미국 금리', keys:['IRX','FVX','TNX','TYX'], labels:['13주','5년','10년','30년'], colors:['#71717a','#eab308','#ef4444','#f97316'], yAxis:'%'},
    {id:'fx', title:'💱 환율', keys:['USD_KRW','JPY100_KRW','CNY_KRW'], labels:['원/달러','원/엔100','원/위안'], colors:['#3b82f6','#ef4444','#22c55e'], yAxis:'원', separate:true},
    {id:'vix', title:'😱 VIX', keys:['VIX'], labels:['VIX'], colors:['#ef4444'], yAxis:''},
    {id:'cmd', title:'🛢️ WTI · 금', keys:['CLF','GOLD_KRW_G'], labels:['WTI($)','금(원/g)'], colors:['#f97316','#eab308'], yAxis:'', separate:true},
  ];

  chartGroups.forEach(function(g) {
    // 데이터 존재 확인
    var hasData = g.keys.some(function(k){ return history.some(function(h){ return h[k] != null; }); });
    if (!hasData) return;

    html += '<div class="chart-box"><h3>' + g.title + '</h3>';
    html += '<div class="chart-wrap"><canvas id="chart-' + g.id + '"></canvas></div></div>';
  });

  // 차트 생성은 렌더 후
  setTimeout(function() {
    chartGroups.forEach(function(g) {
      var canvas = document.getElementById('chart-' + g.id);
      if (!canvas) return;
      var dates = history.map(function(h){return h.date;});
      var datasets = [];
      g.keys.forEach(function(k, i) {
        var vals = history.map(function(h){return h[k] || null;});
        if (vals.every(function(v){return v==null;})) return;
        datasets.push({
          label: g.labels[i],
          data: vals,
          borderColor: g.colors[i],
          backgroundColor: g.colors[i] + '18',
          borderWidth: 2,
          pointRadius: history.length > 60 ? 0 : 3,
          tension: 0.3,
          fill: datasets.length === 0 && g.keys.length === 1,
          yAxisID: g.separate && i > 0 ? 'y1' : 'y',
        });
      });
      if (datasets.length === 0) return;

      var scaleOpts = {
        y: {
          position: 'left',
          grid: {color:'#2a2d3a'},
          ticks: {color:'#71717a', font:{size:10}},
        },
        x: {
          grid: {display:false},
          ticks: {color:'#71717a', font:{size:10}, maxTicksLimit:10},
        },
      };
      if (g.separate && datasets.length > 1) {
        scaleOpts.y1 = {
          position: 'right',
          grid: {display:false},
          ticks: {color: g.colors[1] || '#71717a', font:{size:10}},
        };
      }

      charts[g.id] = new Chart(canvas, {
        type: 'line',
        data: {labels:dates, datasets:datasets},
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {mode:'index', intersect:false},
          plugins: {
            legend: {labels:{color:'#e4e4e7', font:{size:11}}, position:'top'},
            tooltip: {backgroundColor:'#1a1d27', titleColor:'#e4e4e7', bodyColor:'#e4e4e7', borderColor:'#2a2d3a', borderWidth:1},
          },
          scales: scaleOpts,
        },
      });
    });
  }, 100);

  return html;
}

function renderNews(newsData) {
  if (!newsData || !newsData.categories) return '';

  var items = [];
  NEWS_CATS.forEach(function(cat) {
    var catData = newsData.categories[cat];
    if (!catData || !catData.items) return;
    catData.items.slice(0, 3).forEach(function(item) {
      items.push({title:item.title, link:item.link, cat:cat, pubDate:item.pubDate});
    });
  });

  if (items.length === 0) return '';

  // 시간순 정렬 (최신 먼저)
  items.sort(function(a,b){return (b.pubDate||'').localeCompare(a.pubDate||'');});
  items = items.slice(0, 8);

  var html = '<div class="news-section section">';
  html += '<div class="section-title">📰 주요 뉴스 <span style="font-size:11px;color:var(--text-dim);font-weight:400">경제 · 증시 · 속보</span></div>';
  html += '<div class="news-list">';
  items.forEach(function(n) {
    var timeStr = '';
    if (n.pubDate) {
      var d = new Date(n.pubDate);
      timeStr = (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    html += '<a href="' + n.link + '" target="_blank" class="news-item">' +
      '<span class="news-cat">' + (CAT_LABELS[n.cat]||n.cat) + '</span>' +
      '<span class="news-title">' + n.title + '</span>' +
      '<span class="news-time">' + timeStr + '</span></a>';
  });
  html += '</div></div>';
  return html;
}

async function loadAll() {
  try {
    var [indRes, histRes, newsRes] = await Promise.all([
      fetch(DATA_URL + '?t=' + Date.now()),
      fetch(HIST_URL + '?t=' + Date.now()).catch(function(){return null;}),
      fetch(NEWS_URL + '?t=' + Date.now()).catch(function(){return null;}),
    ]);

    if (!indRes.ok) throw new Error('market_indicators.json 로드 실패 (HTTP ' + indRes.status + ')');
    var data = await indRes.json();

    var history = null;
    if (histRes && histRes.ok) {
      try { history = await histRes.json(); } catch(e) {}
    }

    var news = null;
    if (newsRes && newsRes.ok) {
      try { news = await newsRes.json(); } catch(e) {}
    }

    document.getElementById('updated').textContent = '업데이트: ' + (data.updated || '-');

    var html = renderIndicators(data);
    html += renderCharts(history);
    html += renderNews(news);
    html += '<div class="note">데이터: yfinance + exchangerate-api · 평일 07:10 / 18:45 갱신<br>뉴스: 네이버 API · 1시간 간격 수집</div>';

    document.getElementById('content').innerHTML = html;
    initOil();

  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="error-msg">⚠ ' + e.message + '<br>fetch_market_indicators.py 가 먼저 실행되어야 합니다.</div>';
  }
}

// ── (113) 국제유가·석유제품 (오피넷) — 카드 + 추이 그래프 + 일별/월/분기 표. 계산·읽기는 /sf-oil.js 공통 ──
var OIL_COLS = [
  {k:'dubai', n:'두바이', c:'#3b82f6'}, {k:'brent', n:'브렌트', c:'#22c55e'}, {k:'wti', n:'WTI', c:'#a1a1aa'},
  {k:'kero', n:'항공유', c:'#f97316', d:'싱가포르 등유(Jet/Kero) — 항공유 시세로 씀'},
  {k:'spread', n:'스프레드', c:'#a855f7', d:'항공유 − 두바이 (정제 마진 성격). 클수록 원유보다 항공유가 비쌈'},
  {k:'gas92', n:'휘발유92', c:'#eab308'}, {k:'diesel001', n:'경유', c:'#ef4444', d:'싱가포르 경유 황 0.001%'},
  {k:'naphtha', n:'나프타', c:'#14b8a6', d:'석유화학 원료'}
];
var OIL_ROWS = null, oilChart = null, oilDays = 365, oilMode = 'd';
function oilFmt(v, d){ return v == null ? '-' : sfNum(v, d == null ? 2 : d); }
function initOil(){
  sfOilLoad(function(rows, why){
    var msg = document.getElementById('oilMsg');
    if (!msg) return;
    if (!rows){
      msg.innerHTML = why === 'login' ? '🔒 로그인하면 보입니다 — 오피넷 약관(복제·유통 금지) 때문에 공개 파일로 두지 않고 관리자 로그인일 때만 읽음'
        : why === 'empty' ? '자료 없음' : '⚠ 유가 자료를 못 읽음 (VM API 확인 — /api/oil-intl)';
      return;
    }
    OIL_ROWS = rows; msg.style.display = 'none';
    var L = rows[rows.length - 1], P = rows.length > 1 ? rows[rows.length - 2] : null;
    document.getElementById('oilDate').textContent = sfDate(L.price_date, 'dot') + ' 기준 (하루 늦게 올라옴)';
    var cards = OIL_COLS.map(function(c){
      var v = L[c.k], pv = P ? P[c.k] : null, ch = '';
      if (v != null && pv != null){
        var dlt = v - pv, pc = c.k === 'spread' ? null : dlt / pv * 100;
        ch = '<div class="ind-change ' + (dlt > 0 ? 'up' : dlt < 0 ? 'down' : '') + '">' + (dlt > 0 ? '▲ ' : dlt < 0 ? '▼ ' : '') +
          sfNum(Math.abs(dlt), 2) + (pc != null ? ' (' + sfPct(pc, 2, true) + ')' : '') + '</div>';
      }
      return '<div class="ind-card"' + (c.d ? ' title="' + c.d + '"' : '') + '><div class="ind-name">' + c.n + '</div><div class="ind-price">' + (v == null ? '-' : '$' + oilFmt(v)) + '</div>' + ch + '</div>';
    }).join('');
    document.getElementById('oilBody').innerHTML =
      '<div class="indicator-grid">' + cards + '</div>' +
      '<div class="chart-box" style="margin-top:12px"><h3>📈 추이</h3><div class="chart-tabs" id="oilRange">' +
        [[92,'3개월'],[365,'1년'],[1100,'3년']].map(function(x){ return '<button class="chart-tab' + (x[0] === oilDays ? ' active' : '') + '" data-d="' + x[0] + '">' + x[1] + '</button>'; }).join('') +
      '</div><div class="chart-wrap"><canvas id="oilCanvas"></canvas></div></div>' +
      '<div class="oil-bar"><div class="chart-tabs" id="oilMode" style="margin:0">' +
        [['d','일별'],['m','월평균'],['q','분기평균']].map(function(x){ return '<button class="chart-tab' + (x[0] === oilMode ? ' active' : '') + '" data-m="' + x[0] + '">' + x[1] + '</button>'; }).join('') +
      '</div><span class="sp"></span><button class="oil-copy" id="oilCopy">📋 표 복사</button></div>' +
      '<div class="oil-tbl-wrap"><table class="oil-tbl" id="oilTbl"></table></div>' +
      '<div class="oil-note">출처: 오피넷(한국석유공사) 국제유가 · 국제석유제품가격(싱가포르), $/bbl. VM이 화~토 밤에 받음(하루 늦게 올라옴). 휴장일은 빈 칸(-). ' +
        '항공유 = 싱가포르 등유, 스프레드 = 항공유 − 두바이. 일별 표는 최근 120일(위가 최근), 월·분기 평균은 값 있는 날만의 단순 평균. 카드 아래 숫자는 전날 대비. ' +
        sfNum(rows.length) + '일치 (' + rows[0].price_date + ' ~ ' + L.price_date + '). 대한항공 실적 추정에 쓰는 같은 자료가 🔒 대한항공 실적 시뮬레이터에도 있음</div>';
    document.getElementById('oilBody').style.display = '';
    document.querySelectorAll('#oilRange .chart-tab').forEach(function(b){ b.addEventListener('click', function(){
      document.querySelectorAll('#oilRange .chart-tab').forEach(function(x){ x.classList.toggle('active', x === b); });
      oilDays = +b.getAttribute('data-d'); drawOilChart(); }); });
    document.querySelectorAll('#oilMode .chart-tab').forEach(function(b){ b.addEventListener('click', function(){
      document.querySelectorAll('#oilMode .chart-tab').forEach(function(x){ x.classList.toggle('active', x === b); });
      oilMode = b.getAttribute('data-m'); drawOilTable(); }); });
    document.getElementById('oilCopy').addEventListener('click', copyOilTable);
    drawOilTable(); drawOilChart();
  });
}
function oilTableRows(){
  if (oilMode === 'd') return OIL_ROWS.slice(-120).reverse().map(function(r){ var o = {k: r.price_date}; OIL_COLS.forEach(function(c){ o[c.k] = r[c.k]; }); return o; });
  return sfOilAvg(OIL_ROWS, oilMode, OIL_COLS.map(function(c){ return c.k; })).slice(0, oilMode === 'm' ? 25 : 12);
}
function drawOilTable(){
  var rows = oilTableRows(), avg = oilMode !== 'd';
  var head = '<tr><th>' + (oilMode === 'd' ? '날짜' : oilMode === 'm' ? '월' : '분기') + '</th>' + OIL_COLS.map(function(c){ return '<th>' + c.n + '</th>'; }).join('') + (avg ? '<th>일수</th>' : '') + '</tr>';
  document.getElementById('oilTbl').innerHTML = head + rows.map(function(r){
    return '<tr><td>' + r.k + (r.ongoing ? '<span class="ong">진행 중</span>' : '') + '</td>' + OIL_COLS.map(function(c){
      return '<td' + (c.k === 'kero' || c.k === 'spread' ? ' class="hl"' : '') + '>' + oilFmt(r[c.k], avg ? 1 : 2) + '</td>'; }).join('') + (avg ? '<td>' + r.n + '</td>' : '') + '</tr>';
  }).join('');
}
function copyOilTable(){
  var rows = oilTableRows(), avg = oilMode !== 'd', lab = oilMode === 'd' ? '날짜' : oilMode === 'm' ? '월' : '분기';
  var t = ['오피넷 국제유가·석유제품 ' + (oilMode === 'd' ? '일별' : lab + '평균') + ' ($/bbl, 항공유=싱가포르 등유, 스프레드=항공유−두바이, 자료 ~' + OIL_ROWS[OIL_ROWS.length - 1].price_date + ')',
    '| ' + lab + ' | ' + OIL_COLS.map(function(c){ return c.n; }).join(' | ') + (avg ? ' | 일수' : '') + ' |',
    '|' + new Array(OIL_COLS.length + (avg ? 3 : 2)).join('---|')]
    .concat(rows.map(function(r){ return '| ' + r.k + (r.ongoing ? ' (진행 중)' : '') + ' | ' + OIL_COLS.map(function(c){ return oilFmt(r[c.k], avg ? 1 : 2); }).join(' | ') + (avg ? ' | ' + r.n : '') + ' |'; })).join('\n');
  var b = document.getElementById('oilCopy'), done = function(){ var o = b.textContent; b.textContent = '✅ 복사됨'; setTimeout(function(){ b.textContent = o; }, 1500); };
  (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(done).catch(function(){
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) {} ta.remove(); });
}
function drawOilChart(){
  if (!OIL_ROWS || !window.Chart) return;
  var last = new Date(OIL_ROWS[OIL_ROWS.length - 1].price_date), from = new Date(last - oilDays * 864e5);
  var R = OIL_ROWS.filter(function(r){ return new Date(r.price_date) >= from; });
  var show = ['kero', 'dubai', 'brent', 'wti', 'spread'];
  var ds = OIL_COLS.filter(function(c){ return show.indexOf(c.k) >= 0; }).map(function(c){
    var dash = c.k === 'spread' || c.k === 'wti';
    return {label: c.n + (c.k === 'kero' ? '(싱가포르 등유)' : c.k === 'spread' ? '(항공유−두바이)' : ''), data: R.map(function(r){ return r[c.k]; }),
      borderColor: c.c, backgroundColor: c.c, borderWidth: dash ? 1.3 : 2, borderDash: dash ? [4, 3] : [], pointRadius: 0, spanGaps: true, tension: .15};
  });
  var data = {labels: R.map(function(r){ return r.price_date; }), datasets: ds};
  if (oilChart){ oilChart.data = data; oilChart.update(); return; }
  oilChart = new Chart(document.getElementById('oilCanvas'), {type: 'line', data: data, options: {responsive: true, maintainAspectRatio: false,
    interaction: {mode: 'index', intersect: false},
    plugins: {legend: {labels: {color: '#e4e4e7', font: {size: 11}, boxWidth: 12}, position: 'top'},
      tooltip: {backgroundColor: '#1a1d27', titleColor: '#e4e4e7', bodyColor: '#e4e4e7', borderColor: '#2a2d3a', borderWidth: 1,
        callbacks: {label: function(c){ return c.dataset.label + ' $' + sfNum(c.parsed.y, '~2'); }}}},
    scales: {x: {grid: {display: false}, ticks: {color: '#71717a', font: {size: 10}, maxTicksLimit: 10}},
      y: {grid: {color: '#2a2d3a'}, ticks: {color: '#71717a', font: {size: 10}, callback: function(v){ return '$' + v; }}}}}});
}

loadAll();
