<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>기간별 등락률 비교</title>
<link rel="stylesheet" href="/common-dark.css?v=2">
<style>
:root { --sf-max-w: 1400px; }
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-dim);font-size:13px;margin-bottom:16px}

/* 프리셋 */
.presets{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.preset-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s}
.preset-btn:hover,.preset-btn.active{border-color:var(--accent);color:var(--accent)}

/* 필터 바 */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-bar input[type=date],.filter-bar select{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.filter-bar label{font-size:12px;color:var(--text-dim)}
.btn-primary{background:var(--accent);border:none;color:#fff;padding:8px 18px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.btn-primary:hover{opacity:.85}

/* 종목 선택기 */
.picker-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.picker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.picker-header h3{font-size:14px;font-weight:700;margin:0}
.picker-search{background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:6px;font-size:12px;font-family:inherit;width:200px}
.picker-search::placeholder{color:var(--text-dim)}
.picker-actions button{background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
  padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.picker-actions button:hover{color:var(--text);border-color:var(--text-dim)}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:200px;overflow-y:auto}
.picker-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.picker-item:hover{background:rgba(59,130,246,.06)}
.picker-item input{accent-color:var(--accent);cursor:pointer}
.picker-item .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item .pmkt{font-size:9px;padding:1px 4px;border-radius:3px;font-weight:600;flex-shrink:0}
.pmkt.kospi{color:#3b82f6;background:rgba(59,130,246,.12)}
.pmkt.kosdaq{color:#a855f7;background:rgba(168,85,247,.12)}
.selected-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sel-tag{background:rgba(59,130,246,.15);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:11px;
  cursor:pointer;display:flex;align-items:center;gap:4px}
.sel-tag:hover{background:rgba(59,130,246,.25)}
.sel-tag .x{font-weight:700}

/* 서머리 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.summary-card .num{font-size:20px;font-weight:800}
.summary-card .label{font-size:10px;color:var(--text-dim);margin-top:3px}

/* 정렬 바 */
.sort-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sort-bar span{font-size:12px;color:var(--text-dim)}

/* 카드 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.stock-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .12s}
.stock-card:hover{border-color:var(--accent)}
.sc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.sc-name{font-weight:700;font-size:14px}
.sc-code{color:var(--text-dim);font-size:10px;margin-left:6px}
.sc-mkt{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.sc-mkt.kospi{color:#3b82f6;background:rgba(59,130,246,.12)}
.sc-mkt.kosdaq{color:#a855f7;background:rgba(168,85,247,.12)}
.sc-pct{font-size:28px;font-weight:800;margin-bottom:2px}
.sc-excess{font-size:13px;font-weight:600;margin-bottom:8px}
.sc-prices{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim)}
.sc-prices .val{color:var(--text);font-weight:600}
.up{color:var(--red)}.down{color:#3b82f6}.flat{color:var(--text-dim)}

.sc-bar-wrap{height:6px;background:var(--bg);border-radius:3px;margin:8px 0;position:relative;overflow:hidden}
.sc-bar{height:100%;border-radius:3px;position:absolute;top:0}
.sc-bar.pos{background:var(--red);right:50%}.sc-bar.neg{background:#3b82f6;left:50%}

.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:16px;line-height:1.8}
.loading{text-align:center;padding:40px;color:var(--text-dim)}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14px}
</style>
</head>
<body>
<script src="/common.js"></script>

<h1>📊 기간별 등락률 비교</h1>
<p class="subtitle">KOSPI·KOSDAQ 종목별 종가 변동률 비교 (Oracle DB)</p>

<!-- 프리셋 -->
<div class="presets" id="presets">
  <button class="preset-btn" data-days="7">1주</button>
  <button class="preset-btn" data-days="14">2주</button>
  <button class="preset-btn" data-days="30">1개월</button>
  <button class="preset-btn" data-days="60">2개월</button>
  <button class="preset-btn" data-days="90">3개월</button>
  <button class="preset-btn active" data-from="2026-07-31">7월말~</button>
</div>

<!-- 필터 -->
<div class="filter-bar">
  <label>시작일</label>
  <input type="date" id="dateFrom" value="2026-07-31">
  <label>종료일</label>
  <input type="date" id="dateTo">
  <select id="marketFilter">
    <option value="">전체</option>
    <option value="KOSPI">KOSPI</option>
    <option value="KOSDAQ">KOSDAQ</option>
  </select>
  <button class="btn-primary" onclick="fetchData()">조회</button>
</div>

<!-- 종목 선택기 -->
<div class="picker-wrap">
  <div class="picker-header">
    <h3>📌 종목 선택 <span style="font-weight:400;color:var(--text-dim);font-size:12px">(체크 시 해당 종목만 표시. 미선택 = 전체)</span></h3>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" class="picker-search" id="pickerSearch" placeholder="종목명·코드 검색...">
      <div class="picker-actions">
        <button onclick="clearSelection()">초기화</button>
      </div>
    </div>
  </div>
  <div class="picker-grid" id="pickerGrid"></div>
  <div class="selected-tags" id="selectedTags"></div>
</div>

<!-- 서머리 -->
<div class="summary" id="summary" style="display:none">
  <div class="summary-card"><div class="num" id="sTotal">-</div><div class="label">종목수</div></div>
  <div class="summary-card"><div class="num up" id="sUp">-</div><div class="label">상승</div></div>
  <div class="summary-card"><div class="num down" id="sDown">-</div><div class="label">하락</div></div>
  <div class="summary-card"><div class="num" id="sAvg">-</div><div class="label">평균</div></div>
  <div class="summary-card"><div class="num" id="sKospi">-</div><div class="label">KOSPI</div></div>
  <div class="summary-card"><div class="num" id="sKosdaq">-</div><div class="label">KOSDAQ</div></div>
</div>

<!-- 정렬 -->
<div class="sort-bar">
  <span>정렬:</span>
  <button class="preset-btn active" data-sort="change_pct_desc">등락률 높은순</button>
  <button class="preset-btn" data-sort="change_pct_asc">등락률 낮은순</button>
  <button class="preset-btn" data-sort="excess_desc">초과수익률↑</button>
  <button class="preset-btn" data-sort="excess_asc">초과수익률↓</button>
  <button class="preset-btn" data-sort="name">이름순</button>
</div>

<!-- 카드 그리드 -->
<div class="card-grid" id="cardGrid">
  <div class="loading">조회 버튼을 누르세요</div>
</div>

<div class="note" id="rangeNote"></div>
<div class="note" id="note"></div>

<script>
const API = 'https://swingfarmer.duckdns.org/api';
let stockMap = {};
let allData = [];
let selectedCodes = new Set();
let currentSort = 'change_pct_desc';
let dataRange = { first: null, last: null };

async function loadStockMap() {
  async function parseCSV(url, market) {
    try {
      const res = await fetch(url);
      const text = await res.text();
      for (const line of text.split('\n')) {
        const t = line.trim();
        if (!t || t.startsWith('#')) continue;
        const parts = t.split(',');
        if (parts.length >= 2)
          stockMap[parts[0].trim()] = { name: parts[1].trim(), sector: parts.length>=3?parts[2].trim():'', market };
      }
    } catch(e) {}
  }
  await Promise.all([parseCSV('/scripts/kospi200_list.csv','KOSPI'), parseCSV('/scripts/kosdaq_list.csv','KOSDAQ')]);
  renderPicker();
}

function renderPicker() {
  const q = document.getElementById('pickerSearch').value.trim().toLowerCase();
  const grid = document.getElementById('pickerGrid');
  const entries = Object.entries(stockMap)
    .filter(([code,info]) => !q || info.name.toLowerCase().includes(q) || code.includes(q))
    .sort((a,b) => a[1].name.localeCompare(b[1].name));
  grid.innerHTML = entries.slice(0,200).map(([code,info]) => {
    const ck = selectedCodes.has(code)?'checked':'';
    const mc = info.market==='KOSPI'?'kospi':'kosdaq';
    return `<label class="picker-item"><input type="checkbox" value="${code}" ${ck}>
      <span class="pname">${info.name}</span><span class="pmkt ${mc}">${info.market.slice(0,2)}</span></label>`;
  }).join('');
  renderSelectedTags();
}

function renderSelectedTags() {
  const el = document.getElementById('selectedTags');
  if (!selectedCodes.size) { el.innerHTML=''; return; }
  el.innerHTML = [...selectedCodes].map(c => {
    const n = stockMap[c]?.name||c;
    return `<span class="sel-tag" data-code="${c}">${n} <span class="x">✕</span></span>`;
  }).join('');
}

function clearSelection() { selectedCodes.clear(); renderPicker(); renderCards(); }

document.getElementById('pickerGrid').addEventListener('change', e => {
  if (e.target.type!=='checkbox') return;
  if (e.target.checked) selectedCodes.add(e.target.value); else selectedCodes.delete(e.target.value);
  renderSelectedTags(); renderCards();
});
document.getElementById('selectedTags').addEventListener('click', e => {
  const tag = e.target.closest('.sel-tag');
  if (!tag) return;
  selectedCodes.delete(tag.dataset.code); renderPicker(); renderCards();
});
document.getElementById('pickerSearch').addEventListener('input', renderPicker);

function today() { return new Date().toISOString().slice(0,10); }
function daysAgo(n) { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

async function loadDataRange() {
  try {
    const r = await fetch(`${API}/prices/daily/summary`);
    const j = await r.json();
    dataRange.first = j.first_date; dataRange.last = j.last_date;
    const f=document.getElementById('dateFrom'), t=document.getElementById('dateTo');
    if (dataRange.first) { f.min=dataRange.first; t.min=dataRange.first; }
    if (dataRange.last) { f.max=dataRange.last; t.max=dataRange.last; }
    document.getElementById('rangeNote').textContent = `📅 데이터 범위: ${dataRange.first} ~ ${dataRange.last} (${j.stock_count}종목)`;
  } catch(e) {}
}

document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn'); if (!btn) return;
  document.querySelectorAll('#presets .preset-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (btn.dataset.days) { document.getElementById('dateFrom').value=daysAgo(parseInt(btn.dataset.days)); document.getElementById('dateTo').value=today(); }
  else if (btn.dataset.from) { document.getElementById('dateFrom').value=btn.dataset.from; document.getElementById('dateTo').value=today(); }
  fetchData();
});

async function fetchData() {
  let from = document.getElementById('dateFrom').value;
  let to = document.getElementById('dateTo').value || today();
  if (dataRange.first && from < dataRange.first) { from=dataRange.first; document.getElementById('dateFrom').value=from; }
  if (dataRange.last && to > dataRange.last) to=dataRange.last;
  document.getElementById('dateTo').value = to;
  document.getElementById('cardGrid').innerHTML = '<div class="loading">조회 중...</div>';
  try {
    const res = await fetch(`${API}/prices/daily/changes?from=${from}&to=${to}`);
    const json = await res.json();
    const indexMap = {};
    (json.data||[]).forEach(d => {
      if (d.stock_code==='KS11') indexMap.KOSPI=d.change_pct||0;
      if (d.stock_code==='KQ11') indexMap.KOSDAQ=d.change_pct||0;
    });
    window._indexMap = indexMap;
    allData = (json.data||[])
      .filter(d => d.stock_code!=='KS11' && d.stock_code!=='KQ11')
      .filter(d => {
        if (!d.start_date) return false;
        const diff = (new Date(d.start_date)-new Date(from))/(86400000);
        return diff <= 5;
      })
      .map(d => {
        const info = stockMap[d.stock_code]||{};
        const mkt = info.market||'';
        const bench = mkt==='KOSDAQ'?(indexMap.KOSDAQ||0):(indexMap.KOSPI||0);
        return { ...d, name:info.name||d.stock_code, market:mkt, sector:info.sector||'',
          excess_pct: Math.round(((d.change_pct||0)-bench)*100)/100 };
      });
    updateSummary(); renderCards();
    document.getElementById('note').textContent = `기간: ${from} → ${to} · ${allData.length}종목 · Oracle DAILY_PRICES`;
  } catch(e) { document.getElementById('cardGrid').innerHTML=`<div class="loading">❌ ${e.message}</div>`; }
}

function updateSummary() {
  const f = getFiltered(), pcts = f.map(d=>d.change_pct).sort((a,b)=>a-b);
  const up=pcts.filter(p=>p>0).length, down=pcts.filter(p=>p<0).length;
  const avg = pcts.length?(pcts.reduce((s,v)=>s+v,0)/pcts.length):0;
  document.getElementById('sTotal').textContent=f.length;
  document.getElementById('sUp').textContent=up;
  document.getElementById('sDown').textContent=down;
  const ae=document.getElementById('sAvg');
  ae.textContent=(avg>=0?'+':'')+avg.toFixed(2)+'%';
  ae.className='num '+(avg>0?'up':avg<0?'down':'flat');
  const im=window._indexMap||{};
  ['KOSPI','KOSDAQ'].forEach(k => {
    const el=document.getElementById(k==='KOSPI'?'sKospi':'sKosdaq');
    const v=im[k]||0;
    el.textContent=(v>=0?'+':'')+v.toFixed(2)+'%';
    el.className='num '+(v>0?'up':v<0?'down':'flat');
  });
  document.getElementById('summary').style.display='grid';
}

function getFiltered() {
  const mkt=document.getElementById('marketFilter').value;
  return allData.filter(d => {
    if (mkt && d.market!==mkt) return false;
    if (selectedCodes.size && !selectedCodes.has(d.stock_code)) return false;
    return true;
  });
}

function sortData(data) {
  const s=currentSort;
  return [...data].sort((a,b) => {
    if (s==='change_pct_desc') return (b.change_pct||0)-(a.change_pct||0);
    if (s==='change_pct_asc') return (a.change_pct||0)-(b.change_pct||0);
    if (s==='excess_desc') return (b.excess_pct||0)-(a.excess_pct||0);
    if (s==='excess_asc') return (a.excess_pct||0)-(b.excess_pct||0);
    if (s==='name') return (a.name||'').localeCompare(b.name||'');
    return 0;
  });
}

function renderCards() {
  const filtered=getFiltered(), sorted=sortData(filtered);
  const grid=document.getElementById('cardGrid');
  if (!sorted.length) {
    grid.innerHTML='<div class="empty">표시할 종목이 없습니다.<br>종목을 선택하거나 필터를 조정해보세요.</div>';
    updateSummary(); return;
  }
  const maxAbs=Math.max(...filtered.map(d=>Math.abs(d.change_pct||0)),1);
  grid.innerHTML = sorted.map(d => {
    const pct=d.change_pct||0, cls=pct>0?'up':pct<0?'down':'flat', sign=pct>0?'+':'';
    const ex=d.excess_pct||0, exCls=ex>0?'up':ex<0?'down':'flat', exSign=ex>0?'+':'';
    const barW=Math.min(Math.abs(pct)/maxAbs*50,50);
    const barCls=pct>=0?'pos':'neg';
    const barStyle=pct>=0?`right:50%;width:${barW}%`:`left:50%;width:${barW}%`;
    const mktCls=d.market==='KOSPI'?'kospi':'kosdaq';
    const bl=d.market==='KOSDAQ'?'KOSDAQ':'KOSPI';
    return `<div class="stock-card">
      <div class="sc-header"><div><span class="sc-name">${d.name}</span><span class="sc-code">${d.stock_code}</span></div>
        <span class="sc-mkt ${mktCls}">${d.market}</span></div>
      <div class="sc-pct ${cls}">${sign}${pct.toFixed(2)}%</div>
      <div class="sc-excess ${exCls}">${bl} 대비 ${exSign}${ex.toFixed(2)}%p</div>
      <div class="sc-bar-wrap"><div class="sc-bar ${barCls}" style="${barStyle}"></div></div>
      <div class="sc-prices">
        <div>${d.start_date} <span class="val">${(d.start_price||0).toLocaleString()}</span></div>
        <div>→</div>
        <div>${d.end_date} <span class="val">${(d.end_price||0).toLocaleString()}</span></div>
      </div>
    </div>`;
  }).join('');
  updateSummary();
}

document.querySelector('.sort-bar').addEventListener('click', e => {
  const btn=e.target.closest('.preset-btn'); if(!btn||!btn.dataset.sort) return;
  document.querySelectorAll('.sort-bar .preset-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); currentSort=btn.dataset.sort; renderCards();
});

document.getElementById('marketFilter').addEventListener('change', renderCards);

(async () => {
  document.getElementById('dateTo').value = today();
  await Promise.all([loadStockMap(), loadDataRange()]);
  fetchData();
})();
</script>
</body>
</html>
