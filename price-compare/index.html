<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>기간별 등락률 비교</title>
<link rel="stylesheet" href="/common-dark.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root { --sf-max-w: 1400px; }
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-dim);font-size:13px;margin-bottom:16px}
.presets{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.preset-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s}
.preset-btn:hover,.preset-btn.active{border-color:var(--accent);color:var(--accent)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-bar input[type=date],.filter-bar select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.filter-bar label{font-size:12px;color:var(--text-dim)}
.btn-primary{background:var(--accent);border:none;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.btn-primary:hover{opacity:.85}
.picker-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.picker-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.picker-toggle h3{font-size:14px;font-weight:700;margin:0}
.picker-toggle .arrow{font-size:12px;color:var(--text-dim);transition:transform .2s}
.picker-toggle .arrow.open{transform:rotate(180deg)}
.picker-body{overflow:hidden;transition:max-height .3s ease;max-height:0}
.picker-body.open{max-height:600px}
.picker-controls{display:flex;justify-content:space-between;align-items:center;margin:10px 0;flex-wrap:wrap;gap:8px}
.picker-search{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;font-family:inherit;width:200px}
.picker-search::placeholder{color:var(--text-dim)}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:200px;overflow-y:auto}
.picker-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.picker-item:hover{background:rgba(59,130,246,.06)}
.picker-item input{accent-color:var(--accent);cursor:pointer}
.picker-item .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item .pmkt{font-size:9px;padding:1px 4px;border-radius:3px;font-weight:600;flex-shrink:0}
.pmkt.kospi{color:#3b82f6;background:rgba(59,130,246,.12)}
.pmkt.kosdaq{color:#a855f7;background:rgba(168,85,247,.12)}
.selected-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sel-tag{background:rgba(59,130,246,.15);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.sel-tag:hover{background:rgba(59,130,246,.25)}
.sel-tag .x{font-weight:700}
.sel-tag .move-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:10px;padding:0 1px;opacity:.6}
.sel-tag .move-btn:hover{opacity:1}
.sector-filter{margin-bottom:14px}
.sector-filter-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sector-tags{display:flex;flex-wrap:wrap;gap:4px}
.sector-tag{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:3px 10px;border-radius:14px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .12s}
.sector-tag:hover{border-color:var(--text);color:var(--text)}
.sector-tag.active{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1)}
.sector-tag .cnt{font-size:9px;opacity:.6;margin-left:2px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.summary-card .num{font-size:20px;font-weight:800}
.summary-card .label{font-size:10px;color:var(--text-dim);margin-top:3px}
.chart-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.chart-header h3{font-size:14px;font-weight:700;margin:0}
.chart-controls{display:flex;gap:6px;align-items:center}
.chart-note{font-size:10px;color:var(--text-dim);margin-top:8px;text-align:center}
.chart-wrap{position:relative;height:340px}
@media(max-width:600px){.chart-wrap{height:260px}}
.sort-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sort-bar span{font-size:12px;color:var(--text-dim)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.stock-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .12s}
.stock-card:hover{border-color:var(--accent)}
.stock-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.sc-name{font-weight:700;font-size:14px}.sc-code{color:var(--text-dim);font-size:10px;margin-left:6px}
.sc-sector{font-size:9px;color:var(--text-dim);margin-left:4px}
.sc-mkt{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.sc-mkt.kospi{color:#3b82f6;background:rgba(59,130,246,.12)}
.sc-mkt.kosdaq{color:#a855f7;background:rgba(168,85,247,.12)}
.sc-pct{font-size:28px;font-weight:800;margin-bottom:2px}
.sc-excess{font-size:13px;font-weight:600;margin-bottom:8px}
.sc-prices{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim)}
.sc-prices .val{color:var(--text);font-weight:600}
.sc-vol{font-size:11px;color:var(--text-dim);margin-top:6px;text-align:right;display:flex;align-items:center;justify-content:space-between}
.sc-spark{flex-shrink:0}
.sc-vol .val{color:var(--text);font-weight:600}
.up{color:var(--red)}.down{color:#3b82f6}.flat{color:var(--text-dim)}
.sc-bar-wrap{height:6px;background:var(--bg);border-radius:3px;margin:8px 0;position:relative;overflow:hidden}
.sc-bar{height:100%;border-radius:3px;position:absolute;top:0}
.sc-bar.pos{background:var(--red);right:50%}.sc-bar.neg{background:#3b82f6;left:50%}
.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:16px;line-height:1.8}
.loading{text-align:center;padding:40px;color:var(--text-dim)}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14px}
</style>
</head>
<body>
<script src="/common.js"></script>
<h1>📊 기간별 등락률 비교</h1>
<p class="subtitle">KOSPI·KOSDAQ 종목별 종가 변동률 비교 (Oracle DB) · 저장 관리(우하단 💾)</p>

<div class="presets" id="presets">
  <button class="preset-btn" data-days="7">1주</button>
  <button class="preset-btn" data-days="14">2주</button>
  <button class="preset-btn" data-days="30">1개월</button>
  <button class="preset-btn" data-days="60">2개월</button>
  <button class="preset-btn" data-days="90">3개월</button>
  <button class="preset-btn active" data-from="2026-07-31">7월말~</button>
</div>
<div class="filter-bar">
  <label>시작일</label><input type="date" id="dateFrom" value="2026-07-31">
  <label>종료일</label><input type="date" id="dateTo">
  <select id="marketFilter"><option value="">전체</option><option value="KOSPI">KOSPI</option><option value="KOSDAQ">KOSDAQ</option></select>
  <button class="btn-primary" onclick="fetchData()">조회</button>
  <button class="preset-btn" onclick="clearSelection()">초기화</button>
</div>

<div class="picker-wrap">
  <div class="picker-toggle" id="pickerToggle">
    <h3>📌 종목 선택 <span id="selCount" style="font-weight:400;color:var(--text-dim);font-size:12px"></span></h3>
    <span class="arrow" id="pickerArrow">▼</span>
  </div>
  <div class="picker-body" id="pickerBody">
    <div class="picker-controls">
      <input type="text" class="picker-search" id="pickerSearch" placeholder="종목명·코드 검색...">
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
  <div class="selected-tags" id="selectedTags"></div>
</div>

<div class="sector-filter" id="sectorFilter" style="display:none">
  <div class="sector-filter-label">🏷️ 업종 필터 <span style="font-size:10px">(KOSPI만 · KOSDAQ 미반영)</span>
    <button class="preset-btn" onclick="clearSectors()" style="padding:2px 10px;font-size:10px;margin-left:6px">초기화</button></div>
  <div class="sector-tags" id="sectorTags"></div>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="summary-card"><div class="num" id="sTotal">-</div><div class="label">종목수</div></div>
  <div class="summary-card"><div class="num up" id="sUp">-</div><div class="label">상승</div></div>
  <div class="summary-card"><div class="num down" id="sDown">-</div><div class="label">하락</div></div>
  <div class="summary-card"><div class="num" id="sAvg">-</div><div class="label">평균</div></div>
  <div class="summary-card"><div class="num" id="sKospi">-</div><div class="label">KOSPI</div></div>
  <div class="summary-card"><div class="num" id="sKosdaq">-</div><div class="label">KOSDAQ</div></div>
</div>

<div class="chart-section" id="chartSection">
  <div class="chart-header"><h3>📈 수익률 추이 비교</h3>
    <div class="chart-controls">
      <button class="preset-btn active" data-chart-mode="pct" onclick="setChartMode('pct')">수익률(%)</button>
      <button class="preset-btn" data-chart-mode="price" onclick="setChartMode('price')">종가(원)</button>
      <button class="preset-btn" onclick="toggleBenchmark()">벤치마크</button>
      <button class="preset-btn" id="btnVol" onclick="toggleVolume()">거래대금</button>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
  <div class="chart-note">📌 종목 선택 후 차트 표시 (최대 10개) · 시작일 종가=0% 기준 정규화</div>
</div>

<div class="sort-bar">
  <span>정렬:</span>
  <button class="preset-btn active" data-sort="change_pct_desc">등락률 높은순</button>
  <button class="preset-btn" data-sort="change_pct_asc">등락률 낮은순</button>
  <button class="preset-btn" data-sort="excess_desc">초과수익률↑</button>
  <button class="preset-btn" data-sort="excess_asc">초과수익률↓</button>
  <button class="preset-btn" data-sort="vol_desc">거래대금↑</button>
  <button class="preset-btn" data-sort="vol_asc">거래대금↓</button>
  <button class="preset-btn" data-sort="name">이름순</button>
  <button class="preset-btn" data-sort="custom">내 순서</button>
</div>
<div class="card-grid" id="cardGrid"><div class="loading">조회 버튼을 누르세요</div></div>
<div class="note" id="rangeNote"></div>
<div class="note" id="note"></div>

<script>
const API = 'https://swingfarmer.duckdns.org/api';
let stockMap={}, allData=[], selectedCodes=new Set(), currentSort='change_pct_desc';
let dataRange={first:null,last:null}, selectedSectors=new Set();
let chartMode='pct', showBenchmark=true, showVolume=false, priceChart=null;
const CHART_COLORS=['#3b82f6','#ef4444','#22c55e','#eab308','#a855f7','#f97316','#06b6d4','#ec4899','#14b8a6','#f43f5e'];
const BENCH_COLORS={KOSPI:'rgba(255,255,255,.35)',KOSDAQ:'rgba(168,85,247,.35)'};

async function loadStockMap(){
  async function parseCSV(url,market){try{const r=await fetch(url);const t=await r.text();for(const l of t.split('\n')){const s=l.trim();if(!s||s.startsWith('#'))continue;const p=s.split(',');if(p.length>=2)stockMap[p[0].trim()]={name:p[1].trim(),sector:p.length>=3?p[2].trim():'',market};}}catch(e){}}
  await Promise.all([parseCSV('/scripts/kospi200_list.csv','KOSPI'),parseCSV('/scripts/kosdaq_list.csv','KOSDAQ')]);
  renderPicker();
}

let pickerOpen=localStorage.getItem('sf_picker_open')==='1';
function applyPickerState(){document.getElementById('pickerBody').classList.toggle('open',pickerOpen);document.getElementById('pickerArrow').classList.toggle('open',pickerOpen);}
document.getElementById('pickerToggle').addEventListener('click',()=>{pickerOpen=!pickerOpen;localStorage.setItem('sf_picker_open',pickerOpen?'1':'0');applyPickerState();});
applyPickerState();

function updateSelCount(){document.getElementById('selCount').textContent=selectedCodes.size?`(${selectedCodes.size}종목 선택됨)`:'(체크 시 해당 종목만 표시)';}
function renderPicker(){
  const q=document.getElementById('pickerSearch').value.trim().toLowerCase();
  const entries=Object.entries(stockMap).filter(([c,i])=>!q||i.name.toLowerCase().includes(q)||c.includes(q)).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  document.getElementById('pickerGrid').innerHTML=entries.slice(0,200).map(([c,i])=>{const ck=selectedCodes.has(c)?'checked':'';const mc=i.market==='KOSPI'?'kospi':'kosdaq';return`<label class="picker-item"><input type="checkbox" value="${c}" ${ck}><span class="pname">${i.name}</span><span class="pmkt ${mc}">${i.market.slice(0,2)}</span></label>`;}).join('');
  renderSelectedTags();
}

let orderedCodes=[];
function syncOrder(){orderedCodes=orderedCodes.filter(c=>selectedCodes.has(c));selectedCodes.forEach(c=>{if(!orderedCodes.includes(c))orderedCodes.push(c);});}
function renderSelectedTags(){
  syncOrder();updateSelCount();
  const el=document.getElementById('selectedTags');
  if(!orderedCodes.length){el.innerHTML='';return;}
  el.innerHTML=orderedCodes.map((c,i)=>{
    const n=stockMap[c]?.name||c;
    const upDis=i===0?'opacity:.2;pointer-events:none':'';
    const dnDis=i===orderedCodes.length-1?'opacity:.2;pointer-events:none':'';
    return`<span class="sel-tag" data-code="${c}" data-idx="${i}"><button class="move-btn" data-dir="up" data-idx="${i}" style="${upDis}">◀</button> ${n} <button class="move-btn" data-dir="down" data-idx="${i}" style="${dnDis}">▶</button> <span class="x" data-code="${c}">✕</span></span>`;
  }).join('');
}

document.getElementById('selectedTags').addEventListener('click',e=>{
  const mb=e.target.closest('.move-btn');
  if(mb){const idx=parseInt(mb.dataset.idx),dir=mb.dataset.dir;if(dir==='up'&&idx>0)[orderedCodes[idx-1],orderedCodes[idx]]=[orderedCodes[idx],orderedCodes[idx-1]];else if(dir==='down'&&idx<orderedCodes.length-1)[orderedCodes[idx],orderedCodes[idx+1]]=[orderedCodes[idx+1],orderedCodes[idx]];renderSelectedTags();renderCards();return;}
  const xb=e.target.closest('.x');if(xb){selectedCodes.delete(xb.dataset.code);renderPicker();renderCards();return;}
});

function clearSelection(){selectedCodes.clear();orderedCodes=[];selectedSectors.clear();renderPicker();renderCards();buildSectorFilter();}
function clearSectors(){selectedSectors.clear();buildSectorFilter();renderCards();}

document.getElementById('pickerGrid').addEventListener('change',e=>{if(e.target.type!=='checkbox')return;if(e.target.checked)selectedCodes.add(e.target.value);else selectedCodes.delete(e.target.value);renderSelectedTags();renderCards();});
document.getElementById('pickerSearch').addEventListener('input',renderPicker);
function today(){return new Date().toISOString().slice(0,10);}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

async function loadDataRange(){try{const r=await fetch(`${API}/prices/daily/summary`);const j=await r.json();dataRange.first=j.first_date;dataRange.last=j.last_date;const f=document.getElementById('dateFrom'),t=document.getElementById('dateTo');if(dataRange.first){f.min=dataRange.first;t.min=dataRange.first;}if(dataRange.last){f.max=dataRange.last;t.max=dataRange.last;}document.getElementById('rangeNote').textContent=`📅 데이터 범위: ${dataRange.first} ~ ${dataRange.last} (${j.stock_count}종목)`;}catch(e){}}

document.getElementById('presets').addEventListener('click',e=>{const b=e.target.closest('.preset-btn');if(!b)return;document.querySelectorAll('#presets .preset-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.days){document.getElementById('dateFrom').value=daysAgo(parseInt(b.dataset.days));document.getElementById('dateTo').value=today();}else if(b.dataset.from){document.getElementById('dateFrom').value=b.dataset.from;document.getElementById('dateTo').value=today();}fetchData();});

function buildSectorFilter(){
  const sc={};allData.forEach(d=>{const s=d.sector;if(s&&s!=='기타')sc[s]=(sc[s]||0)+1;});
  const sectors=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const wrap=document.getElementById('sectorFilter'),tags=document.getElementById('sectorTags');
  if(!sectors.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  tags.innerHTML=`<button class="sector-tag${selectedSectors.size===0?' active':''}" data-sector="">전체<span class="cnt">${allData.length}</span></button>`+sectors.map(([s,c])=>`<button class="sector-tag${selectedSectors.has(s)?' active':''}" data-sector="${s}">${s}<span class="cnt">${c}</span></button>`).join('');
}
document.getElementById('sectorTags').addEventListener('click',e=>{const b=e.target.closest('.sector-tag');if(!b)return;const s=b.dataset.sector;if(s==='')selectedSectors.clear();else{if(selectedSectors.has(s))selectedSectors.delete(s);else selectedSectors.add(s);}document.querySelectorAll('.sector-tag').forEach(x=>{if(x.dataset.sector==='')x.classList.toggle('active',selectedSectors.size===0);else x.classList.toggle('active',selectedSectors.has(x.dataset.sector));});renderCards();});

async function fetchData(){
  let from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value||today();
  if(dataRange.first&&from<dataRange.first){from=dataRange.first;document.getElementById('dateFrom').value=from;}
  if(dataRange.last&&to>dataRange.last)to=dataRange.last;
  document.getElementById('dateTo').value=to;
  document.getElementById('cardGrid').innerHTML='<div class="loading">조회 중...</div>';
  try{
    const res=await fetch(`${API}/prices/daily/changes?from=${from}&to=${to}`);const json=await res.json();
    const im={};(json.data||[]).forEach(d=>{if(d.stock_code==='KS11')im.KOSPI=d.change_pct||0;if(d.stock_code==='KQ11')im.KOSDAQ=d.change_pct||0;});
    window._indexMap=im;
    allData=(json.data||[]).filter(d=>d.stock_code!=='KS11'&&d.stock_code!=='KQ11').filter(d=>{if(!d.start_date)return false;return(new Date(d.start_date)-new Date(from))/86400000<=5;}).map(d=>{const i=stockMap[d.stock_code]||{};const m=i.market||'';const b=m==='KOSDAQ'?(im.KOSDAQ||0):(im.KOSPI||0);return{...d,name:i.name||d.stock_code,market:m,sector:i.sector||'',excess_pct:Math.round(((d.change_pct||0)-b)*100)/100,avg_trade_amount:d.avg_trade_amount||0};});
    buildSectorFilter();updateSummary();renderCards();
    document.getElementById('note').textContent=`기간: ${from} → ${to} · ${allData.length}종목 · Oracle DAILY_PRICES`;
  }catch(e){document.getElementById('cardGrid').innerHTML=`<div class="loading">❌ ${e.message}</div>`;}
}

function updateSummary(){
  const f=getFiltered(),pcts=f.map(d=>d.change_pct).sort((a,b)=>a-b);
  const up=pcts.filter(p=>p>0).length,down=pcts.filter(p=>p<0).length,avg=pcts.length?(pcts.reduce((s,v)=>s+v,0)/pcts.length):0;
  document.getElementById('sTotal').textContent=f.length;document.getElementById('sUp').textContent=up;document.getElementById('sDown').textContent=down;
  const ae=document.getElementById('sAvg');ae.textContent=(avg>=0?'+':'')+avg.toFixed(2)+'%';ae.className='num '+(avg>0?'up':avg<0?'down':'flat');
  const im=window._indexMap||{};['KOSPI','KOSDAQ'].forEach(k=>{const el=document.getElementById(k==='KOSPI'?'sKospi':'sKosdaq');const v=im[k]||0;el.textContent=(v>=0?'+':'')+v.toFixed(2)+'%';el.className='num '+(v>0?'up':v<0?'down':'flat');});
  document.getElementById('summary').style.display='grid';
}
function getFiltered(){const m=document.getElementById('marketFilter').value;return allData.filter(d=>{if(m&&d.market!==m)return false;if(selectedCodes.size&&!selectedCodes.has(d.stock_code))return false;if(selectedSectors.size&&!selectedSectors.has(d.sector))return false;return true;});}
function sortData(data){const s=currentSort;if(s==='custom'&&selectedCodes.size)return[...data].sort((a,b)=>{const ai=orderedCodes.indexOf(a.stock_code),bi=orderedCodes.indexOf(b.stock_code);return(ai===-1?999:ai)-(bi===-1?999:bi);});return[...data].sort((a,b)=>{if(s==='change_pct_desc')return(b.change_pct||0)-(a.change_pct||0);if(s==='change_pct_asc')return(a.change_pct||0)-(b.change_pct||0);if(s==='excess_desc')return(b.excess_pct||0)-(a.excess_pct||0);if(s==='excess_asc')return(a.excess_pct||0)-(b.excess_pct||0);if(s==='vol_desc')return(b.avg_trade_amount||0)-(a.avg_trade_amount||0);if(s==='vol_asc')return(a.avg_trade_amount||0)-(b.avg_trade_amount||0);if(s==='name')return(a.name||'').localeCompare(b.name||'');return 0;});}

function renderCards(){
  const filtered=getFiltered(),sorted=sortData(filtered),grid=document.getElementById('cardGrid');
  if(!sorted.length){grid.innerHTML='<div class="empty">표시할 종목이 없습니다.</div>';updateSummary();hideChart();return;}
  const maxAbs=Math.max(...filtered.map(d=>Math.abs(d.change_pct||0)),1);
  grid.innerHTML=sorted.map(d=>{const pct=d.change_pct||0,c=pct>0?'up':pct<0?'down':'flat',sign=pct>0?'+':'';const ex=d.excess_pct||0,ec=ex>0?'up':ex<0?'down':'flat',es=ex>0?'+':'';const bw=Math.min(Math.abs(pct)/maxAbs*50,50);const bc=pct>=0?'pos':'neg';const bs=pct>=0?`right:50%;width:${bw}%`:`left:50%;width:${bw}%`;const mc=d.market==='KOSPI'?'kospi':'kosdaq';const bl=d.market==='KOSDAQ'?'KOSDAQ':'KOSPI';const sl=d.sector&&d.sector!=='기타'?`<span class="sc-sector">${d.sector}</span>`:'';const vol=d.avg_trade_amount?`<div class="sc-vol"><span>일평균 <span class="val">${fmtAmt(d.avg_trade_amount)}</span></span><span class="sc-spark" id="spark-${d.stock_code}"></span></div>`:'';const sel=selectedCodes.has(d.stock_code)?' selected':'';return`<div class="stock-card${sel}" data-code="${d.stock_code}" style="cursor:pointer"><div class="sc-header"><div><span class="sc-name">${d.name}</span><span class="sc-code">${d.stock_code}</span>${sl}</div><span class="sc-mkt ${mc}">${d.market}</span></div><div class="sc-pct ${c}">${sign}${pct.toFixed(2)}%</div><div class="sc-excess ${ec}">${bl} 대비 ${es}${ex.toFixed(2)}%p</div><div class="sc-bar-wrap"><div class="sc-bar ${bc}" style="${bs}"></div></div><div class="sc-prices"><div>${d.start_date} <span class="val">${(d.start_price||0).toLocaleString()}</span></div><div>→</div><div>${d.end_date} <span class="val">${(d.end_price||0).toLocaleString()}</span></div></div>${vol}</div>`;}).join('');
  loadSparklines();
  updateSummary();
  const cc=selectedCodes.size?[...selectedCodes]:[];if(cc.length>=1&&cc.length<=10)loadChart(cc);else hideChart();
}

function fmtAmt(v){if(!v)return'-';if(v>=1e12)return(v/1e12).toFixed(1)+'조';if(v>=1e8)return Math.round(v/1e8).toLocaleString()+'억';if(v>=1e4)return Math.round(v/1e4).toLocaleString()+'만';return Math.round(v).toLocaleString()+'원';}

// ===== 차트 =====
function hideChart(){document.getElementById('chartSection').style.display='none';if(priceChart){priceChart.destroy();priceChart=null;}}
function toggleVolume(){showVolume=!showVolume;document.getElementById('btnVol').classList.toggle('active',showVolume);const c=[...selectedCodes];if(c.length>=1&&c.length<=10)loadChart(c);}
function setChartMode(m){chartMode=m;document.querySelectorAll('[data-chart-mode]').forEach(b=>b.classList.toggle('active',b.dataset.chartMode===m));const c=[...selectedCodes];if(c.length>=1&&c.length<=10)loadChart(c);}
function toggleBenchmark(){showBenchmark=!showBenchmark;const c=[...selectedCodes];if(c.length>=1&&c.length<=10)loadChart(c);}
async function loadChart(codes){const from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value||today();const ac=[...codes];if(showBenchmark)ac.push('KS11','KQ11');try{const r=await fetch(`${API}/prices/daily?codes=${[...new Set(ac)].join(',')}&from=${from}&to=${to}`);const j=await r.json();drawChart(j.data||[],codes);}catch(e){}}
function drawChart(raw,codes){const bc={};raw.forEach(r=>{if(!bc[r.stock_code])bc[r.stock_code]=[];bc[r.stock_code].push(r);});const ad=[...new Set(raw.map(r=>r.trade_date))].sort();if(!ad.length){hideChart();return;}const ds=[];
// 수익률/종가 라인
codes.forEach((c,i)=>{const rows=bc[c]||[];if(!rows.length)return;const dm={};rows.forEach(r=>dm[r.trade_date]=r);const bp=rows[0]?.close_price||1;ds.push({type:'line',label:stockMap[c]?.name||c,yAxisID:'y',data:ad.map(d=>{const r=dm[d];if(!r)return null;const cl=r.close_price??0;return chartMode==='pct'?Math.round((cl/bp-1)*10000)/100:cl;}),borderColor:CHART_COLORS[i%CHART_COLORS.length],backgroundColor:'transparent',borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.1,spanGaps:true,order:1});});
// 벤치마크
if(showBenchmark&&chartMode==='pct')['KS11','KQ11'].forEach(idx=>{const rows=bc[idx]||[];if(!rows.length)return;const dm={};rows.forEach(r=>dm[r.trade_date]=r);const bp=rows[0]?.close_price||1;const nm=idx==='KS11'?'KOSPI':'KOSDAQ';ds.push({type:'line',label:nm,yAxisID:'y',data:ad.map(d=>{const r=dm[d];if(!r)return null;return Math.round((r.close_price/bp-1)*10000)/100;}),borderColor:BENCH_COLORS[nm],backgroundColor:'transparent',borderWidth:1.5,borderDash:[6,3],pointRadius:0,tension:.1,spanGaps:true,order:1});});
// 거래대금 바
if(showVolume){codes.forEach((c,i)=>{const rows=bc[c]||[];if(!rows.length)return;const dm={};rows.forEach(r=>dm[r.trade_date]=r);ds.push({type:'bar',label:(stockMap[c]?.name||c)+' 거래대금',yAxisID:'y1',data:ad.map(d=>{const r=dm[d];return r?(r.trade_amount||0):null;}),backgroundColor:CHART_COLORS[i%CHART_COLORS.length]+'30',borderColor:CHART_COLORS[i%CHART_COLORS.length]+'60',borderWidth:1,barPercentage:.6,categoryPercentage:.8,order:2});});}
if(!ds.length){hideChart();return;}
const hasVol=showVolume&&ds.some(d=>d.yAxisID==='y1');
document.getElementById('chartSection').style.display='block';const ctx=document.getElementById('priceChart').getContext('2d');if(priceChart)priceChart.destroy();
priceChart=new Chart(ctx,{data:{labels:ad.map(d=>d.slice(5)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{color:'#e4e4e7',boxWidth:14,padding:12,font:{size:11},filter:item=>!item.text.includes('거래대금')||showVolume}},tooltip:{backgroundColor:'#1a1d27',titleColor:'#e4e4e7',bodyColor:'#e4e4e7',borderColor:'#2a2d3a',borderWidth:1,callbacks:{label:c=>{const v=c.parsed.y;if(v===null)return'';if(c.dataset.yAxisID==='y1')return`${c.dataset.label}: ${fmtAmt(v)}`;return chartMode==='pct'?`${c.dataset.label}: ${v>=0?'+':''}${v.toFixed(2)}%`:`${c.dataset.label}: ${v.toLocaleString()}원`;}}}},scales:{x:{ticks:{color:'#71717a',maxRotation:0,autoSkipPadding:20,font:{size:10}},grid:{color:'rgba(42,45,58,.5)'}},y:{position:'left',ticks:{color:'#71717a',font:{size:10},callback:v=>chartMode==='pct'?v.toFixed(1)+'%':v.toLocaleString()},grid:{color:'rgba(42,45,58,.5)'}},y1:{display:hasVol,position:'right',ticks:{color:'#71717a80',font:{size:9},callback:v=>fmtAmt(v)},grid:{drawOnChartArea:false}}}}});}

// ===== 스파크라인 =====
let sparkCache={};
async function loadSparklines(){
  const from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value||today();
  const key=from+'_'+to;
  if(sparkCache._key===key&&Object.keys(sparkCache).length>1){drawAllSparks();return;}
  try{const r=await fetch(`${API}/prices/daily/sparklines?from=${from}&to=${to}`);sparkCache=await r.json();sparkCache._key=key;drawAllSparks();}catch(e){}}
function drawAllSparks(){
  document.querySelectorAll('.sc-spark').forEach(el=>{
    const code=el.id.replace('spark-','');
    const pts=sparkCache[code];
    if(!pts||!pts.length)return;
    el.innerHTML=drawSpark(pts);
  });
}
function drawSpark(arr){
  const w=80,h=22,pad=1;
  const mn=Math.min(...arr),mx=Math.max(...arr),rng=mx-mn||1;
  const step=w/(arr.length-1||1);
  const coords=arr.map((v,i)=>[Math.round(i*step), Math.round(pad+(h-2*pad)*(1-(v-mn)/rng))]);
  const line=coords.map(p=>p.join(',')).join(' ');
  const fill=line+` ${w},${h} 0,${h}`;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><polyline points="${fill}" fill="rgba(59,130,246,.12)" stroke="none"/><polyline points="${line}" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
}

// ===== 카드 클릭 → 종목 선택 + 차트 =====
document.getElementById('cardGrid').addEventListener('click',e=>{
  const card=e.target.closest('.stock-card');if(!card)return;
  const code=card.dataset.code;if(!code)return;
  if(selectedCodes.has(code))selectedCodes.delete(code);else selectedCodes.add(code);
  renderPicker();renderCards();
  const sec=document.getElementById('chartSection');if(sec.style.display==='block')sec.scrollIntoView({behavior:'smooth',block:'start'});
});

document.querySelector('.sort-bar').addEventListener('click',e=>{const b=e.target.closest('.preset-btn');if(!b||!b.dataset.sort)return;document.querySelectorAll('.sort-bar .preset-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentSort=b.dataset.sort;renderCards();});
document.getElementById('marketFilter').addEventListener('change',renderCards);

// ===== sf-slots.js 연동 =====
window.CALC_KEY = 'price_compare';
window.slGetState = function(){syncOrder();return{orderedCodes,dateFrom:document.getElementById('dateFrom').value,dateTo:document.getElementById('dateTo').value};};
window.slSetState = function(d){if(!d)return;if(d.orderedCodes&&d.orderedCodes.length){orderedCodes=[...d.orderedCodes];selectedCodes=new Set(d.orderedCodes);renderPicker();}if(d.dateFrom)document.getElementById('dateFrom').value=d.dateFrom;if(d.dateTo)document.getElementById('dateTo').value=d.dateTo;fetchData();};
window.calculate = function(){fetchData();};

(async()=>{document.getElementById('dateTo').value=today();await Promise.all([loadStockMap(),loadDataRange()]);
  // localStorage 자동복원은 sf-slots.js가 처리
  if(!selectedCodes.size){try{const r=localStorage.getItem('sf_price_compare_v2');if(r){const d=JSON.parse(r);if(d.orderedCodes){orderedCodes=[...d.orderedCodes];selectedCodes=new Set(d.orderedCodes);renderPicker();}}}catch(e){}}
  fetchData();
})();
</script>
