<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>커뮤니티 | 스윙파머</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;max-width:860px;margin:0 auto;padding:20px;background:#fff;color:#333}
a{color:#333;text-decoration:none}
.back-link{display:inline-block;margin-bottom:12px;color:#1F4E78;font-size:14px}
.back-link:hover{text-decoration:underline}
.board-header{border-bottom:2px solid #1F4E78;padding-bottom:12px;margin-bottom:0}
.board-header h1{font-size:20px;color:#1F4E78;font-weight:800;display:flex;align-items:center;gap:10px}
.board-header .cat-mgr{background:none;border:1px solid #ddd;border-radius:4px;padding:3px 8px;font-size:12px;color:#888;cursor:pointer;font-family:inherit}
.board-header .cat-mgr:hover{background:#f5f5f5;color:#333}

/* 필터+검색 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0;border-bottom:1px solid #e5e5e5}
.filter-tabs{display:flex;gap:0;flex-wrap:wrap}
.ftab{padding:6px 14px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#666;font-family:inherit;margin-right:-1px}
.ftab:first-child{border-radius:4px 0 0 4px}
.ftab:last-child{border-radius:0 4px 4px 0}
.ftab.active{background:#1F4E78;color:white;border-color:#1F4E78;z-index:1;position:relative}
.search-box{display:flex;gap:0;flex:1;min-width:120px;margin-left:auto;max-width:260px}
.search-box input{flex:1;padding:6px 10px;font-size:12px;border:1px solid #ddd;border-right:none;border-radius:4px 0 0 4px;font-family:inherit}
.search-box input:focus{outline:none;border-color:#1F4E78}
.search-box button{padding:6px 12px;background:#1F4E78;color:white;border:1px solid #1F4E78;border-radius:0 4px 4px 0;cursor:pointer;font-size:12px}

.list-header{display:flex;align-items:center;padding:10px 0}
.list-cnt{font-size:13px;color:#666}
.btn-write{margin-left:auto;padding:8px 20px;background:#03c75a;color:white;border:none;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-write:hover{background:#02b350}

/* 글 목록 테이블 */
.post-table{width:100%;border-collapse:collapse}
.post-table th{padding:9px 8px;font-size:12px;font-weight:600;color:#666;text-align:center;background:#fafafa;border-bottom:1px solid #e5e5e5}
.post-table th.th-title{text-align:left;padding-left:16px}
.post-table td{padding:8px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.post-table tbody tr:hover{background:#f8fbff}
.td-no{text-align:center;color:#999;font-size:12px;width:50px}
.td-cat{text-align:center;width:70px}
.td-title-cell{padding-left:16px!important;cursor:pointer}
.td-title-cell:hover .t-text{text-decoration:underline}
.t-text{font-weight:500;color:#333}
.t-comment{color:#e55;font-size:12px;font-weight:700;margin-left:3px}
.t-new{display:inline-block;background:#ff3e3e;color:white;font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:1px}
.td-author{text-align:center;color:#555;width:80px;font-size:12px}
.td-date{text-align:center;color:#999;width:80px;font-size:12px}
.td-views{text-align:center;color:#999;width:50px;font-size:12px}
.cat-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#e8f0fe;color:#1a73e8}
.pin-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#fff3e0;color:#e65100}
.pager{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:16px}
.pager button{padding:5px 12px;border:1px solid #ddd;border-radius:3px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.current{background:#1F4E78;color:white;border-color:#1F4E78}
.empty{text-align:center;color:#999;padding:60px 20px}
.loading{text-align:center;color:#888;padding:40px}

/* 모달 공통 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-overlay.active{display:block}
.modal-inner{max-width:780px;margin:60px auto 40px;padding:0 16px}

/* 글 상세 */
.v-box{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.v-header{padding:24px 28px 20px;border-bottom:1px solid #eee}
.v-category{margin-bottom:10px}
.v-title{font-size:22px;font-weight:800;color:#333;line-height:1.4;margin-bottom:14px}
.v-meta{display:flex;gap:12px;font-size:13px;color:#999;flex-wrap:wrap}
.v-author{font-weight:700;color:#333}
.v-body{padding:28px;font-size:15.5px;line-height:1.85;color:#333;min-height:120px;word-break:break-word;white-space:pre-wrap}
.v-body img{max-width:100%;border-radius:4px;margin:10px 0;display:block}
.v-body a{color:#1a73e8;text-decoration:underline}
.v-body hr{border:none;border-top:1px solid #e5e5e5;margin:20px 0}
.v-actions{padding:14px 28px;border-top:1px solid #eee;display:flex;gap:8px}
.v-btn{padding:6px 16px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#555}
.v-btn:hover{background:#f5f5f5}
.v-btn.red{color:#e55;border-color:#fcc}.v-btn.red:hover{background:#fff5f5}
.v-close{margin-left:auto}
.v-comments{padding:20px 28px 24px;background:#fafafa;border-top:1px solid #eee}
.v-comments h3{font-size:14px;font-weight:700;color:#333;margin-bottom:14px}
.cm-list{display:flex;flex-direction:column;gap:0;margin-bottom:16px}
.cm-item{padding:14px 0;border-bottom:1px solid #eee}
.cm-item:last-child{border-bottom:none}
.cm-item.admin{background:#f0f6ff;margin:0 -28px;padding:14px 28px;border-left:3px solid #1a73e8}
.cm-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cm-name{font-weight:700;font-size:13px;color:#333}
.cm-item.admin .cm-name{color:#1a73e8}
.cm-time{font-size:11px;color:#aaa;margin-right:auto}
.cm-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:11px}
.cm-del:hover{color:#e55}
.cm-body{font-size:13.5px;color:#333;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cm-empty{font-size:13px;color:#aaa;padding:10px 0}
.cm-form{display:flex;gap:8px;flex-wrap:wrap}
.cm-form input{padding:8px 10px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit}
.cm-form input:focus{outline:none;border-color:#1F4E78}
.cm-form .cma{width:90px}
.cm-form .cmt{flex:1;min-width:150px}
.cm-form button{padding:8px 16px;background:#1F4E78;color:white;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

/* 글쓰기 */
.w-box{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.w-topbar{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid #e5e5e5}
.w-topbar h2{font-size:17px;font-weight:800;color:#333;flex:1}
.w-topbar .w-cancel{padding:6px 14px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#555;margin-right:8px}
.w-topbar .w-submit{padding:6px 20px;border:none;border-radius:4px;background:#03c75a;color:white;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.w-topbar .w-submit:hover{background:#02b350}
.w-selectors{display:flex;gap:10px;padding:14px 24px;border-bottom:1px solid #f0f0f0}
.w-selectors select{padding:8px 12px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit;background:#fff}
.w-selectors select:focus{outline:none;border-color:#1F4E78}
.w-title-row{padding:0 24px;border-bottom:1px solid #f0f0f0}
.w-title-row input{width:100%;padding:14px 0;font-size:16px;border:none;font-family:inherit;color:#333;font-weight:500}
.w-title-row input::placeholder{color:#bbb}
.w-title-row input:focus{outline:none}
.w-media-bar{display:flex;gap:0;padding:8px 24px;border-bottom:1px solid #f0f0f0;overflow-x:auto}
.w-media-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border:none;background:none;cursor:pointer;font-family:inherit;color:#555;min-width:48px;border-radius:4px}
.w-media-btn:hover{background:#f5f5f5}
.w-media-btn.disabled{opacity:.3;cursor:not-allowed}.w-media-btn.disabled:hover{background:none}
.w-media-btn .ico{font-size:20px}.w-media-btn .lbl{font-size:10px;white-space:nowrap;color:#888}
.w-format-bar{display:flex;gap:2px;padding:6px 24px;border-bottom:1px solid #f0f0f0;align-items:center;flex-wrap:wrap}
.w-fmt{padding:4px 7px;border:none;background:none;cursor:pointer;font-size:14px;color:#555;border-radius:3px;font-family:inherit}
.w-fmt:hover{background:#f0f0f0}
.w-fmt.disabled{opacity:.3;cursor:not-allowed}.w-fmt.disabled:hover{background:none}
.w-fmt-sep{width:1px;height:18px;background:#ddd;margin:0 6px}
.w-content textarea{width:100%;min-height:300px;border:none;padding:18px 24px;font-size:15px;line-height:1.8;resize:vertical;font-family:inherit;color:#333}
.w-content textarea::placeholder{color:#bbb}
.w-content textarea:focus{outline:none}
.w-pin-row{display:none;padding:8px 24px;align-items:center;gap:6px;border-top:1px solid #f0f0f0}
.w-pin-row label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.w-bottom{padding:14px 24px;border-top:1px solid #e5e5e5;background:#fafafa}
.w-bot-row{display:flex;gap:12px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.w-bot-row:last-child{margin-bottom:0}
.w-bot-label{font-size:12px;font-weight:600;color:#666;width:52px;flex:none}
.w-bot-input{flex:1;max-width:220px;padding:7px 10px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit}
.w-bot-input:focus{outline:none;border-color:#1F4E78}
.pw-wrap{position:relative;flex:1;max-width:220px}
.pw-wrap input{width:100%;padding:7px 34px 7px 10px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit}
.pw-wrap input:focus{outline:none;border-color:#1F4E78}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px}
.w-bot-hint{font-size:11px;color:#999;margin-left:64px}

/* 비밀번호 모달 */
.pw-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1002;align-items:center;justify-content:center;padding:20px}
.pw-modal-bg.active{display:flex}
.pw-modal{background:white;border-radius:8px;max-width:360px;width:100%;padding:24px}
.pw-modal h2{font-size:16px;font-weight:700;margin-bottom:14px}
.pw-modal .pw-wrap{max-width:100%;margin-bottom:6px}
.pw-modal .hint{font-size:11px;color:#888}
.pw-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pw-modal-actions button{padding:7px 16px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid #ddd;background:#fff;color:#555}
.pw-modal-actions .pw-ok{background:#1F4E78;color:white;border-color:#1F4E78}

/* 카테고리 관리 모달 */
.cat-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1002;align-items:center;justify-content:center;padding:20px}
.cat-modal-bg.active{display:flex}
.cat-modal{background:white;border-radius:8px;max-width:400px;width:100%;padding:24px}
.cat-modal h2{font-size:16px;font-weight:700;margin-bottom:14px}
.cat-list{margin-bottom:14px}
.cat-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.cat-item .cat-name{flex:1;font-size:14px}
.cat-item .cat-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:13px;padding:2px 6px}
.cat-item .cat-del:hover{color:#e55}
.cat-add-row{display:flex;gap:8px}
.cat-add-row input{flex:1;padding:7px 10px;font-size:13px;border:1px solid #ddd;border-radius:4px;font-family:inherit}
.cat-add-row input:focus{outline:none;border-color:#1F4E78}
.cat-add-row button{padding:7px 14px;background:#1F4E78;color:white;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.cat-modal-close{margin-top:14px;text-align:right}
.cat-modal-close button{padding:7px 16px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit}

@media(max-width:600px){
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{max-width:100%}
  .td-no,.td-views{display:none}
  .modal-inner{margin:20px auto}
  .w-media-bar{padding:6px 12px}
  .w-media-btn{padding:6px 8px}
  .w-format-bar{padding:4px 12px}
  .cm-form{flex-direction:column}.cm-form .cma{width:100%}
  .w-bot-row{flex-direction:column;align-items:stretch}
  .w-bot-label{width:auto}
  .w-bot-input,.pw-wrap{max-width:100%}
  .w-bot-hint{margin-left:0}
}
</style>
</head>
<body>
<a href="/" class="back-link">← 메인으로</a>
<div class="board-header">
  <h1>💬 커뮤니티 <button class="cat-mgr" id="btnCatMgr" title="카테고리 관리">⚙️ 카테고리</button></h1>
</div>
<div class="toolbar">
  <div class="filter-tabs" id="filterTabs">
    <button class="ftab active" data-filter="">전체</button>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="제목, 내용 검색">
    <button id="btnSearch">검색</button>
  </div>
</div>
<div class="list-header">
  <span class="list-cnt" id="cntInfo"></span>
  <button class="btn-write" id="btnWrite">글쓰기</button>
</div>
<div id="postArea"><div class="loading">불러오는 중...</div></div>
<div id="pager" class="pager" style="display:none"></div>

<!-- 글 상세 -->
<div class="modal-overlay" id="viewModal"><div class="modal-inner"><div class="v-box">
  <div class="v-header"><div class="v-category" id="vBadge"></div><div class="v-title" id="vTitle"></div>
    <div class="v-meta"><span class="v-author" id="vAuthor"></span><span style="color:#ddd">|</span><span id="vDate" style="color:#999"></span><span style="color:#ddd">|</span><span id="vViews" style="color:#999"></span></div>
  </div>
  <div class="v-body" id="vBody"></div>
  <div class="v-actions" id="vActions"></div>
  <div class="v-comments" id="vComments"></div>
</div></div></div>

<!-- 글쓰기 -->
<div class="modal-overlay" id="writeModal"><div class="modal-inner"><div class="w-box">
  <div class="w-topbar"><h2 id="wTitle">글쓰기</h2><button class="w-cancel" id="wCancel">취소</button><button class="w-submit" id="wSubmit">등록</button></div>
  <div class="w-selectors"><select id="fCategory"></select></div>
  <div class="w-title-row"><input type="text" id="fTitle" placeholder="제목을 입력해 주세요." maxlength="100"></div>
  <div class="w-media-bar">
    <button class="w-media-btn disabled" disabled><span class="ico">🖼️</span><span class="lbl">사진</span></button>
    <button class="w-media-btn disabled" disabled><span class="ico">🎬</span><span class="lbl">동영상</span></button>
    <button class="w-media-btn" id="tbHr"><span class="ico">—</span><span class="lbl">구분선</span></button>
    <button class="w-media-btn disabled" disabled><span class="ico">📎</span><span class="lbl">파일</span></button>
    <button class="w-media-btn" id="tbLink"><span class="ico">🔗</span><span class="lbl">링크</span></button>
    <button class="w-media-btn" id="tbImg"><span class="ico">🌐</span><span class="lbl">이미지URL</span></button>
  </div>
  <div class="w-format-bar">
    <button class="w-fmt disabled" disabled><b>B</b></button>
    <button class="w-fmt disabled" disabled><i>I</i></button>
    <button class="w-fmt disabled" disabled><u>U</u></button>
    <button class="w-fmt disabled" disabled><s>S</s></button>
    <div class="w-fmt-sep"></div>
    <button class="w-fmt disabled" disabled style="font-size:12px">☰</button>
    <span style="flex:1"></span>
    <span style="font-size:11px;color:#bbb">서식은 Phase 2</span>
  </div>
  <div class="w-content"><textarea id="fContent" placeholder="내용을 입력하세요."></textarea></div>
  <div class="w-pin-row" id="pinRow"><label><input type="checkbox" id="fPinned" style="width:15px;height:15px"> 📌 상단 고정</label></div>
  <div class="w-bottom">
    <div class="w-bot-row"><span class="w-bot-label">작성자</span><input class="w-bot-input" type="text" id="fAuthor" placeholder="이름 또는 닉네임" maxlength="20"></div>
    <div class="w-bot-row"><span class="w-bot-label" id="pwLabel">비밀번호</span><div class="pw-wrap"><input type="password" id="fPw" placeholder="4자 이상" maxlength="30"><button type="button" class="pw-eye" id="fPwToggle">👁</button></div></div>
    <div class="w-bot-hint" id="pwHint">이 비밀번호로 나중에 수정·삭제할 수 있어요.</div>
  </div>
</div></div></div>

<!-- 비밀번호 확인 -->
<div class="pw-modal-bg" id="pwModal"><div class="pw-modal">
  <h2 id="pwModalTitle">🔒 비밀번호 확인</h2>
  <div class="pw-wrap"><input type="password" id="pwInput" placeholder="비밀번호 입력" maxlength="30"><button type="button" class="pw-eye" id="pwToggle">👁</button></div>
  <div class="hint" id="pwModalHint"></div>
  <div class="pw-modal-actions"><button id="btnPwCancel">취소</button><button class="pw-ok" id="btnPwConfirm">확인</button></div>
</div></div>

<!-- 카테고리 관리 -->
<div class="cat-modal-bg" id="catModal"><div class="cat-modal">
  <h2>⚙️ 카테고리 관리</h2>
  <div class="cat-list" id="catList"><div class="loading">불러오는 중...</div></div>
  <div class="cat-add-row">
    <input type="text" id="catNewName" placeholder="새 카테고리명" maxlength="20">
    <button id="btnCatAdd">추가</button>
  </div>
  <div class="cat-modal-close"><button id="btnCatClose">닫기</button></div>
</div></div>

<script>
(function(){
'use strict';
var API='https://swingfarmer.duckdns.org/api';
var currentFilter='',currentPage=1,totalPages=1,searchQuery='',editingId=null;
var categories=[];
var $=function(id){return document.getElementById(id);};
var esc=function(s){return(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

function fmtDate(s){if(!s)return'';var d=new Date(s.replace(' ','T'));if(isNaN(d))return s;var p=function(n){return('0'+n).slice(-2);};return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+'. '+p(d.getHours())+':'+p(d.getMinutes());}
function fmtShort(s){if(!s)return'';var d=new Date(s.replace(' ','T'));if(isNaN(d))return s;var p=function(n){return('0'+n).slice(-2);};var now=new Date();if(d.toDateString()===now.toDateString())return p(d.getHours())+':'+p(d.getMinutes());if(d.getFullYear()===now.getFullYear())return p(d.getMonth()+1)+'.'+p(d.getDate())+'.';return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+'.';}
function isNew(s){if(!s)return false;return(Date.now()-new Date(s.replace(' ','T')).getTime())<86400000;}

function askPassword(title,hint){return new Promise(function(resolve){
  $('pwModalTitle').textContent=title||'🔒 비밀번호 확인';$('pwModalHint').textContent=hint||'';$('pwInput').value='';$('pwInput').type='password';$('pwModal').classList.add('active');setTimeout(function(){$('pwInput').focus();},50);
  function ok(){cleanup();resolve($('pwInput').value);}function cancel(){cleanup();resolve(null);}function onKey(e){if(e.key==='Enter')ok();if(e.key==='Escape')cancel();}
  function cleanup(){$('pwModal').classList.remove('active');$('btnPwConfirm').removeEventListener('click',ok);$('btnPwCancel').removeEventListener('click',cancel);$('pwInput').removeEventListener('keydown',onKey);}
  $('btnPwConfirm').addEventListener('click',ok);$('btnPwCancel').addEventListener('click',cancel);$('pwInput').addEventListener('keydown',onKey);
});}
$('pwToggle').addEventListener('click',function(){var i=$('pwInput');i.type=i.type==='password'?'text':'password';});
$('fPwToggle').addEventListener('click',function(){var i=$('fPw');i.type=i.type==='password'?'text':'password';});

// ── 카테고리 로드 ──
function loadCategories(){
  return fetch(API+'/categories').then(function(r){return r.json();}).then(function(data){
    categories=data;
    renderFilterTabs();
    renderCategorySelect();
    renderCatList();
  }).catch(function(){categories=[];renderFilterTabs();renderCategorySelect();});
}
function renderFilterTabs(){
  var h='<button class="ftab'+(currentFilter===''?' active':'')+'" data-filter="">전체</button>';
  categories.forEach(function(c){
    h+='<button class="ftab'+(currentFilter===String(c.id)?' active':'')+'" data-filter="'+c.id+'">'+esc(c.name)+'</button>';
  });
  $('filterTabs').innerHTML=h;
  $('filterTabs').querySelectorAll('.ftab').forEach(function(t){
    t.addEventListener('click',function(){
      $('filterTabs').querySelectorAll('.ftab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');currentFilter=t.dataset.filter;currentPage=1;loadPosts();
    });
  });
}
function renderCategorySelect(){
  var h='<option value="">카테고리 선택</option>';
  categories.forEach(function(c){h+='<option value="'+c.id+'">'+esc(c.name)+'</option>';});
  $('fCategory').innerHTML=h;
}
function catName(id){
  var c=categories.find(function(x){return String(x.id)===String(id);});
  return c?c.name:'';
}

// ── 카테고리 관리 ──
$('btnCatMgr').addEventListener('click',function(){$('catModal').classList.add('active');renderCatList();});
$('btnCatClose').addEventListener('click',function(){$('catModal').classList.remove('active');});
$('catModal').addEventListener('click',function(e){if(e.target===$('catModal'))$('catModal').classList.remove('active');});

function renderCatList(){
  if(!categories.length){$('catList').innerHTML='<div style="color:#999;font-size:13px;padding:8px 0">카테고리가 없습니다. 아래에서 추가하세요.</div>';return;}
  var h='';categories.forEach(function(c){
    h+='<div class="cat-item"><span class="cat-name">'+esc(c.name)+'</span><button class="cat-del" data-cid="'+c.id+'" title="삭제">✕</button></div>';
  });
  $('catList').innerHTML=h;
  $('catList').querySelectorAll('.cat-del').forEach(function(b){
    b.addEventListener('click',function(){deleteCat(parseInt(b.dataset.cid));});
  });
}

$('btnCatAdd').addEventListener('click',function(){
  var name=$('catNewName').value.trim();
  if(!name){alert('카테고리명을 입력하세요.');return;}
  askPassword('⚙️ 카테고리 추가','관리자 비밀번호를 입력하세요.').then(function(pw){
    if(pw===null)return;
    fetch(API+'/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,password:pw})})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});})
    .then(function(res){if(!res.ok){alert(res.data.error||'실패');return;} $('catNewName').value=''; loadCategories();})
    .catch(function(e){alert('오류: '+e.message);});
  });
});

function deleteCat(cid){
  if(!confirm('이 카테고리를 삭제할까요?'))return;
  askPassword('⚙️ 카테고리 삭제','관리자 비밀번호를 입력하세요.').then(function(pw){
    if(pw===null)return;
    fetch(API+'/categories/'+cid,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});})
    .then(function(res){if(!res.ok){alert(res.data.error||'실패');return;} loadCategories();})
    .catch(function(e){alert('오류: '+e.message);});
  });
}

// ── 글 목록 ──
function loadPosts(){
  var q='?page='+currentPage+'&per_page=20';
  if(currentFilter) q+='&category='+currentFilter;
  if(searchQuery) q+='&q='+encodeURIComponent(searchQuery);
  $('postArea').innerHTML='<div class="loading">불러오는 중...</div>';$('pager').style.display='none';$('cntInfo').textContent='';
  fetch(API+'/posts'+q).then(function(r){return r.json();}).then(function(d){
    totalPages=d.pages||1;$('cntInfo').textContent='총 '+(d.total||0)+'건';
    renderTable(d.data||[],d.total||0);renderPager();
  }).catch(function(e){$('postArea').innerHTML='<div class="empty">불러오기 실패: '+esc(e.message)+'</div>';});
}
$('btnSearch').addEventListener('click',function(){searchQuery=$('searchInput').value.trim();currentPage=1;loadPosts();});
$('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')$('btnSearch').click();});

function renderTable(posts,total){
  if(!posts.length){$('postArea').innerHTML='<div class="empty">글이 없습니다. 첫 글을 남겨보세요!</div>';return;}
  var h='<table class="post-table"><thead><tr><th>번호</th><th>분류</th><th class="th-title">제목</th><th>작성자</th><th>작성일</th><th>조회</th></tr></thead><tbody>';
  posts.forEach(function(p,i){
    var no=p.pinned?'<span class="pin-tag">📌</span>':(total-((currentPage-1)*20)-i);
    var cn=catName(p.category);
    var cm=p.comment_count?'<span class="t-comment">['+p.comment_count+']</span>':'';
    var nw=isNew(p.created_at)?'<span class="t-new">N</span>':'';
    h+='<tr data-id="'+p.id+'"><td class="td-no">'+no+'</td><td class="td-cat">'+(cn?'<span class="cat-tag">'+esc(cn)+'</span>':'')+'</td><td class="td-title-cell"><span class="t-text">'+esc(p.title)+'</span>'+cm+nw+'</td><td class="td-author">'+esc(p.author||'익명')+'</td><td class="td-date">'+fmtShort(p.created_at)+'</td><td class="td-views">'+(p.views||0)+'</td></tr>';
  });
  h+='</tbody></table>';$('postArea').innerHTML=h;
  $('postArea').querySelectorAll('tr[data-id]').forEach(function(tr){
    tr.querySelector('.td-title-cell').addEventListener('click',function(){openPost(parseInt(tr.dataset.id));});
  });
}
function renderPager(){
  if(totalPages<=1){$('pager').style.display='none';return;}
  $('pager').style.display='flex';
  var h='<button '+(currentPage<=1?'disabled':'')+' data-p="'+(currentPage-1)+'">◀</button>';
  var s=Math.max(1,currentPage-4),e=Math.min(totalPages,s+9);if(e-s<9)s=Math.max(1,e-9);
  for(var i=s;i<=e;i++) h+='<button data-p="'+i+'" class="'+(i===currentPage?'current':'')+'">'+i+'</button>';
  h+='<button '+(currentPage>=totalPages?'disabled':'')+' data-p="'+(currentPage+1)+'">▶</button>';
  $('pager').innerHTML=h;
}
$('pager').addEventListener('click',function(e){var b=e.target.closest('button[data-p]');if(!b||b.disabled)return;currentPage=parseInt(b.dataset.p);loadPosts();window.scrollTo({top:0,behavior:'smooth'});});

// ── 글 상세 ──
function openPost(id){
  fetch(API+'/posts/'+id).then(function(r){return r.json();}).then(function(p){if(p.error){alert(p.error);return;}renderView(p);$('viewModal').classList.add('active');document.body.style.overflow='hidden';}).catch(function(e){alert('오류: '+e.message);});
}
function closeView(){$('viewModal').classList.remove('active');document.body.style.overflow='';}
function renderView(p){
  var cn=catName(p.category);
  $('vBadge').innerHTML=(p.pinned?'<span class="pin-tag">📌 고정</span> ':'')+(cn?'<span class="cat-tag">'+esc(cn)+'</span>':'');
  $('vTitle').textContent=p.title;$('vAuthor').textContent=p.author||'익명';$('vDate').textContent=fmtDate(p.created_at);$('vViews').textContent='조회 '+(p.views||0);
  var body=esc(p.content);
  body=body.replace(/\[이미지:(https?:\/\/[^\]]+)\]/g,'<img src="$1" alt="이미지">');
  body=body.replace(/\[링크:(https?:\/\/[^\|]+)\|([^\]]+)\]/g,'<a href="$1" target="_blank" rel="noopener">$2 ↗</a>');
  body=body.replace(/────+/g,'<hr>');
  $('vBody').innerHTML=body.replace(/\n/g,'<br>');
  $('vActions').innerHTML='<button class="v-btn" data-act="edit" data-id="'+p.id+'">수정</button><button class="v-btn red" data-act="del" data-id="'+p.id+'">삭제</button><button class="v-btn v-close">닫기</button>';
  $('vActions').querySelector('.v-close').addEventListener('click',closeView);
  $('vActions').querySelector('[data-act="edit"]').addEventListener('click',function(){closeView();editPost(parseInt(this.dataset.id));});
  $('vActions').querySelector('[data-act="del"]').addEventListener('click',function(){deletePost(parseInt(this.dataset.id));});
  renderComments(p.id,p.comments||[]);
}
function renderComments(pid,comments){
  var h='<h3>댓글 '+comments.length+'</h3>';
  if(!comments.length)h+='<div class="cm-empty">댓글이 없습니다.</div>';
  else{h+='<div class="cm-list">';comments.forEach(function(c){var adm=c.is_admin;h+='<div class="cm-item '+(adm?'admin':'')+'"><div class="cm-head"><span class="cm-name">'+(adm?'🛡️ ':'')+esc(c.author||'익명')+'</span><span class="cm-time">'+fmtDate(c.created_at)+'</span><button class="cm-del" data-cid="'+c.id+'" data-pid="'+pid+'">삭제</button></div><div class="cm-body">'+esc(c.content)+'</div></div>';});h+='</div>';}
  h+='<div class="cm-form"><input class="cma" id="ca_'+pid+'" placeholder="이름" maxlength="20"><input class="cmt" id="ct_'+pid+'" placeholder="댓글을 입력하세요." maxlength="500"><button id="cmAdd_'+pid+'">등록</button></div>';
  $('vComments').innerHTML=h;
  $('cmAdd_'+pid).addEventListener('click',function(){addComment(pid);});
  $('ct_'+pid).addEventListener('keydown',function(e){if(e.key==='Enter')addComment(pid);});
  $('vComments').querySelectorAll('[data-cid]').forEach(function(b){b.addEventListener('click',function(){deleteComment(parseInt(b.dataset.cid),parseInt(b.dataset.pid));});});
}
function addComment(pid){
  var author=($('ca_'+pid).value||'').trim()||'익명',text=($('ct_'+pid).value||'').trim();
  if(!text){alert('댓글 내용을 입력하세요.');return;}
  var body={author:author,content:text},adminNames=['운영자','관리자','admin'];
  function doPost(pw){if(pw!==undefined)body.password=pw;fetch(API+'/posts/'+pid+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});}).then(function(res){if(!res.ok){alert(res.data.error||'실패');return;}openPost(pid);}).catch(function(e){alert('오류: '+e.message);});}
  if(adminNames.indexOf(author)>=0){askPassword('🛡️ 관리자 댓글','관리자 비밀번호를 입력하세요.').then(function(pw){if(pw===null)return;doPost(pw);});}else doPost();
}
function deleteComment(cid,pid){askPassword('🔒 댓글 삭제','관리자 비밀번호를 입력하세요.').then(function(pw){if(pw===null)return;fetch(API+'/comments/'+cid,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});}).then(function(res){if(!res.ok){alert(res.data.error||'실패');return;}openPost(pid);}).catch(function(e){alert('오류: '+e.message);});});}
$('viewModal').addEventListener('click',function(e){if(e.target===$('viewModal'))closeView();});

// ── 글쓰기 ──
function openWrite(){
  editingId=null;$('wTitle').textContent='글쓰기';
  $('fCategory').value='';$('fTitle').value='';$('fAuthor').value='';$('fContent').value='';$('fPw').value='';$('fPinned').checked=false;
  $('pinRow').style.display='none';
  $('writeModal').classList.add('active');document.body.style.overflow='hidden';
  setTimeout(function(){$('fTitle').focus();},100);
}
$('btnWrite').addEventListener('click',openWrite);
function closeWrite(){$('writeModal').classList.remove('active');document.body.style.overflow='';}
$('wCancel').addEventListener('click',closeWrite);
$('writeModal').addEventListener('click',function(e){if(e.target===$('writeModal'))closeWrite();});

function insertAt(ta,txt){var s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;ta.value=v.substring(0,s)+txt+v.substring(e);ta.selectionStart=ta.selectionEnd=s+txt.length;ta.focus();}
$('tbHr').addEventListener('click',function(){insertAt($('fContent'),'\n────────────────────\n');});
$('tbImg').addEventListener('click',function(){var u=prompt('이미지 URL (https://...)');if(u&&u.trim())insertAt($('fContent'),'[이미지:'+u.trim()+']');});
$('tbLink').addEventListener('click',function(){var u=prompt('링크 URL');if(!u||!u.trim())return;var l=prompt('표시할 텍스트',u.trim());insertAt($('fContent'),'[링크:'+u.trim()+'|'+(l||u.trim())+']');});

$('wSubmit').addEventListener('click',function(){
  var category=$('fCategory').value,title=$('fTitle').value.trim(),author=$('fAuthor').value.trim()||'익명',content=$('fContent').value.trim(),pw=$('fPw').value,pinned=$('fPinned').checked;
  if(!title){alert('제목을 입력하세요.');return;}
  if(!content){alert('내용을 입력하세요.');return;}
  if(!editingId&&pw.length<4){alert('비밀번호를 4자 이상 입력하세요.');return;}
  $('wSubmit').disabled=true;$('wSubmit').textContent='저장 중...';
  var body={category:category,title:title,author:author,content:content,password:pw,pinned:pinned};
  fetch(API+'/posts'+(editingId?'/'+editingId:''),{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});})
  .then(function(res){if(!res.ok){alert(res.data.error||'저장 실패');return;}closeWrite();loadPosts();})
  .catch(function(e){alert('오류: '+e.message);})
  .finally(function(){$('wSubmit').disabled=false;$('wSubmit').textContent='등록';});
});

function editPost(id){askPassword('🔒 수정','본인 또는 관리자 비밀번호를 입력하세요.').then(function(pw){if(pw===null)return;fetch(API+'/posts/'+id).then(function(r){return r.json();}).then(function(p){if(p.error){alert(p.error);return;}editingId=id;$('wTitle').textContent='글 수정';$('fCategory').value=p.category||'';$('fTitle').value=p.title||'';$('fAuthor').value=p.author||'';$('fContent').value=p.content||'';$('fPw').value=pw;$('fPinned').checked=!!p.pinned;$('pinRow').style.display='flex';$('writeModal').classList.add('active');document.body.style.overflow='hidden';}).catch(function(e){alert('오류: '+e.message);});});}

function deletePost(id){askPassword('🔒 삭제','본인 또는 관리자 비밀번호를 입력하세요.').then(function(pw){if(pw===null)return;if(!confirm('정말 삭제할까요?'))return;fetch(API+'/posts/'+id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});}).then(function(res){if(!res.ok){alert(res.data.error||'실패');return;}closeView();loadPosts();}).catch(function(e){alert('오류: '+e.message);});});}

// ── 초기화 ──
loadCategories().then(function(){loadPosts();});
})();
</script>
