<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>커뮤니티 | 스윙파머</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f7fa;color:#1a1a1a}
.back-link{display:inline-block;margin-bottom:16px;color:#1F4E78;text-decoration:none;font-size:14px}
.back-link:hover{text-decoration:underline}
h1{color:#1F4E78;border-bottom:3px solid #1F4E78;padding-bottom:10px;margin-bottom:6px;font-size:22px}
.desc{color:#555;font-size:13.5px;margin-bottom:18px}
.btn{padding:9px 16px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .1s}
.btn-primary{background:#1F4E78;color:white}.btn-primary:hover{background:#2d6ba3}
.btn-gray{background:#9ca3af;color:white}.btn-gray:hover{background:#6b7280}
.btn-red{background:#dc2626;color:white}.btn-red:hover{background:#b91c1c}
.btn-sm{padding:5px 11px;font-size:12px}

/* 툴바 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-tabs{display:flex;gap:4px;background:#e5e7eb;padding:4px;border-radius:8px}
.ftab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:#666;border-radius:6px;font-family:inherit}
.ftab.active{background:white;color:#1F4E78;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search-box{display:flex;gap:6px;flex:1;min-width:160px}
.search-box input{flex:1;padding:8px 10px;font-size:13px;border:1px solid #ccc;border-radius:6px;font-family:inherit}
.search-box input:focus{outline:2px solid #1F4E78}

/* 글 목록 (테이블형) */
.post-table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.post-table th{background:#1F4E78;color:white;padding:10px 12px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap}
.post-table th.center{text-align:center}
.post-table td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle}
.post-table tr:hover td{background:#f0f5fa}
.post-table tr.notice-row td{background:#fffbfb}
.post-table tr.pinned-row td{background:#fffbeb}
.post-table .td-no{text-align:center;color:#aaa;font-size:12px;width:50px}
.post-table .td-badge{text-align:center;width:70px}
.post-table .td-title{cursor:pointer}
.post-table .td-title:hover .title-text{color:#1F4E78;text-decoration:underline}
.title-text{font-weight:600;color:#1a1a1a}
.title-comment{color:#dc2626;font-size:12px;font-weight:700;margin-left:4px}
.title-new{display:inline-block;background:#dc2626;color:white;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:middle}
.td-author{color:#555;white-space:nowrap;width:80px}
.td-date{color:#999;white-space:nowrap;width:90px;font-size:12px}
.td-views{color:#999;text-align:center;width:50px;font-size:12px}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap}
.badge.notice{background:#fee2e2;color:#b91c1c}
.badge.question{background:#dbeafe;color:#1e40af}
.badge.pin{background:#fed7aa;color:#9a3412}

/* 글 상세 (모달형 — 카페 스타일) */
.view-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.view-bg.active{display:flex}
.view-box{background:white;border-radius:12px;max-width:720px;width:100%;padding:0;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.view-header{padding:20px 24px 16px;border-bottom:1px solid #eee}
.view-header .view-badge{margin-bottom:8px}
.view-title{font-size:20px;font-weight:800;color:#1a1a1a;line-height:1.4;margin-bottom:10px}
.view-meta{display:flex;gap:14px;font-size:13px;color:#888;flex-wrap:wrap}
.view-body{padding:24px;font-size:15px;line-height:1.8;color:#333;white-space:pre-wrap;word-break:break-word;min-height:120px;border-bottom:1px solid #eee}
.view-actions{padding:12px 24px;display:flex;gap:8px;border-bottom:1px solid #eee}
.view-comments{padding:20px 24px}
.view-comments h3{font-size:14px;font-weight:700;color:#1F4E78;margin-bottom:12px}
.comment-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.comment{padding:12px 14px;border-radius:8px;background:#f8fafc}
.comment.admin{background:#eff6ff;border-left:3px solid #2563eb}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment-name{font-weight:700;font-size:13px;color:#1F4E78}
.comment.admin .comment-name{color:#1e40af}
.comment-date{font-size:11px;color:#aaa;margin-right:auto}
.comment-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:12px;padding:0 4px}
.comment-del:hover{color:#dc2626}
.comment-body{font-size:13.5px;color:#333;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.comment-form{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.comment-form input{padding:8px 10px;font-size:13px;border:1px solid #ddd;border-radius:6px;background:#FFF2CC;font-family:inherit}
.comment-form input:focus{outline:2px solid #1F4E78;background:#FFFACD}
.cm-author{width:100px}
.cm-text{flex:1;min-width:160px}
.comment-empty{font-size:13px;color:#aaa;padding:8px 0 14px}

/* 글쓰기 모달 (카페 스타일) */
.write-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1001;align-items:flex-start;justify-content:center;padding:30px 20px;overflow-y:auto}
.write-bg.active{display:flex}
.write-box{background:white;border-radius:12px;max-width:680px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.write-header{padding:18px 24px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
.write-header h2{font-size:18px;color:#1F4E78}
.write-close{background:none;border:none;font-size:22px;cursor:pointer;color:#999;padding:4px 8px}
.write-close:hover{color:#333}
.write-body{padding:20px 24px}
.w-row{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.w-row label{font-size:13px;font-weight:600;color:#444;width:60px;flex:none;text-align:right}
.w-row input,.w-row select{flex:1;padding:9px 10px;font-size:14px;border:1px solid #ddd;border-radius:6px;font-family:inherit}
.w-row input{background:#FFF2CC}
.w-row input:focus,.w-row select:focus{outline:2px solid #1F4E78;background:#FFFACD}
/* 에디터 영역 */
.editor-wrap{border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:12px}
.editor-toolbar{display:flex;gap:2px;padding:6px 8px;background:#f5f5f5;border-bottom:1px solid #ddd;flex-wrap:wrap}
.editor-toolbar button{background:none;border:1px solid transparent;border-radius:4px;padding:5px 8px;cursor:pointer;font-size:14px;color:#555;font-family:inherit}
.editor-toolbar button:hover{background:#e5e7eb;border-color:#ccc}
.editor-toolbar button.disabled{opacity:.35;cursor:not-allowed}
.editor-toolbar button.disabled:hover{background:none;border-color:transparent}
.editor-textarea{width:100%;min-height:240px;border:none;padding:14px 16px;font-size:14.5px;line-height:1.7;resize:vertical;font-family:inherit;background:white}
.editor-textarea:focus{outline:none;background:#fffff8}
.editor-textarea::placeholder{color:#bbb}
/* 비번 영역 */
.pw-section{margin-bottom:12px}
.pw-row{display:flex;gap:10px;align-items:center}
.pw-row label{font-size:13px;font-weight:600;color:#444;width:60px;flex:none;text-align:right}
.pw-input-wrap{flex:1;position:relative}
.pw-input-wrap input{width:100%;padding:9px 40px 9px 10px;font-size:14px;border:1px solid #ddd;border-radius:6px;background:#FFF2CC;font-family:inherit}
.pw-input-wrap input:focus{outline:2px solid #1F4E78;background:#FFFACD}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:2px}
.pw-hint{font-size:11px;color:#888;margin-top:4px;padding-left:70px}
.pin-check{padding-left:70px;margin-bottom:12px;display:none}
.pin-check label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.write-footer{padding:14px 24px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}

/* 비밀번호 확인 모달 */
.pw-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1002;align-items:center;justify-content:center;padding:20px}
.pw-modal-bg.active{display:flex}
.pw-modal{background:white;border-radius:12px;max-width:380px;width:100%;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.pw-modal h2{color:#1F4E78;font-size:18px;margin-bottom:16px}
.pw-modal .pw-input-wrap{margin-bottom:6px}
.pw-modal .hint{font-size:11px;color:#888}
.pw-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* 페이저 */
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.pager button{padding:6px 14px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer;font-size:13px;font-family:inherit}
.pager button:disabled{opacity:.4;cursor:default}
.pager span{font-size:13px;color:#666}

.empty{text-align:center;color:#999;padding:50px 20px;background:white;border-radius:10px}
.loading{text-align:center;color:#888;padding:40px}
.cnt{font-size:12px;color:#888;margin-bottom:8px}

@media(max-width:600px){
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{width:100%}
  .w-row{flex-direction:column;align-items:stretch}
  .w-row label{text-align:left;width:auto}
  .pw-row{flex-direction:column;align-items:stretch}
  .pw-row label{text-align:left;width:auto}
  .pw-hint{padding-left:0}
  .pin-check{padding-left:0}
  .post-table .td-no{display:none}
  .comment-form{flex-direction:column}
  .cm-author{width:100%}
}
</style>
</head>
<body>

<a href="/" class="back-link">← 메인으로</a>
<h1>💬 커뮤니티</h1>
<p class="desc">공지사항 확인, 문의, 자료 공유를 할 수 있는 공간입니다.</p>

<div class="toolbar">
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all">전체</button>
    <button class="ftab" data-filter="notice">📢 공지</button>
    <button class="ftab" data-filter="question">💬 문의</button>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="제목·내용 검색">
    <button class="btn btn-primary btn-sm" id="btnSearch">🔍</button>
  </div>
  <button class="btn btn-primary" id="btnWrite">✏️ 글쓰기</button>
</div>

<div id="cntInfo" class="cnt"></div>
<div id="postArea">
  <div class="loading">불러오는 중...</div>
</div>
<div id="pager" class="pager" style="display:none"></div>

<!-- ═══ 글 상세 보기 모달 ═══ -->
<div class="view-bg" id="viewModal">
  <div class="view-box">
    <div class="view-header">
      <div class="view-badge" id="viewBadge"></div>
      <div class="view-title" id="viewTitle"></div>
      <div class="view-meta" id="viewMeta"></div>
    </div>
    <div class="view-body" id="viewBody"></div>
    <div class="view-actions" id="viewActions"></div>
    <div class="view-comments" id="viewComments"></div>
  </div>
</div>

<!-- ═══ 글쓰기/수정 모달 ═══ -->
<div class="write-bg" id="writeModal">
  <div class="write-box">
    <div class="write-header">
      <h2 id="writeTitle">✏️ 글쓰기</h2>
      <button class="write-close" id="writeClose">✕</button>
    </div>
    <div class="write-body">
      <div class="w-row">
        <label>종류</label>
        <select id="fType">
          <option value="question" selected>💬 문의</option>
          <option value="notice">📢 공지 (운영자)</option>
        </select>
      </div>
      <div class="w-row">
        <label>제목</label>
        <input type="text" id="fTitle" placeholder="제목을 입력하세요" maxlength="100">
      </div>
      <div class="w-row">
        <label>작성자</label>
        <input type="text" id="fAuthor" placeholder="이름 또는 닉네임" maxlength="20">
      </div>
      <div class="editor-wrap">
        <div class="editor-toolbar">
          <button title="굵게 (준비중)" class="disabled" disabled>B</button>
          <button title="기울임 (준비중)" class="disabled" disabled><i>I</i></button>
          <button title="취소선 (준비중)" class="disabled" disabled><s>S</s></button>
          <button title="구분선 삽입" id="tbHr">―</button>
          <button title="이미지 URL 삽입" id="tbImg">🖼️ 이미지</button>
          <button title="링크 삽입" id="tbLink">🔗 링크</button>
          <button title="파일 첨부 (준비중)" class="disabled" disabled>📎 첨부</button>
        </div>
        <textarea class="editor-textarea" id="fContent" placeholder="내용을 입력하세요.&#10;&#10;이미지는 툴바의 🖼️ 버튼으로 URL을 삽입할 수 있습니다."></textarea>
      </div>
      <div class="pw-section" id="pwSection">
        <div class="pw-row">
          <label id="pwLabel">비밀번호</label>
          <div class="pw-input-wrap">
            <input type="password" id="fPw" placeholder="4자 이상" maxlength="30">
            <button type="button" class="pw-toggle" id="fPwToggle">👁</button>
          </div>
        </div>
        <div class="pw-hint" id="pwHint">문의 글은 이 비밀번호로 나중에 수정·삭제할 수 있어요.</div>
      </div>
      <div class="pin-check" id="pinCheck">
        <label><input type="checkbox" id="fPinned" style="width:16px;height:16px"> 📌 상단 고정</label>
      </div>
    </div>
    <div class="write-footer">
      <button class="btn btn-gray" id="btnCancel">취소</button>
      <button class="btn btn-primary" id="btnSubmit">등록</button>
    </div>
  </div>
</div>

<!-- ═══ 비밀번호 확인 모달 ═══ -->
<div class="pw-modal-bg" id="pwModal">
  <div class="pw-modal">
    <h2 id="pwModalTitle">🔒 비밀번호 확인</h2>
    <div class="pw-input-wrap">
      <input type="password" id="pwInput" placeholder="비밀번호 입력" maxlength="30">
      <button type="button" class="pw-toggle" id="pwToggle">👁</button>
    </div>
    <div class="hint" id="pwModalHint"></div>
    <div class="pw-modal-actions">
      <button class="btn btn-gray" id="btnPwCancel">취소</button>
      <button class="btn btn-primary" id="btnPwConfirm">확인</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var API = 'https://swingfarmer.duckdns.org/api';
var currentFilter = 'all';
var currentPage = 1;
var totalPages = 1;
var searchQuery = '';
var editingId = null;

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

function fmtDate(s){
  if(!s) return '';
  var d = new Date(s.replace(' ','T'));
  if(isNaN(d)) return s;
  var p = function(n){ return ('0'+n).slice(-2); };
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function fmtDateShort(s){
  if(!s) return '';
  var d = new Date(s.replace(' ','T'));
  if(isNaN(d)) return s;
  var p = function(n){ return ('0'+n).slice(-2); };
  var now = new Date();
  if(d.toDateString() === now.toDateString()) return p(d.getHours())+':'+p(d.getMinutes());
  return p(d.getMonth()+1)+'.'+p(d.getDate());
}
function isNew(s){
  if(!s) return false;
  var d = new Date(s.replace(' ','T'));
  return (Date.now() - d.getTime()) < 86400000; // 24h
}

// 비밀번호 입력 모달
function askPassword(title, hint){
  return new Promise(function(resolve){
    $('pwModalTitle').textContent = title || '🔒 비밀번호 확인';
    $('pwModalHint').textContent = hint || '';
    $('pwInput').value = '';
    $('pwInput').type = 'password';
    $('pwModal').classList.add('active');
    setTimeout(function(){ $('pwInput').focus(); }, 50);
    function ok(){ cleanup(); resolve($('pwInput').value); }
    function cancel(){ cleanup(); resolve(null); }
    function onKey(e){ if(e.key==='Enter') ok(); if(e.key==='Escape') cancel(); }
    function cleanup(){
      $('pwModal').classList.remove('active');
      $('btnPwConfirm').removeEventListener('click', ok);
      $('btnPwCancel').removeEventListener('click', cancel);
      $('pwInput').removeEventListener('keydown', onKey);
    }
    $('btnPwConfirm').addEventListener('click', ok);
    $('btnPwCancel').addEventListener('click', cancel);
    $('pwInput').addEventListener('keydown', onKey);
  });
}
$('pwToggle').addEventListener('click', function(){ var i=$('pwInput'); i.type = i.type==='password'?'text':'password'; });
$('fPwToggle').addEventListener('click', function(){ var i=$('fPw'); i.type = i.type==='password'?'text':'password'; });

// ── 필터 ──
document.querySelectorAll('.ftab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.ftab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    currentFilter = t.dataset.filter;
    currentPage = 1;
    loadPosts();
  });
});

// ── 검색 ──
$('btnSearch').addEventListener('click', function(){
  searchQuery = $('searchInput').value.trim();
  currentPage = 1;
  loadPosts();
});
$('searchInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') $('btnSearch').click();
});

// ══════════════════════════════════
//  글 목록
// ══════════════════════════════════
function loadPosts(){
  var q = '?page='+currentPage+'&per_page=20';
  if(currentFilter !== 'all') q += '&type='+currentFilter;
  if(searchQuery) q += '&q='+encodeURIComponent(searchQuery);

  $('postArea').innerHTML = '<div class="loading">불러오는 중...</div>';
  $('pager').style.display = 'none';
  $('cntInfo').textContent = '';

  fetch(API+'/posts'+q)
    .then(function(r){ return r.json(); })
    .then(function(d){
      totalPages = d.pages || 1;
      $('cntInfo').textContent = '총 '+(d.total||0)+'건';
      renderTable(d.data || [], d.total);
      renderPager();
    })
    .catch(function(e){
      $('postArea').innerHTML = '<div class="empty">불러오기 실패: '+esc(e.message)+'</div>';
    });
}

function renderTable(posts, total){
  if(posts.length === 0){
    $('postArea').innerHTML = '<div class="empty">글이 없습니다. 첫 글을 남겨보세요!</div>';
    return;
  }
  var html = '<table class="post-table"><thead><tr>' +
    '<th class="center">번호</th><th class="center">분류</th><th>제목</th><th>작성자</th><th>날짜</th><th class="center">조회</th>' +
    '</tr></thead><tbody>';

  posts.forEach(function(p, idx){
    var cls = '';
    if(p.post_type==='notice') cls = 'notice-row';
    if(p.pinned) cls += ' pinned-row';
    var no = p.pinned ? '<span class="badge pin">📌</span>' : (total - ((currentPage-1)*20) - idx);
    var badgeCls = p.post_type==='notice' ? 'notice' : 'question';
    var badgeText = p.post_type==='notice' ? '공지' : '문의';
    var cmCnt = p.comment_count ? '<span class="title-comment">['+p.comment_count+']</span>' : '';
    var newTag = isNew(p.created_at) ? '<span class="title-new">N</span>' : '';

    html += '<tr class="'+cls+'" data-id="'+p.id+'">' +
      '<td class="td-no">'+no+'</td>' +
      '<td class="td-badge"><span class="badge '+badgeCls+'">'+badgeText+'</span></td>' +
      '<td class="td-title"><span class="title-text">'+esc(p.title)+'</span>'+cmCnt+newTag+'</td>' +
      '<td class="td-author">'+esc(p.author||'익명')+'</td>' +
      '<td class="td-date">'+fmtDateShort(p.created_at)+'</td>' +
      '<td class="td-views">'+(p.views||0)+'</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  $('postArea').innerHTML = html;

  // 행 클릭
  $('postArea').querySelectorAll('tr[data-id]').forEach(function(tr){
    tr.querySelector('.td-title').addEventListener('click', function(){
      openPost(parseInt(tr.dataset.id));
    });
  });
}

function renderPager(){
  if(totalPages <= 1){ $('pager').style.display = 'none'; return; }
  $('pager').style.display = 'flex';
  $('pager').innerHTML =
    '<button '+(currentPage<=1?'disabled':'')+' data-page="'+(currentPage-1)+'">◀ 이전</button>' +
    '<span>'+currentPage+' / '+totalPages+'</span>' +
    '<button '+(currentPage>=totalPages?'disabled':'')+' data-page="'+(currentPage+1)+'">다음 ▶</button>';
}
$('pager').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-page]');
  if(!btn || btn.disabled) return;
  currentPage = parseInt(btn.dataset.page);
  loadPosts();
  window.scrollTo({top:0, behavior:'smooth'});
});

// ══════════════════════════════════
//  글 상세 보기
// ══════════════════════════════════
function openPost(id){
  fetch(API+'/posts/'+id)
    .then(function(r){ return r.json(); })
    .then(function(p){
      if(p.error){ alert(p.error); return; }
      renderView(p);
      $('viewModal').classList.add('active');
    })
    .catch(function(e){ alert('오류: '+e.message); });
}

function renderView(p){
  var badgeCls = p.post_type==='notice' ? 'notice' : 'question';
  var badgeText = p.post_type==='notice' ? '📢 공지' : '💬 문의';
  $('viewBadge').innerHTML = (p.pinned?'<span class="badge pin">📌 고정</span> ':'') + '<span class="badge '+badgeCls+'">'+badgeText+'</span>';
  $('viewTitle').textContent = p.title;
  $('viewMeta').innerHTML = '<span>👤 '+esc(p.author||'익명')+'</span><span>🕒 '+fmtDate(p.created_at)+'</span><span>👁 '+(p.views||0)+'</span>';

  // 본문: 이미지 URL을 img 태그로 변환
  var body = esc(p.content);
  body = body.replace(/\[이미지:(https?:\/\/[^\]]+)\]/g, '<img src="$1" style="max-width:100%;border-radius:8px;margin:8px 0;display:block" alt="이미지">');
  body = body.replace(/\[링크:(https?:\/\/[^\|]+)\|([^\]]+)\]/g, '<a href="$1" target="_blank" rel="noopener" style="color:#1F4E78;font-weight:600">$2 ↗</a>');
  $('viewBody').innerHTML = body.replace(/\n/g,'<br>');

  $('viewActions').innerHTML =
    '<button class="btn btn-gray btn-sm" id="vaEdit" data-id="'+p.id+'">수정</button>' +
    '<button class="btn btn-red btn-sm" id="vaDelete" data-id="'+p.id+'">삭제</button>' +
    '<button class="btn btn-gray btn-sm" style="margin-left:auto" id="vaClose">닫기</button>';

  $('vaClose').addEventListener('click', function(){ $('viewModal').classList.remove('active'); });
  $('vaEdit').addEventListener('click', function(){ $('viewModal').classList.remove('active'); editPost(parseInt(this.dataset.id)); });
  $('vaDelete').addEventListener('click', function(){ deletePost(parseInt(this.dataset.id)); });

  renderComments(p.id, p.comments || []);
}

function renderComments(postId, comments){
  var html = '<h3>댓글 '+comments.length+'개</h3>';
  if(comments.length === 0){
    html += '<div class="comment-empty">아직 댓글이 없어요.</div>';
  } else {
    html += '<div class="comment-list">';
    comments.forEach(function(c){
      var isAdmin = c.is_admin;
      html += '<div class="comment '+(isAdmin?'admin':'')+'">' +
        '<div class="comment-head">' +
          '<span class="comment-name">'+(isAdmin?'🛡️ ':'')+esc(c.author||'익명')+'</span>' +
          '<span class="comment-date">'+fmtDate(c.created_at)+'</span>' +
          '<button class="comment-del" data-cm-id="'+c.id+'" data-post-id="'+postId+'" title="삭제">✕</button>' +
        '</div>' +
        '<div class="comment-body">'+esc(c.content)+'</div>' +
      '</div>';
    });
    html += '</div>';
  }
  html += '<div class="comment-form">' +
    '<input type="text" class="cm-author" id="ca_'+postId+'" placeholder="이름" maxlength="20">' +
    '<input type="text" class="cm-text" id="ct_'+postId+'" placeholder="댓글 달기..." maxlength="500">' +
    '<button class="btn btn-primary btn-sm" id="cmAdd_'+postId+'">등록</button>' +
  '</div>';
  $('viewComments').innerHTML = html;

  // 댓글 등록
  $('cmAdd_'+postId).addEventListener('click', function(){ addComment(postId); });
  $('ct_'+postId).addEventListener('keydown', function(e){ if(e.key==='Enter') addComment(postId); });

  // 댓글 삭제
  $('viewComments').querySelectorAll('[data-cm-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      deleteComment(parseInt(btn.dataset.cmId), parseInt(btn.dataset.postId));
    });
  });
}

function addComment(postId){
  var author = ($('ca_'+postId).value || '').trim() || '익명';
  var text = ($('ct_'+postId).value || '').trim();
  if(!text){ alert('댓글 내용을 입력하세요.'); return; }

  var adminNames = ['운영자','관리자','admin'];
  var body = { author: author, content: text };

  function doPost(pw){
    if(pw !== undefined) body.password = pw;
    fetch(API+'/posts/'+postId+'/comments', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
    .then(function(res){
      if(!res.ok){ alert(res.data.error || '등록 실패'); return; }
      openPost(postId); // 새로고침
    })
    .catch(function(e){ alert('오류: '+e.message); });
  }

  if(adminNames.indexOf(author) >= 0){
    askPassword('🛡️ 관리자 댓글', '관리자 이름으로 댓글을 달려면 비밀번호를 입력하세요.').then(function(pw){
      if(pw === null) return;
      doPost(pw);
    });
  } else {
    doPost();
  }
}

function deleteComment(commentId, postId){
  askPassword('🔒 댓글 삭제', '관리자 비밀번호를 입력하세요.').then(function(pw){
    if(pw === null) return;
    fetch(API+'/comments/'+commentId, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
    .then(function(res){
      if(!res.ok){ alert(res.data.error || '삭제 실패'); return; }
      openPost(postId);
    })
    .catch(function(e){ alert('오류: '+e.message); });
  });
}

// 뷰 모달 바깥 클릭 닫기
$('viewModal').addEventListener('click', function(e){
  if(e.target === $('viewModal')) $('viewModal').classList.remove('active');
});

// ══════════════════════════════════
//  글쓰기 / 수정
// ══════════════════════════════════
function openWrite(){
  editingId = null;
  $('writeTitle').textContent = '✏️ 글쓰기';
  $('fType').value = 'question';
  $('fTitle').value = ''; $('fAuthor').value = ''; $('fContent').value = ''; $('fPw').value = '';
  $('fPinned').checked = false;
  $('pwSection').style.display = 'block';
  updateTypeUI();
  $('writeModal').classList.add('active');
  setTimeout(function(){ $('fTitle').focus(); }, 100);
}
$('btnWrite').addEventListener('click', openWrite);
$('writeClose').addEventListener('click', function(){ $('writeModal').classList.remove('active'); });
$('btnCancel').addEventListener('click', function(){ $('writeModal').classList.remove('active'); });
$('writeModal').addEventListener('click', function(e){ if(e.target === $('writeModal')) $('writeModal').classList.remove('active'); });

function updateTypeUI(){
  var isNotice = $('fType').value === 'notice';
  $('pinCheck').style.display = isNotice ? 'block' : 'none';
  if(isNotice){
    $('pwLabel').textContent = '관리자PW';
    $('pwHint').textContent = '공지 작성에는 관리자 비밀번호가 필요합니다.';
    if(!editingId && (!$('fAuthor').value.trim() || $('fAuthor').value.trim()==='익명'))
      $('fAuthor').value = '운영자';
  } else {
    $('pwLabel').textContent = '비밀번호';
    $('pwHint').textContent = '문의 글은 이 비밀번호로 나중에 수정·삭제할 수 있어요.';
    if(!editingId && $('fAuthor').value.trim()==='운영자')
      $('fAuthor').value = '';
  }
}
$('fType').addEventListener('change', updateTypeUI);

// 에디터 툴바
$('tbHr').addEventListener('click', function(){
  insertAtCursor($('fContent'), '\n────────────────\n');
});
$('tbImg').addEventListener('click', function(){
  var url = prompt('이미지 URL을 입력하세요 (https://...)');
  if(url && url.trim()) insertAtCursor($('fContent'), '[이미지:'+url.trim()+']');
});
$('tbLink').addEventListener('click', function(){
  var url = prompt('링크 URL을 입력하세요');
  if(!url || !url.trim()) return;
  var label = prompt('표시할 텍스트', url.trim());
  insertAtCursor($('fContent'), '[링크:'+url.trim()+'|'+(label||url.trim())+']');
});
function insertAtCursor(textarea, text){
  var s = textarea.selectionStart, e = textarea.selectionEnd;
  var v = textarea.value;
  textarea.value = v.substring(0,s) + text + v.substring(e);
  textarea.selectionStart = textarea.selectionEnd = s + text.length;
  textarea.focus();
}

// 등록/수정
$('btnSubmit').addEventListener('click', function(){
  var type = $('fType').value;
  var title = $('fTitle').value.trim();
  var author = $('fAuthor').value.trim() || '익명';
  var content = $('fContent').value.trim();
  var pw = $('fPw').value;
  var pinned = $('fPinned').checked;

  if(!title){ alert('제목을 입력하세요.'); return; }
  if(!content){ alert('내용을 입력하세요.'); return; }
  if(!editingId && type !== 'notice' && pw.length < 4){ alert('비밀번호를 4자 이상 입력하세요.'); return; }
  if(!editingId && type === 'notice' && !pw){ alert('관리자 비밀번호를 입력하세요.'); return; }

  $('btnSubmit').disabled = true;
  $('btnSubmit').textContent = '저장 중...';

  var body = { type:type, title:title, author:author, content:content, password:pw, pinned:pinned };
  var url = API + '/posts' + (editingId ? '/'+editingId : '');
  var method = editingId ? 'PUT' : 'POST';

  fetch(url, { method:method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
  .then(function(res){
    if(!res.ok){ alert(res.data.error || '저장 실패'); return; }
    $('writeModal').classList.remove('active');
    loadPosts();
  })
  .catch(function(e){ alert('오류: '+e.message); })
  .finally(function(){
    $('btnSubmit').disabled = false;
    $('btnSubmit').textContent = '등록';
  });
});

function editPost(id){
  askPassword('🔒 수정 비밀번호', '본인 비밀번호 또는 관리자 비밀번호를 입력하세요.').then(function(pw){
    if(pw === null) return;
    fetch(API+'/posts/'+id)
      .then(function(r){ return r.json(); })
      .then(function(p){
        if(p.error){ alert(p.error); return; }
        editingId = id;
        $('writeTitle').textContent = '✏️ 글 수정';
        $('fType').value = p.post_type || 'question';
        $('fTitle').value = p.title || '';
        $('fAuthor').value = p.author || '';
        $('fContent').value = p.content || '';
        $('fPw').value = pw;
        $('fPinned').checked = !!p.pinned;
        $('pwSection').style.display = 'block';
        updateTypeUI();
        $('writeModal').classList.add('active');
      })
      .catch(function(e){ alert('오류: '+e.message); });
  });
}

function deletePost(id){
  askPassword('🔒 삭제 비밀번호', '본인 비밀번호 또는 관리자 비밀번호를 입력하세요.').then(function(pw){
    if(pw === null) return;
    if(!confirm('정말 삭제할까요? (되돌릴 수 없습니다)')) return;
    fetch(API+'/posts/'+id, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
    .then(function(res){
      if(!res.ok){ alert(res.data.error || '삭제 실패'); return; }
      $('viewModal').classList.remove('active');
      loadPosts();
    })
    .catch(function(e){ alert('오류: '+e.message); });
  });
}

// ── 초기 로드 ──
loadPosts();

})();
</script>
