<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>실거래가 트래커 | 스윙파머</title>
<link rel="stylesheet" href="/common.css?v=4">
<style>
:root { --sf-max-w: 1200px; }
.final { background: linear-gradient(135deg, #1F4E78, #2563eb); }
*{box-sizing:border-box;margin:0;padding:0}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.scard{padding:14px;border-radius:10px;color:white}
.scard.blue{background:linear-gradient(135deg,#1F4E78,#2563eb)}
.scard.green{background:linear-gradient(135deg,#059669,#10b981)}
.scard.amber{background:linear-gradient(135deg,#d97706,#f59e0b)}
.scard.purple{background:linear-gradient(135deg,#6d28d9,#8b5cf6)}
.scard.red{background:linear-gradient(135deg,#dc2626,#ef4444)}
.scard .lbl{font-size:11px;opacity:.9;margin-bottom:3px}
.scard .val{font-size:18px;font-weight:800}
.scard .sub{font-size:11px;opacity:.85;margin-top:3px}
.prop-tabs{display:flex;gap:4px;background:#1F4E78;padding:4px;border-radius:10px;margin-bottom:12px}
.prop-tab{flex:1;padding:10px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:700;color:rgba(255,255,255,.6);border-radius:8px;transition:all .15s;font-family:inherit}
.prop-tab:hover{color:white;background:rgba(255,255,255,.1)}
.prop-tab.active{background:white;color:#1F4E78}
.tabs{display:flex;gap:4px;background:#e5e7eb;padding:4px;border-radius:10px;margin-bottom:18px;flex-wrap:wrap}
.tab{flex:1;padding:10px 6px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:#666;border-radius:8px;transition:all .15s;font-family:inherit;min-width:80px}
.tab:hover{background:rgba(255,255,255,.5)}
.tab.active{background:white;color:#1F4E78;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab-content{display:none}.tab-content.active{display:block}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row input{padding:8px;font-size:13px;border:1px solid #ccc;border-radius:6px;font-family:inherit}
.filter-row input{flex:1;min-width:160px}
.cnt{font-size:12px;color:#888;margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#1F4E78;color:white;padding:8px 6px;font-size:12px;font-weight:600;position:sticky;top:0}
.tbl th:nth-child(1),.tbl th:nth-child(2),.tbl th:nth-child(3){text-align:left}
.tbl td:nth-child(1),.tbl td:nth-child(2),.tbl td:nth-child(3){text-align:left}
.tbl td{padding:7px 6px;text-align:right;border-bottom:1px solid #eee}
.tbl tr:hover td{background:#e8f0fe;transition:background .1s}
.tbl-wrap{max-height:600px;overflow-y:auto;border:1px solid #ddd;border-radius:8px}
.price{color:#dc2626;font-weight:700}
.jeonse{color:#2563eb;font-weight:700}
.wolse{color:#059669;font-weight:700}
.badge-trade{background:#fee2e2;color:#991b1b}
.badge-jeonse{background:#dbeafe;color:#1e40af}
.badge-wolse{background:#d1fae5;color:#065f46}
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.region-card{background:white;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .1s}
.region-card:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.region-card h4{color:#1F4E78;font-size:14px;margin-bottom:6px}
.region-card .avg-price{font-size:18px;font-weight:800;color:#dc2626}
.region-card .sub{font-size:12px;color:#888;margin-top:4px}
.yearly-chart{background:white;border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:18px}
.yearly-chart h3{color:#1F4E78;font-size:15px;margin-bottom:12px}
.chart-container{position:relative;height:250px}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.pager button{padding:6px 14px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer;font-size:13px;font-family:inherit}
.pager button:disabled{opacity:.4;cursor:default}
.pager span{font-size:13px;color:#666}
.chk-group{display:inline-flex;gap:0;align-items:center;border:1px solid #ddd;border-radius:6px;overflow:hidden;flex:none}
.chk-label{padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;border-right:1px solid #ddd;transition:all .15s;font-family:inherit;user-select:none}
.chk-label:last-child{border-right:none}
.chk-label input{display:none}
.chk-label.on-trade{background:#fee2e2;color:#991b1b}
.chk-label.on-jeonse{background:#dbeafe;color:#1e40af}
.chk-label.on-wolse{background:#d1fae5;color:#065f46}
.chk-label.off{background:#e5e5e5;color:#aaa;text-decoration:line-through}
.loading{text-align:center;padding:60px;color:#888}
/* 다크모드 대응 */
body.sf-dark .tbl-wrap{border-color:#2c333f}
body.sf-dark .tbl td{border-bottom-color:#2c333f;color:#d8dde5}
body.sf-dark .tbl th{background:#2a4a6e;color:#d8dde5}
body.sf-dark .tbl tr:hover td{background:#2a3a50!important;color:#fff}
body.sf-dark .tabs{background:#2a313d}
body.sf-dark .tab{color:#aab3c0}
body.sf-dark .tab.active{background:#1F4E78;color:#fff}
body.sf-dark .region-card{background:#1e242e;box-shadow:0 1px 3px rgba(0,0,0,.3);border:1px solid #2c333f}
body.sf-dark .region-card:hover{box-shadow:0 3px 8px rgba(0,0,0,.4)}
body.sf-dark .region-card h4{color:#6ba3e0}
body.sf-dark .yearly-chart{background:#1e242e;box-shadow:0 1px 3px rgba(0,0,0,.3);border:1px solid #2c333f}
body.sf-dark .yearly-chart h3{color:#6ba3e0}
body.sf-dark .pager button{background:#2a313d;color:#d8dde5;border-color:#3a4250}
body.sf-dark .pager span{color:#aab3c0}
body.sf-dark .filter-row select,body.sf-dark .filter-row input{background:#2a313d;color:#e8ecf2;border-color:#3a4250}
body.sf-dark .cnt{color:#aab3c0}
body.sf-dark .chk-label.off{background:#2a313d;color:#666}
body.sf-dark .chk-group{border-color:#3a4250}
body.sf-dark .prop-tabs{background:#162d4a}
@media(max-width:600px){.summary-cards{grid-template-columns:repeat(2,1fr)}.region-grid{grid-template-columns:1fr}.filter-row input{min-width:60px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="sf-narrow">
<a href="/" class="back-link">← 메인으로</a>
<h1>🏠 실거래가 트래커</h1>
<p class="desc">국토교통부 실거래 데이터 — 아파트·오피스텔·상업용. Oracle DB 기반 실시간 조회.</p>

<!-- 부동산 유형 탭 -->
<div class="prop-tabs">
  <button class="prop-tab active" data-prop="APT">🏢 아파트</button>
  <button class="prop-tab" data-prop="OFT">🏬 오피스텔</button>
  <button class="prop-tab" data-prop="COM">🏪 상업·업무용</button>
</div>

<div class="summary-cards" id="topCards"><div class="loading">로딩...</div></div>

<div class="tabs">
  <button class="tab active" data-tab="recent">📋 최근 거래</button>
  <button class="tab" data-tab="stats">📊 지역 통계</button>
  <button class="tab" data-tab="yearly">📈 연도별 추이</button>
</div>

<!-- 최근 거래 -->
<div class="tab-content active" id="tab-recent">
  <div class="filter-row">
    <select id="fRegion"><option value="">전체 지역</option></select>
    <select id="fDong"><option value="">전체 동</option></select>
    <div class="chk-group" id="fTypeGroup">
      <label class="chk-label on-trade" id="lblS">매매</label>
      <label class="chk-label on-jeonse" id="lblJ">전세</label>
      <label class="chk-label on-wolse" id="lblW">월세</label>
    </div>
    <select id="fYearFrom"></select>
    <span style="font-size:13px;color:#888">~</span>
    <select id="fYearTo"></select>
    <input type="text" id="fSearch" placeholder="건물명 검색 (쉼표로 여러개: 콤비,홍우)" style="min-width:250px;flex:1;max-width:500px">
  </div>
  <div class="filter-row" style="margin-top:-6px">
    <span style="font-size:12px;color:#666;font-weight:600">전용면적(㎡)</span>
    <input type="number" id="fAreaMin" placeholder="최소" style="width:70px;min-width:70px;flex:none" min="0" step="1">
    <span style="font-size:13px;color:#888">~</span>
    <input type="number" id="fAreaMax" placeholder="최대" style="width:70px;min-width:70px;flex:none" min="0" step="1">
    <span style="font-size:12px;color:#666;font-weight:600;margin-left:8px">금액(만원)</span>
    <input type="number" id="fPriceMin" placeholder="최소" style="width:90px;min-width:90px;flex:none" min="0" step="1000">
    <span style="font-size:13px;color:#888">~</span>
    <input type="number" id="fPriceMax" placeholder="최대" style="width:90px;min-width:90px;flex:none" min="0" step="1000">
    <span style="font-size:12px;color:#666;font-weight:600;margin-left:8px">준공</span>
    <input type="number" id="fBuildFrom" placeholder="시작" style="width:64px;min-width:64px;flex:none" min="1970" max="2030">
    <span style="font-size:13px;color:#888">~</span>
    <input type="number" id="fBuildTo" placeholder="끝" style="width:64px;min-width:64px;flex:none" min="1970" max="2030">
  </div>
  <div class="filter-row" style="margin-top:-4px;gap:6px">
    <span style="font-size:12px;color:#666;font-weight:600">🔖 즐겨찾기</span>
    <select id="fBookmark" style="max-width:160px;font-size:12px"><option value="">저장된 검색 불러오기</option></select>
    <button id="btnBmOverwrite" style="font-size:11px;padding:4px 10px;border:1px solid #1F4E78;border-radius:4px;background:#fff;color:#1F4E78;cursor:pointer;font-family:inherit;font-weight:600" title="선택된 항목에 덮어쓰기">💾 덮어쓰기</button>
    <button id="btnBmSave" style="font-size:11px;padding:4px 10px;border:1px solid #03c75a;border-radius:4px;background:#fff;color:#03c75a;cursor:pointer;font-family:inherit;font-weight:600" title="새 이름으로 저장">📥 새로저장</button>
    <button id="btnBmRename" style="font-size:11px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#888;cursor:pointer;font-family:inherit" title="이름변경">✏️</button>
    <button id="btnBmDel" style="font-size:11px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#999;cursor:pointer;font-family:inherit" title="삭제">🗑️</button>
  </div>
  <div class="cnt" id="recentCnt"></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>지역</th><th>건물명</th><th>동</th><th>전용면적</th><th>층</th><th>금액</th><th>유형</th><th>준공</th><th>거래일</th></tr></thead><tbody id="recentBody"><tr><td colspan="9" class="loading">로딩...</td></tr></tbody></table></div>
  <div class="pager" id="pager"></div>
</div>

<!-- 지역 통계 -->
<div class="tab-content" id="tab-stats">
  <div class="region-grid" id="regionGrid"><div class="loading">로딩...</div></div>
</div>

<!-- 연도별 추이 -->
<div class="tab-content" id="tab-yearly">
  <div class="filter-row">
    <select id="yRegion"><option value="">전체 지역</option></select>
  </div>
  <div class="yearly-chart"><h3>연도별 평균 매매가 추이</h3><div class="chart-container"><canvas id="yearlyChart"></canvas></div></div>
  <div id="yearlyTable"></div>
</div>

<script>
var API='https://swingfarmer.duckdns.org/api/realestate';
var PROP='APT',PAGE=0,LIMIT=500,TOTAL=0;
var yearlyChart=null;

function fmt(n){return Math.round(n).toLocaleString('ko-KR')}
function fmtEok(n){if(!n)return'-';if(n>=10000)return(n/10000).toFixed(1)+'억';return fmt(n)+'만'}
function typeBadge(t){if(t==='S')return'<span class="badge badge-trade">매매</span>';if(t==='J')return'<span class="badge badge-jeonse">전세</span>';return'<span class="badge badge-wolse">월세</span>'}
function typePrice(d){
  if(d.deal_type==='S')return'<span class="price">'+fmtEok(d.price)+'</span>';
  if(d.deal_type==='J')return'<span class="jeonse">'+fmtEok(d.deposit)+'</span>';
  return'<span class="wolse">'+fmtEok(d.deposit)+'/'+fmt(d.monthly_rent||0)+'</span>';
}

// ── 지역 목록 로드 ──
function loadRegions(){
  fetch(API+'/regions?prop_type='+PROP).then(function(r){return r.json()}).then(function(data){
    // fRegion: multi-select
    var sel=document.getElementById('fRegion');
    sel.innerHTML='<option value="">전체 지역</option>';
    data.forEach(function(d){
      var o=document.createElement('option');o.value=d.region;o.textContent=d.region+' ('+fmt(d.count)+')';sel.appendChild(o);
    });
    // yRegion: single select
    var ysel=document.getElementById('yRegion');if(!ysel)return;
    ysel.innerHTML='<option value="">전체 지역</option>';
    data.forEach(function(d){
      var o=document.createElement('option');o.value=d.region;o.textContent=d.region;ysel.appendChild(o);
    });
  });
}

// ── 동 목록 로드 ──
function loadDongs(){
  var region=document.getElementById('fRegion').value;
  var sel=document.getElementById('fDong');
  sel.innerHTML='<option value="">전체 동</option>';
  if(!region)return;
  fetch(API+'/dongs?region='+encodeURIComponent(region)+'&prop_type='+PROP).then(function(r){return r.json()}).then(function(data){
    data.forEach(function(d){var o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  });
}

// ── 요약 카드 ──
function loadSummary(){
  document.getElementById('topCards').innerHTML='<div class="loading">로딩...</div>';
  fetch(API+'/stats?prop_type='+PROP).then(function(r){return r.json()}).then(function(d){
    var s=d.summary;
    var label={'APT':'아파트','OFT':'오피스텔','COM':'상업·업무용'}[PROP];
    document.getElementById('topCards').innerHTML=
      '<div class="scard blue"><div class="lbl">'+label+' 매매</div><div class="val">'+fmt(s.count)+'건</div></div>'
      +'<div class="scard red"><div class="lbl">평균 매매가</div><div class="val">'+fmtEok(s.avg_price)+'</div></div>'
      +'<div class="scard purple"><div class="lbl">최고가</div><div class="val">'+fmtEok(s.max_price)+'</div></div>'
      +'<div class="scard green"><div class="lbl">최저가</div><div class="val">'+fmtEok(s.min_price)+'</div></div>'
      +'<div class="scard amber"><div class="lbl">Top 단지</div><div class="val">'+(d.top_apts.length?d.top_apts[0].name:'-')+'</div><div class="sub">'+(d.top_apts.length?fmt(d.top_apts[0].count)+'건':'')+'</div></div>';
  });
}

// ── 최근 거래 ──
function loadRecent(){
  var region=document.getElementById('fRegion').value;
  var dong=document.getElementById('fDong').value;
  var typeMap={'lblS':'S','lblJ':'J','lblW':'W'};
  var types=[];
  ['lblS','lblJ','lblW'].forEach(function(id){var el=document.getElementById(id);if(!el.classList.contains('off'))types.push(typeMap[id]);});
  // 전부 끄면 0건
  if(types.length===0){
    TOTAL=0;
    document.getElementById('recentCnt').textContent='0건';
    document.getElementById('recentBody').innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px;color:#999">거래 유형을 선택하세요.</td></tr>';
    document.getElementById('pager').innerHTML='';
    return;
  }
  var name=document.getElementById('fSearch').value.trim();
  var yf=document.getElementById('fYearFrom').value;
  var yt=document.getElementById('fYearTo').value;
  var areaMin=document.getElementById('fAreaMin').value;
  var areaMax=document.getElementById('fAreaMax').value;
  var priceMin=document.getElementById('fPriceMin').value;
  var priceMax=document.getElementById('fPriceMax').value;
  var buildFrom=document.getElementById('fBuildFrom').value;
  var buildTo=document.getElementById('fBuildTo').value;

  var q='?prop_type='+PROP+'&limit='+LIMIT+'&offset='+(PAGE*LIMIT);
  if(region)q+='&region='+encodeURIComponent(region);
  if(dong)q+='&dong='+encodeURIComponent(dong);
  if(types.length>0&&types.length<3)q+='&deal_type='+types.join(',');
  if(name)q+='&name='+encodeURIComponent(name);
  if(yf)q+='&year_from='+yf;
  if(yt)q+='&year_to='+yt;
  if(areaMin)q+='&area_min='+areaMin;
  if(areaMax)q+='&area_max='+areaMax;
  if(priceMin)q+='&price_min='+priceMin;
  if(priceMax)q+='&price_max='+priceMax;
  if(buildFrom)q+='&build_year_from='+buildFrom;
  if(buildTo)q+='&build_year_to='+buildTo;

  document.getElementById('recentBody').innerHTML='<tr><td colspan="9" class="loading">검색 중...</td></tr>';
  fetch(API+'/search'+q).then(function(r){return r.json()}).then(function(d){
    TOTAL=d.total;
    document.getElementById('recentCnt').textContent=fmt(TOTAL)+'건'+(TOTAL>LIMIT?' (페이지 '+(PAGE+1)+'/'+Math.ceil(TOTAL/LIMIT)+')':'');
    var html='';
    d.data.forEach(function(t){
      var yr=t.deal_year||t.year||'';
      var mo=String(t.deal_month||t.month||'').padStart(2,'0');
      var dy=String(t.deal_day||t.day||'').padStart(2,'0');
      var areaM2=t.area||0;
      var pyeong=(areaM2/3.3058).toFixed(1);
      var areaStr=areaM2+'㎡<br><span style="font-size:11px;color:#888">('+pyeong+'평)</span>';
      html+='<tr><td>'+t.region+'</td><td>'+(t.name||'')+'</td><td>'+(t.dong||'')+'</td><td>'+areaStr+'</td><td>'+(t.floor||'')+'층</td><td>'+typePrice(t)+'</td><td>'+typeBadge(t.deal_type)+'</td><td>'+(t.build_year||'-')+'</td><td>'+yr+'.'+mo+'.'+dy+'</td></tr>';
    });
    document.getElementById('recentBody').innerHTML=html||'<tr><td colspan="9" style="text-align:center;padding:30px;color:#999">결과 없음</td></tr>';
    renderPager();
  }).catch(function(e){
    document.getElementById('recentBody').innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px;color:#c00">오류: '+e.message+'</td></tr>';
  });
}

function renderPager(){
  var totalPages=Math.ceil(TOTAL/LIMIT);
  if(totalPages<=1){document.getElementById('pager').innerHTML='';return}
  document.getElementById('pager').innerHTML=
    '<button onclick="PAGE=0;loadRecent()" '+(PAGE===0?'disabled':'')+'>⟪</button>'
    +'<button onclick="PAGE--;loadRecent()" '+(PAGE===0?'disabled':'')+'>◀</button>'
    +'<span>'+(PAGE+1)+' / '+totalPages+'</span>'
    +'<button onclick="PAGE++;loadRecent()" '+(PAGE>=totalPages-1?'disabled':'')+'>▶</button>'
    +'<button onclick="PAGE='+( totalPages-1)+';loadRecent()" '+(PAGE>=totalPages-1?'disabled':'')+'>⟫</button>';
}

// ── 지역 통계 ──
function loadRegionStats(){
  document.getElementById('regionGrid').innerHTML='<div class="loading">로딩...</div>';
  fetch(API+'/regions?prop_type='+PROP).then(function(r){return r.json()}).then(function(data){
    var html='';
    data.forEach(function(d){
      html+='<div class="region-card" data-region="'+d.region+'"><h4>'+d.region+'</h4><div class="stat">거래 '+fmt(d.count)+'건</div></div>';
    });
    document.getElementById('regionGrid').innerHTML=html||'<div class="loading">데이터 없음</div>';
    document.querySelectorAll('.region-card').forEach(function(card){
      card.addEventListener('click',function(){
        document.getElementById('fRegion').value=card.dataset.region;
        loadDongs();PAGE=0;loadRecent();document.querySelectorAll('.tab')[0].click();
      });
    });
  });
}

// ── 연도별 추이 ──
function loadYearly(){
  var region=document.getElementById('yRegion').value;
  var q='?prop_type='+PROP;
  if(region)q+='&region='+encodeURIComponent(region);

  fetch(API+'/stats'+q).then(function(r){return r.json()}).then(function(d){
    var yearly=d.yearly||[];
    if(!yearly.length)return;

    var labels=yearly.map(function(y){return y.year||y.deal_year});
    var prices=yearly.map(function(y){return y.avg_price});
    var counts=yearly.map(function(y){return y.count||y.cnt});

    if(yearlyChart)yearlyChart.destroy();
    yearlyChart=new Chart(document.getElementById('yearlyChart'),{
      type:'line',
      data:{labels:labels,datasets:[
        {label:'평균 매매가(만원)',data:prices,borderColor:'#dc2626',backgroundColor:'rgba(220,38,38,.1)',fill:true,tension:.3,yAxisID:'y'},
        {label:'거래건수',data:counts,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)',fill:false,tension:.3,yAxisID:'y1'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        scales:{y:{position:'left',ticks:{callback:function(v){return fmtEok(v)}}},y1:{position:'right',grid:{drawOnChartArea:false}}},
        plugins:{tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+(ctx.datasetIndex===0?fmtEok(ctx.parsed.y):fmt(ctx.parsed.y)+'건')}}}}}
    });

    var thtml='<table class="tbl" style="margin-top:14px"><thead><tr><th style="text-align:left">연도</th><th>거래건수</th><th>평균매매가</th></tr></thead><tbody>';
    yearly.slice().reverse().forEach(function(y){
      thtml+='<tr><td style="text-align:left">'+(y.year||y.deal_year)+'</td><td>'+fmt(y.count||y.cnt)+'건</td><td class="price">'+fmtEok(y.avg_price)+'</td></tr>';
    });
    thtml+='</tbody></table>';
    document.getElementById('yearlyTable').innerHTML=thtml;
  });
}

// ── 이벤트 ──
document.querySelectorAll('.prop-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.prop-tab').forEach(function(t){t.classList.remove('active')});
    tab.classList.add('active');
    PROP=tab.dataset.prop;PAGE=0;
    loadRegions();loadSummary();loadRecent();loadRegionStats();loadYearly();
  });
});
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab==='stats')loadRegionStats();
    if(tab.dataset.tab==='yearly')loadYearly();
  });
});
// ── 검색조건 즐겨찾기 ──
var BM_KEY='sf_re_bookmarks';
function loadBookmarks(){try{return JSON.parse(localStorage.getItem(BM_KEY))||{};}catch(e){return {};}}
function saveBookmarks(bm){localStorage.setItem(BM_KEY,JSON.stringify(bm));}
function renderBookmarks(){
  var bm=loadBookmarks(),sel=document.getElementById('fBookmark');
  sel.innerHTML='<option value="">저장된 검색 불러오기</option>';
  Object.keys(bm).forEach(function(name){
    var o=document.createElement('option');o.value=name;o.textContent=name;sel.appendChild(o);
  });
}
function getCurrentFilters(){
  var typeMap={'lblS':'S','lblJ':'J','lblW':'W'};var types=[];
  ['lblS','lblJ','lblW'].forEach(function(id){if(!document.getElementById(id).classList.contains('off'))types.push(typeMap[id]);});
  return {
    region:document.getElementById('fRegion').value,
    dong:document.getElementById('fDong').value,
    types:types,
    yearFrom:document.getElementById('fYearFrom').value,
    yearTo:document.getElementById('fYearTo').value,
    areaMin:document.getElementById('fAreaMin').value,
    areaMax:document.getElementById('fAreaMax').value,
    priceMin:document.getElementById('fPriceMin').value,
    priceMax:document.getElementById('fPriceMax').value,
    buildFrom:document.getElementById('fBuildFrom').value,
    buildTo:document.getElementById('fBuildTo').value,
    search:document.getElementById('fSearch').value,
    prop:PROP
  };
}
function applyFilters(f){
  // 탭 전환
  if(f.prop && f.prop!==PROP){
    PROP=f.prop;
    document.querySelectorAll('.prop-tab').forEach(function(t){t.classList.toggle('active',t.dataset.prop===PROP);});
    loadRegions();
  }
  if(f.region){document.getElementById('fRegion').value=f.region;loadDongs();}
  setTimeout(function(){
    if(f.dong)document.getElementById('fDong').value=f.dong;
    // types
    var onMap={'S':'lblS','J':'lblJ','W':'lblW'};
    var clsMap={'lblS':'on-trade','lblJ':'on-jeonse','lblW':'on-wolse'};
    ['lblS','lblJ','lblW'].forEach(function(id){
      var el=document.getElementById(id);
      var t=id==='lblS'?'S':id==='lblJ'?'J':'W';
      if(f.types && f.types.indexOf(t)>=0){el.classList.remove('off');el.classList.add(clsMap[id]);}
      else{el.classList.add('off');el.classList.remove(clsMap[id]);}
    });
    document.getElementById('fYearFrom').value=f.yearFrom||'';
    document.getElementById('fYearTo').value=f.yearTo||'';
    document.getElementById('fAreaMin').value=f.areaMin||'';
    document.getElementById('fAreaMax').value=f.areaMax||'';
    document.getElementById('fPriceMin').value=f.priceMin||'';
    document.getElementById('fPriceMax').value=f.priceMax||'';
    document.getElementById('fBuildFrom').value=f.buildFrom||'';
    document.getElementById('fBuildTo').value=f.buildTo||'';
    document.getElementById('fSearch').value=f.search||'';
    PAGE=0;loadRecent();
  },300);
}
document.getElementById('btnBmOverwrite').addEventListener('click',function(){
  var name=document.getElementById('fBookmark').value;
  if(!name){alert('덮어쓸 즐겨찾기를 먼저 선택하세요.\n새로 만들려면 📥 새로저장을 누르세요.');return;}
  var bm=loadBookmarks();
  bm[name]=getCurrentFilters();
  saveBookmarks(bm);
});
document.getElementById('btnBmSave').addEventListener('click',function(){
  var name=prompt('새 즐겨찾기 이름:');
  if(!name)return;
  var bm=loadBookmarks();
  if(bm[name]){if(!confirm('"'+name+'" 이미 있습니다. 덮어쓸까요?'))return;}
  bm[name]=getCurrentFilters();
  saveBookmarks(bm);
  renderBookmarks();
  document.getElementById('fBookmark').value=name;
});
document.getElementById('btnBmRename').addEventListener('click',function(){
  var name=document.getElementById('fBookmark').value;
  if(!name){alert('이름을 바꿀 즐겨찾기를 선택하세요.');return;}
  var newName=prompt('새 이름:',name);
  if(!newName||newName===name)return;
  var bm=loadBookmarks();bm[newName]=bm[name];delete bm[name];
  saveBookmarks(bm);renderBookmarks();
  document.getElementById('fBookmark').value=newName;
});
document.getElementById('btnBmDel').addEventListener('click',function(){
  var name=document.getElementById('fBookmark').value;
  if(!name){alert('삭제할 즐겨찾기를 선택하세요.');return;}
  if(!confirm('"'+name+'" 삭제할까요?'))return;
  var bm=loadBookmarks();delete bm[name];saveBookmarks(bm);renderBookmarks();
});
document.getElementById('fBookmark').addEventListener('change',function(){
  var name=this.value;if(!name)return;
  var bm=loadBookmarks();if(bm[name])applyFilters(bm[name]);
});
renderBookmarks();

document.getElementById('fRegion').addEventListener('change',function(){loadDongs();PAGE=0;loadRecent()});
document.getElementById('fDong').addEventListener('change',function(){PAGE=0;loadRecent()});
['lblS','lblJ','lblW'].forEach(function(id){
  var el=document.getElementById(id);
  var onCls=id==='lblS'?'on-trade':id==='lblJ'?'on-jeonse':'on-wolse';
  el.addEventListener('click',function(){el.classList.toggle('off');el.classList.toggle(onCls);PAGE=0;loadRecent()});
});
document.getElementById('fSearch').addEventListener('input',function(){clearTimeout(this._t);this._t=setTimeout(function(){PAGE=0;loadRecent()},400)});
document.getElementById('fYearFrom').addEventListener('change',function(){PAGE=0;loadRecent()});
document.getElementById('fYearTo').addEventListener('change',function(){PAGE=0;loadRecent()});
// 면적·금액 입력 (debounce)
['fAreaMin','fAreaMax','fPriceMin','fPriceMax','fBuildFrom','fBuildTo'].forEach(function(id){
  document.getElementById(id).addEventListener('input',function(){clearTimeout(this._t);this._t=setTimeout(function(){PAGE=0;loadRecent()},600)});
});
document.getElementById('yRegion').addEventListener('change',loadYearly);

// ── 연도 셀렉트 초기화 ──
(function(){
  var now=new Date().getFullYear();
  ['fYearFrom','fYearTo'].forEach(function(id){
    var sel=document.getElementById(id);
    sel.innerHTML='<option value="">'+(id==='fYearFrom'?'시작년도':'종료년도')+'</option>';
    for(var y=now;y>=2006;y--){var o=document.createElement('option');o.value=y;o.textContent=y+'년';sel.appendChild(o);}
  });
})();

// ── 초기 로드 ──
loadRegions();loadSummary();loadRecent();
</script>
