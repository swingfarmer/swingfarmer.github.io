<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<title>페이지 없음 | 스윙파머</title>
<script>
/* (113) GitHub Pages는 없는 주소에 이 파일을 보여줌.
   합치거나 옮긴 페이지는 여기서 새 주소로 넘김 → 브라우저 북마크·옛 링크가 안 깨짐.
   페이지를 합칠 때마다 한 줄 추가 (메인 index.html 즐겨찾기 MOVED와 같이). 새 주소에 #탭을 붙이면 그 탭으로 열림 */
var SF_MOVED = {
  '/indicators/': '/dashboard/',         // 113: 시장 지표 대시보드 → 시장 대시보드(📈 지표 추이·⛽ 국제유가 탭)
  '/data/': '/rates/',                   // 114: 환율/금시세 → 환율·금리·금시세 (/data/ 폴더의 json은 그대로)
  '/tax/retirement-compare/': '/tax/retirement/#compare',  // 114: 퇴직금 수령 방식 비교 → 퇴직소득세 페이지 탭
  '/1808/': '/?view=list',               // 115: 전체 메뉴 → 메인 「📋 목록」 보기
  '/research/kal-2027-hantu-base-compare.html/': '/research/kal-2027-bridge.html#hantu'  // 116: 한투 교정 비교 → 브리지 v3 안 「한투 2027F 교정 비교」 절
};
(function(){
  var p = location.pathname.replace(/index\.html$/, '');
  if (p.slice(-1) !== '/') p += '/';
  var to = SF_MOVED[p];
  // (114) 새 주소에 #탭이 붙어 있으면 ?검색어 뒤로 (주소#탭?x 가 되지 않게). 옛 주소에 #가 있으면 그걸 우선
  if (to){ var h = to.indexOf('#'); var path = h < 0 ? to : to.slice(0, h), hash = location.hash || (h < 0 ? '' : to.slice(h)); location.replace(path + location.search + hash); }
})();
</script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:#f5f7fa;color:#1a1a1a;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:28px 32px;text-align:center;max-width:420px}
h1{font-size:20px;color:#1F4E78;margin:0 0 8px}p{font-size:13px;color:#555;line-height:1.7;margin:6px 0}
a{display:inline-block;margin-top:12px;padding:8px 16px;background:#1F4E78;color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600}
@media (prefers-color-scheme:dark){body{background:#0f1117;color:#e4e4e7}.box{background:#1a1d27;border-color:#2a2d3a}h1{color:#85b5e0}p{color:#a1a1aa}}
</style>
</head>
<body>
<div class="box">
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없어진 페이지입니다.<br>메인에서 찾거나 메뉴 검색을 써 주세요.</p>
  <a href="/">🏠 메인으로</a>
</div>
</body>
</html>
