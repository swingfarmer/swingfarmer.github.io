<link rel="stylesheet" href="/common.css?v=5">
<style>
:root { --sf-max-w: 860px; }
.page-desc{color:#666;font-size:14px;margin-bottom:24px}

/* 카테고리 탭 */
.cat-tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:20px}
.ctab{padding:8px 16px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#666;font-family:inherit;margin-right:-1px;transition:all .15s}
.ctab:first-child{border-radius:6px 0 0 6px}
.ctab:last-child{border-radius:0 6px 6px 0}
.ctab.active{background:#1F4E78;color:white;border-color:#1F4E78;z-index:1;position:relative}
.ctab:hover:not(.active){background:#f0f5fa;color:#1F4E78}
.ctab .cnt{font-size:11px;font-weight:400;margin-left:4px;opacity:.7}

/* 리서치 카드 리스트 */
.research-list{display:flex;flex-direction:column;gap:12px}
.research-card{display:block;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px 24px;text-decoration:none;color:inherit;transition:all .2s;border-left:4px solid #1F4E78}
.research-card:hover{box-shadow:0 4px 12px rgba(31,78,120,.12);transform:translateY(-1px)}
.rc-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rc-cat{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.rc-cat.macro{background:#e0e7ff;color:#3730a3}
.rc-cat.stock{background:#dcfce7;color:#166534}
.rc-cat.strategy{background:#fef3c7;color:#92400e}
.rc-cat.tax{background:#fce7f3;color:#9d174d}
.rc-date{font-size:12px;color:#aaa}
.rc-title{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.rc-desc{font-size:13px;color:#888;line-height:1.5}
.rc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc-tag{font-size:11px;color:#1F4E78;background:#e8f0fe;padding:2px 8px;border-radius:4px}

.empty-msg{text-align:center;padding:60px 20px;color:#aaa;font-size:14px}
.sbtn{font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid #d1d5db;background:white;cursor:pointer;font-family:inherit;color:#555}
.sbtn:hover{background:#f3f4f6}
.sbtn.active{background:#1F4E78;color:white;border-color:#1F4E78}
</style>

<link rel="stylesheet" href="/auth-guard.css?v=4">
<script type="module" src="/auth-guard.js?v=5"></script>
</head>
<body class="sf-narrow">

<h1 style="color:#1F4E78;border-bottom:3px solid #1F4E78;padding-bottom:10px;margin-bottom:8px">📄 리서치 노트</h1>
<p class="page-desc">정제된 분석 문서 모음. 매크로·종목·전략·세금/법인.</p>

<!-- 카테고리 탭 -->
<div class="cat-tabs" id="catTabs">
  <button class="ctab active" data-cat="all">전체<span class="cnt" id="cntAll"></span></button>
  <button class="ctab" data-cat="macro">매크로<span class="cnt" id="cntMacro"></span></button>
  <button class="ctab" data-cat="stock">종목<span class="cnt" id="cntStock"></span></button>
  <button class="ctab" data-cat="strategy">전략<span class="cnt" id="cntStrategy"></span></button>
  <button class="ctab" data-cat="tax">세금·법인<span class="cnt" id="cntTax"></span></button>
</div>

<!-- 정렬 -->
<div class="sort-bar" id="sortBar" style="display:flex;gap:6px;margin-bottom:14px;align-items:center">
  <span style="font-size:12px;color:#888;margin-right:4px">정렬:</span>
  <button class="sbtn active" data-sort="date-desc">최신순</button>
  <button class="sbtn" data-sort="date-asc">오래된순</button>
  <button class="sbtn" data-sort="title-asc">ㄱㄴㄷ순</button>
  <button class="sbtn" data-sort="reg">등록순</button>
</div>

<!-- 리서치 리스트 -->
<div class="research-list" id="researchList"></div>

<script>
/* ── 리서치 문서 목록 (새 글 추가 시 여기에 추가) ── */
const ARTICLES = [
  {
    title: '미국 정치권 섹터별 정책 수혜 지도',
    desc: 'Tier 1(초당적: 조선·방산·반도체·원전) → Tier 2(주도 정당 차이: 크립토·DC·핵심광물) → Tier 3(당파적: 신재생↔석유가스). 근거 법안·표결·양당 지지도 정리. 정권교체 리스크 매트릭스.',
    cat: 'macro',
    date: '2026-11-04',
    href: './us-policy-sector-map.html',
    tags: ['초당적','NDAA','OBBBA','IRA','원전','방산','반도체','정권교체']
  },
  {
    title: '환율·유가 2축 업종·종목 매트릭스',
    desc: '원화 강약 × 유가 상하 9박스로 한국 업종·종목의 영업이익 방향성을 분류. 현재 시장 포지션 표시, 시나리오별 전환 테이블, NAV 보완축, 투자 판단 체크리스트.',
    cat: 'strategy',
    date: '2026-11-03',
    href: './fx-oil-matrix.html',
    tags: ['환율','유가','정유','항공','반도체','정제마진','에틸렌','매트릭스']
  },
  {
    title: 'KB증권 2027년 한국주식 전망 "Uphill" — 핵심 정리',
    desc: 'KOSPI 밴드 5,100~9,000pt. 닷컴 평행이론 기반 따라잡기 반등 시나리오, AI 변동성 전이 진단(Pástor–Veronesi), 물가·고용 리스크 프레임워크, 반도체+소외주 역발상, 퀀트 마진·특허 전략.',
    cat: 'macro',
    date: '2026-11-02',
    href: './kb-2027-outlook.html',
    tags: ['KB증권','KOSPI','AI랠리','물가','고용','반도체','소외주','퀀트']
  },
  {
    title: '현대제철(004020) 투자 종합 리포트 — 12사 셀사이드 종합',
    desc: 'PBR 0.17배 역사적 하단. 3Q26 연결OP 871억(별도 BEP), 27E OP 3,031~7,765억 2.6배 격차. Bull/Base/Bear 시나리오, 추적 대시보드 5카테고리, vs 동국제강 비교.',
    cat: 'stock',
    date: '2026-11-02',
    href: './hdsteel-thesis.html',
    tags: ['현대제철','PBR','밸류업','전기료','모비스','철강']
  },
  {
    title: '대한항공(003490) 투자 보고서 — 합병·실적·배당 종합',
    desc: '12/17 아시아나 합병으로 아시아 1위 항공사 출범. 셀사이드 11개사 종합, 배당 조정NI 분석, 환율·유가 민감도 모델, 매매 전략.',
    cat: 'stock',
    date: '2026-10-29',
    href: './kal-thesis.html',
    tags: ['대한항공','합병','배당','환율민감도','MRO']
  },
  {
    title: '약세장 회복 분석 — S&P 500 & KOSPI',
    desc: '1980년 이후 20%+ 하락 약세장의 하락폭·회복기간·원인 팩트 정리. 회복 속도를 결정하는 구조적 요인과 현 매크로 시사점.',
    cat: 'macro',
    date: '2026-11-01',
    href: './bear-market-recovery.html',
    tags: ['약세장','회복기간','정책대응','코리아디스카운트']
  }
];

const CAT_LABEL = {macro:'매크로',stock:'종목',strategy:'전략',tax:'세금·법인'};
const listEl = document.getElementById('researchList');

// 원본 순서(등록순) 보존
ARTICLES.forEach(function(a,i){ a._regIdx = i; });

var curCat = 'all';
var curSort = 'date-desc';

// localStorage에서 복원
try {
  var saved = localStorage.getItem('sf_research_filter');
  if (saved) {
    var p = JSON.parse(saved);
    if (p.cat) curCat = p.cat;
    if (p.sort) curSort = p.sort;
  }
} catch(e){}

function saveFilter() {
  try { localStorage.setItem('sf_research_filter', JSON.stringify({cat:curCat, sort:curSort})); } catch(e){}
}

function sortArticles(arr, mode) {
  var sorted = arr.slice();
  if (mode === 'date-desc') sorted.sort(function(a,b){ return b.date.localeCompare(a.date); });
  else if (mode === 'date-asc') sorted.sort(function(a,b){ return a.date.localeCompare(b.date); });
  else if (mode === 'title-asc') sorted.sort(function(a,b){ return a.title.localeCompare(b.title, 'ko'); });
  else if (mode === 'reg') sorted.sort(function(a,b){ return a._regIdx - b._regIdx; });
  return sorted;
}

function render() {
  var filtered = curCat === 'all' ? ARTICLES : ARTICLES.filter(function(a){ return a.cat === curCat; });
  filtered = sortArticles(filtered, curSort);

  // 탭 active
  document.querySelectorAll('.ctab').forEach(function(b){ b.classList.toggle('active', b.dataset.cat === curCat); });
  // 정렬 버튼 active
  document.querySelectorAll('.sbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.sort === curSort); });

  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty-msg">등록된 문서가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(function(a){ return '\
    <a href="'+a.href+'" class="research-card" data-cat="'+a.cat+'">\
      <div class="rc-header">\
        <span class="rc-cat '+a.cat+'">'+(CAT_LABEL[a.cat]||a.cat)+'</span>\
        <span class="rc-date">'+a.date+'</span>\
      </div>\
      <div class="rc-title">'+a.title+'</div>\
      <div class="rc-desc">'+a.desc+'</div>\
      '+(a.tags ? '<div class="rc-tags">'+a.tags.map(function(t){return '<span class="rc-tag">#'+t+'</span>';}).join('')+'</div>' : '')+'\
    </a>';
  }).join('');

  saveFilter();
}

// 카운트 표시
document.getElementById('cntAll').textContent = '(' + ARTICLES.length + ')';
['macro','stock','strategy','tax'].forEach(function(c){
  var cnt = ARTICLES.filter(function(a){return a.cat===c;}).length;
  var el = document.getElementById('cnt' + c.charAt(0).toUpperCase() + c.slice(1));
  if(el) el.textContent = cnt ? '('+cnt+')' : '';
});

// 탭 클릭
document.getElementById('catTabs').addEventListener('click', function(e){
  var btn = e.target.closest('.ctab');
  if(btn){ curCat = btn.dataset.cat; render(); }
});

// 정렬 클릭
document.getElementById('sortBar').addEventListener('click', function(e){
  var btn = e.target.closest('.sbtn');
  if(btn){ curSort = btn.dataset.sort; render(); }
});

render();
</script>
