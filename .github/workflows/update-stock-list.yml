name: Update Stock List (시총 1조↑)

on:
  schedule:
    # 매주 월요일 KST 06:00 (UTC 21:00 일요일) — 주초에 종목 리스트 갱신
    - cron: '0 21 * * 0'
  workflow_dispatch: {}

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update stock list
        run: python scripts/update_stock_list.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/kospi200_list.csv
          git diff --staged --quiet || git commit -m "🔄 종목 리스트 갱신 $(date +%Y-%m-%d)"
          git pull --rebase
          git push
