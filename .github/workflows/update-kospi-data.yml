name: Update KOSPI Financial Data

on:
  schedule:
    # 연간 (3월 공시 → 4월 5일)
    - cron: '0 0 5 4 *'
    # 1분기 (5/15 공시 → 5월 20일)
    - cron: '0 0 20 5 *'
    # 반기 (8/14 공시 → 8월 20일)
    - cron: '0 0 20 8 *'
    # 3분기 (11/14 공시 → 11월 20일)
    - cron: '0 0 20 11 *'
  workflow_dispatch:
    inputs:
      period:
        description: '수집 기간 (annual/q1/q2/q3)'
        required: false
        default: 'annual'
      year:
        description: '사업연도 (비우면 자동)'
        required: false
        default: ''

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine period
        id: period
        run: |
          MONTH=$(date +%m)
          if [ -n "${{ github.event.inputs.period }}" ]; then
            echo "period=${{ github.event.inputs.period }}" >> $GITHUB_OUTPUT
          elif [ "$MONTH" = "04" ]; then
            echo "period=annual" >> $GITHUB_OUTPUT
          elif [ "$MONTH" = "05" ]; then
            echo "period=q1" >> $GITHUB_OUTPUT
          elif [ "$MONTH" = "08" ]; then
            echo "period=q2" >> $GITHUB_OUTPUT
          elif [ "$MONTH" = "11" ]; then
            echo "period=q3" >> $GITHUB_OUTPUT
          else
            echo "period=annual" >> $GITHUB_OUTPUT
          fi

      - name: Run DART collector
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          YEAR_ARG=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            YEAR_ARG="--year ${{ github.event.inputs.year }}"
          fi
          python scripts/fetch_dart.py --period ${{ steps.period.outputs.period }} $YEAR_ARG

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 재무 데이터: ${{ steps.period.outputs.period }} $(date +%Y-%m-%d)"
          git pull --rebase
          git push
