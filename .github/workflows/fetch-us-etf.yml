name: 미국 ETF 데이터 수집

on:
  schedule:
    - cron: '30 22 * * 1-5'  # 월~금 미장 마감 후 (오전 7:30 KST)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch US ETF data
        run: python scripts/fetch_us_etf.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_etf.json
          git diff --cached --quiet || git commit -m "미국 ETF 업데이트 $(date +%Y-%m-%d)"
          git push
