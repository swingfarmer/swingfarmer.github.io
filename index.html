<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingFarmer 금융 도구</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
    background: #f5f7fa;
    color: #1a1a1a;
    min-height: 100vh;
  }
  header {
    text-align: center;
    margin-bottom: 50px;
  }
  h1 {
    color: #1F4E78;
    font-size: 32px;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #666;
    font-size: 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    text-decoration: none;
    color: inherit;
    border: 2px solid transparent;
    transition: all 0.15s ease;
    display: block;
  }
  .card:hover {
    border-color: #1F4E78;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(31, 78, 120, 0.15);
  }
  .card.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }
  .icon {
    font-size: 32px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: #1F4E78;
    margin-bottom: 6px;
  }
  .card-desc {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
  }
  .tag {
    display: inline-block;
    background: #eef2f7;
    color: #1F4E78;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 10px;
  }
  .tag.soon {
    background: #f5f5f5;
    color: #999;
  }
  footer {
    text-align: center;
    margin-top: 60px;
    color: #999;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>SwingFarmer 금융 도구</h1>
  <p class="subtitle">개인 재무 시뮬레이션 & 분석 모음</p>
</header>

<div class="grid">

  <a href="free/" class="card">
    <div class="icon">📈</div>
    <div class="card-title">경제적자유 계산기</div>
    <div class="card-desc">현재 자산·저축·지출·수익률을 입력하면 은퇴 시점과 100세까지의 자산 추이를 자동 계산. <b>"내가 어디까지 갈까?"</b></div>
    <div class="tag">사용 가능</div>
  </a>

  <a href="fire/" class="card">
    <div class="icon">🎯</div>
    <div class="card-title">파이어족 역산 계산기</div>
    <div class="card-desc">월 소비액과 사망 시 남길 금액을 입력하면 은퇴 시점에 얼마가 필요한지 역산. <b>"얼마 모아야 할까?"</b></div>
    <div class="tag">사용 가능</div>
  </a>

</div>

<footer>
  © SwingFarmer · GitHub Pages
</footer>

</body>
</html>
