<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>KOSPI 200 스크리너 · 시그널 & 수급</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e0e0e0;--text-dim:#888;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--gold:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:1400px;margin:0 auto;padding:16px}
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-dim);font-size:13px;margin-bottom:16px}

/* 날짜 네비 */
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.date-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.date-nav button:hover{border-color:var(--accent)}
.date-nav .current{font-size:15px;font-weight:700;color:var(--accent)}
.date-nav select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit}

/* 시그널 탭 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .12s}
.tab:hover{border-color:var(--text-dim)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .cnt{margin-left:4px;opacity:.7}

/* 서머리 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.summary-card .num{font-size:26px;font-weight:800;color:var(--accent)}
.summary-card .label{font-size:11px;color:var(--text-dim);margin-top:4px}

/* 테이블 */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--card);max-height:calc(100vh - 360px)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
th{position:sticky;top:0;background:#22253a;padding:10px 8px;text-align:right;font-weight:700;font-size:11px;color:var(--text-dim);border-bottom:2px solid var(--border);white-space:nowrap;z-index:2;cursor:pointer}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
td:nth-child(1),td:nth-child(2){text-align:left}
tr:hover{background:rgba(59,130,246,.06)}
.stock-name{font-weight:700;font-size:13px}
.stock-code{color:var(--text-dim);font-size:10px;margin-left:6px}
.stock-sector{color:var(--text-dim);font-size:10px;margin-left:6px;background:rgba(255,255,255,.05);padding:1px 6px;border-radius:4px}
.up{color:var(--green)}.down{color:var(--red)}.gold{color:var(--gold)}
.loading{text-align:center;padding:60px;color:var(--text-dim)}
.empty{text-align:center;padding:40px;color:var(--text-dim);font-size:14px}
.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:20px;line-height:1.8}
</style>
</head>
<body>

<a href="/" style="font-size:13px;color:var(--text-dim)">← 메인</a>
<h1>📊 KOSPI 200 스크리너</h1>
<p class="subtitle" id="updated">기술적 시그널 + 외인·기관 수급</p>

<div class="date-nav">
  <button onclick="navDate(-1)">◀ 이전</button>
  <span class="current" id="dateLabel">—</span>
  <button onclick="navDate(1)">다음 ▶</button>
  <select id="dateSelect" onchange="loadDate(this.value)"></select>
</div>

<div class="summary" id="summary"></div>
<div class="tabs" id="tabs"></div>
<div class="table-wrap">
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<p class="note">
  ※ KIS Open API · 평일 장 마감 후 자동 업데이트<br>
  ※ 과거 데이터 최대 1년 보관
</p>

<script src="/common.js?v=4"></script>
<script>
(function(){

var indexData = null;   // {dates:[], latest:''}
var currentDate = '';
var currentTab = '';
var dayData = null;     // 현재 날짜 데이터

var TAB_CONFIG = [
  {key:'ma50_breakout',         label:'10주선 돌파',       icon:'📈'},
  {key:'bb_upper_close',        label:'볼밴상단 종가',     icon:'🔺'},
  {key:'bb_upper_intra',        label:'볼밴상단 장중',     icon:'⚡'},
  {key:'rally_3d_10pct',        label:'3일양봉 10%↑',     icon:'🔥'},
  {key:'foreign_top15_buy',     label:'외인 매수 T15',    icon:'🏦'},
  {key:'foreign_top15_sell',    label:'외인 매도 T15',    icon:'🏦'},
  {key:'institution_top15_buy', label:'기관 매수 T15',    icon:'🏛'},
  {key:'institution_top15_sell',label:'기관 매도 T15',    icon:'🏛'},
  {key:'foreign_consecutive',   label:'외인 연속매수',     icon:'📊'},
  {key:'institution_consecutive',label:'기관 연속매수',    icon:'📊'},
];

// 탭별 테이블 컬럼 정의
function getColumns(tab){
  var base = [
    {key:'name',label:'종목',align:'left'},
    {key:'price',label:'현재가',unit:'원'},
    {key:'sector',label:'업종',align:'left'},
  ];
  if(tab==='ma50_breakout')
    return base.concat([{key:'ma50',label:'MA50',unit:'원'}]);
  if(tab==='bb_upper_close'||tab==='bb_upper_intra')
    return base.concat([{key:'bb_upper',label:'BB상단',unit:'원'},{key:'high',label:'고가',unit:'원'}]);
  if(tab==='rally_3d_10pct')
    return base.concat([{key:'gain_3d',label:'3일수익',unit:'%'}]);
  if(tab.indexOf('top15')>=0)
    return base.concat([{key:'net_amt',label:'순매수금액',unit:'만원'},{key:'net_qty',label:'순매수수량'}]);
  if(tab.indexOf('consecutive')>=0)
    return base.concat([{key:'consecutive',label:'연속일'}]);
  return base;
}

function fmt(v,unit){
  if(v===null||v===undefined) return '-';
  if(unit==='원') return v.toLocaleString()+'원';
  if(unit==='%') return v.toFixed(1)+'%';
  if(unit==='만원'){
    if(Math.abs(v)>=100000000) return (v/100000000).toFixed(0)+'억';
    if(Math.abs(v)>=10000) return (v/10000).toFixed(0)+'만';
    return v.toLocaleString();
  }
  return typeof v==='number'?v.toLocaleString():v;
}

// ── 날짜 네비 ──
function navDate(dir){
  if(!indexData||!indexData.dates.length) return;
  var idx=indexData.dates.indexOf(currentDate);
  var next=idx-dir; // dates는 최신순이라 방향 반전
  if(next<0) next=0;
  if(next>=indexData.dates.length) next=indexData.dates.length-1;
  loadDate(indexData.dates[next]);
}

function loadDate(d){
  currentDate=d;
  document.getElementById('dateLabel').textContent=d;
  document.getElementById('dateSelect').value=d;

  document.getElementById('tbody').innerHTML='<tr><td colspan="10" class="loading">로딩 중…</td></tr>';

  fetch('/data/kr/screener/'+d+'.json')
    .then(function(r){return r.json();})
    .then(function(data){
      dayData=data;
      renderSummary();
      renderTabs();
      if(!currentTab) currentTab=TAB_CONFIG[0].key;
      selectTab(currentTab);
    })
    .catch(function(){
      document.getElementById('tbody').innerHTML='<tr><td colspan="10" class="empty">데이터 없음</td></tr>';
    });
}

// ── 서머리 카드 ──
function renderSummary(){
  var el=document.getElementById('summary');
  if(!dayData||!dayData.summary){el.innerHTML='';return;}
  var s=dayData.summary;
  var cards=[
    {label:'10주선 돌파',num:s.ma50_breakout||0},
    {label:'볼밴 돌파',num:(s.bb_upper_close||0)+(s.bb_upper_intra||0)},
    {label:'3일양봉10%↑',num:s.rally_3d_10pct||0},
    {label:'외인 연속매수',num:s.foreign_consecutive||0},
    {label:'기관 연속매수',num:s.institution_consecutive||0},
  ];
  el.innerHTML=cards.map(function(c){
    return '<div class="summary-card"><div class="num">'+c.num+'</div><div class="label">'+c.label+'</div></div>';
  }).join('');
}

// ── 탭 ──
function renderTabs(){
  var el=document.getElementById('tabs');
  var s=dayData?dayData.summary:{};
  el.innerHTML=TAB_CONFIG.map(function(t){
    var cnt=s[t.key]||0;
    var cls='tab'+(t.key===currentTab?' active':'');
    return '<button class="'+cls+'" data-key="'+t.key+'">'+t.icon+' '+t.label+'<span class="cnt">('+cnt+')</span></button>';
  }).join('');
  el.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      selectTab(btn.getAttribute('data-key'));
    });
  });
}

function selectTab(key){
  currentTab=key;
  // 탭 active 갱신
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active',t.getAttribute('data-key')===key);
  });
  renderTable();
}

// ── 테이블 ──
function renderTable(){
  var cols=getColumns(currentTab);
  var items=(dayData&&dayData.signals)?dayData.signals[currentTab]||[]:[];

  // 헤더
  var thead=document.getElementById('thead');
  thead.innerHTML='<tr>'+cols.map(function(c){
    return '<th style="text-align:'+(c.align||'right')+'">'+c.label+'</th>';
  }).join('')+'</tr>';

  var tbody=document.getElementById('tbody');
  if(!items.length){
    tbody.innerHTML='<tr><td colspan="'+cols.length+'" class="empty">해당 시그널 없음</td></tr>';
    return;
  }

  tbody.innerHTML=items.map(function(item){
    return '<tr>'+cols.map(function(c){
      if(c.key==='name'){
        return '<td style="text-align:left"><span class="stock-name">'+item.name+'</span><span class="stock-code">'+item.code+'</span></td>';
      }
      if(c.key==='sector'){
        return '<td style="text-align:left"><span class="stock-sector">'+item.sector+'</span></td>';
      }
      var v=item[c.key];
      var cls='';
      if(c.key==='net_amt'||c.key==='net_qty'){
        cls=v>0?'up':v<0?'down':'';
      }
      if(c.key==='gain_3d') cls='up';
      if(c.key==='consecutive') cls='gold';
      return '<td'+(cls?' class="'+cls+'"':'')+'>'+ fmt(v,c.unit)+'</td>';
    }).join('')+'</tr>';
  }).join('');
}

// ── 초기화 ──
fetch('/data/kr/screener/index.json')
  .then(function(r){return r.json();})
  .then(function(idx){
    indexData=idx;
    var sel=document.getElementById('dateSelect');
    idx.dates.forEach(function(d){
      var opt=document.createElement('option');
      opt.value=d;opt.textContent=d;
      sel.appendChild(opt);
    });
    if(idx.latest) loadDate(idx.latest);
    else document.getElementById('tbody').innerHTML='<tr><td class="empty">아직 데이터 없음 — GitHub Actions에서 스크리너를 먼저 실행하세요</td></tr>';
  })
  .catch(function(){
    document.getElementById('tbody').innerHTML='<tr><td class="empty">index.json 로드 실패</td></tr>';
  });

window.navDate=navDate;
window.loadDate=loadDate;
})();
</script>
</body>
</html>
