<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>금융 계산기</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;max-width:900px;margin:0 auto;padding:40px 20px;background:#f5f7fa;color:#1a1a1a;min-height:100vh}.back-link{display:inline-block;margin-bottom:16px;color:#1F4E78;text-decoration:none;font-size:14px}.back-link:hover{text-decoration:underline}header{text-align:center;margin-bottom:40px}h1{color:#1F4E78;font-size:28px;margin-bottom:8px}.subtitle{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:white;border-radius:10px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,0.06);text-decoration:none;color:inherit;border:2px solid transparent;transition:all 0.15s ease;display:block}.card:hover{border-color:#1F4E78;transform:translateY(-2px);box-shadow:0 4px 12px rgba(31,78,120,0.15)}.icon{font-size:28px;margin-bottom:8px}.card-title{font-size:16px;font-weight:700;color:#1F4E78;margin-bottom:4px}.card-desc{font-size:12px;color:#666;line-height:1.4}footer{text-align:center;margin-top:60px;color:#999;font-size:12px}
</style>
</head>
<body>

<a href="../" class="back-link">← 메인으로</a>

<header>
  <h1>💼 금융 계산기</h1>

</header>

<div class="grid">
  <a href="loan/" class="card">
    <div class="icon">🏦</div>
    <div class="card-title">대출 상환 계산기</div>
    <div class="card-desc">원리금균등 · 원금균등 · 만기일시 · 거치기간 옵션</div>
  </a>
  <a href="compound/" class="card">
    <div class="icon">📈</div>
    <div class="card-title">복리 계산기</div>
    <div class="card-desc">일·주·월·연 단위 복리 + 추가 적립 + 인플레 반영</div>
  </a>
</div>

<footer>
  © 스윙파머
</footer>

<script src="/common.js?v=2"></script>
</body>
</html>
