<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex, nofollow">
<title>웹툰 트래커 — 스윙파머</title>
<link rel="stylesheet" href="/common.css?v=4">
<style>
:root { --sf-max-w: 720px; }

/* 상태 색상 */
.st-reading  { --st: #2563eb; }
.st-done     { --st: #10b981; }
.st-wishlist { --st: #8b5cf6; }
.st-dropped  { --st: #ef4444; }

/* 상단 통계 */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px; }
.stats-row .s-box { text-align:center; padding:12px 8px; border-radius:10px; background:var(--sf-surface); box-shadow:var(--sf-shadow); }
.stats-row .s-num { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
.stats-row .s-label { font-size:11px; color:var(--sf-text-dim); margin-top:2px; }
@media(max-width:500px){ .stats-row{grid-template-columns:repeat(2,1fr)} }

/* 필터+검색 바 */
.filter-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.filter-bar .f-btn {
  padding:7px 14px; border-radius:8px; border:1.5px solid var(--sf-border);
  background:var(--sf-surface); font-size:13px; font-weight:600; cursor:pointer;
  font-family:var(--sf-font); transition:all .15s; color:#666;
}
.filter-bar .f-btn:hover { border-color:var(--sf-brand); color:var(--sf-brand); }
.filter-bar .f-btn.active { background:var(--sf-brand); color:#fff; border-color:var(--sf-brand); }
.filter-bar .f-search {
  flex:1; min-width:140px; padding:7px 12px; border-radius:8px;
  border:1.5px solid var(--sf-border); font-size:13px; font-family:var(--sf-font);
  background:var(--sf-surface);
}
.filter-bar .f-search:focus { outline:2px solid var(--sf-brand); }

/* 정렬 */
.sort-bar { display:flex; gap:6px; margin-bottom:16px; align-items:center; }
.sort-bar span { font-size:12px; color:var(--sf-text-dim); }
.sort-bar select { padding:5px 8px; border-radius:6px; border:1px solid var(--sf-border); font-size:12px; font-family:var(--sf-font); background:var(--sf-surface); }

/* 카드 리스트 */
.wt-list { display:flex; flex-direction:column; gap:10px; }
.wt-card {
  background:var(--sf-surface); border-radius:10px; padding:16px;
  box-shadow:var(--sf-shadow); border-left:4px solid var(--st, #ccc);
  display:grid; grid-template-columns:1fr auto; gap:8px 16px; align-items:start;
  transition:all .15s;
}
.wt-card:hover { box-shadow:var(--sf-shadow-hover); }
.wt-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.wt-title { font-size:16px; font-weight:700; color:var(--sf-text); }
.wt-platform {
  font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px;
  background:#f0f0f0; color:#666;
}
.wt-platform.naver { background:#1ec800; color:#fff; }
.wt-platform.kakao { background:#fee500; color:#3c1e1e; }
.wt-platform.ridi  { background:#7b68ee; color:#fff; }
.wt-meta { font-size:12px; color:var(--sf-text-dim); display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; }
.wt-stars { color:#f59e0b; letter-spacing:1px; }
.wt-memo { font-size:12px; color:var(--sf-text-sub); margin-top:4px; font-style:italic; }
.wt-status-badge {
  font-size:11px; font-weight:700; padding:3px 10px; border-radius:6px;
  background:color-mix(in srgb, var(--st) 15%, transparent); color:var(--st);
  white-space:nowrap;
}
.wt-actions { display:flex; gap:4px; justify-self:end; align-self:center; }
.wt-actions button {
  background:none; border:1px solid var(--sf-border); border-radius:6px;
  width:30px; height:30px; cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center; transition:all .15s;
}
.wt-actions button:hover { border-color:var(--sf-brand); background:#f0f5fa; }
.wt-actions button.del:hover { border-color:var(--sf-red); background:#fef2f2; }

/* 추가 모달 */
.modal-overlay {
  position:fixed; inset:0; z-index:100000; background:rgba(0,0,0,.45);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--sf-surface); border-radius:14px; width:100%; max-width:440px;
  padding:28px; box-shadow:0 10px 40px rgba(0,0,0,.2); max-height:90vh; overflow-y:auto;
}
.modal h2 { margin:0 0 20px; font-size:18px; color:var(--sf-brand); }
.modal .m-row { margin-bottom:14px; }
.modal label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:#333; }
.modal input, .modal select, .modal textarea {
  width:100%; padding:10px; border:1.5px solid var(--sf-border); border-radius:8px;
  font-size:14px; font-family:var(--sf-font); background:var(--sf-surface);
}
.modal input:focus, .modal select:focus, .modal textarea:focus { outline:2px solid var(--sf-brand); }
.modal textarea { resize:vertical; min-height:50px; }
.modal .star-input { display:flex; gap:4px; font-size:28px; cursor:pointer; }
.modal .star-input span { color:#ddd; transition:color .1s; user-select:none; }
.modal .star-input span.on { color:#f59e0b; }
.modal .m-btns { display:flex; gap:8px; margin-top:20px; }
.modal .m-btns button {
  flex:1; padding:12px; border:none; border-radius:10px; font-size:14px;
  font-weight:700; cursor:pointer; font-family:var(--sf-font); transition:all .15s;
}
.btn-save { background:var(--sf-brand); color:#fff; }
.btn-save:hover { opacity:.9; }
.btn-cancel { background:var(--sf-border); color:#666; }
.btn-cancel:hover { background:#d1d5db; }

/* FAB */
.fab {
  position:fixed; bottom:24px; right:24px; width:56px; height:56px;
  border-radius:50%; background:var(--sf-brand); color:#fff; border:none;
  font-size:28px; cursor:pointer; box-shadow:0 4px 16px rgba(31,78,120,.35);
  z-index:99990; display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.fab:hover { transform:scale(1.1); }

/* 빈 상태 */
.empty-state { text-align:center; padding:60px 20px; color:var(--sf-text-dim); }
.empty-state .empty-icon { font-size:48px; margin-bottom:12px; }
.empty-state p { font-size:14px; line-height:1.6; }

/* 다크모드 보정 */
body.sf-dark .wt-card { background:#1e242e; border-color:#2c333f; }
body.sf-dark .wt-card { border-left-color:var(--st); }
body.sf-dark .wt-title { color:#d8dde5; }
body.sf-dark .wt-platform { background:#2a313d; color:#aab3c0; }
body.sf-dark .wt-platform.naver { background:#1ec800; color:#fff; }
body.sf-dark .wt-platform.kakao { background:#fee500; color:#3c1e1e; }
body.sf-dark .wt-platform.ridi  { background:#7b68ee; color:#fff; }
body.sf-dark .filter-bar .f-btn { background:#1e242e; color:#aab3c0; border-color:#2c333f; }
body.sf-dark .filter-bar .f-btn.active { background:var(--sf-brand); color:#fff; }
body.sf-dark .filter-bar .f-search { background:#1e242e; color:#d8dde5; border-color:#2c333f; }
body.sf-dark .modal { background:#1e242e; }
body.sf-dark .modal input, body.sf-dark .modal select, body.sf-dark .modal textarea { background:#2a313d; color:#d8dde5; border-color:#3a4250; }
body.sf-dark .s-box { background:#1e242e; }
</style>
</head>
<body class="sf-narrow">

<a href="/" class="back-link">← 홈</a>
<h1>📚 웹툰 트래커</h1>
<p class="desc">읽은 웹툰 기록 — 보는중·다봄·볼거·하차 관리</p>

<div class="stats-row" id="stats"></div>

<div class="filter-bar">
  <button class="f-btn active" data-f="all">전체</button>
  <button class="f-btn" data-f="reading">📖 보는중</button>
  <button class="f-btn" data-f="done">✅ 다봄</button>
  <button class="f-btn" data-f="wishlist">💜 볼거</button>
  <button class="f-btn" data-f="dropped">🚫 하차</button>
  <input class="f-search" type="text" placeholder="🔍 작품명 검색…" id="searchInput">
</div>

<div class="sort-bar">
  <span>정렬</span>
  <select id="sortSelect">
    <option value="updated">최근 수정순</option>
    <option value="title">이름순</option>
    <option value="rating">별점순</option>
    <option value="episode">화수순</option>
  </select>
</div>

<div class="wt-list" id="wtList"></div>

<button class="fab" id="fabAdd" title="작품 추가">+</button>

<!-- 추가/수정 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">작품 추가</h2>
    <div class="m-row">
      <label>작품명 *</label>
      <input type="text" id="mTitle" placeholder="예: 검술명가 막내아들" autocomplete="off">
    </div>
    <div class="m-row">
      <label>플랫폼</label>
      <select id="mPlatform">
        <option value="">선택 안함</option>
        <option value="naver">네이버웹툰</option>
        <option value="kakao">카카오웹툰</option>
        <option value="kakaopage">카카오페이지</option>
        <option value="ridi">리디</option>
        <option value="lezhin">레진코믹스</option>
        <option value="etc">기타</option>
      </select>
    </div>
    <div class="m-row">
      <label>상태</label>
      <select id="mStatus">
        <option value="reading">📖 보는중</option>
        <option value="done">✅ 다봄</option>
        <option value="wishlist">💜 볼거</option>
        <option value="dropped">🚫 하차</option>
      </select>
    </div>
    <div class="m-row">
      <label>현재 화수</label>
      <input type="number" id="mEpisode" min="0" placeholder="0">
    </div>
    <div class="m-row">
      <label>별점</label>
      <div class="star-input" id="starInput">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="m-row">
      <label>메모</label>
      <textarea id="mMemo" placeholder="한줄평 / 하차 이유 등" rows="2"></textarea>
    </div>
    <div class="m-btns">
      <button class="btn-cancel" id="btnCancel">취소</button>
      <button class="btn-save" id="btnSave">저장</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script type="module">
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, Timestamp }
  from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';

const COL = 'webtoon';
let db, items = [], editId = null, starVal = 0;

/* ── Firebase 준비 ── */
_sfFirebaseReady.promise.then(auth => {
  const { getApps } = window; // already initialized by common.js
  db = getFirestore();
  loadAll();
});

/* ── 데이터 로드 ── */
async function loadAll() {
  const snap = await getDocs(collection(db, COL));
  items = [];
  snap.forEach(d => items.push({ id: d.id, ...d.data() }));
  render();
}

/* ── 렌더링 ── */
const STATUS = { reading:'📖 보는중', done:'✅ 다봄', wishlist:'💜 볼거', dropped:'🚫 하차' };
const PLAT_LABEL = { naver:'네이버', kakao:'카카오', kakaopage:'카카오페이지', ridi:'리디', lezhin:'레진', etc:'기타' };

function render() {
  // 통계
  const cnt = { reading:0, done:0, wishlist:0, dropped:0 };
  items.forEach(it => cnt[it.status] = (cnt[it.status]||0)+1);
  document.getElementById('stats').innerHTML =
    `<div class="s-box st-reading"><div class="s-num" style="color:#2563eb">${cnt.reading}</div><div class="s-label">보는중</div></div>` +
    `<div class="s-box st-done"><div class="s-num" style="color:#10b981">${cnt.done}</div><div class="s-label">다봄</div></div>` +
    `<div class="s-box st-wishlist"><div class="s-num" style="color:#8b5cf6">${cnt.wishlist}</div><div class="s-label">볼거</div></div>` +
    `<div class="s-box st-dropped"><div class="s-num" style="color:#ef4444">${cnt.dropped}</div><div class="s-label">하차</div></div>`;

  // 필터
  const filt = document.querySelector('.f-btn.active')?.dataset.f || 'all';
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = items.filter(it => {
    if (filt !== 'all' && it.status !== filt) return false;
    if (q && !it.title.toLowerCase().includes(q)) return false;
    return true;
  });

  // 정렬
  const sort = document.getElementById('sortSelect').value;
  list.sort((a,b) => {
    if (sort === 'title') return (a.title||'').localeCompare(b.title||'');
    if (sort === 'rating') return (b.rating||0) - (a.rating||0);
    if (sort === 'episode') return (b.episode||0) - (a.episode||0);
    // updated (default)
    const ta = a.updatedAt?.seconds || 0, tb = b.updatedAt?.seconds || 0;
    return tb - ta;
  });

  const el = document.getElementById('wtList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><p>등록된 작품이 없습니다.<br>+ 버튼으로 추가해보세요.</p></div>';
    return;
  }

  el.innerHTML = list.map(it => {
    const stClass = 'st-' + (it.status||'reading');
    const platClass = it.platform || '';
    const stars = it.rating ? '★'.repeat(it.rating) + '☆'.repeat(5 - it.rating) : '';
    return `<div class="wt-card ${stClass}">
      <div>
        <div class="wt-top">
          <span class="wt-title">${esc(it.title)}</span>
          ${it.platform ? `<span class="wt-platform ${platClass}">${PLAT_LABEL[it.platform]||it.platform}</span>` : ''}
        </div>
        <div class="wt-meta">
          <span class="wt-status-badge">${STATUS[it.status]||it.status}</span>
          ${it.episode ? `<span>${it.episode}화</span>` : ''}
          ${stars ? `<span class="wt-stars">${stars}</span>` : ''}
        </div>
        ${it.memo ? `<div class="wt-memo">"${esc(it.memo)}"</div>` : ''}
      </div>
      <div class="wt-actions">
        <button title="수정" onclick="editItem('${it.id}')">✏️</button>
        <button title="삭제" class="del" onclick="delItem('${it.id}','${esc(it.title)}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── 모달 ── */
function openModal(data) {
  document.getElementById('modalTitle').textContent = data ? '작품 수정' : '작품 추가';
  document.getElementById('mTitle').value = data?.title || '';
  document.getElementById('mPlatform').value = data?.platform || '';
  document.getElementById('mStatus').value = data?.status || 'reading';
  document.getElementById('mEpisode').value = data?.episode || '';
  document.getElementById('mMemo').value = data?.memo || '';
  starVal = data?.rating || 0;
  updateStars();
  editId = data?.id || null;
  document.getElementById('modal').classList.add('show');
  document.getElementById('mTitle').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  editId = null;
}

function updateStars() {
  document.querySelectorAll('#starInput span').forEach(s => {
    s.classList.toggle('on', +s.dataset.v <= starVal);
  });
}

/* ── 저장 ── */
async function save() {
  const title = document.getElementById('mTitle').value.trim();
  if (!title) { alert('작품명을 입력하세요.'); return; }
  const obj = {
    title,
    platform: document.getElementById('mPlatform').value,
    status: document.getElementById('mStatus').value,
    episode: parseInt(document.getElementById('mEpisode').value) || 0,
    rating: starVal,
    memo: document.getElementById('mMemo').value.trim(),
    updatedAt: Timestamp.now()
  };
  try {
    if (editId) {
      await updateDoc(doc(db, COL, editId), obj);
    } else {
      obj.createdAt = Timestamp.now();
      await addDoc(collection(db, COL), obj);
    }
    closeModal();
    await loadAll();
  } catch(e) { alert('저장 실패: ' + e.message); }
}

/* ── 삭제 ── */
window.delItem = async function(id, title) {
  if (!confirm(`"${title}" 삭제할까요?`)) return;
  try {
    await deleteDoc(doc(db, COL, id));
    await loadAll();
  } catch(e) { alert('삭제 실패: ' + e.message); }
};

/* ── 수정 ── */
window.editItem = function(id) {
  const it = items.find(x => x.id === id);
  if (it) openModal(it);
};

/* ── 이벤트 ── */
document.getElementById('fabAdd').addEventListener('click', () => openModal(null));
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', save);

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

document.querySelectorAll('#starInput span').forEach(s => {
  s.addEventListener('click', () => { starVal = +s.dataset.v; updateStars(); });
});

document.querySelectorAll('.f-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);

// ESC로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
