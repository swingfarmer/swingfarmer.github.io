<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;max-width:780px;margin:0 auto;padding:20px;background:#f5f7fa;color:#1a1a1a}
.back-link{display:inline-block;margin-bottom:16px;color:#1F4E78;text-decoration:none;font-size:14px}
.back-link:hover{text-decoration:underline}
h1{color:#1F4E78;border-bottom:3px solid #1F4E78;padding-bottom:10px;margin-bottom:6px}
.desc{color:#666;font-size:14px;margin-bottom:8px}
.today{font-size:13px;color:#888;margin-bottom:20px}
.quote-card{background:white;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.07);margin-bottom:16px;border-left:5px solid #1F4E78;position:relative;overflow:hidden}
.quote-mark{font-size:46px;color:#e0e7f0;font-weight:800;line-height:1;position:absolute;top:12px;right:18px}
.quote-cat{display:inline-block;font-size:11px;font-weight:700;color:#1F4E78;background:#eef2f7;padding:3px 10px;border-radius:10px;margin-bottom:10px}
.quote-text{font-size:18px;font-weight:700;line-height:1.55;margin-bottom:12px;position:relative;z-index:1}
.quote-author{font-size:13px;font-weight:600;color:#1F4E78;margin-bottom:12px}
.quote-author::before{content:"— "}
.quote-meaning{font-size:13.5px;line-height:1.7;color:#555;background:#f8fafc;padding:13px 15px;border-radius:8px}
.quote-meaning b{color:#1F4E78}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.nav button{background:#1F4E78;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.nav button:hover{background:#2d5a8c}
.nav .page-info{font-size:13px;color:#888}
.tabs{display:flex;gap:6px;margin:20px 0;flex-wrap:wrap}
.tab{padding:7px 14px;background:white;border:1px solid #d0d7e0;color:#555;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.15s}
.tab:hover{background:#eef2f7}
.tab.active{background:#1F4E78;color:white;border-color:#1F4E78}
.section-head{font-size:16px;color:#1F4E78;font-weight:700;margin:24px 0 12px}
.all-link{text-align:center;margin-top:20px}
.all-link a{color:#1F4E78;font-size:13px;text-decoration:none;cursor:pointer}
.all-link a:hover{text-decoration:underline}
footer{text-align:center;margin-top:40px;color:#999;font-size:12px}
</style>

<h1>💬 오늘의 투자 명언</h1>
<p class="desc">매일 3개씩 자동으로 바뀝니다. 위대한 투자자들의 지혜와 증시 격언, 그리고 그 해석.</p>

  <button id="nextBtn" onclick="changeDay(1)">다음 →</button>
</div>

<div class="all-link">

</div>

<footer>© 스윙파머 · 오늘의 투자 명언</footer>

<script>
const quotes = [
  { text:"남들이 탐욕스러울 때 두려워하고, 남들이 두려워할 때 탐욕스러워라.", author:"워런 버핏", cat:"공포에 용기, 환희에 조심", meaning:"시장이 과열돼 모두 사들일 때는 거품을 경계하고, 공포에 모두 팔 때 기회를 찾으라는 <b>역발상 투자</b>의 핵심." },
  { text:"비관론자처럼 분석하고, 낙관론자처럼 행동하라.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"리스크는 냉정하고 보수적으로 따지되, 일단 확신이 서면 과감하게 실행하라는 뜻." },
  { text:"거리에 피가 낭자할 때 사라.", author:"네이선 로스차일드", cat:"공포에 용기, 환희에 조심", meaning:"공황과 폭락으로 모두가 절망할 때가 오히려 최고의 매수 기회. 극단적 공포는 바닥 신호일 때가 많다." },
  { text:"강세장은 비관 속에서 태어나, 회의 속에서 자라고, 낙관 속에서 성숙하며, 행복감 속에서 죽는다.", author:"존 템플턴", cat:"공포에 용기, 환희에 조심", meaning:"시장 사이클의 심리 단계. 모두가 행복할 때(꼭지)를 조심하고, 모두가 비관할 때(바닥)를 주목하라." },
  { text:"가장 비싼 네 단어는 '이번엔 다르다'이다.", author:"존 템플턴", cat:"공포에 용기, 환희에 조심", meaning:"버블 때마다 '이번엔 다르다'며 정당화하지만 결국 거품은 터진다. 역사의 교훈을 잊지 말라는 경고." },
  { text:"군중이 가는 곳에 기회는 없다.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"모두 몰리는 인기 종목은 이미 가격에 반영돼 수익 기회가 적다. 남들과 다른 시각이 초과수익을 만든다." },
  { text:"소문에 사서 뉴스에 팔아라.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"기대(소문)가 형성될 때 주가가 오르고, 막상 사실(뉴스)이 공개되면 차익 실현 매물이 나온다는 시장 생리." },
  { text:"주식시장은 인내심 없는 사람의 돈을 인내심 있는 사람에게 옮기는 장치다.", author:"워런 버핏", cat:"인내·장기투자", meaning:"단기 변동에 흔들려 조급하게 매매하는 사람은 잃고, 좋은 기업을 오래 기다리는 사람이 결국 가져간다." },
  { text:"10년간 보유할 주식이 아니라면 10분도 보유하지 마라.", author:"워런 버핏", cat:"인내·장기투자", meaning:"단기 시세차익이 아니라 10년을 믿고 맡길 수 있는 기업에만 투자하라는 장기투자 철학." },
  { text:"우리가 가장 좋아하는 보유 기간은 영원이다.", author:"워런 버핏", cat:"인내·장기투자", meaning:"진짜 좋은 기업은 팔 이유가 없다. 매매가 아니라 동업한다는 마음으로 장기 보유하라." },
  { text:"시간은 훌륭한 기업의 친구이고, 평범한 기업의 적이다.", author:"워런 버핏", cat:"인내·장기투자", meaning:"좋은 기업은 시간이 갈수록 가치가 쌓이지만, 부실한 기업은 시간이 갈수록 문제가 드러난다." },
  { text:"인내는 투자자의 가장 큰 무기다.", author:"증시 격언", cat:"인내·장기투자", meaning:"좋은 기회는 자주 오지 않고, 좋은 종목도 빛을 보기까지 시간이 걸린다. 기다릴 줄 아는 능력이 수익을 만든다." },
  { text:"나무는 하늘까지 자라지 않는다.", author:"증시 격언", cat:"인내·장기투자", meaning:"아무리 좋은 주식도 끝없이 오르지 않는다. 과도한 상승 뒤엔 조정이 온다는 점을 경계하라." },
  { text:"가격은 당신이 지불하는 것이고, 가치는 당신이 얻는 것이다.", author:"워런 버핏", cat:"가치 vs 가격", meaning:"주가(가격)와 기업의 실제 가치는 다르다. 싼 가격이 아니라 그 기업의 진짜 가치를 보고 투자하라." },
  { text:"훌륭한 기업을 적정한 가격에 사는 것이, 평범한 기업을 싼 가격에 사는 것보다 낫다.", author:"워런 버핏", cat:"가치 vs 가격", meaning:"단순히 싼 주식보다, 경쟁력 있는 좋은 기업을 합리적 가격에 사는 것이 장기적으로 유리하다." },
  { text:"시장은 단기적으로는 투표기계지만, 장기적으로는 저울이다.", author:"벤저민 그레이엄", cat:"가치 vs 가격", meaning:"단기 주가는 인기·심리(투표)로 움직이지만, 장기적으로는 기업의 실제 가치(무게)로 수렴한다." },
  { text:"안전마진을 항상 확보하라.", author:"벤저민 그레이엄", cat:"가치 vs 가격", meaning:"기업 가치보다 충분히 싼 가격에 사서, 판단이 틀려도 손실을 줄일 여유(안전마진)를 두라는 가치투자의 핵심." },
  { text:"미스터 마켓은 매일 가격을 제시하지만, 그를 따를지는 당신의 선택이다.", author:"벤저민 그레이엄", cat:"가치 vs 가격", meaning:"시장은 감정적으로 매일 다른 가격을 부른다. 그 변덕에 휘둘리지 말고 가치 판단의 기준으로만 활용하라." },
  { text:"좋은 주식을 비싸게 사면 나쁜 투자가 된다.", author:"증시 격언", cat:"가치 vs 가격", meaning:"아무리 우량한 기업도 너무 비싼 가격에 사면 수익을 내기 어렵다. 기업의 질과 매수 가격은 별개로 따져야 한다." },
  { text:"분산투자는 무지에 대한 보호장치다. 자신이 무엇을 하는지 안다면 별 의미가 없다.", author:"워런 버핏", cat:"분산 vs 집중", meaning:"잘 모르면 분산이 안전하지만, 확신 있는 좋은 기업이 있다면 집중 투자가 낫다. 단 일반 투자자에겐 분산이 안전." },
  { text:"계란을 한 바구니에 담지 마라.", author:"증시 격언", cat:"분산 vs 집중", meaning:"한 종목·자산에 전부 걸면 그것이 무너질 때 전부 잃는다. 위험을 나누라는 분산투자의 기본." },
  { text:"계란을 한 바구니에 담되, 그 바구니를 잘 지켜봐라.", author:"앤드루 카네기", cat:"분산 vs 집중", meaning:"확신 있는 곳에 집중하되 철저히 관리하라는 집중투자 관점. 분산과 집중은 상황에 따라 선택." },
  { text:"6개의 훌륭한 기업을 아는 것이, 형편없는 60개에 분산하는 것보다 안전하다.", author:"필립 피셔", cat:"분산 vs 집중", meaning:"제대로 아는 소수 우량 기업에 집중하는 것이, 잘 모르는 다수에 분산하는 것보다 오히려 안전할 수 있다." },
  { text:"과도한 분산은 자신이 무엇을 가졌는지도 모르게 만든다.", author:"증시 격언", cat:"분산 vs 집중", meaning:"너무 많은 종목으로 분산하면 관리도 안 되고 수익도 평범해진다. 적절한 분산과 과잉 분산은 다르다." },
  { text:"규칙 1: 절대 돈을 잃지 마라. 규칙 2: 규칙 1을 잊지 마라.", author:"워런 버핏", cat:"리스크 관리·손절", meaning:"수익을 좇기 전에 손실을 막는 것이 먼저다. 원금 보존을 최우선으로 두라는 보수적 투자 원칙." },
  { text:"손실은 빨리 끊고, 이익은 길게 가져가라.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"손실 종목은 미련 없이 손절하고, 수익 종목은 성급히 팔지 말라. 손익비를 관리하는 매매의 기본." },
  { text:"살아남는 것이 먼저고, 돈 버는 것은 그다음이다.", author:"조지 소로스", cat:"리스크 관리·손절", meaning:"큰 손실로 시장에서 퇴출되면 기회 자체가 없어진다. 우선 살아남아 다음 기회를 노릴 수 있어야 한다." },
  { text:"틀렸을 때 얼마나 잃느냐가, 맞았을 때 얼마나 버느냐보다 중요하다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"투자는 승률보다 손익 관리가 핵심. 한 번의 큰 손실이 여러 번의 작은 수익을 날릴 수 있다." },
  { text:"떨어지는 칼날을 잡지 마라.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"급락 중인 종목을 '싸다'고 섣불리 매수하면 더 큰 손실을 본다. 하락이 멈추는 것을 확인하고 들어가라." },
  { text:"물타기는 손실을 키우는 가장 빠른 길이 될 수 있다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"하락 이유를 모른 채 평단만 낮추려 추가 매수하면 손실 규모가 더 커진다. 물타기 전에 펀더멘털을 확인하라." },
  { text:"투자에서 가장 위험한 것은 '이번엔 다르다'는 생각과 자신의 감정이다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"시장 변동보다 투자자 본인의 탐욕·공포·자만이 더 큰 적이다. 감정 통제가 실력의 절반." },
  { text:"투자자의 가장 큰 적은 바로 자기 자신이다.", author:"벤저민 그레이엄", cat:"심리·감정 통제", meaning:"시장이 아니라 자신의 조급함·욕심·공포가 손실을 만든다. 자기 통제가 투자 성공의 핵심." },
  { text:"머리가 아니라 위장으로 투자하면 진다.", author:"피터 린치", cat:"심리·감정 통제", meaning:"두려움이나 흥분 같은 감정(위장의 느낌)에 따라 매매하면 실패한다. 냉정한 분석(머리)으로 판단하라." },
  { text:"주식 투자의 핵심은 남보다 똑똑한 것이 아니라, 남보다 감정을 잘 다스리는 것이다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"지능이나 정보보다 규율과 인내, 감정 통제가 장기 수익을 결정한다." },
  { text:"공포와 탐욕이 시장을 움직인다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"시장의 단기 변동은 결국 사람들의 공포와 탐욕이라는 두 감정의 결과. 이를 이해하면 군중심리를 읽을 수 있다." },
  { text:"시장을 예측하려 하지 마라. 아무도 할 수 없다.", author:"피터 린치", cat:"시장 예측의 함정", meaning:"단기 시장 방향을 맞히려는 시도는 대부분 실패한다. 예측보다 좋은 기업을 사서 보유하는 데 집중하라." },
  { text:"경제 예측가들이 존재하는 이유는 점성술사를 그럴듯해 보이게 하기 위해서다.", author:"존 케네스 갤브레이스", cat:"시장 예측의 함정", meaning:"경제·시장 예측의 정확도가 매우 낮음을 풍자. 예측에 의존한 투자의 위험성을 경고." },
  { text:"시장의 바닥과 꼭지를 잡으려는 사람은 거짓말쟁이거나 바보다.", author:"증시 격언", cat:"시장 예측의 함정", meaning:"정확한 고점·저점은 아무도 맞힐 수 없다. 타이밍을 노리기보다 분할 매매와 장기 관점이 현실적이다." },
  { text:"주가가 어디로 갈지는 모르지만, 좋은 기업인지는 알 수 있다.", author:"증시 격언", cat:"시장 예측의 함정", meaning:"단기 주가 방향은 예측 불가지만, 기업의 본질적 경쟁력은 분석으로 판단 가능하다. 후자에 집중하라." },
  { text:"위험은 자신이 무엇을 하는지 모르는 데서 온다.", author:"워런 버핏", cat:"공부·이해의 중요성", meaning:"진짜 위험은 시장 변동이 아니라 투자 대상을 이해하지 못하는 것. 잘 아는 분야에 투자하라." },
  { text:"당신이 이해하지 못하는 사업에는 투자하지 마라.", author:"워런 버핏", cat:"공부·이해의 중요성", meaning:"비즈니스 모델·수익 구조를 이해하지 못하면 가치 판단도 못 한다. 자신의 '능력범위' 안에서 투자하라." },
  { text:"투자하기 전에 최소한 그 기업을 설명할 수 있어야 한다.", author:"피터 린치", cat:"공부·이해의 중요성", meaning:"어린아이에게도 설명할 만큼 그 기업을 이해해야 한다. 모르고 사는 것은 투자가 아니라 도박." },
  { text:"아는 것에 투자하라.", author:"피터 린치", cat:"공부·이해의 중요성", meaning:"자신이 잘 아는 산업·생활 속에서 발견한 기업이 좋은 투자처가 될 수 있다. 일상의 관찰이 투자 아이디어." },
  { text:"공부 없는 투자는 패를 보지 않고 포커를 치는 것과 같다.", author:"피터 린치", cat:"공부·이해의 중요성", meaning:"기업 분석·재무 공부 없이 투자하는 것은 운에 맡기는 도박이다. 준비된 자가 이긴다." },
  { text:"복리는 세계 8번째 불가사의다. 이해하는 자는 벌고, 모르는 자는 낸다.", author:"증시 격언", cat:"복리·시간의 힘", meaning:"복리의 위력은 시간이 갈수록 기하급수적이다. 일찍, 오래 투자할수록 유리하다. (출처 불확실하나 핵심 진리)" },
  { text:"인생은 눈덩이와 같다. 중요한 건 축축한 눈과 긴 언덕을 찾는 것이다.", author:"워런 버핏", cat:"복리·시간의 힘", meaning:"복리(눈덩이)가 굴러 커지려면 좋은 수익률(축축한 눈)과 긴 시간(긴 언덕)이 필요하다. 일찍 시작하라." },
  { text:"부자가 되는 가장 확실한 방법은 천천히 부자가 되는 것이다.", author:"증시 격언", cat:"복리·시간의 힘", meaning:"일확천금을 노리면 위험이 커진다. 꾸준한 복리로 시간을 들여 쌓는 것이 가장 안전하고 확실하다." },
  { text:"시장에 머문 시간이, 시장 타이밍보다 중요하다.", author:"증시 격언", cat:"복리·시간의 힘", meaning:"언제 사고파느냐(타이밍)보다, 얼마나 오래 투자에 머무느냐가 장기 수익을 좌우한다. 복리는 시간의 함수." },
  { text:"투자는 휘두를 때마다 스트라이크가 없는 야구다. 좋은 공을 기다려라.", author:"워런 버핏", cat:"기다림·기회 포착", meaning:"억지로 매매할 필요 없다. 확실한 기회(좋은 공)가 올 때까지 기다렸다가 크게 휘둘러라." },
  { text:"현금도 하나의 포지션이다.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"항상 주식을 들고 있을 필요는 없다. 기회가 없을 땐 현금을 들고 기다리는 것도 전략이다." },
  { text:"기회는 준비된 자에게만 보인다.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"평소 공부하고 현금을 준비해둔 사람만이 폭락장 같은 기회를 잡을 수 있다. 기회는 준비의 결과." },
  { text:"좋은 투자 기회는 자주 오지 않는다. 올 때 크게 베팅하라.", author:"찰리 멍거", cat:"기다림·기회 포착", meaning:"평생 만나는 진짜 좋은 기회는 몇 번뿐이다. 그 순간이 오면 확신을 갖고 과감히 투자하라." },

  // ===== 2차 50개 =====
  // ── 매도·차익실현 ──
  { text:"이익은 실현하기 전까지는 이익이 아니다.", author:"증시 격언", cat:"매도·차익실현", meaning:"장부상 평가이익은 팔기 전엔 내 돈이 아니다. 적절한 시점에 실현해야 진짜 수익이 된다." },
  { text:"무릎에서 사서 어깨에서 팔아라.", author:"증시 격언", cat:"매도·차익실현", meaning:"바닥(발)과 천장(머리)을 노리지 말라. 적당히 낮을 때 사서 적당히 높을 때 팔면 충분하다." },
  { text:"산 이유가 사라지면 팔아라.", author:"증시 격언", cat:"매도·차익실현", meaning:"매수했던 근거(실적·성장성 등)가 훼손되면 미련 없이 매도하라. 주가가 아니라 논리로 판단." },
  { text:"고점에 팔려 하지 말고, 충분히 먹었으면 만족하라.", author:"증시 격언", cat:"매도·차익실현", meaning:"최고점 매도는 운이다. 욕심부리다 수익을 토해내느니, 적정 수익에 만족하는 것이 낫다." },
  { text:"매수는 기술, 매도는 예술이다.", author:"증시 격언", cat:"매도·차익실현", meaning:"사는 것보다 파는 것이 훨씬 어렵다. 감정·욕심이 개입되는 매도 타이밍이 투자의 진짜 실력." },

  // ── 투기 vs 투자 경계 ──
  { text:"투자는 철저한 분석 위에서 원금 안전과 적정 수익을 추구하는 것이다. 그렇지 않으면 투기다.", author:"벤저민 그레이엄", cat:"투기 vs 투자 경계", meaning:"분석과 안전마진에 근거하면 투자, 그저 오를 것 같아서 사면 투기. 둘을 명확히 구분하라." },
  { text:"빚내서 투자하지 마라.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"레버리지는 수익도 손실도 키운다. 빚으로 투자하면 작은 하락에도 버티지 못하고 강제 청산당한다." },
  { text:"확실한 한 방을 노리는 것이 가장 위험하다.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"인생역전을 노린 몰빵·한방 투자는 도박이다. 잃으면 회복 불가능한 베팅은 피하라." },
  { text:"공짜 점심은 없다.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"고수익에는 반드시 고위험이 따른다. '쉽게 큰돈' 같은 말은 대부분 사기이거나 함정." },
  { text:"확실한 정보는 이미 늦은 정보다.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"누구나 아는 '확실한 호재'는 이미 주가에 반영됐다. 남에게 들은 정보로 사면 막차일 가능성이 높다." },

  // ── 거시경제·금리 ──
  { text:"금리는 자산 가격의 중력과 같다.", author:"워런 버핏", cat:"거시경제·금리", meaning:"금리가 오르면 모든 자산 가치를 끌어내리고, 내리면 띄운다. 금리는 주식·부동산 가격의 근본 동력." },
  { text:"연준에 맞서지 마라.", author:"증시 격언", cat:"거시경제·금리", meaning:"중앙은행(연준)의 정책 방향(긴축·완화)을 거슬러 투자하면 이기기 어렵다. 큰 흐름에 순응하라." },
  { text:"인플레이션은 보이지 않는 세금이다.", author:"증시 격언", cat:"거시경제·금리", meaning:"물가 상승은 현금의 구매력을 갉아먹는다. 현금만 들고 있으면 가만히 있어도 자산이 줄어든다." },
  { text:"경기는 순환한다. 영원한 호황도, 영원한 불황도 없다.", author:"증시 격언", cat:"거시경제·금리", meaning:"경제는 확장과 수축을 반복한다. 사이클 위치를 이해하면 공포와 탐욕에 덜 휘둘린다." },
  { text:"썰물이 빠지면 누가 발가벗고 헤엄쳤는지 드러난다.", author:"워런 버핏", cat:"거시경제·금리", meaning:"호황(밀물)엔 부실도 가려지지만, 위기(썰물)가 오면 약한 기업·무리한 투자가 드러난다. 평소 체력이 중요." },

  // ── 단순함·상식의 힘 ──
  { text:"단순함이 정교함의 궁극이다.", author:"레오나르도 다빈치", cat:"단순함·상식의 힘", meaning:"복잡한 전략보다 단순하고 일관된 원칙이 장기적으로 이긴다. 투자도 단순할수록 실수가 적다." },
  { text:"투자는 단순해야 하지만 쉽지는 않다.", author:"워런 버핏", cat:"단순함·상식의 힘", meaning:"원칙 자체는 단순하지만, 그것을 감정 없이 꾸준히 지키는 것은 어렵다. 단순함과 쉬움은 다르다." },
  { text:"이해할 수 없는 복잡한 상품은 사지 마라.", author:"증시 격언", cat:"단순함·상식의 힘", meaning:"구조가 복잡해 이해 안 되는 금융상품엔 보통 숨은 위험·수수료가 있다. 모르면 사지 마라." },
  { text:"상식이 가장 좋은 투자 도구다.", author:"증시 격언", cat:"단순함·상식의 힘", meaning:"화려한 이론보다 '이게 말이 되나?'라는 상식적 판단이 위험을 피하게 해준다." },
  { text:"천재가 아니어도 투자로 성공할 수 있다. 필요한 건 기질이다.", author:"워런 버핏", cat:"단순함·상식의 힘", meaning:"높은 IQ보다 인내·규율·감정 통제 같은 기질이 투자 성공을 결정한다. 똑똑함이 전부가 아니다." },

  // ── 성공 투자자의 습관 ──
  { text:"좋은 투자자는 사는 것보다 기다리는 데 더 많은 시간을 쓴다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"항상 매매하는 것이 아니라, 좋은 기회가 올 때까지 관찰하고 기다리는 것이 고수의 자세." },
  { text:"기록하지 않으면 배우지 못한다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"매매 이유와 결과를 기록하고 복기해야 실수를 반복하지 않는다. 매매일지는 성장의 도구." },
  { text:"자신만의 원칙을 세우고 지켜라.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"시장 분위기에 휩쓸리지 않으려면 자기만의 투자 원칙이 있어야 한다. 원칙 없는 매매는 표류." },
  { text:"모르면 쉬어라.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"확신이 없을 땐 억지로 매매하지 말고 관망하라. 쉬는 것도 훌륭한 투자 결정이다." },
  { text:"꾸준함이 천재성을 이긴다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"한 번의 대박보다 꾸준한 원칙 준수와 복리가 장기적으로 더 큰 부를 만든다." },

  // ── 한국 증시 격언 ──
  { text:"밀짚모자는 겨울에 사라.", author:"증시 격언", cat:"한국 증시 격언", meaning:"수요가 없어 외면받을 때(겨울의 밀짚모자) 싸게 사두라는 뜻. 비인기 시점이 매수 기회." },
  { text:"숲을 보고 나무를 보라.", author:"증시 격언", cat:"한국 증시 격언", meaning:"개별 종목(나무)만 보지 말고 시장 전체·업황(숲)을 먼저 파악하라. 큰 흐름 속에서 종목을 골라야 한다." },
  { text:"달걀이 다 깨지기 전에 나와라.", author:"증시 격언", cat:"한국 증시 격언", meaning:"손실이 커지기 전에 손절하라는 뜻. 작은 손실을 두려워하다 큰 손실을 본다." },
  { text:"바닥인 줄 알았는데 지하실이 있다.", author:"증시 격언", cat:"한국 증시 격언", meaning:"'이제 바닥'이라 생각하고 샀는데 더 떨어지는 경우가 많다. 섣부른 바닥 예측을 경계." },
  { text:"주식은 사는 것보다 파는 것이 어렵고, 파는 것보다 쉬는 것이 어렵다.", author:"증시 격언", cat:"한국 증시 격언", meaning:"매수·매도·관망 중 가장 어려운 것이 관망. 거래하고 싶은 충동을 참는 것이 고수의 경지." },
  { text:"떨어지는 주식은 잡지 말고, 오르는 주식은 놓지 마라.", author:"증시 격언", cat:"한국 증시 격언", meaning:"추세를 거스르지 말라는 뜻. 하락 추세에 섣불리 사거나 상승 추세를 너무 일찍 팔지 마라." },

  // ── 기존 카테고리 보강 ──
  { text:"훌륭한 투자자는 좋은 기업이 나쁜 뉴스로 싸질 때를 노린다.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"일시적 악재로 우량주가 급락할 때가 기회. 본질이 멀쩡한데 분위기로 싸진 종목을 찾아라." },
  { text:"모두가 주식 이야기를 할 때가 가장 위험하다.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"택시기사·미용실까지 주식 얘기를 하면 과열의 신호. 대중이 열광할 때가 꼭지일 때가 많다." },
  { text:"위대한 기업은 위기 때 더 강해진다.", author:"증시 격언", cat:"인내·장기투자", meaning:"경쟁력 있는 기업은 불황에 약한 경쟁자가 무너질 때 점유율을 키운다. 위기는 강자에게 기회." },
  { text:"복리의 마법을 누리려면 중간에 깨지 말아야 한다.", author:"증시 격언", cat:"복리·시간의 힘", meaning:"복리는 중단 없이 굴러갈 때 위력을 낸다. 중간에 자주 빼 쓰면 눈덩이가 커지지 못한다." },
  { text:"손실 회피 본능이 합리적 판단을 망친다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"손실을 확정하기 싫어 손절을 미루다 더 큰 손실을 본다. 본전 집착이 판단을 흐린다." },
  { text:"확증편향을 경계하라. 반대 의견을 일부러 찾아라.", author:"증시 격언", cat:"심리·감정 통제", meaning:"자기 생각을 지지하는 정보만 모으면 오판한다. 의도적으로 반대 근거를 찾아 검증하라." },
  { text:"좋은 기업과 좋은 주식은 다르다.", author:"증시 격언", cat:"가치 vs 가격", meaning:"훌륭한 기업이라도 너무 비싸면 좋은 주식이 아니다. 기업의 질과 가격 매력은 따로 봐야 한다." },
  { text:"PER이 낮다고 무조건 싼 것은 아니다.", author:"증시 격언", cat:"가치 vs 가격", meaning:"저PER에는 이유(저성장·사양산업)가 있을 수 있다. 숫자만 보지 말고 그 배경을 이해하라." },
  { text:"빚이 많은 기업은 위기에 가장 먼저 쓰러진다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"부채비율이 높은 기업은 경기 둔화·금리 인상에 취약하다. 재무 건전성을 반드시 확인하라." },
  { text:"한 종목에 자산의 대부분을 걸지 마라.", author:"증시 격언", cat:"분산 vs 집중", meaning:"아무리 확신해도 예상 못 한 악재는 온다. 한 종목 비중이 과도하면 치명적 손실 위험." },
  { text:"시장을 이기려 하지 말고, 시장과 함께 가라.", author:"증시 격언", cat:"시장 예측의 함정", meaning:"시장을 매번 이기려는 욕심보다, 큰 흐름에 올라타 꾸준히 수익을 쌓는 것이 현실적이다." },
  { text:"모르는 종목에 투자하느니 인덱스를 사라.", author:"증시 격언", cat:"공부·이해의 중요성", meaning:"개별 기업 분석이 어렵다면, 시장 전체를 사는 인덱스 투자가 평균 이상의 안전한 선택이다." },
  { text:"좋은 기업을 찾았다면, 시장이 알아줄 때까지 기다려라.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"저평가 우량주는 시장이 가치를 인정하기까지 시간이 걸린다. 조급해하지 말고 기다려라." },
  { text:"현금은 기회가 왔을 때 쓰는 총알이다.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"폭락장 같은 기회는 현금이 있어야 잡는다. 평소 일정 현금을 확보해두는 것이 전략." },
  { text:"투자에서 가장 비싼 수업료는 '확신'이다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"과도한 확신은 무리한 베팅과 손절 거부로 이어진다. 늘 틀릴 수 있음을 인정하라." },
  { text:"좋은 결정과 좋은 결과는 다르다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"올바른 과정으로 결정해도 운으로 나쁜 결과가 나올 수 있다. 결과가 아닌 과정의 질로 평가하라." },
  { text:"시장은 항상 옳다, 다만 잠시 미칠 때가 있다.", author:"증시 격언", cat:"시장 예측의 함정", meaning:"장기적으로 시장 가격은 합리적이지만, 단기적으론 공포·탐욕으로 과도하게 움직인다. 그 틈이 기회." },
  { text:"수익률보다 중요한 것은 잃지 않는 것이다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"50% 손실은 100% 수익으로만 복구된다. 큰 손실을 피하는 것이 높은 수익보다 우선." },

  // ===== 3차 50개 =====
  // ── 찰리 멍거 ──
  { text:"거꾸로 생각하라. 항상 거꾸로 생각하라.", author:"찰리 멍거", cat:"심리·감정 통제", meaning:"'어떻게 성공할까'보다 '어떻게 실패할까'를 먼저 생각하고 그것을 피하라. 역방향 사고가 실수를 줄인다." },
  { text:"내가 죽을 곳을 알고 싶다. 그래야 거기 가지 않을 테니.", author:"찰리 멍거", cat:"리스크 관리·손절", meaning:"실패하는 경로를 미리 파악해 피하라는 뜻. 무엇을 하지 말아야 할지 아는 것이 성공의 절반." },
  { text:"인내심을 갖고 아무것도 하지 않는 능력이 큰 돈을 벌어준다.", author:"찰리 멍거", cat:"기다림·기회 포착", meaning:"잦은 매매가 아니라, 좋은 종목을 사서 오래 가만히 두는 것이 큰 수익을 만든다." },
  { text:"큰돈은 사고파는 데 있지 않고 기다리는 데 있다.", author:"찰리 멍거", cat:"인내·장기투자", meaning:"매매 빈도가 아니라 좋은 자산을 오래 보유하는 인내가 부를 만든다." },
  { text:"하루하루 조금씩 더 현명해지려 노력하라.", author:"찰리 멍거", cat:"성공 투자자의 습관", meaning:"꾸준한 학습과 자기 개선이 복리처럼 쌓여 투자 실력을 만든다. 매일의 성장이 핵심." },

  // ── 피터 린치 ──
  { text:"칵테일 파티 이론: 모두가 주식 자랑을 하면 꼭지가 가깝다.", author:"피터 린치", cat:"공포에 용기, 환희에 조심", meaning:"사람들이 주식에 무관심하면 바닥, 너도나도 자랑하면 천장. 대중의 관심도로 시장 국면을 읽는다." },
  { text:"당신의 강점은 월스트리트가 모르는 것을 일상에서 먼저 본다는 것이다.", author:"피터 린치", cat:"공부·이해의 중요성", meaning:"전문가보다 일반인이 생활 속에서 좋은 기업을 먼저 발견할 수 있다. 일상의 관찰력이 무기." },
  { text:"손실 난 꽃을 뽑고 잡초에 물 주는 짓을 하지 마라.", author:"피터 린치", cat:"매도·차익실현", meaning:"오르는 좋은 종목(꽃)을 팔고 손실 종목(잡초)을 붙드는 실수를 경계. 승자를 키우고 패자를 정리하라." },
  { text:"준비되지 않은 투자는 패가 없이 포커 치는 것과 같다.", author:"피터 린치", cat:"공부·이해의 중요성", meaning:"조사·분석 없이 투자하면 운에 맡기는 도박. 충분히 공부한 뒤 들어가라." },
  { text:"주가가 반토막 날 수 있음을 견딜 수 없다면 주식을 하지 마라.", author:"피터 린치", cat:"심리·감정 통제", meaning:"주식은 단기 변동성이 크다. 일시적 급락을 버틸 멘탈이 없으면 장기 수익도 못 얻는다." },

  // ── 앙드레 코스톨라니 ──
  { text:"주식과 결혼하지 마라.", author:"앙드레 코스톨라니", cat:"심리·감정 통제", meaning:"특정 종목에 감정적으로 집착하면 객관적 판단을 못 한다. 사랑이 아니라 논리로 보유·매도하라." },
  { text:"증시는 개를 산책시키는 주인과 같다. 개는 앞뒤로 뛰지만 결국 주인을 따라온다.", author:"앙드레 코스톨라니", cat:"가치 vs 가격", meaning:"주가(개)는 단기적으로 기업가치(주인)를 벗어나 출렁이지만, 결국 가치로 돌아온다." },
  { text:"돈 많은 사람은 투자할 수 있고, 돈 적은 사람은 투자해야 하며, 돈 없는 사람은 투자하면 안 된다.", author:"앙드레 코스톨라니", cat:"투기 vs 투자 경계", meaning:"여윳돈으로 투자하라는 뜻. 생활비·빚으로 투자하면 변동성을 못 견뎌 최악의 시점에 판다." },
  { text:"투자자는 사고 나서 수면제를 먹고 몇 년 자둬라.", author:"앙드레 코스톨라니", cat:"인내·장기투자", meaning:"좋은 종목을 사두고 단기 등락에 신경 끄고 장기 보유하라는 비유. 잦은 확인이 오히려 독." },
  { text:"용기 있는 자만이 증시에서 살아남는다.", author:"앙드레 코스톨라니", cat:"공포에 용기, 환희에 조심", meaning:"남들이 공포에 떨 때 살 수 있는 용기, 환희에 팔 수 있는 결단이 수익을 만든다." },

  // ── 하워드 막스·레이 달리오 등 ──
  { text:"남들과 다르게, 그리고 더 정확하게 생각해야 한다.", author:"하워드 막스", cat:"공포에 용기, 환희에 조심", meaning:"초과수익은 군중과 다른 견해가 맞을 때 나온다. 단순히 반대가 아니라 '더 정확한' 판단이 핵심." },
  { text:"사이클을 이해하는 것이 투자의 전부에 가깝다.", author:"하워드 막스", cat:"거시경제·금리", meaning:"시장은 항상 사이클을 그린다. 지금이 사이클의 어디인지 알면 공포·탐욕에 휘둘리지 않는다." },
  { text:"위험은 변동성이 아니라 영구적 자본 손실 가능성이다.", author:"하워드 막스", cat:"리스크 관리·손절", meaning:"진짜 위험은 가격이 출렁이는 게 아니라 돈을 영영 잃는 것. 변동성과 위험을 혼동하지 마라." },
  { text:"고통스러운 진실을 마주하는 것이 성장의 시작이다.", author:"레이 달리오", cat:"성공 투자자의 습관", meaning:"자신의 실수와 약점을 직시해야 발전한다. 현실을 외면하면 같은 손실을 반복한다." },
  { text:"역사는 반복된다. 같은 실수도 반복된다.", author:"레이 달리오", cat:"거시경제·금리", meaning:"경제 위기·버블은 형태만 바뀔 뿐 반복된다. 역사를 공부하면 다음 사이클을 대비할 수 있다." },

  // ── 제시 리버모어 ──
  { text:"돈은 앉아서 기다리는 데서 벌린다. 매매가 아니라 인내에서.", author:"제시 리버모어", cat:"기다림·기회 포착", meaning:"큰 수익은 자주 사고파는 게 아니라, 옳은 포지션을 잡고 추세가 끝날 때까지 버티는 데서 나온다." },
  { text:"시장은 절대 틀리지 않는다. 틀리는 건 나의 생각이다.", author:"제시 리버모어", cat:"시장 예측의 함정", meaning:"내 예상과 시장이 다르면 시장이 맞다. 고집부리지 말고 시장 흐름을 인정하라." },
  { text:"추세를 거스르지 마라.", author:"제시 리버모어", cat:"시장 예측의 함정", meaning:"상승·하락 추세에 맞서 반대 베팅하는 것은 위험하다. 추세에 올라타는 것이 안전하다." },
  { text:"손실 포지션에 물타기 하는 것은 치명적 실수다.", author:"제시 리버모어", cat:"리스크 관리·손절", meaning:"떨어지는 종목에 계속 추가하다 손실이 눈덩이처럼 커진다. 손실은 키우지 말고 끊어라." },

  // ── 존 보글 (인덱스) ──
  { text:"건초더미에서 바늘을 찾지 말고, 건초더미를 통째로 사라.", author:"존 보글", cat:"분산 vs 집중", meaning:"승자 종목을 골라내려 애쓰지 말고, 시장 전체(인덱스)를 사면 평균 수익을 안정적으로 얻는다." },
  { text:"비용은 수익을 갉아먹는 좀이다.", author:"존 보글", cat:"성공 투자자의 습관", meaning:"수수료·운용보수가 장기적으로 수익을 크게 갉아먹는다. 저비용 투자가 복리에 유리하다." },
  { text:"시간이 당신의 친구이고, 충동이 당신의 적이다.", author:"존 보글", cat:"복리·시간의 힘", meaning:"장기 보유(시간)는 수익을 키우고, 충동적 매매는 비용과 실수를 부른다." },
  { text:"투자에서 단순함이 복잡함을 이긴다.", author:"존 보글", cat:"단순함·상식의 힘", meaning:"복잡한 전략·상품보다 저비용 인덱스 장기 보유 같은 단순한 방법이 대부분의 투자자에게 낫다." },

  // ── 추가 증시 격언 (다양) ──
  { text:"주식을 사기 전에 왜 파는 사람이 있는지 생각하라.", author:"증시 격언", cat:"공부·이해의 중요성", meaning:"내가 사는 가격에 누군가는 판다. 거래 상대의 논리를 생각하면 더 신중해진다." },
  { text:"모두가 부자가 될 거라 믿을 때가 가장 위험하다.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"전 국민이 투자로 쉽게 돈 번다고 믿는 시기가 버블의 정점. 그때가 가장 경계할 때." },
  { text:"좋은 주식은 비쌀 때 더 사고 싶고, 쌀 때 팔고 싶어진다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"인간 심리는 거꾸로 작동한다. 오르면 추격하고 싶고 떨어지면 도망가고 싶다. 이를 역이용하라." },
  { text:"테마는 바람과 같다. 불 땐 거세지만 곧 멎는다.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"단기 테마·유행은 빠르게 끓고 빠르게 식는다. 막차 타면 큰 손실. 실체 없는 테마를 경계." },
  { text:"오를 이유보다 안 떨어질 이유를 먼저 찾아라.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"상승 시나리오에만 취하지 말고, 하방을 막아줄 근거(자산가치·실적)를 먼저 확인하라." },
  { text:"시장에는 늙은 투자자도 있고 대담한 투자자도 있지만, 늙고 대담한 투자자는 없다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"무모하게 베팅하는 투자자는 오래 살아남지 못한다. 오래 살아남으려면 신중해야 한다." },
  { text:"확신이 강할수록 베팅은 작게 시작하라.", author:"증시 격언", cat:"심리·감정 통제", meaning:"확신이 클수록 과신의 위험도 크다. 분할 매수로 시작해 검증하며 늘려라." },
  { text:"좋은 기업이 잠시 미움받을 때가 매수 기회다.", author:"증시 격언", cat:"가치 vs 가격", meaning:"일시적 악재·실적 부진으로 우량주가 외면받을 때, 본질이 멀쩡하면 좋은 진입 시점." },
  { text:"평단가에 집착하면 판단이 흐려진다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"내 매수 단가는 시장과 무관하다. 본전 생각에 매도·매수를 미루면 손실이 커진다." },
  { text:"시장은 인내심을 시험한 뒤에야 보상한다.", author:"증시 격언", cat:"인내·장기투자", meaning:"좋은 판단도 결실까지 시간이 걸린다. 흔들기를 견딘 사람만 수익을 가져간다." },
  { text:"분할 매수와 분할 매도는 후회를 줄인다.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"한 번에 다 사거나 팔면 타이밍 실패 시 후회가 크다. 나눠서 대응하면 평균에 수렴해 안정적." },
  { text:"수익은 엉덩이가 무거운 사람의 몫이다.", author:"증시 격언", cat:"인내·장기투자", meaning:"좋은 종목을 끝까지 들고 가는 인내(무거운 엉덩이)가 큰 수익을 만든다. 조급함은 적." },
  { text:"공포 지수가 극에 달할 때가 바닥일 때가 많다.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"VIX 같은 공포 지표가 치솟을 때가 역설적으로 매수 기회인 경우가 많다." },
  { text:"실패한 투자에서 배우지 못하면 수업료만 낸 것이다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"손실 자체보다 거기서 교훈을 못 얻는 것이 진짜 손해. 복기를 통해 같은 실수를 막아라." },
  { text:"주식시장은 참는 자에게 돈을 주고 조급한 자에게서 돈을 뺏는다.", author:"증시 격언", cat:"인내·장기투자", meaning:"버핏의 말과 통하는 격언. 인내가 보상받고 조급함이 벌받는 곳이 시장." },
  { text:"고수는 잃지 않는 법을 먼저 배우고, 하수는 버는 법부터 배운다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"수익보다 손실 관리가 먼저다. 잃지 않는 원칙이 잡힌 뒤에 수익이 따라온다." },
  { text:"시장이 비이성적인 기간은 당신이 버틸 수 있는 기간보다 길 수 있다.", author:"존 메이너드 케인스", cat:"시장 예측의 함정", meaning:"옳은 판단이라도 시장이 비합리적으로 오래 갈 수 있다. 그래서 무리한 레버리지는 위험하다." },
  { text:"생각이 바뀌면 행동도 바꿔라. 고집은 손실을 부른다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"새 정보로 판단이 바뀌면 포지션도 바꿔야 한다. 자존심 때문에 고집부리면 손실만 커진다." },
  { text:"좋은 투자는 지루하다.", author:"증시 격언", cat:"단순함·상식의 힘", meaning:"스릴 넘치는 매매가 아니라, 묵묵히 좋은 자산을 모아 기다리는 지루한 과정이 부를 만든다." },

  // ===== 4차 50개 =====
  // ── 세스 클라먼 ──
  { text:"가치투자는 안전마진을 요구한다. 싸게 사야 실수해도 산다.", author:"세스 클라먼", cat:"가치 vs 가격", meaning:"충분히 싸게 사두면 판단이 일부 틀려도 손실이 제한된다. 안전마진이 실수를 덮어준다." },
  { text:"가격이 떨어졌다고 위험이 커진 것이 아니다. 오히려 줄었을 수 있다.", author:"세스 클라먼", cat:"공포에 용기, 환희에 조심", meaning:"가치가 그대로인데 가격만 내렸다면 위험은 줄고 기대수익은 커진 것. 가격 하락=위험이라는 통념을 뒤집는다." },
  { text:"인내심 없이는 가치투자를 할 수 없다.", author:"세스 클라먼", cat:"인내·장기투자", meaning:"저평가가 해소되기까지 오래 걸린다. 기다림을 견디지 못하면 가치투자의 결실을 못 본다." },

  // ── 존 네프 ──
  { text:"인기 없는 종목에서 기회를 찾아라.", author:"존 네프", cat:"공포에 용기, 환희에 조심", meaning:"시장이 외면한 저PER 우량주에서 초과수익이 나온다. 소외주 속에 보석이 있다." },
  { text:"배당은 공짜로 받는 수익률이다.", author:"존 네프", cat:"배당·현금흐름", meaning:"주가가 제자리여도 배당은 꼬박꼬박 들어온다. 배당수익률은 기다리는 동안 받는 보상." },

  // ── 짐 로저스 ──
  { text:"쌀 때 사서 비쌀 때 파는 것, 그것이 전부다. 단지 실행이 어려울 뿐.", author:"짐 로저스", cat:"단순함·상식의 힘", meaning:"원리는 누구나 안다. 문제는 공포와 탐욕을 이기고 실행하는 것. 앎과 행함은 다르다." },
  { text:"아무것도 하지 않는 것이 최선일 때가 많다.", author:"짐 로저스", cat:"기다림·기회 포착", meaning:"확신이 없으면 매매하지 마라. 좋은 기회가 보일 때까지 기다리는 것도 전략이다." },
  { text:"모두가 좋다고 할 때 조심하고, 모두가 싫다고 할 때 들여다봐라.", author:"짐 로저스", cat:"공포에 용기, 환희에 조심", meaning:"대중의 만장일치는 위험 신호. 만장일치로 외면받는 곳에 기회가 숨어 있다." },

  // ── 스탠리 드러켄밀러 ──
  { text:"맞느냐 틀리느냐가 아니라, 맞을 때 얼마 벌고 틀릴 때 얼마 잃느냐다.", author:"스탠리 드러켄밀러", cat:"리스크 관리·손절", meaning:"승률보다 손익의 크기가 중요하다. 확신할 때 크게, 불확실할 때 작게 베팅하는 것이 핵심." },
  { text:"확신이 들 때 과감하게 베팅하라. 그런 기회는 드물다.", author:"스탠리 드러켄밀러", cat:"기다림·기회 포착", meaning:"진짜 좋은 기회엔 집중 투자할 용기가 필요하다. 평범한 아이디어에 분산하지 마라." },

  // ── 필립 피셔 보강 ──
  { text:"위대한 기업을 찾았다면 사소한 가격 변동으로 팔지 마라.", author:"필립 피셔", cat:"인내·장기투자", meaning:"성장하는 위대한 기업은 단기 등락에 흔들려 팔면 안 된다. 큰 그림을 보고 보유하라." },
  { text:"기업을 사기 전에 그 회사 제품·경쟁사·고객을 직접 조사하라.", author:"필립 피셔", cat:"공부·이해의 중요성", meaning:"재무제표만 보지 말고 현장(제품·평판·경쟁력)을 발로 확인하라. 깊은 조사가 확신을 만든다." },

  // ── 템플턴 보강 ──
  { text:"최대 비관의 순간이 최고의 매수 시점이고, 최대 낙관의 순간이 최고의 매도 시점이다.", author:"존 템플턴", cat:"공포에 용기, 환희에 조심", meaning:"감정의 극단이 곧 전환점. 모두 절망할 때 사고, 모두 환호할 때 판다." },
  { text:"강세장에서 번 돈을 약세장에서 지키는 것이 진짜 실력이다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"오를 때 버는 건 쉽다. 하락장에서 수익을 지키고 손실을 줄이는 것이 고수의 영역." },

  // ── 배당·현금흐름 (새 카테고리) ──
  { text:"배당은 거짓말을 하지 않는다.", author:"증시 격언", cat:"배당·현금흐름", meaning:"실적은 회계로 부풀릴 수 있지만, 실제 현금으로 주는 배당은 기업의 진짜 체력을 보여준다." },
  { text:"꾸준히 배당을 늘리는 기업이 좋은 기업이다.", author:"증시 격언", cat:"배당·현금흐름", meaning:"수십 년간 배당을 늘려온 기업은 안정적 현금흐름과 주주환원 의지를 증명한 것." },
  { text:"재투자된 배당이 장기 수익의 큰 부분을 만든다.", author:"증시 격언", cat:"배당·현금흐름", meaning:"배당을 다시 투자하면 복리 효과로 장기 총수익이 크게 늘어난다. 배당 재투자의 힘." },
  { text:"고배당의 함정을 조심하라. 배당수익률이 너무 높으면 이유가 있다.", author:"증시 격언", cat:"배당·현금흐름", meaning:"비정상적으로 높은 배당률은 주가 급락(부실 신호)의 결과일 수 있다. 지속 가능성을 따져라." },

  // ── 거시·사이클 보강 ──
  { text:"금리가 오르면 빚 많은 기업부터 흔들린다.", author:"증시 격언", cat:"거시경제·금리", meaning:"금리 상승기엔 부채 의존도가 높은 기업이 이자 부담으로 먼저 위기를 맞는다. 재무구조를 보라." },
  { text:"환율은 수출주와 수입주의 운명을 가른다.", author:"증시 격언", cat:"거시경제·금리", meaning:"원화 약세는 수출 기업에 유리하고 수입·내수 기업엔 부담. 환율 방향이 업종 희비를 가른다." },
  { text:"유동성이 밀물처럼 들어오면 모든 배가 뜬다.", author:"증시 격언", cat:"거시경제·금리", meaning:"중앙은행이 돈을 풀면 부실 기업까지 주가가 오른다. 그래서 호황기엔 옥석 구분이 어렵다." },
  { text:"위기는 늘 '설마' 하는 곳에서 터진다.", author:"증시 격언", cat:"거시경제·금리", meaning:"안전하다고 믿던 곳에서 위기가 시작된다. 과신하지 말고 항상 시나리오를 점검하라." },

  // ── 실전 태도 ──
  { text:"계획 없이 매수하면 계획 없이 손절한다.", author:"증시 격언", cat:"성공 투자자의 습관", meaning:"매수 전에 목표가·손절가를 정해두지 않으면, 막상 흔들릴 때 감정적으로 대응하게 된다." },
  { text:"오늘 사지 않아도 내일 또 기회는 온다.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"조급함에 추격 매수하지 마라. 시장은 늘 새로운 기회를 준다. 놓친 기회를 아쉬워 말 것." },
  { text:"종목과 사랑에 빠지면 객관성을 잃는다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"특정 종목에 애착이 생기면 악재도 외면하게 된다. 냉정한 거리를 유지하라." },
  { text:"수익이 났을 때 자만이 가장 위험하다.", author:"증시 격언", cat:"심리·감정 통제", meaning:"몇 번 성공하면 자신을 과신해 무리한 베팅을 한다. 연승 뒤가 가장 조심할 때." },
  { text:"손실을 인정하는 용기가 자산을 지킨다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"틀렸음을 인정하고 손절하는 것은 패배가 아니라 자본을 지키는 현명한 결정." },
  { text:"빚으로 산 주식은 하락장에서 가장 먼저 팔린다.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"레버리지 투자자는 급락 시 강제 청산당해 최악의 가격에 팔게 된다. 버틸 수 없는 투자는 위험." },
  { text:"확실해 보이는 기회일수록 한 번 더 의심하라.", author:"증시 격언", cat:"공부·이해의 중요성", meaning:"'무조건 오른다'는 확신이 들 때가 가장 위험하다. 반대 시나리오를 반드시 점검하라." },
  { text:"꾸준한 적립이 타이밍을 이긴다.", author:"증시 격언", cat:"복리·시간의 힘", meaning:"매수 시점을 맞히려 애쓰기보다, 꾸준히 일정액을 적립(분할매수)하면 평균에 수렴해 안정적이다." },
  { text:"작은 수익을 무시하면 큰 부도 없다.", author:"증시 격언", cat:"복리·시간의 힘", meaning:"작은 수익이 복리로 쌓여 큰 부가 된다. 한 방만 노리면 결국 아무것도 못 모은다." },
  { text:"투자는 마라톤이지 단거리 경주가 아니다.", author:"증시 격언", cat:"인내·장기투자", meaning:"단기 성과에 일희일비하지 말고 장기적 관점으로 꾸준히 가라. 끝까지 완주하는 자가 이긴다." },
  { text:"남의 돈 자랑에 흔들리지 마라.", author:"증시 격언", cat:"심리·감정 통제", meaning:"남이 번 이야기에 조급해져 무리하게 따라가면 꼭지를 잡는다. 자기 페이스를 지켜라." },
  { text:"모르는 분야의 대박 소문은 가장 위험한 유혹이다.", author:"증시 격언", cat:"투기 vs 투자 경계", meaning:"이해 못 하는 분야의 '대박' 소문에 올라타면 빠져나올 시점도 모른다. 능력범위를 지켜라." },
  { text:"좋은 기업도 너무 많은 사람이 알면 비싸진다.", author:"증시 격언", cat:"가치 vs 가격", meaning:"모두가 좋다고 인정한 기업은 이미 비싸다. 남보다 먼저 가치를 알아보는 것이 수익의 원천." },
  { text:"하락장은 부가 원래 주인에게 돌아가는 시기다.", author:"증시 격언", cat:"공포에 용기, 환희에 조심", meaning:"하락장에서 약한 손이 우량주를 던지고, 준비된 투자자가 그것을 받는다. 위기는 부의 이동기." },
  { text:"투자 실력은 상승장이 아니라 하락장에서 드러난다.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"오를 땐 누구나 번다. 진짜 실력은 하락장에서 손실을 관리하고 버티는 능력에서 나온다." },
  { text:"단기 뉴스에 장기 계획을 바꾸지 마라.", author:"증시 격언", cat:"인내·장기투자", meaning:"매일 쏟아지는 뉴스에 휘둘려 장기 전략을 흔들면 안 된다. 노이즈와 신호를 구분하라." },
  { text:"분할 매수는 미래를 모른다는 겸손에서 나온다.", author:"증시 격언", cat:"기다림·기회 포착", meaning:"바닥을 모르기에 나눠 산다. 분할매수는 예측 불가를 인정하는 현명한 겸손." },
  { text:"손절 라인을 정했으면 반드시 지켜라.", author:"증시 격언", cat:"리스크 관리·손절", meaning:"정해둔 손절선을 '조금만 더'라며 미루면 손실이 눈덩이가 된다. 규칙은 지킬 때 의미가 있다." },

];

const PER_DAY = 3;
const EPOCH = new Date(2026, 0, 1);
let viewOffset = 0;

function getDayNumber(){ const t=new Date(); const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()); return Math.floor((d-EPOCH)/(1000*60*60*24)); }
function totalPages(){ return Math.ceil(quotes.length/PER_DAY); }
function cardHtml(q){ return '<div class="quote-card"><div class="quote-mark">"</div>'+(q.cat?'<div class="quote-cat">'+q.cat+'</div>':'')+'<div class="quote-text">'+q.text+'</div><div class="quote-author">'+q.author+'</div><div class="quote-meaning">💡 '+q.meaning+'</div></div>'; }

function render(){
  const dayNum=getDayNumber()+viewOffset, pages=totalPages();
  let pageIdx=((dayNum%pages)+pages)%pages;
  const start=pageIdx*PER_DAY;
  document.getElementById('quoteContainer').innerHTML=quotes.slice(start,start+PER_DAY).map(cardHtml).join('');
  const d=new Date(); d.setDate(d.getDate()+viewOffset);
  const dateStr=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
  document.getElementById('todayInfo').textContent=viewOffset===0?'📅 '+dateStr+' (오늘)':'📅 '+dateStr;
  document.getElementById('pageInfo').textContent=(pageIdx+1)+' / '+pages+' 세트 · 총 '+quotes.length+'개';
}
function changeDay(delta){ viewOffset+=delta; render(); }

let currentCat='전체';
function getCategories(){ const cats=['전체']; quotes.forEach(q=>{if(q.cat&&!cats.includes(q.cat))cats.push(q.cat);}); return cats; }
function renderAll(){
  document.getElementById('catTabs').innerHTML=getCategories().map(c=>'<div class="tab '+(c===currentCat?'active':'')+'" onclick="selectCat(\''+c+'\')">'+c+'</div>').join('');
  const filtered=currentCat==='전체'?quotes:quotes.filter(q=>q.cat===currentCat);
  document.getElementById('allQuotes').innerHTML='<div class="section-head">'+currentCat+' ('+filtered.length+'개)</div>'+filtered.map(cardHtml).join('');
}
function selectCat(c){ currentCat=c; renderAll(); }
function toggleAll(){
  const el=document.getElementById('allSection'), toggle=document.getElementById('allToggle');
  if(el.style.display==='none'){ renderAll(); el.style.display='block'; toggle.textContent='🔼 접기'; }
  else{ el.style.display='none'; toggle.textContent='📜 전체 명언 카테고리별로 보기'; }
}
render();
</script>
