<script type="module">
/* 저장 구조 (078 단일화)
   - 로컬 자동저장: localStorage sf_cardmanager_v2 (sf-slots와 같은 키, 형식 {cards:[...]})
   - 클라우드: sf-slots.js 만 사용 (calc_data.cardmanager.slots) → 우측 하단 저장 버튼
   - 구 저장소(Firestore users/{uid}/cards)는 읽기 전용으로 최초 1회만 가져옴. 쓰지도 지우지도 않음. */
const LS_KEY='sf_cardmanager_v2';
const MIG_FLAG='sf_cardmanager_legacy_done';
let cards=[], currentSort='order';

function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({cards})); }catch(e){} }
function readLocal(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d && Array.isArray(d.cards)) return d.cards;
  }catch(e){}
  return null;
}
function setNote(msg){ const el=document.getElementById('saveNote'); if(el) el.textContent=msg; }

// Firestore Timestamp → ISO 문자열 (로컬/슬롯에 그대로 넣을 수 있게)
function plain(v){
  if(v && typeof v.toDate==='function'){ try{ return v.toDate().toISOString(); }catch(e){ return ''; } }
  return v;
}

async function migrateLegacy(){
  try{ if(localStorage.getItem(MIG_FLAG)) return; }catch(e){ return; }
  if(cards.length){ try{ localStorage.setItem(MIG_FLAG,'local'); }catch(e){} return; }
  // 로그인 완료 대기 (최대 15초)
  let user=null;
  for(let i=0;i<30;i++){
    user=window._sfAuth && window._sfAuth.currentUser;
    if(user) break;
    await new Promise(r=>setTimeout(r,500));
  }
  if(!user) return; // 다음 방문 때 다시 시도
  try{
    // 이미 클라우드 슬롯이 있으면(다른 기기에서 이전 완료) 옛 데이터를 다시 끌어오지 않음
    if(window._sfSlots && window._sfSlots.getSlots){
      const slots=await window._sfSlots.getSlots();
      if(slots && slots.length){
        localStorage.setItem(MIG_FLAG,'slots');
        setNote('클라우드 저장분 '+slots.length+'개 있음 → 우측 하단 저장 버튼에서 불러오기');
        return;
      }
    }
    const [appMod, fsMod]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js')
    ]);
    const apps=appMod.getApps();
    if(!apps.length) return;
    const db=fsMod.getFirestore(apps[0]);
    const snap=await fsMod.getDocs(fsMod.collection(db,'users',user.uid,'cards'));
    const legacy=[];
    snap.forEach(d=>{
      const o={id:d.id}, src=d.data();
      for(const k in src) o[k]=plain(src[k]);
      legacy.push(o);
    });
    if(cards.length) { localStorage.setItem(MIG_FLAG,'local'); return; } // 기다리는 사이 직접 입력한 경우
    if(legacy.length){
      cards=legacy; persist(); renderAll();
      setNote('기존 카드 '+legacy.length+'장 가져옴 → 우측 하단 저장 버튼으로 클라우드에 저장하세요');
    }
    localStorage.setItem(MIG_FLAG, legacy.length ? 'imported' : 'empty');
  }catch(e){
    console.error('[card-manager] 기존 카드 가져오기 실패:', e);
    setNote('기존 카드 가져오기 실패 (새로고침하면 다시 시도)');
  }
}

function dday(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr), now=new Date();
  now.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.ceil((d-now)/(86400000));
}

function renderAll(){
  sortCards(); renderSlider(); renderSummary();
  const totalBenefit=cards.reduce((s,c)=>s+(c.benefitAmount||0),0);
  document.getElementById('cardCount').textContent=`카드 ${cards.length}장 · 예상 혜택 ${totalBenefit.toLocaleString()}원`;
  document.getElementById('emptyMsg').style.display=cards.length?'none':'';
}

function sortCards(){
  if(currentSort==='spending') cards.sort((a,b)=>(b.currentSpending||0)-(a.currentSpending||0));
  else if(currentSort==='deadline') cards.sort((a,b)=>{const da=a.deadline||'9999',db2=b.deadline||'9999';return da<db2?-1:da>db2?1:0;});
  else if(currentSort==='cancel') cards.sort((a,b)=>{const da=a.cancelAvail||'9999',db2=b.cancelAvail||'9999';return da<db2?-1:da>db2?1:0;});
  else cards.sort((a,b)=>(a.order||0)-(b.order||0));
}

function renderSlider(){
  const sl=document.getElementById('slider'), dots=document.getElementById('dots');
  sl.innerHTML=''; dots.innerHTML='';
  cards.forEach((c,i)=>{
    sl.innerHTML+=buildCard(c,i);
    dots.innerHTML+=`<div class="dot${i===0?' active':''}" data-i="${i}"></div>`;
  });
  const items=sl.querySelectorAll('.card-item');
  if(!items.length) return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){
      const idx=e.target.dataset.idx;
      dots.querySelectorAll('.dot').forEach(d=>d.classList.toggle('active',d.dataset.i===idx));
    }});
  },{root:sl,threshold:0.6});
  items.forEach(it=>obs.observe(it));
}

function buildCard(c,idx){
  const ic=`issuer-${c.issuer||'기타'}`;
  const pct=c.monthlyTarget>0?Math.round((c.currentSpending||0)/c.monthlyTarget*100):0;
  const remain=(c.monthlyTarget||0)-(c.currentSpending||0);
  const fillClass=pct>=100?(pct>100?'over':'full'):'';
  const fillW=Math.min(pct,100);
  const remainClass=remain>0?'under':'over';
  const remainText=remain>0?`${remain.toLocaleString()}원 남음`:remain===0?'달성!':
    `${Math.abs(remain).toLocaleString()}원 초과`;
  const since=c.usageStart?c.usageStart.replace(/-/g,'').substring(0,6):'';
  const cancelledCls=c.cancelled?' cancelled':'';

  // D-day 배지
  let badge='';
  if(c.cancelled){
    badge='<div class="cancel-badge">해지 완료</div>';
  } else if(c.deadline){
    const dd=dday(c.deadline);
    if(dd!==null){
      const urgent=dd<=7?'urgent':'';
      badge=`<div class="card-dday ${urgent}">실적마감 ${dd>0?'D-'+dd:dd===0?'D-Day':'만료'}</div>`;
    }
  }

  let info='';
  if(c.usageStart) info+=row('발급일',fmtD(c.usageStart));
  if(c.deadline){
    const dd=dday(c.deadline);
    const ddText=dd!==null?` · ${dd>0?'D-'+dd:dd===0?'D-Day':'만료'}`:'';
    info+=row('실적 마감일',fmtD(c.deadline)+ddText);
  }
  if(c.benefitAmount){
    const cls=c.benefitDone?'done':'benefit';
    const mark=c.benefitDone?'✅ ':'';
    info+=`<div class="info-row"><span class="info-label">이벤트 혜택</span><span class="info-val ${cls}">${mark}${c.benefitAmount.toLocaleString()}원</span></div>`;
  }
  if(c.benefitDate) info+=row('혜택 지급일',fmtD(c.benefitDate));
  if(c.cancelAvail){
    const dd=dday(c.cancelAvail);
    const ddText=dd!==null&&dd>0?` · D-${dd}`:(dd!==null&&dd<=0?' · 가능':'');
    info+=`<div class="info-row alert-row"><span class="info-label">해지 가능일</span><span class="info-val cancel-date">${fmtD(c.cancelAvail)}${ddText}</span></div>`;
  }
  if(c.nextEvent) info+=row('다음 이벤트 가능',fmtD(c.nextEvent),'dim');

  const memoHTML=c.memo?`<div class="memo-text">📝 ${c.memo}</div>`:'';

  return `<div class="card-item" data-idx="${idx}">
  <div class="card-visual ${ic}${cancelledCls}" onclick="window._editCard('${c.id}')">
    <div class="card-top">${badge}
      <div class="card-issuer">${c.issuer||''}</div>
      <div class="card-chip"></div>
      <div class="card-name">${c.cardName||''}</div>
      ${since?`<div class="card-since">MEMBER SINCE ${since}</div>`:''}
    </div>
    <div class="card-bottom">
      <div class="spending-label">이번 달 지출</div>
      <div class="spending-amount">${(c.currentSpending||0).toLocaleString()}원</div>
      <div class="progress-row">
        <span class="progress-label">실적 달성률</span>
        <span class="progress-remain ${remainClass}">${remainText}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${fillW}%"></div></div>
      ${info?`<div class="card-info">${info}</div>`:''}
      ${memoHTML}
    </div>
  </div>
</div>`;
}

function row(l,v,cls){return `<div class="info-row"><span class="info-label">${l}</span><span class="info-val${cls?' '+cls:''}">${v}</span></div>`;}
function fmtD(d){return d?d.replace(/-/g,'.'):''}

function renderSummary(){
  const total=cards.reduce((s,c)=>s+(c.currentSpending||0),0);
  const totalB=cards.reduce((s,c)=>s+(c.benefitAmount||0),0);
  const totalF=cards.reduce((s,c)=>s+(c.annualFee||0),0);
  const active=cards.filter(c=>!c.cancelled).length;
  document.getElementById('summary').innerHTML=`
    <div class="summary-chip"><span style="color:#888">총 지출</span><span class="sv">${total.toLocaleString()}원</span></div>
    <div class="summary-chip"><span style="color:#888">총 혜택</span><span class="sv" style="color:#1976d2">${totalB.toLocaleString()}원</span></div>
    <div class="summary-chip"><span style="color:#888">연회비</span><span class="sv">${totalF.toLocaleString()}원</span></div>
    <div class="summary-chip"><span style="color:#888">활성</span><span class="sv">${active}장</span></div>`;
}

const FIELDS=['fIssuer','fName','fTarget','fSpending','fBenefit','fFee','fStart','fDeadline','fBenefitDate','fCancelAvail','fNextEvent','fMemo','fBenefitDone','fCancelled'];
window.openModal=function(){
  document.getElementById('modal').classList.add('show');
  document.getElementById('editId').value='';
  document.getElementById('modalTitle').textContent='카드 등록';
  document.getElementById('btnDel').style.display='none';
  document.getElementById('cancelledField').style.display='none';
  FIELDS.forEach(id=>{const el=document.getElementById(id);if(el.type==='checkbox')el.checked=false;else el.value='';});
};

window._editCard=function(id){
  const c=cards.find(x=>x.id===id);if(!c) return;
  document.getElementById('modal').classList.add('show');
  document.getElementById('editId').value=id;
  document.getElementById('modalTitle').textContent='카드 수정';
  document.getElementById('btnDel').style.display='';
  document.getElementById('cancelledField').style.display='';
  document.getElementById('fIssuer').value=c.issuer||'기타';
  document.getElementById('fName').value=c.cardName||'';
  document.getElementById('fTarget').value=c.monthlyTarget||'';
  document.getElementById('fSpending').value=c.currentSpending||'';
  document.getElementById('fBenefit').value=c.benefitAmount||'';
  document.getElementById('fFee').value=c.annualFee||'';
  document.getElementById('fStart').value=c.usageStart||'';
  document.getElementById('fDeadline').value=c.deadline||'';
  document.getElementById('fBenefitDate').value=c.benefitDate||'';
  document.getElementById('fCancelAvail').value=c.cancelAvail||'';
  document.getElementById('fNextEvent').value=c.nextEvent||'';
  document.getElementById('fMemo').value=c.memo||'';
  document.getElementById('fBenefitDone').checked=!!c.benefitDone;
  document.getElementById('fCancelled').checked=!!c.cancelled;
};

window.closeModal=function(){document.getElementById('modal').classList.remove('show');};

window.saveCard=function(){
  const editId=document.getElementById('editId').value;
  const data={
    issuer:document.getElementById('fIssuer').value,
    cardName:document.getElementById('fName').value.trim(),
    monthlyTarget:parseInt(document.getElementById('fTarget').value)||0,
    currentSpending:parseInt(document.getElementById('fSpending').value)||0,
    benefitAmount:parseInt(document.getElementById('fBenefit').value)||0,
    annualFee:parseInt(document.getElementById('fFee').value)||0,
    usageStart:document.getElementById('fStart').value,
    deadline:document.getElementById('fDeadline').value,
    benefitDate:document.getElementById('fBenefitDate').value,
    cancelAvail:document.getElementById('fCancelAvail').value,
    nextEvent:document.getElementById('fNextEvent').value,
    memo:document.getElementById('fMemo').value.trim(),
    benefitDone:document.getElementById('fBenefitDone').checked,
    cancelled:document.getElementById('fCancelled').checked,
    updatedAt:new Date().toISOString()
  };
  if(!data.cardName){alert('카드명을 입력하세요.');return;}
  if(editId){
    const i=cards.findIndex(x=>x.id===editId);
    if(i<0){alert('수정할 카드를 찾지 못했습니다.');return;}
    cards[i]={...cards[i],...data};
  } else {
    data.id='card_'+Date.now();
    data.order=cards.reduce((m,c)=>Math.max(m,(c.order||0)+1),0);
    data.createdAt=data.updatedAt;
    cards.push(data);
  }
  persist(); closeModal(); renderAll();
};

window.deleteCard=function(){
  const editId=document.getElementById('editId').value;
  if(!editId||!confirm('이 카드를 삭제할까요?')) return;
  cards=cards.filter(x=>x.id!==editId);
  persist(); closeModal(); renderAll();
};

window.setSort=function(s){
  currentSort=s;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.sort===s));
  renderAll();
};

document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── sf-slots 연동 (실제 slGetState/slSetState는 아래 일반 script에 정의) ──
window._cmGet=function(){ return {cards:JSON.parse(JSON.stringify(cards))}; };
window._cmSet=function(d){
  if(!d || !Array.isArray(d.cards)) return;
  cards=JSON.parse(JSON.stringify(d.cards));
  persist(); renderAll();
};

// ── 시작 ──
cards=readLocal()||[];
renderAll();
migrateLegacy();
</script>
<script>
window.CALC_KEY='cardmanager';
window.slGetState=function(){
  if(!window._cmGet) throw new Error('페이지 로딩 중입니다. 잠시 후 다시 시도하세요.');
  return window._cmGet();
};
window.slSetState=function(d){ if(window._cmSet) window._cmSet(d); };
</script>

<script src="/common.js?v=8"></script>
