<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>회사 문서 작업 | 스윙파머</title>
<link rel="stylesheet" href="/common.css?v=8">
<style>
:root { --sf-max-w: 900px; }
body.sf-dark{
  --p-brand:#60a5fa;--p-surface:#1a1d27;--p-surface2:#222532;--p-surface3:#2a2d3a;
  --p-border:#2a2d3a;--p-border2:#475569;--p-border3:#334155;
  --p-text:#e4e4e7;--p-text2:#a1a1aa;--p-text3:#a1a1aa;--p-text4:#71717a;
  --p-green:#22c55e;--p-red:#f87171;--p-blue:#60a5fa;
  --p-input-bg:#0f1117;--p-input-bd:#475569;--p-input-c:#fff;
  --p-tab-bg:#1a1d27;--p-tab-active:#222532}
body.sf-dark .panel,body.sf-dark .card-body,body.sf-dark .calc-section,
body.sf-dark .result-box,body.sf-dark .section,body.sf-dark .tab-content,
body.sf-dark .manual,body.sf-dark .manual-section{
  background:var(--p-surface2)!important;border-color:var(--p-border)!important}
body.sf-dark input,body.sf-dark select,body.sf-dark textarea{
  background:var(--p-input-bg)!important;border-color:var(--p-input-bd)!important;color:var(--p-input-c)!important}
body.sf-dark table th{background:var(--p-surface3)!important;color:var(--p-text2)!important}
body.sf-dark table td{border-color:var(--p-border3)!important}
body.sf-dark .gauge-bar-bg,body.sf-dark .gauge-track{background:var(--p-surface3)!important}
body.sf-dark .stab{background:var(--p-tab-bg)!important;border-color:var(--p-border)!important;color:var(--p-text3)!important}
body.sf-dark .stab.active{background:var(--p-tab-active)!important;color:var(--p-brand)!important}
body.sf-dark .tab-body{background:var(--p-tab-active)!important;border-color:var(--p-border)!important}
body.sf-dark .bracket-box{background:var(--p-surface2)!important;border-color:var(--p-border)!important}
body.sf-dark .br-item{background:var(--p-surface3)!important;color:var(--p-text3)!important}
body.sf-dark .alert-safe{background:rgba(34,197,94,.1)!important;border-color:rgba(34,197,94,.3)!important;color:#4ade80!important}
body.sf-dark .alert-warn{background:rgba(251,191,36,.1)!important;border-color:rgba(251,191,36,.3)!important;color:#fbbf24!important}
body.sf-dark .alert-danger{background:rgba(239,68,68,.1)!important;border-color:rgba(239,68,68,.3)!important;color:#f87171!important}
body.sf-dark .alert-critical{background:rgba(69,10,10,.9)!important;color:#fca5a5!important}
*{box-sizing:border-box;margin:0;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-decoration:none;color:inherit;transition:all .15s;border:1px solid #eee;display:block}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-2px)}
.card.soon{opacity:.55;cursor:default}
.card.soon:hover{transform:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.icon{font-size:30px;margin-bottom:10px}
.card-title{font-size:16px;font-weight:700;color:#1F4E78;margin-bottom:6px}
.card-desc{font-size:13px;color:#666;line-height:1.6}
.tag{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:#dbeafe;color:#1e40af}
.tag.soon{background:#f3f4f6;color:#9ca3af}
footer{margin-top:30px;text-align:center;color:#aaa;font-size:12px}
</style>

<link rel="stylesheet" href="/auth-guard.css?v=4">
<script type="module" src="/auth-guard.js?v=5"></script>
</head>
<body class="sf-narrow">

<h1>🏢 회사 문서 작업</h1>
<p class="desc">거래명세표·견적서 등 회사 관련 문서를 작성·출력하는 공간입니다. 입력값은 이 브라우저에 저장(서버 전송 없음).</p>

<div class="grid">
  <a href="invoice/" class="card">
    <div class="icon">🧾</div>
    <div class="card-title">거래명세표</div>
    <div class="card-desc">공급자 등록·선택, 품목 입력 시 공급가액·세액 자동 계산. 공급자/공급받는자 보관용 2장 동시 출력.</div>
    <div class="tag">사용 가능</div>
  </a>
  <div class="card soon">
    <div class="icon">📄</div>
    <div class="card-title">견적서</div>
    <div class="card-desc">추후 추가 예정.</div>
    <div class="tag soon">준비 중</div>
  </div>
  <div class="card soon">
    <div class="icon">🧮</div>
    <div class="card-title">세금계산서</div>
    <div class="card-desc">추후 추가 예정.</div>
    <div class="tag soon">준비 중</div>
  </div>
</div>

<footer>© 스윙파머 · 회사 문서</footer>

<script src="/common.js?v=7"></script>
</body>
</html>
