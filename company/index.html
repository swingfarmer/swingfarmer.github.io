<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>회사 문서 작업</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f7fa;color:#1a1a1a}
.back-link{display:inline-block;margin-bottom:16px;color:#1F4E78;text-decoration:none;font-size:14px}
.back-link:hover{text-decoration:underline}
h1{color:#1F4E78;border-bottom:3px solid #1F4E78;padding-bottom:10px;margin-bottom:6px;font-size:22px}
.desc{color:#555;font-size:13.5px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-decoration:none;color:inherit;transition:all .15s;border:1px solid #eee;display:block}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-2px)}
.card.soon{opacity:.55;cursor:default}
.card.soon:hover{transform:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.icon{font-size:30px;margin-bottom:10px}
.card-title{font-size:16px;font-weight:700;color:#1F4E78;margin-bottom:6px}
.card-desc{font-size:13px;color:#666;line-height:1.6}
.tag{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:#dbeafe;color:#1e40af}
.tag.soon{background:#f3f4f6;color:#9ca3af}
footer{margin-top:30px;text-align:center;color:#aaa;font-size:12px}
</style>
</head>
<body>

<a href="/" class="back-link">← 메인으로</a>
<h1>🏢 회사 문서 작업</h1>
<p class="desc">거래명세표·견적서 등 회사 관련 문서를 작성·출력하는 공간입니다. 입력값은 이 브라우저에 저장(서버 전송 없음).</p>

<div class="grid">
  <a href="invoice/" class="card">
    <div class="icon">🧾</div>
    <div class="card-title">거래명세표</div>
    <div class="card-desc">공급자 등록·선택, 품목 입력 시 공급가액·세액 자동 계산. 공급자/공급받는자 보관용 2장 동시 출력.</div>
    <div class="tag">사용 가능</div>
  </a>
  <div class="card soon">
    <div class="icon">📄</div>
    <div class="card-title">견적서</div>
    <div class="card-desc">추후 추가 예정.</div>
    <div class="tag soon">준비 중</div>
  </div>
  <div class="card soon">
    <div class="icon">🧮</div>
    <div class="card-title">세금계산서</div>
    <div class="card-desc">추후 추가 예정.</div>
    <div class="tag soon">준비 중</div>
  </div>
</div>

<footer>© 스윙파머 · 회사 문서</footer>

<script src="/common.js?v=4"></script>
</body>
</html>
