# (133) 우분투 자동 업데이트 「내려받기」를 크론이 없는 새벽 03:20으로 고정
#   unattended-upgrade가 220MB까지 커져 07:00 크론과 겹치면 swap으로 밀림(11/25 mem_watch). 원래는 06:00·18:00 + 최대 12시간 무작위
# 적용: sudo cp 이 파일 /etc/systemd/system/apt-daily.timer.d/ → sudo systemctl daemon-reload
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:20
RandomizedDelaySec=0
