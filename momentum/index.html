
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>업종·종목 모멘텀 — 주간/월간 강세 랭킹</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e0e0e0;--text-dim:#888;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--gold:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:1400px;margin:0 auto;padding:16px}
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-dim);font-size:13px;margin-bottom:16px}

/* 기간 탭 */
.period-tabs{display:flex;gap:6px;margin-bottom:20px}
.period-tab{padding:10px 24px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text-dim);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s}
.period-tab:hover{border-color:var(--text-dim)}
.period-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.period-tab.disabled{opacity:.3;cursor:not-allowed}

/* 서머리 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.summary-card .num{font-size:24px;font-weight:800}
.summary-card .label{font-size:11px;color:var(--text-dim);margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}

/* 섹션 */
.section{margin-bottom:24px}
.section-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}

/* 업종 그리드 */
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.sector-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .12s}
.sector-card:hover{border-color:var(--accent)}
.sector-card.expanded{border-color:var(--accent)}
.sector-name{font-weight:700;font-size:14px;margin-bottom:4px}
.sector-return{font-size:22px;font-weight:800;margin-bottom:4px}
.sector-meta{font-size:11px;color:var(--text-dim)}

/* 업종 상세 (접기/펼치기) */
.sector-detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.sector-card.expanded .sector-detail{display:block}
.sector-stock{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.sector-stock .sname{font-weight:600}

/* 테이블 */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--card);max-height:500px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
th{position:sticky;top:0;background:#22253a;padding:10px 8px;text-align:right;font-weight:700;font-size:11px;color:var(--text-dim);border-bottom:2px solid var(--border);white-space:nowrap;z-index:2}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
td:nth-child(1){text-align:center;width:30px}
td:nth-child(2){text-align:left}
tr:hover{background:rgba(59,130,246,.06)}
.stock-name{font-weight:700;font-size:13px}
.stock-code{color:var(--text-dim);font-size:10px;margin-left:6px}
.stock-sector{color:var(--text-dim);font-size:10px;margin-left:6px;background:rgba(255,255,255,.05);padding:1px 6px;border-radius:4px}

.loading{text-align:center;padding:60px;color:var(--text-dim)}
.empty{text-align:center;padding:40px;color:var(--text-dim);font-size:14px}
.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:20px;line-height:1.8}

/* 탭 전환 */
.tab-gainers{display:flex;gap:6px;margin-bottom:10px}
.tab-gl{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.tab-gl.active{background:var(--card);border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<a href="/" style="font-size:13px;color:var(--text-dim)">← 메인</a>
<h1>🔥 업종·종목 모멘텀</h1>
<p class="subtitle" id="updated">주간/월간 강세 업종·종목 랭킹</p>

<div class="period-tabs">
  <button class="period-tab active" data-period="weekly">📅 주간</button>
  <button class="period-tab" data-period="monthly">📆 월간</button>
  <button class="period-tab disabled" data-period="intraday" title="오라클 이관 후 추가 예정">⏰ 장중 (준비 중)</button>
</div>

<div id="content">
  <div class="loading">로딩 중…</div>
</div>

<p class="note">
  ※ KIS Open API 기준 · 수익률 = (현재가 − N거래일전 종가) ÷ N거래일전 종가<br>
  ※ 업종 수익률 = 구성종목 수익률 산술평균
</p>

<script src="/common.js?v=4"></script>
<script>
(function(){

var cache = {};
var currentPeriod = 'weekly';

// ── 기간 탭 ──
document.querySelectorAll('.period-tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.classList.contains('disabled')) return;
    document.querySelectorAll('.period-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentPeriod = btn.getAttribute('data-period');
    loadPeriod(currentPeriod);
  });
});

function loadPeriod(period){
  if(cache[period]){
    render(cache[period]);
    return;
  }
  document.getElementById('content').innerHTML='<div class="loading">로딩 중…</div>';
  fetch('/data/kr/momentum/'+period+'.json')
    .then(function(r){return r.json();})
    .then(function(data){
      cache[period]=data;
      render(data);
    })
    .catch(function(){
      document.getElementById('content').innerHTML='<div class="empty">데이터 없음 — GitHub Actions에서 모멘텀 스크립트를 먼저 실행하세요</div>';
    });
}

function render(data){
  var html='';
  var stats=data.stats;
  var periodLabel = data.period==='weekly'?'주간 (5거래일)':'월간 (22거래일)';

  document.getElementById('updated').textContent=
    periodLabel+' · 기준일: '+data.updated+' · '+data.total_stocks+'종목';

  // 서머리 카드
  html+='<div class="summary">';
  html+='<div class="summary-card"><div class="num '+(stats.avg_return>=0?'up':'down')+'">'+
    (stats.avg_return>=0?'+':'')+stats.avg_return.toFixed(1)+'%</div><div class="label">전체 평균</div></div>';
  html+='<div class="summary-card"><div class="num up">'+stats.positive+'</div><div class="label">상승 종목</div></div>';
  html+='<div class="summary-card"><div class="num down">'+stats.negative+'</div><div class="label">하락 종목</div></div>';
  html+='<div class="summary-card"><div class="num" style="color:var(--accent)">'+data.sectors.length+'</div><div class="label">업종</div></div>';
  html+='</div>';

  // 업종 랭킹
  html+='<div class="section"><div class="section-title">🏆 업종 랭킹</div>';
  html+='<div class="sector-grid">';
  data.sectors.forEach(function(sec, idx){
    var cls = sec.return_pct>=0?'up':'down';
    html+='<div class="sector-card" onclick="toggleSector(this)">';
    html+='<div class="sector-name">'+(idx+1)+'. '+sec.sector+'</div>';
    html+='<div class="sector-return '+cls+'">'+(sec.return_pct>=0?'+':'')+sec.return_pct.toFixed(1)+'%</div>';
    html+='<div class="sector-meta">'+sec.stock_count+'종목</div>';
    html+='<div class="sector-detail">';
    sec.top_stocks.forEach(function(s){
      var c2=s.return_pct>=0?'up':'down';
      html+='<div class="sector-stock"><span class="sname">'+s.name+'</span><span class="'+c2+'">'+(s.return_pct>=0?'+':'')+s.return_pct.toFixed(1)+'%</span></div>';
    });
    html+='</div></div>';
  });
  html+='</div></div>';

  // 강세/약세 종목 Top 15
  html+='<div class="section"><div class="section-title">📊 종목 랭킹</div>';
  html+='<div class="tab-gainers">';
  html+='<button class="tab-gl active" onclick="showRank(this,\'gainers\')">📈 강세 Top 15</button>';
  html+='<button class="tab-gl" onclick="showRank(this,\'losers\')">📉 약세 Top 15</button>';
  html+='</div>';

  html+='<div id="rank-gainers">'+buildTable(data.top_gainers, false)+'</div>';
  html+='<div id="rank-losers" style="display:none">'+buildTable(data.top_losers, true)+'</div>';
  html+='</div>';

  document.getElementById('content').innerHTML=html;
}

function buildTable(items, isLoser){
  var h='<div class="table-wrap"><table><thead><tr>';
  h+='<th style="text-align:center">#</th>';
  h+='<th style="text-align:left">종목</th>';
  h+='<th>현재가</th><th>기준가</th><th>수익률</th><th style="text-align:left">업종</th>';
  h+='</tr></thead><tbody>';
  items.forEach(function(s, i){
    var cls=s.return_pct>=0?'up':'down';
    h+='<tr>';
    h+='<td style="text-align:center">'+(i+1)+'</td>';
    h+='<td style="text-align:left"><span class="stock-name">'+s.name+'</span><span class="stock-code">'+s.code+'</span></td>';
    h+='<td>'+s.price.toLocaleString()+'</td>';
    h+='<td>'+s.prev_price.toLocaleString()+'</td>';
    h+='<td class="'+cls+'">'+(s.return_pct>=0?'+':'')+s.return_pct.toFixed(1)+'%</td>';
    h+='<td style="text-align:left"><span class="stock-sector">'+s.sector+'</span></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

// 전역 함수
window.toggleSector = function(el){
  el.classList.toggle('expanded');
};

window.showRank = function(btn, which){
  btn.parentElement.querySelectorAll('.tab-gl').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('rank-gainers').style.display = which==='gainers'?'':'none';
  document.getElementById('rank-losers').style.display  = which==='losers'?'':'none';
};

// 초기화
loadPeriod('weekly');

})();
</script>
</body>
</html>
