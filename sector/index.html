<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>업종지수 대시보드</title>
<link rel="stylesheet" href="/common-dark.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root { --sf-max-w: 1400px; }
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-dim);font-size:13px;margin-bottom:16px}
.presets{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.preset-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s}
.preset-btn:hover,.preset-btn.active{border-color:var(--accent);color:var(--accent)}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-bar select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.filter-bar label{font-size:12px;color:var(--text-dim)}
.ma-filters{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.mf-btn{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .12s}
.mf-btn:hover{border-color:var(--text);color:var(--text)}
.mf-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.mf-btn.green{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.08)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.summary-card .num{font-size:20px;font-weight:800}
.summary-card .label{font-size:10px;color:var(--text-dim);margin-top:3px}
.chart-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.chart-header h3{font-size:14px;font-weight:700;margin:0}
.chart-nav{display:flex;gap:6px}
.chart-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.chart-nav button:hover{border-color:var(--accent)}
.chart-wrap{position:relative;height:360px}
@media(max-width:600px){.chart-wrap{height:280px}}
.chart-info{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.chart-info .ci-item{display:flex;align-items:center;gap:4px}
.chart-info .ci-label{color:var(--text-dim)}
.chart-info .ci-val{font-weight:700}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.sector-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .12s}
.sector-card:hover{border-color:var(--accent)}
.sector-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.sc-name{font-weight:700;font-size:14px}
.sc-code{color:var(--text-dim);font-size:10px;margin-left:6px}
.sc-price{font-size:13px;color:var(--text-dim)}
.align-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px}
.align-badge.bull{color:#22c55e;background:rgba(34,197,94,.15)}
.align-badge.bear{color:#ef4444;background:rgba(239,68,68,.15)}
.align-badge.partial{color:#eab308;background:rgba(234,179,8,.12)}
.sig-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.sig-tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.sig-tag.bullish{color:#22c55e;background:rgba(34,197,94,.12)}
.sig-tag.bearish{color:#ef4444;background:rgba(239,68,68,.12)}
.rsi-wrap{margin-top:6px}
.rsi-label{font-size:10px;color:var(--text-dim)}
.rsi-bar{height:5px;background:var(--border);border-radius:3px;position:relative;overflow:visible}
.rsi-fill{height:100%;border-radius:3px}
.rsi-marker{position:absolute;top:-3px;width:3px;height:11px;background:#fff;border-radius:2px;transform:translateX(-50%)}
.rsi-val{font-size:11px;font-weight:700;margin-left:6px}
.rsi-row{display:flex;align-items:center}
.ma-row{display:flex;gap:8px;margin-top:5px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.ma-row .ma-item{display:flex;align-items:center;gap:3px}
.ma-row .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:20px;line-height:1.8}
.loading{text-align:center;padding:60px 0;color:var(--text-dim);font-size:14px}
.empty-msg{text-align:center;padding:40px 0;color:var(--text-dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 업종지수 대시보드</h1>
<p class="subtitle">KOSPI 26개 업종지수 · 등락률 · 이평선 · RSI · 정배열</p>

<div class="presets" id="presets">
  <button class="preset-btn" data-days="60">60일</button>
  <button class="preset-btn active" data-days="120">120일</button>
  <button class="preset-btn" data-days="200">200일</button>
</div>

<div class="filter-bar">
  <label>구분:</label>
  <select id="groupFilter">
    <option value="all">전체 (26)</option>
    <option value="industry">업종별 (22)</option>
    <option value="size">규모별 (대/중/소)</option>
    <option value="index">지수 (종합/200/제조)</option>
  </select>
  <label style="margin-left:12px">정렬:</label>
  <select id="sortSelect">
    <option value="strength_desc">MA 강도순 ↓</option>
    <option value="return_desc">등락률 ↓</option>
    <option value="return_asc">등락률 ↑</option>
    <option value="rsi_desc">RSI ↓</option>
    <option value="rsi_asc">RSI ↑</option>
    <option value="name">이름순</option>
  </select>
</div>

<div class="ma-filters" id="maFilters">
  <button class="mf-btn active" data-filter="all">전체</button>
  <button class="mf-btn" data-filter="perfect">🟢 정배열</button>
  <button class="mf-btn" data-filter="reverse">🔴 역배열</button>
  <button class="mf-btn" data-filter="above5">MA5 위</button>
  <button class="mf-btn" data-filter="above10">MA10 위</button>
  <button class="mf-btn" data-filter="above20">MA20 위</button>
  <button class="mf-btn" data-filter="above50">MA50 위</button>
</div>

<div class="summary" id="summary"></div>
<div class="card-grid" id="cardGrid"></div>
<div class="loading" id="loading">데이터 로딩 중...</div>

<div class="chart-section" id="chartSection">
  <div class="chart-header">
    <h3 id="chartTitle">업종 차트</h3>
    <div class="chart-nav">
      <button onclick="navChart(-1)">◀ 이전</button>
      <button onclick="navChart(1)">다음 ▶</button>
      <button onclick="closeChart()">✕ 닫기</button>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  <div class="chart-info" id="chartInfo"></div>
</div>

<div class="note">데이터: 한국투자증권 API · 평일 20:15 자동 수집 · KOSPI 업종지수 기준</div>
</div>

<script src="/common.js?v=2"></script>
<script>
const ORACLE_API = 'https://swingfarmer.duckdns.org/api';
const SIZE_CODES = ['0002','0003','0004'];
const INDEX_CODES = ['0001','0027','0028'];
const INDUSTRY_CODES = ['0005','0006','0007','0008','0009','0010','0011','0012',
  '0013','0014','0015','0016','0017','0018','0019','0020','0021','0024','0025','0026'];

let allSectors = [], selectedCode = null, chartInstance = null, currentDays = 120, currentMaFilter = 'all';

document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn');
  if (!btn || !btn.dataset.days) return;
  currentDays = parseInt(btn.dataset.days);
  document.querySelectorAll('#presets .preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadData();
});
document.getElementById('groupFilter').addEventListener('change', renderCards);
document.getElementById('sortSelect').addEventListener('change', renderCards);
document.getElementById('maFilters').addEventListener('click', e => {
  const btn = e.target.closest('.mf-btn');
  if (!btn) return;
  currentMaFilter = btn.dataset.filter;
  document.querySelectorAll('.mf-btn').forEach(b => { b.classList.remove('active'); b.classList.remove('green'); });
  btn.classList.add('active');
  if (currentMaFilter === 'perfect') btn.classList.add('green');
  renderCards();
});

async function loadData() {
  document.getElementById('loading').style.display = '';
  document.getElementById('cardGrid').innerHTML = '';
  try {
    const resp = await fetch(ORACLE_API + '/sector-prices?days=' + currentDays);
    const json = await resp.json();
    processSectors(json);
    renderSummary();
    renderCards();
    if (selectedCode) showChart(selectedCode);
  } catch (e) {
    document.getElementById('loading').textContent = '데이터 로드 실패: ' + e.message;
    return;
  }
  document.getElementById('loading').style.display = 'none';
}

function processSectors(json) {
  var sectorMap = {};
  json.sectors.forEach(function(s) { sectorMap[s.code] = s.name; });
  var grouped = {};
  json.data.forEach(function(d) {
    if (!grouped[d.sector_code]) grouped[d.sector_code] = [];
    grouped[d.sector_code].push({ date: d.trade_date, open: d.open_price, high: d.high_price,
      low: d.low_price, close: d.close_price, volume: d.volume });
  });
  allSectors = [];
  Object.keys(grouped).forEach(function(code) {
    var data = grouped[code];
    data.sort(function(a,b) { return a.date < b.date ? -1 : 1; });
    allSectors.push(computeIndicators(code, sectorMap[code] || code, data));
  });
}

function computeIndicators(code, name, data) {
  var closes = data.map(function(d){return d.close;});
  var n = closes.length, latest = closes[n-1] || 0;
  var pct1d = n>=2 ? ((closes[n-1]-closes[n-2])/closes[n-2]*100) : 0;
  var pct5d = n>=6 ? ((closes[n-1]-closes[n-6])/closes[n-6]*100) : null;
  var pct20d = n>=21 ? ((closes[n-1]-closes[n-21])/closes[n-21]*100) : null;
  var pct60d = n>=61 ? ((closes[n-1]-closes[n-61])/closes[n-61]*100) : null;

  function ma(p) { if(n<p) return null; var s=0; for(var i=n-p;i<n;i++) s+=closes[i]; return s/p; }
  var ma5=ma(5), ma10=ma(10), ma20=ma(20), ma50=ma(50);
  var gap5=ma5?((latest-ma5)/ma5*100):null;
  var gap10=ma10?((latest-ma10)/ma10*100):null;
  var gap20=ma20?((latest-ma20)/ma20*100):null;
  var gap50=ma50?((latest-ma50)/ma50*100):null;
  var above5=ma5!==null&&latest>=ma5, above10=ma10!==null&&latest>=ma10;
  var above20=ma20!==null&&latest>=ma20, above50=ma50!==null&&latest>=ma50;

  var alignment='none';
  if(ma5!==null&&ma10!==null&&ma20!==null&&ma50!==null){
    if(latest>=ma5&&ma5>=ma10&&ma10>=ma20&&ma20>=ma50) alignment='perfect';
    else if(latest<=ma5&&ma5<=ma10&&ma10<=ma20&&ma20<=ma50) alignment='reverse';
    else if(above5&&above10&&above20) alignment='partial_bull';
    else if(!above5&&!above10&&!above20) alignment='partial_bear';
  }
  var strength = (gap5||0)+(gap10||0)+(gap20||0)+(gap50||0);

  var signals=[];
  if(alignment==='perfect') signals.push({label:'정배열',type:'bullish'});
  if(alignment==='reverse') signals.push({label:'역배열',type:'bearish'});

  if(n>=22&&ma5!==null&&ma20!==null){
    var pc=closes.slice(0,n-1), pn=pc.length;
    if(pn>=20&&pn>=5){
      var pM5=0,pM20=0;
      for(var i=pn-5;i<pn;i++) pM5+=pc[i]; pM5/=5;
      for(var i=pn-20;i<pn;i++) pM20+=pc[i]; pM20/=20;
      if(pM5<=pM20&&ma5>ma20) signals.push({label:'골든크로스(5/20)',type:'bullish'});
      if(pM5>=pM20&&ma5<ma20) signals.push({label:'데드크로스(5/20)',type:'bearish'});
    }
  }

  var rsi=null;
  if(n>=15){
    var gains=0,losses=0;
    for(var i=n-14;i<n;i++){var diff=closes[i]-closes[i-1]; if(diff>0)gains+=diff; else losses-=diff;}
    rsi=losses===0?100: 100-100/(1+(gains/14)/(losses/14));
  }
  if(rsi!==null&&rsi>=70) signals.push({label:'RSI 과매수',type:'bearish'});
  if(rsi!==null&&rsi<=30) signals.push({label:'RSI 과매도',type:'bullish'});

  return {code:code,name:name,data:data,closes:closes,latest:latest,
    pct1d:pct1d,pct5d:pct5d,pct20d:pct20d,pct60d:pct60d,
    ma5:ma5,ma10:ma10,ma20:ma20,ma50:ma50,
    gap5:gap5,gap10:gap10,gap20:gap20,gap50:gap50,
    above5:above5,above10:above10,above20:above20,above50:above50,
    alignment:alignment,strength:strength,rsi:rsi,signals:signals};
}

function renderSummary(){
  var ind=allSectors.filter(function(s){return INDUSTRY_CODES.indexOf(s.code)>=0;});
  var up=ind.filter(function(s){return s.pct1d>0;}).length;
  var down=ind.filter(function(s){return s.pct1d<0;}).length;
  var perfect=ind.filter(function(s){return s.alignment==='perfect';}).length;
  var reverse=ind.filter(function(s){return s.alignment==='reverse';}).length;
  var kospi=allSectors.find(function(s){return s.code==='0001';});
  var best=ind.length?ind.reduce(function(a,b){return a.pct1d>b.pct1d?a:b;}):null;
  var worst=ind.length?ind.reduce(function(a,b){return a.pct1d<b.pct1d?a:b;}):null;
  document.getElementById('summary').innerHTML=
    '<div class="summary-card"><div class="num" style="color:'+(kospi&&kospi.pct1d>=0?'#22c55e':'#ef4444')+'">'+(kospi?kospi.latest.toFixed(2):'-')+'</div><div class="label">KOSPI '+(kospi?pctStr(kospi.pct1d):'')+'</div></div>'+
    '<div class="summary-card"><div class="num" style="color:#22c55e">'+up+'</div><div class="label">상승</div></div>'+
    '<div class="summary-card"><div class="num" style="color:#ef4444">'+down+'</div><div class="label">하락</div></div>'+
    '<div class="summary-card"><div class="num" style="color:#22c55e">'+perfect+'</div><div class="label">🟢 정배열</div></div>'+
    '<div class="summary-card"><div class="num" style="color:#ef4444">'+reverse+'</div><div class="label">🔴 역배열</div></div>'+
    '<div class="summary-card"><div class="num" style="font-size:13px;color:#22c55e">'+(best?best.name:'-')+'</div><div class="label">최강 '+(best?pctStr(best.pct1d):'')+'</div></div>'+
    '<div class="summary-card"><div class="num" style="font-size:13px;color:#ef4444">'+(worst?worst.name:'-')+'</div><div class="label">최약 '+(worst?pctStr(worst.pct1d):'')+'</div></div>';
}

function renderCards(){
  var group=document.getElementById('groupFilter').value;
  var sort=document.getElementById('sortSelect').value;
  var list=allSectors.slice();
  if(group==='size') list=list.filter(function(s){return SIZE_CODES.indexOf(s.code)>=0;});
  else if(group==='industry') list=list.filter(function(s){return INDUSTRY_CODES.indexOf(s.code)>=0;});
  else if(group==='index') list=list.filter(function(s){return INDEX_CODES.indexOf(s.code)>=0;});

  if(currentMaFilter==='perfect') list=list.filter(function(s){return s.alignment==='perfect';});
  else if(currentMaFilter==='reverse') list=list.filter(function(s){return s.alignment==='reverse';});
  else if(currentMaFilter==='above5') list=list.filter(function(s){return s.above5;});
  else if(currentMaFilter==='above10') list=list.filter(function(s){return s.above10;});
  else if(currentMaFilter==='above20') list=list.filter(function(s){return s.above20;});
  else if(currentMaFilter==='above50') list=list.filter(function(s){return s.above50;});

  if(sort==='strength_desc') list.sort(function(a,b){return b.strength-a.strength;});
  else if(sort==='return_desc') list.sort(function(a,b){return b.pct1d-a.pct1d;});
  else if(sort==='return_asc') list.sort(function(a,b){return a.pct1d-b.pct1d;});
  else if(sort==='rsi_desc') list.sort(function(a,b){return (b.rsi||0)-(a.rsi||0);});
  else if(sort==='rsi_asc') list.sort(function(a,b){return (a.rsi||50)-(b.rsi||50);});
  else list.sort(function(a,b){return a.name.localeCompare(b.name);});

  var grid=document.getElementById('cardGrid');
  if(!list.length){ grid.innerHTML='<div class="empty-msg">조건에 맞는 업종이 없습니다.</div>'; return; }

  grid.innerHTML=list.map(function(s){
    var ab='';
    if(s.alignment==='perfect') ab='<span class="align-badge bull">정배열</span>';
    else if(s.alignment==='reverse') ab='<span class="align-badge bear">역배열</span>';
    else if(s.alignment==='partial_bull') ab='<span class="align-badge partial">준정배열</span>';
    else if(s.alignment==='partial_bear') ab='<span class="align-badge partial">준역배열</span>';

    var sigs=s.signals.filter(function(x){return x.label!=='정배열'&&x.label!=='역배열';})
      .map(function(x){return '<span class="sig-tag '+x.type+'">'+x.label+'</span>';}).join('');

    var rh=s.rsi!==null?'<div class="rsi-wrap"><div class="rsi-row"><span class="rsi-label">RSI</span>'+
      '<span class="rsi-val" style="color:'+(s.rsi>=70?'#ef4444':s.rsi<=30?'#22c55e':'var(--text)')+'">'+s.rsi.toFixed(0)+'</span></div>'+
      '<div class="rsi-bar"><div class="rsi-fill" style="width:'+s.rsi+'%;background:'+(s.rsi>=70?'#ef4444':s.rsi<=30?'#22c55e':'#3b82f6')+'"></div>'+
      '<div class="rsi-marker" style="left:'+s.rsi+'%"></div></div></div>':'';

    var mh='<div class="ma-row">'+maItem('5',s.ma5,s.latest,s.gap5)+maItem('10',s.ma10,s.latest,s.gap10)+
      maItem('20',s.ma20,s.latest,s.gap20)+maItem('50',s.ma50,s.latest,s.gap50)+'</div>';

    var pcts=[pctBadge('1D',s.pct1d),
      s.pct5d!==null?pctBadge('5D',s.pct5d):'',
      s.pct20d!==null?pctBadge('20D',s.pct20d):'',
      s.pct60d!==null?pctBadge('60D',s.pct60d):''].filter(Boolean).join(' ');

    return '<div class="sector-card'+(s.code===selectedCode?' selected':'')+'" data-code="'+s.code+'">'+
      '<div class="sc-header"><div><span class="sc-name">'+s.name+'</span><span class="sc-code">'+s.code+'</span>'+ab+'</div>'+
      '<div class="sc-price">'+s.latest.toFixed(2)+'</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">'+pcts+'</div>'+
      mh+rh+'<div class="sig-tags">'+sigs+'</div></div>';
  }).join('');

  grid.querySelectorAll('.sector-card').forEach(function(card){
    card.addEventListener('click', function(){
      selectedCode=card.dataset.code;
      grid.querySelectorAll('.sector-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');
      showChart(selectedCode);
    });
  });
}

function pctStr(v){return v==null?'-':(v>=0?'+':'')+v.toFixed(2)+'%';}
function pctBadge(l,v){return '<span style="font-size:11px;color:'+(v>=0?'#22c55e':'#ef4444')+';font-weight:700">'+l+' '+pctStr(v)+'</span>';}
function maItem(p,maVal,price,gap){
  if(maVal===null) return '';
  var c=price>=maVal?'#22c55e':'#ef4444';
  var g=gap!==null?' ('+(gap>=0?'+':'')+gap.toFixed(1)+'%)':'';
  return '<div class="ma-item"><span class="dot" style="background:'+c+'"></span><span>MA'+p+g+'</span></div>';
}

function showChart(code){
  var s=allSectors.find(function(x){return x.code===code;});
  if(!s) return;
  var section=document.getElementById('chartSection');
  section.style.display='';
  document.getElementById('chartTitle').textContent=s.name+' ('+s.code+')';
  var labels=s.data.map(function(d){return d.date.slice(5);});
  var prices=s.data.map(function(d){return d.close;});

  function calcMA(arr,period){
    return arr.map(function(_,i){
      if(i<period-1) return null;
      var sum=0; for(var j=i-period+1;j<=i;j++) sum+=arr[j]; return sum/period;
    });
  }

  if(chartInstance) chartInstance.destroy();
  chartInstance=new Chart(document.getElementById('mainChart'),{
    type:'line',
    data:{labels:labels,datasets:[
      {label:'종가',data:prices,borderColor:'#3b82f6',borderWidth:2,pointRadius:0,fill:false},
      {label:'MA5',data:calcMA(prices,5),borderColor:'#22c55e',borderWidth:1.2,pointRadius:0,fill:false},
      {label:'MA10',data:calcMA(prices,10),borderColor:'#eab308',borderWidth:1.2,pointRadius:0,fill:false},
      {label:'MA20',data:calcMA(prices,20),borderColor:'#ef4444',borderWidth:1.2,pointRadius:0,fill:false},
      {label:'MA50',data:calcMA(prices,50),borderColor:'#a855f7',borderWidth:1,pointRadius:0,borderDash:[4,2],fill:false},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#999',font:{size:11},usePointStyle:true,pointStyle:'line'}},
        tooltip:{backgroundColor:'rgba(20,20,20,.95)',titleColor:'#fff',bodyColor:'#ccc',
          callbacks:{label:function(ctx){return ctx.dataset.label+': '+(ctx.parsed.y!=null?ctx.parsed.y.toFixed(2):'-');}}}
      },
      scales:{
        x:{ticks:{color:'#555',font:{size:10},maxTicksLimit:12},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'#555',font:{size:10}},grid:{color:'rgba(255,255,255,.06)'}},
      }
    }
  });

  var al={perfect:'🟢 정배열',reverse:'🔴 역배열',partial_bull:'준정배열',partial_bear:'준역배열',none:'-'};
  document.getElementById('chartInfo').innerHTML=
    '<div class="ci-item"><span class="ci-label">배열:</span><span class="ci-val">'+(al[s.alignment]||'-')+'</span></div>'+
    '<div class="ci-item"><span class="ci-label">RSI(14):</span><span class="ci-val" style="color:'+(s.rsi>=70?'#ef4444':s.rsi<=30?'#22c55e':'var(--text)')+'">'+(s.rsi!=null?s.rsi.toFixed(1):'-')+'</span></div>'+
    '<div class="ci-item"><span class="ci-label">MA5 이격:</span><span class="ci-val" style="color:'+((s.gap5||0)>=0?'#22c55e':'#ef4444')+'">'+(s.gap5!=null?s.gap5.toFixed(2):'-')+'%</span></div>'+
    '<div class="ci-item"><span class="ci-label">MA20 이격:</span><span class="ci-val" style="color:'+((s.gap20||0)>=0?'#22c55e':'#ef4444')+'">'+(s.gap20!=null?s.gap20.toFixed(2):'-')+'%</span></div>'+
    '<div class="ci-item"><span class="ci-label">1D:</span><span class="ci-val" style="color:'+(s.pct1d>=0?'#22c55e':'#ef4444')+'">'+pctStr(s.pct1d)+'</span></div>'+
    '<div class="ci-item"><span class="ci-label">20D:</span><span class="ci-val" style="color:'+((s.pct20d||0)>=0?'#22c55e':'#ef4444')+'">'+pctStr(s.pct20d)+'</span></div>';

  section.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function navChart(dir){
  if(!selectedCode) return;
  var group=document.getElementById('groupFilter').value;
  var list=allSectors.slice();
  if(group==='size') list=list.filter(function(s){return SIZE_CODES.indexOf(s.code)>=0;});
  else if(group==='industry') list=list.filter(function(s){return INDUSTRY_CODES.indexOf(s.code)>=0;});
  else if(group==='index') list=list.filter(function(s){return INDEX_CODES.indexOf(s.code)>=0;});
  var idx=-1;
  for(var i=0;i<list.length;i++){if(list[i].code===selectedCode){idx=i;break;}}
  if(idx<0) return;
  var next=(idx+dir+list.length)%list.length;
  selectedCode=list[next].code;
  document.querySelectorAll('.sector-card').forEach(function(c){c.classList.toggle('selected',c.dataset.code===selectedCode);});
  showChart(selectedCode);
}

function closeChart(){
  document.getElementById('chartSection').style.display='none';
  selectedCode=null;
  document.querySelectorAll('.sector-card').forEach(function(c){c.classList.remove('selected');});
}

loadData();
</script>
