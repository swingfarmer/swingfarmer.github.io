<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>업종지수 대시보드</title>
<link rel="stylesheet" href="/common-dark.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root { --sf-max-w: 1400px; }
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-dim);font-size:13px;margin-bottom:16px}

/* 기간 프리셋 */
.presets{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.preset-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s}
.preset-btn:hover,.preset-btn.active{border-color:var(--accent);color:var(--accent)}

/* 필터 */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.filter-bar label{font-size:12px;color:var(--text-dim)}

/* 서머리 카드 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.summary-card .num{font-size:20px;font-weight:800}
.summary-card .label{font-size:10px;color:var(--text-dim);margin-top:3px}

/* 차트 섹션 */
.chart-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chart-header h3{font-size:14px;font-weight:700;margin:0}
.chart-wrap{position:relative;height:340px}
@media(max-width:600px){.chart-wrap{height:260px}}
.chart-note{font-size:10px;color:var(--text-dim);margin-top:6px;text-align:center}

/* 정렬 바 */
.sort-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sort-bar span{font-size:12px;color:var(--text-dim)}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text-dim);
  padding:4px 12px;border-radius:16px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .12s}
.sort-btn:hover,.sort-btn.active{border-color:var(--accent);color:var(--accent)}

/* 카드 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.sector-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .12s}
.sector-card:hover{border-color:var(--accent)}
.sector-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.sc-name{font-weight:700;font-size:14px}
.sc-code{color:var(--text-dim);font-size:10px;margin-left:6px}
.sc-price{font-size:13px;color:var(--text-dim)}
.sc-pct{font-size:26px;font-weight:800;margin-bottom:6px}

/* 시그널 태그 */
.sig-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sig-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.sig-tag.bullish{color:#22c55e;background:rgba(34,197,94,.12)}
.sig-tag.bearish{color:#ef4444;background:rgba(239,68,68,.12)}
.sig-tag.neutral{color:var(--text-dim);background:rgba(255,255,255,.06)}

/* RSI 바 */
.rsi-wrap{margin-top:8px}
.rsi-label{font-size:10px;color:var(--text-dim);margin-bottom:3px}
.rsi-bar{height:6px;background:var(--border);border-radius:3px;position:relative;overflow:visible}
.rsi-fill{height:100%;border-radius:3px;transition:width .3s}
.rsi-marker{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px;transform:translateX(-50%)}
.rsi-val{font-size:11px;font-weight:700;margin-left:6px}
.rsi-row{display:flex;align-items:center}

/* MA 테이블 */
.ma-row{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--text-dim)}
.ma-row .ma-item{display:flex;align-items:center;gap:3px}
.ma-row .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.note{font-size:11px;color:var(--text-dim);text-align:center;margin-top:20px;line-height:1.8}
.loading{text-align:center;padding:60px 0;color:var(--text-dim);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 업종지수 대시보드</h1>
<p class="subtitle">KOSPI 26개 업종지수 · 등락률 · 이평선 시그널 · RSI</p>

<div class="presets" id="presets">
  <button class="preset-btn" data-days="60">최근 60일</button>
  <button class="preset-btn active" data-days="120">최근 120일</button>
  <button class="preset-btn" data-days="200">최근 200일</button>
</div>

<div class="filter-bar">
  <label>구분:</label>
  <select id="groupFilter">
    <option value="all">전체 (26)</option>
    <option value="size">규모별 (대/중/소)</option>
    <option value="industry">업종별 (22)</option>
    <option value="index">지수 (종합/200/제조)</option>
  </select>
  <label style="margin-left:12px">정렬:</label>
  <select id="sortSelect">
    <option value="return_desc">등락률 높은순</option>
    <option value="return_asc">등락률 낮은순</option>
    <option value="rsi_desc">RSI 높은순</option>
    <option value="rsi_asc">RSI 낮은순</option>
    <option value="name">이름순</option>
  </select>
</div>

<div class="summary" id="summary"></div>

<div class="chart-section" id="chartSection">
  <div class="chart-header">
    <h3 id="chartTitle">업종 차트</h3>
    <button class="preset-btn" onclick="closeChart()">✕ 닫기</button>
  </div>
  <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  <div class="chart-note" id="chartNote"></div>
</div>

<div class="card-grid" id="cardGrid"></div>

<div class="loading" id="loading">데이터 로딩 중...</div>
<div class="note">데이터: 한국투자증권 API · 평일 20:15 자동 수집 · KOSPI 업종지수 기준</div>
</div>

<script src="/common.js?v=2"></script>
<script>
const API = 'https://swingfarmer.github.io';
const ORACLE_API = window.SF_API || 'https://api.swingfarmer.site';

// 업종 분류
const SIZE_CODES = ['0002','0003','0004'];
const INDEX_CODES = ['0001','0027','0028'];
const INDUSTRY_CODES = ['0005','0006','0007','0008','0009','0010','0011','0012',
  '0013','0014','0015','0016','0017','0018','0019','0020','0021','0024','0025','0026'];

let allSectors = [];  // {code, name, data:[{date,open,high,low,close,vol}], ...computed}
let selectedCode = null;
let chartInstance = null;
let currentDays = 120;

// ── 기간 프리셋 ──
document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  currentDays = parseInt(btn.dataset.days);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadData();
});

document.getElementById('groupFilter').addEventListener('change', renderCards);
document.getElementById('sortSelect').addEventListener('change', renderCards);

// ── 데이터 로드 ──
async function loadData() {
  document.getElementById('loading').style.display = '';
  document.getElementById('cardGrid').innerHTML = '';
  try {
    const resp = await fetch(`${ORACLE_API}/api/sector-prices?days=${currentDays}`);
    const json = await resp.json();
    processSectors(json);
    renderSummary();
    renderCards();
  } catch (e) {
    document.getElementById('loading').textContent = '데이터 로드 실패: ' + e.message;
    return;
  }
  document.getElementById('loading').style.display = 'none';
}

function processSectors(json) {
  const sectorMap = {};
  json.sectors.forEach(s => { sectorMap[s.code] = s.name; });

  // 그룹화
  const grouped = {};
  json.data.forEach(d => {
    const code = d.sector_code;
    if (!grouped[code]) grouped[code] = [];
    grouped[code].push({
      date: d.trade_date,
      open: d.open_price,
      high: d.high_price,
      low: d.low_price,
      close: d.close_price,
      volume: d.volume,
    });
  });

  allSectors = [];
  for (const [code, data] of Object.entries(grouped)) {
    data.sort((a, b) => a.date.localeCompare(b.date));
    const s = computeIndicators(code, sectorMap[code] || code, data);
    allSectors.push(s);
  }
}

function computeIndicators(code, name, data) {
  const closes = data.map(d => d.close);
  const n = closes.length;
  const latest = closes[n - 1] || 0;

  // 등락률
  const pct1d = n >= 2 ? ((closes[n-1] - closes[n-2]) / closes[n-2] * 100) : 0;
  const pct5d = n >= 6 ? ((closes[n-1] - closes[n-6]) / closes[n-6] * 100) : null;
  const pct20d = n >= 21 ? ((closes[n-1] - closes[n-21]) / closes[n-21] * 100) : null;
  const pct60d = n >= 61 ? ((closes[n-1] - closes[n-61]) / closes[n-61] * 100) : null;

  // 이동평균
  function ma(period) {
    if (n < period) return null;
    let sum = 0;
    for (let i = n - period; i < n; i++) sum += closes[i];
    return sum / period;
  }
  const ma5 = ma(5), ma10 = ma(10), ma20 = ma(20), ma50 = ma(50);

  // MA 시그널
  const signals = [];
  function maSignal(label, maVal) {
    if (maVal === null) return;
    if (latest > maVal) signals.push({ label: `${label} 돌파`, type: 'bullish' });
    else signals.push({ label: `${label} 하회`, type: 'bearish' });
  }
  maSignal('MA5', ma5);
  maSignal('MA10', ma10);
  maSignal('MA20', ma20);
  maSignal('MA50', ma50);

  // 골든크로스/데드크로스 (5/20)
  if (ma5 !== null && ma20 !== null) {
    // 전일 MA5/20
    if (n >= 21) {
      const prevMa5 = n >= 6 ? closes.slice(n-6, n-1).reduce((a,b)=>a+b,0)/5 : null;
      const prevMa20 = n >= 22 ? closes.slice(n-22, n-2).reduce((a,b)=>a+b,0)/20 : null;
      if (prevMa5 !== null && prevMa20 !== null) {
        if (prevMa5 <= prevMa20 && ma5 > ma20) signals.push({ label: '골든크로스(5/20)', type: 'bullish' });
        if (prevMa5 >= prevMa20 && ma5 < ma20) signals.push({ label: '데드크로스(5/20)', type: 'bearish' });
      }
    }
  }

  // RSI (14)
  let rsi = null;
  if (n >= 15) {
    let gains = 0, losses = 0;
    for (let i = n - 14; i < n; i++) {
      const diff = closes[i] - closes[i - 1];
      if (diff > 0) gains += diff; else losses -= diff;
    }
    const avgGain = gains / 14;
    const avgLoss = losses / 14;
    rsi = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }

  // RSI 시그널
  if (rsi !== null) {
    if (rsi >= 70) signals.push({ label: `RSI 과매수(${rsi.toFixed(0)})`, type: 'bearish' });
    else if (rsi <= 30) signals.push({ label: `RSI 과매도(${rsi.toFixed(0)})`, type: 'bullish' });
  }

  return {
    code, name, data, closes,
    latest, pct1d, pct5d, pct20d, pct60d,
    ma5, ma10, ma20, ma50, rsi, signals,
  };
}

// ── 서머리 ──
function renderSummary() {
  const industries = allSectors.filter(s => INDUSTRY_CODES.includes(s.code));
  const up = industries.filter(s => s.pct1d > 0).length;
  const down = industries.filter(s => s.pct1d < 0).length;
  const flat = industries.length - up - down;
  const best = industries.reduce((a, b) => a.pct1d > b.pct1d ? a : b, industries[0]);
  const worst = industries.reduce((a, b) => a.pct1d < b.pct1d ? a : b, industries[0]);

  const kospi = allSectors.find(s => s.code === '0001');

  document.getElementById('summary').innerHTML = `
    <div class="summary-card"><div class="num" style="color:${kospi && kospi.pct1d>=0?'#22c55e':'#ef4444'}">${kospi?kospi.latest.toFixed(2):'-'}</div><div class="label">KOSPI (${kospi?pctStr(kospi.pct1d):''})</div></div>
    <div class="summary-card"><div class="num" style="color:#22c55e">${up}</div><div class="label">상승 업종</div></div>
    <div class="summary-card"><div class="num" style="color:#ef4444">${down}</div><div class="label">하락 업종</div></div>
    <div class="summary-card"><div class="num">${flat}</div><div class="label">보합</div></div>
    <div class="summary-card"><div class="num" style="color:#22c55e;font-size:14px">${best?best.name:'-'}</div><div class="label">최강 업종 (${best?pctStr(best.pct1d):''})</div></div>
    <div class="summary-card"><div class="num" style="color:#ef4444;font-size:14px">${worst?worst.name:'-'}</div><div class="label">최약 업종 (${worst?pctStr(worst.pct1d):''})</div></div>
  `;
}

// ── 카드 렌더링 ──
function renderCards() {
  const group = document.getElementById('groupFilter').value;
  const sort = document.getElementById('sortSelect').value;

  let list = [...allSectors];

  // 필터
  if (group === 'size') list = list.filter(s => SIZE_CODES.includes(s.code));
  else if (group === 'industry') list = list.filter(s => INDUSTRY_CODES.includes(s.code));
  else if (group === 'index') list = list.filter(s => INDEX_CODES.includes(s.code));

  // 정렬
  if (sort === 'return_desc') list.sort((a, b) => b.pct1d - a.pct1d);
  else if (sort === 'return_asc') list.sort((a, b) => a.pct1d - b.pct1d);
  else if (sort === 'rsi_desc') list.sort((a, b) => (b.rsi||0) - (a.rsi||0));
  else if (sort === 'rsi_asc') list.sort((a, b) => (a.rsi||50) - (b.rsi||50));
  else if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = list.map(s => {
    const color = s.pct1d >= 0 ? '#22c55e' : '#ef4444';
    const sigHtml = s.signals.map(sig =>
      `<span class="sig-tag ${sig.type}">${sig.label}</span>`
    ).join('');

    const rsiHtml = s.rsi !== null ? `
      <div class="rsi-wrap">
        <div class="rsi-row">
          <span class="rsi-label">RSI(14)</span>
          <span class="rsi-val" style="color:${rsiColor(s.rsi)}">${s.rsi.toFixed(1)}</span>
        </div>
        <div class="rsi-bar">
          <div class="rsi-fill" style="width:${s.rsi}%;background:${rsiGradient(s.rsi)}"></div>
          <div class="rsi-marker" style="left:${s.rsi}%"></div>
        </div>
      </div>
    ` : '';

    const maHtml = `<div class="ma-row">
      ${maItem('5', s.ma5, s.latest)}
      ${maItem('10', s.ma10, s.latest)}
      ${maItem('20', s.ma20, s.latest)}
      ${maItem('50', s.ma50, s.latest)}
    </div>`;

    const pctRows = [
      pctBadge('1D', s.pct1d),
      s.pct5d !== null ? pctBadge('5D', s.pct5d) : '',
      s.pct20d !== null ? pctBadge('20D', s.pct20d) : '',
      s.pct60d !== null ? pctBadge('60D', s.pct60d) : '',
    ].filter(Boolean).join(' ');

    return `
      <div class="sector-card${s.code===selectedCode?' selected':''}" data-code="${s.code}">
        <div class="sc-header">
          <div><span class="sc-name">${s.name}</span><span class="sc-code">${s.code}</span></div>
          <div class="sc-price">${s.latest.toFixed(2)}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${pctRows}</div>
        ${maHtml}
        ${rsiHtml}
        <div class="sig-tags">${sigHtml}</div>
      </div>
    `;
  }).join('');

  // 카드 클릭 → 차트
  grid.querySelectorAll('.sector-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedCode = card.dataset.code;
      grid.querySelectorAll('.sector-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      showChart(selectedCode);
    });
  });
}

function pctStr(v) {
  if (v === null || v === undefined) return '-';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}

function pctBadge(label, val) {
  const c = val >= 0 ? '#22c55e' : '#ef4444';
  return `<span style="font-size:12px;color:${c};font-weight:700">${label} ${pctStr(val)}</span>`;
}

function maItem(period, maVal, price) {
  if (maVal === null) return '';
  const above = price >= maVal;
  const color = above ? '#22c55e' : '#ef4444';
  return `<div class="ma-item"><span class="dot" style="background:${color}"></span>MA${period}</div>`;
}

function rsiColor(v) {
  if (v >= 70) return '#ef4444';
  if (v <= 30) return '#22c55e';
  return 'var(--text)';
}

function rsiGradient(v) {
  if (v >= 70) return 'linear-gradient(90deg, #22c55e, #eab308, #ef4444)';
  if (v <= 30) return '#22c55e';
  return 'linear-gradient(90deg, #22c55e, #3b82f6)';
}

// ── 차트 ──
function showChart(code) {
  const s = allSectors.find(x => x.code === code);
  if (!s) return;
  const section = document.getElementById('chartSection');
  section.style.display = '';
  document.getElementById('chartTitle').textContent = `${s.name} (${s.code})`;

  const labels = s.data.map(d => d.date.slice(5)); // MM-DD
  const prices = s.data.map(d => d.close);

  // MA lines
  function calcMA(arr, period) {
    return arr.map((_, i) => {
      if (i < period - 1) return null;
      let sum = 0;
      for (let j = i - period + 1; j <= i; j++) sum += arr[j];
      return sum / period;
    });
  }

  const datasets = [
    { label: '종가', data: prices, borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, fill: false, order: 0 },
    { label: 'MA5', data: calcMA(prices, 5), borderColor: '#22c55e', borderWidth: 1, pointRadius: 0, borderDash: [], fill: false, order: 1 },
    { label: 'MA10', data: calcMA(prices, 10), borderColor: '#eab308', borderWidth: 1, pointRadius: 0, fill: false, order: 2 },
    { label: 'MA20', data: calcMA(prices, 20), borderColor: '#ef4444', borderWidth: 1, pointRadius: 0, fill: false, order: 3 },
    { label: 'MA50', data: calcMA(prices, 50), borderColor: '#a855f7', borderWidth: 1, pointRadius: 0, borderDash: [4, 2], fill: false, order: 4 },
  ];

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('mainChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#999', font: { size: 11 }, usePointStyle: true, pointStyle: 'line' } },
        tooltip: {
          backgroundColor: 'rgba(30,30,30,.95)',
          titleColor: '#fff',
          bodyColor: '#ccc',
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2) ?? '-'}`
          }
        }
      },
      scales: {
        x: { ticks: { color: '#666', font: { size: 10 }, maxTicksLimit: 12 }, grid: { color: 'rgba(255,255,255,.04)' } },
        y: { ticks: { color: '#666', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,.06)' } },
      }
    }
  });

  document.getElementById('chartNote').textContent =
    `RSI(14): ${s.rsi !== null ? s.rsi.toFixed(1) : '-'} · MA5: ${s.ma5?.toFixed(2)??'-'} · MA20: ${s.ma20?.toFixed(2)??'-'} · MA50: ${s.ma50?.toFixed(2)??'-'}`;

  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeChart() {
  document.getElementById('chartSection').style.display = 'none';
  selectedCode = null;
  document.querySelectorAll('.sector-card').forEach(c => c.classList.remove('selected'));
}

// ── 초기 로드 ──
loadData();
</script>
</body>
</html>
